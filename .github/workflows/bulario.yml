name: Bulário (atualização semanal)

# O Bulário da plataforma (painel 💊 Bulário) lê bulario.json, montado a partir de
# duas fontes públicas oficiais: os dados abertos de medicamentos registrados da
# ANVISA e a lista de preços máximos da CMED. As duas mudam toda semana (registros
# novos, vencidos, cancelados; a CMED republica a lista). Este job refaz o arquivo
# toda segunda-feira e grava na main só se ele passar na conferência; a Vercel
# publica sozinha. Pedido do professor em 16/10/2026: "ferramenta de Bulário
# atualizada na plataforma".
on:
  schedule:
    - cron: '17 9 * * 1'   # segunda-feira, 09h17 UTC (06h17 em Brasília)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bulario
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar bulario.json (ANVISA + CMED)
        run: node --max-old-space-size=4096 scripts/bulario/construir.js
      - name: Conferir o arquivo antes de gravar
        run: node scripts/test-bulario.js
      - name: Gravar na main se mudou
        run: |
          if git diff --quiet -- bulario.json; then echo "bulario.json sem mudança"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bulario.json
          git commit -m "Bulário: atualização semanal (ANVISA + CMED)"
          git push origin HEAD:main
