name: CI

# Guard-rails antes do merge: valida sintaxe (servidor + scripts inline do
# index.html) e impede que api/ ultrapasse o limite de 12 funções serverless
# da Vercel (estouro já travou produção em #311/#313).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Disparo manual. Em 31/07 um PR foi aberto e o evento `pull_request` NÃO
  # gerou run (só o check da Vercel apareceu), e sem `workflow_dispatch` não
  # havia como pedir a validação — o jeito era empurrar commit vazio. Mergear
  # sem o gate não é opção: é ele que barra o estouro de 12 funções serverless,
  # que já travou produção (#311/#313).
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar JS (api/lib + scripts inline) e limite de funções Vercel
        run: node scripts/ci-validate.js
