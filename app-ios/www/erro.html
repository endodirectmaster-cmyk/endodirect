<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sem conexão — Endodirect</title>
<!--
  Tela do PRÓPRIO app (errorPath do capacitor.config.json): o iPhone a mostra quando o app abre e o
  site não carrega. Desde a 1.3 (17/11/2026, "Resumos sem internet"), se o aluno baixou áreas dos
  Resumos, ela as lê do pacote que o site gravou em Library/Caches/offline (plugin Filesystem):
  leitor.json (capítulos já desenhados pelo site, o CSS do app e a data) e fig/<nome> (figuras).
  Sem pacote, sem plugin ou com pacote de mais de 30 dias: só a mensagem de sempre.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #0b1325; color: #e8edf7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #aviso { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
  #aviso h1 { font-size: 20px; margin: 0; }
  #aviso p { margin: 0; max-width: 32ch; line-height: 1.5; color: #b6c2da; }
  .lx-btn { margin-top: 8px; font: inherit; font-weight: 600; color: #0b1325; background: #e8edf7;
    border: 0; border-radius: 10px; padding: 12px 22px; }
  .lx-btn:focus-visible, .lx-item:focus-visible, .lx-volta:focus-visible { outline: 3px solid #7fa6ff; outline-offset: 3px; }
  /* Leitor das áreas baixadas (classes lx-: não colidem com o CSS do app, que vem no pacote) */
  #leitor { display: none; padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 28px);
    max-width: 760px; margin: 0 auto; box-sizing: border-box; }
  .lx-topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .lx-estado { font-size: 13px; line-height: 1.4; color: #b6c2da; }
  .lx-estado b { color: #e8edf7; }
  .lx-topo .lx-btn { margin: 0; padding: 8px 14px; font-size: 13px; flex-shrink: 0; }
  .lx-h { font-size: 22px; font-weight: 800; margin: 6px 0 12px; }
  .lx-sec { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #8fa0bf; margin: 18px 0 8px; }
  .lx-lista { display: flex; flex-direction: column; gap: 8px; }
  .lx-item { display: block; width: 100%; text-align: left; font: inherit; font-size: 15px; font-weight: 600; color: #e8edf7;
    background: #16213a; border: 1px solid #263452; border-left: 3px solid #3b6fe0; border-radius: 12px; padding: 13px 14px; }
  .lx-item small { display: block; font-weight: 500; font-size: 12px; color: #8fa0bf; margin-top: 2px; }
  .lx-volta { position: sticky; top: calc(env(safe-area-inset-top) + 6px); z-index: 5; font: inherit; font-size: 14px; font-weight: 700;
    color: #0b1325; background: #e8edf7; border: 0; border-radius: 999px; padding: 8px 14px; margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .lx-faixa { display: none; margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: #173a2a; color: #d6f5e3; font-size: 13px; line-height: 1.4; }
  .lx-faixa button { margin: 6px 0 0; display: block; }
  #lx-cap img { max-width: 100%; height: auto; }
</style>
</head>
<body>
<main id="aviso">
  <h1>Sem conexão</h1>
  <p id="aviso-txt">O Endodirect precisa de internet para abrir. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
  <button type="button" class="lx-btn" id="tentar">Tentar de novo</button>
</main>
<div id="leitor">
  <div class="lx-topo">
    <div class="lx-estado">📴 <b>Sem internet.</b> Lendo o que foi baixado neste aparelho.</div>
    <button type="button" class="lx-btn" id="tentar2">Tentar conectar</button>
  </div>
  <div class="lx-faixa" id="faixa">A conexão voltou.<button type="button" class="lx-btn" id="abrir">Abrir o Endodirect</button></div>
  <div id="tela"></div>
</div>
<script>
(function () {
  var SITE = 'https://www.endodirect.com.br/?app=ios';
  var VALIDADE_MS = 30 * 86400000;
  function abrirSite() { location.replace(SITE); }
  document.getElementById('tentar').addEventListener('click', abrirSite);
  document.getElementById('tentar2').addEventListener('click', abrirSite);
  document.getElementById('abrir').addEventListener('click', abrirSite);
  window.addEventListener('online', function () { document.getElementById('faixa').style.display = 'block'; });

  var C = window.Capacitor;
  var FS = C && C.Plugins && C.Plugins.Filesystem;
  if (!FS) return; // app 1.2 ou anterior: só a mensagem

  var pacote = null, base = '', estado = { sub: null, i: null, y: 0 };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function tela() { return document.getElementById('tela'); }

  function desenhar() {
    var t = tela(), h = '';
    if (estado.sub == null) {
      h += '<div class="lx-h">📚 Resumos baixados</div><div class="lx-lista">';
      pacote.subs.forEach(function (s, k) {
        var n = (s.itens || []).length;
        h += '<button type="button" class="lx-item" data-sub="' + k + '">' + esc(s.sub) + '<small>' + n + ' ' + (n === 1 ? 'texto' : 'textos') + '</small></button>';
      });
      t.innerHTML = h + '</div>';
      window.scrollTo(0, estado.y || 0);
      return;
    }
    var s = pacote.subs[estado.sub];
    if (estado.i == null) {
      h += '<button type="button" class="lx-volta" data-volta="1">← Todas as áreas</button><div class="lx-h">' + esc(s.sub) + '</div>';
      ['capitulo', 'artigo'].forEach(function (tipo) {
        var l = [];
        (s.itens || []).forEach(function (it, i) { if ((it.tipo || 'capitulo') === tipo) l.push([it, i]); });
        if (!l.length) return;
        h += '<div class="lx-sec">' + (tipo === 'artigo' ? 'Artigos' : 'Capítulos') + '</div><div class="lx-lista">';
        l.forEach(function (x) { h += '<button type="button" class="lx-item" data-i="' + x[1] + '">' + esc(x[0].tema) + '</button>'; });
        h += '</div>';
      });
      t.innerHTML = h;
      window.scrollTo(0, 0);
      return;
    }
    var it = s.itens[estado.i];
    t.innerHTML = '<button type="button" class="lx-volta" data-volta="1">← ' + esc(s.sub) + '</button>'
      + '<div class="lx-h">' + esc(it.tema) + '</div><div id="lx-cap">' + (it.html || '') + '</div>';
    t.querySelectorAll('img[data-off]').forEach(function (img) {
      img.src = base + '/fig/' + encodeURIComponent(img.getAttribute('data-off'));
      img.onerror = function () { img.style.display = 'none'; };
    });
    window.scrollTo(0, 0);
  }

  document.getElementById('tela').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-sub')) { estado.y = window.scrollY; estado.sub = +b.getAttribute('data-sub'); estado.i = null; desenhar(); }
    else if (b.hasAttribute('data-i')) { estado.i = +b.getAttribute('data-i'); desenhar(); }
    else if (b.hasAttribute('data-volta')) { if (estado.i != null) estado.i = null; else estado.sub = null; desenhar(); }
  });

  FS.readFile({ path: 'offline/leitor.json', directory: 'CACHE', encoding: 'utf8' }).then(function (r) {
    var p = JSON.parse(r && r.data);
    if (!p || !Array.isArray(p.subs) || !p.subs.length) return;
    if (!(Date.now() - (+p.at || 0) <= VALIDADE_MS)) {
      document.getElementById('aviso-txt').textContent = 'As áreas dos Resumos baixadas neste aparelho ficaram mais de 30 dias sem conexão. Conecte-se uma vez para renová-las.';
      return;
    }
    return FS.getUri({ path: 'offline', directory: 'CACHE' }).then(function (u) {
      pacote = p;
      base = C.convertFileSrc(u.uri).replace(/\/$/, '');
      if (p.css) { var st = document.createElement('style'); st.textContent = p.css; document.head.insertBefore(st, document.head.firstChild); }
      // Tema: o escuro, padrão do app (a moldura desta tela é escura; o claro deixaria os cartões destoando).
      document.getElementById('aviso').style.display = 'none';
      document.getElementById('leitor').style.display = 'block';
      desenhar();
    });
  }).catch(function () { /* sem pacote: fica a mensagem */ });
})();
</script>
</body>
</html>
