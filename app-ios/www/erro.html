<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sem conexão — Endodirect</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b1325; color: #e8edf7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; max-width: 32ch; line-height: 1.5; color: #b6c2da; }
  button { margin-top: 8px; font: inherit; font-weight: 600; color: #0b1325; background: #e8edf7;
    border: 0; border-radius: 10px; padding: 12px 22px; }
  button:focus-visible { outline: 3px solid #7fa6ff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Sem conexão</h1>
  <p>O Endodirect precisa de internet para abrir. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
  <button type="button" id="tentar">Tentar de novo</button>
</main>
<script>
  document.getElementById('tentar').addEventListener('click', function () {
    location.replace('https://www.endodirect.com.br/?app=ios');
  });
</script>
</body>
</html>
