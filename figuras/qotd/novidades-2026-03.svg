<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 478" width="720" height="478" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="ATTAIN-1: variação do peso em 72 semanas (dose da cápsula e o comprimido equivalente)"><rect width="720" height="478" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">ATTAIN-1: variação do peso em 72 semanas (dose</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">da cápsula e o comprimido equivalente)</text><text x="24" y="106" font-size="18" fill="#4b5563">% de variação do peso</text><text x="238" y="148" font-size="18" text-anchor="end" fill="#1f2937">36 mg cápsula (≡ 17,2</text><text x="238" y="168" font-size="18" text-anchor="end" fill="#1f2937">mg comprimido)</text><rect x="250" y="132" width="360.0" height="40" rx="5" fill="#0f766e"/><text x="620.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">−11,2%</text><text x="238" y="206" font-size="18" text-anchor="end" fill="#1f2937">12 mg cápsula (≡ 9 mg</text><text x="238" y="226" font-size="18" text-anchor="end" fill="#1f2937">comprimido)</text><rect x="250" y="190" width="270.0" height="40" rx="5" fill="#0f766e"/><text x="530.0" y="217.0" font-size="20" font-weight="700" fill="#1f2937">−8,4%</text><text x="238" y="264" font-size="18" text-anchor="end" fill="#1f2937">6 mg cápsula (≡ 5,5 mg</text><text x="238" y="284" font-size="18" text-anchor="end" fill="#1f2937">comprimido)</text><rect x="250" y="248" width="241.1" height="40" rx="5" fill="#0f766e"/><text x="501.1" y="275.0" font-size="20" font-weight="700" fill="#1f2937">−7,5%</text><text x="238" y="332" font-size="18" text-anchor="end" fill="#1f2937">Placebo</text><rect x="250" y="306" width="67.5" height="40" rx="5" fill="#9ca3af"/><text x="327.5" y="333.0" font-size="20" font-weight="700" fill="#1f2937">−2,1%</text><line x1="250" y1="126" x2="250" y2="352" stroke="#4b5563" stroke-width="1.5"/><text x="690" y="366" font-size="15" text-anchor="end" fill="#4b5563">valores negativos: redução</text><text x="24" y="402" font-size="17" fill="#4b5563">Média; estimando de regime de tratamento. Fonte: Wharton S, et al. N</text><text x="24" y="424" font-size="17" fill="#4b5563">Engl J Med. 2025; equivalência de doses: Lilly Medical Information,</text><text x="24" y="446" font-size="17" fill="#4b5563">2026.</text></svg>