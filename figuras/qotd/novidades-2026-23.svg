<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 554" width="720" height="554" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Transição no mundo real: o que os centros oferecem"><rect width="720" height="554" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Transição no mundo real: o que os centros</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">oferecem</text><text x="24" y="106" font-size="18" fill="#4b5563">% dos 372 profissionais que relataram o recurso</text><text x="238" y="148" font-size="18" text-anchor="end" fill="#1f2937">Clínica de transição</text><text x="238" y="168" font-size="18" text-anchor="end" fill="#1f2937">conjunta</text><rect x="250" y="132" width="372.0" height="40" rx="5" fill="#0f766e"/><text x="632.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">35,2%</text><text x="238" y="206" font-size="18" text-anchor="end" fill="#1f2937">Instrumento de</text><text x="238" y="226" font-size="18" text-anchor="end" fill="#1f2937">prontidão</text><rect x="250" y="190" width="346.6" height="40" rx="5" fill="#0f766e"/><text x="606.6" y="217.0" font-size="20" font-weight="700" fill="#1f2937">32,8%</text><text x="238" y="264" font-size="18" text-anchor="end" fill="#1f2937">Informação escrita à</text><text x="238" y="284" font-size="18" text-anchor="end" fill="#1f2937">equipe de adultos</text><rect x="250" y="248" width="312.8" height="40" rx="5" fill="#0f766e"/><text x="572.8" y="275.0" font-size="20" font-weight="700" fill="#1f2937">29,6%</text><text x="238" y="332" font-size="18" text-anchor="end" fill="#1f2937">Apoio psicológico</text><rect x="250" y="306" width="272.7" height="40" rx="5" fill="#0f766e"/><text x="532.7" y="333.0" font-size="20" font-weight="700" fill="#1f2937">25,8%</text><text x="238" y="380" font-size="18" text-anchor="end" fill="#1f2937">Profissional dedicado</text><text x="238" y="400" font-size="18" text-anchor="end" fill="#1f2937">à transição</text><rect x="250" y="364" width="243.1" height="40" rx="5" fill="#0f766e"/><text x="503.1" y="391.0" font-size="20" font-weight="700" fill="#1f2937">23%</text><text x="238" y="438" font-size="18" text-anchor="end" fill="#1f2937">Educação estruturada</text><text x="238" y="458" font-size="18" text-anchor="end" fill="#1f2937">para a transição</text><rect x="250" y="422" width="237.8" height="40" rx="5" fill="#0f766e"/><text x="497.8" y="449.0" font-size="20" font-weight="700" fill="#1f2937">22,5%</text><line x1="250" y1="126" x2="250" y2="468" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="500" font-size="17" fill="#4b5563">Inquérito global do grupo de trabalho ISPAD/EASD/ADA. Fonte: de Beaufort</text><text x="24" y="522" font-size="17" fill="#4b5563">C, et al. Diabetologia. 2026;69:3396-408.</text></svg>