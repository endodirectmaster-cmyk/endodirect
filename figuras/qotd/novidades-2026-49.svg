<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" width="720" height="292" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="ACHIEVE-4: MACE-4, orforglipron × insulina glargina"><rect width="720" height="292" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">ACHIEVE-4: MACE-4, orforglipron × insulina</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">glargina</text><text x="24" y="128" font-size="18" fill="#1f2937">MACE-4</text><text x="24" y="148" font-size="16" fill="#4b5563">HR 0,84 (IC 95% 0,59–1,20)</text><line x1="357.2" y1="132" x2="602.8" y2="132" stroke="#0f766e" stroke-width="3"/><rect x="471.4" y="124" width="16" height="16" fill="#0f766e"/><line x1="539.8" y1="104" x2="539.8" y2="166" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/><text x="300.0" y="186" font-size="15" text-anchor="middle" fill="#4b5563">0,5</text><text x="440.2" y="186" font-size="15" text-anchor="middle" fill="#4b5563">0,75</text><text x="539.8" y="186" font-size="15" text-anchor="middle" fill="#4b5563">1</text><text x="680.0" y="186" font-size="15" text-anchor="middle" fill="#4b5563">1,5</text><text x="300" y="208" font-size="15" fill="#4b5563">← favorece o orforglipron</text><text x="680" y="208" font-size="15" text-anchor="end" fill="#4b5563">favorece a glargina →</text><text x="24" y="238" font-size="17" fill="#4b5563">Não inferioridade: limite superior do IC 95% &lt; 1,8. Seguimento mediano</text><text x="24" y="260" font-size="17" fill="#4b5563">de 2 anos. Fonte: Klein KR, et al. Lancet. 2026.</text></svg>