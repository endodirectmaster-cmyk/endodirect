<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 291" width="720" height="291" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="DASH4D: tempo no alvo (70–180 mg/dL) no CGM"><rect width="720" height="291" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">DASH4D: tempo no alvo (70–180 mg/dL) no CGM</text><text x="24" y="75" font-size="18" fill="#4b5563">Tempo no alvo (%)</text><text x="238" y="127" font-size="18" text-anchor="end" fill="#1f2937">Dieta DASH4D</text><rect x="250" y="101" width="372.0" height="40" rx="5" fill="#0f766e"/><text x="632.0" y="128.0" font-size="20" font-weight="700" fill="#1f2937">83%</text><text x="238" y="175" font-size="18" text-anchor="end" fill="#1f2937">Dieta habitual (típica</text><text x="238" y="195" font-size="18" text-anchor="end" fill="#1f2937">dos EUA)</text><rect x="250" y="159" width="348.7" height="40" rx="5" fill="#9ca3af"/><text x="608.7" y="186.0" font-size="20" font-weight="700" fill="#1f2937">77,8%</text><line x1="250" y1="95" x2="250" y2="205" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="237" font-size="17" fill="#4b5563">Média ajustada; ensaio cruzado, 5 semanas por dieta, peso mantido.</text><text x="24" y="259" font-size="17" fill="#4b5563">Fonte: Fang M, et al. Nat Med. 2025.</text></svg>