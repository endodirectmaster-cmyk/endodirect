<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" width="720" height="348" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Lp(a)HORIZON: pelacarsena × placebo, desfecho cardiovascular primário"><rect width="720" height="348" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Lp(a)HORIZON: pelacarsena × placebo, desfecho</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">cardiovascular primário</text><text x="24" y="128" font-size="18" fill="#1f2937">População total</text><text x="24" y="148" font-size="16" fill="#4b5563">HR 1,02 (IC 95% 0,90–1,15)</text><line x1="503.3" y1="132" x2="588.1" y2="132" stroke="#0f766e" stroke-width="3"/><rect x="538.6" y="124" width="16" height="16" fill="#0f766e"/><text x="24" y="184" font-size="18" fill="#1f2937">Lp(a) basal ≥ 90 mg/dL</text><text x="24" y="204" font-size="16" fill="#4b5563">HR 1,00 (IC 95% 0,87–1,15)</text><line x1="491.6" y1="188" x2="588.1" y2="188" stroke="#0f766e" stroke-width="3"/><rect x="531.8" y="180" width="16" height="16" fill="#0f766e"/><line x1="539.8" y1="104" x2="539.8" y2="222" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/><text x="300.0" y="242" font-size="15" text-anchor="middle" fill="#4b5563">0,5</text><text x="440.2" y="242" font-size="15" text-anchor="middle" fill="#4b5563">0,75</text><text x="539.8" y="242" font-size="15" text-anchor="middle" fill="#4b5563">1</text><text x="680.0" y="242" font-size="15" text-anchor="middle" fill="#4b5563">1,5</text><text x="300" y="264" font-size="15" fill="#4b5563">← favorece a pelacarsena</text><text x="680" y="264" font-size="15" text-anchor="end" fill="#4b5563">favorece o placebo →</text><text x="24" y="294" font-size="17" fill="#4b5563">Morte CV, IAM ou AVC não fatais, revascularização urgente; mediana de</text><text x="24" y="316" font-size="17" fill="#4b5563">4,7 anos. Fonte: Cho L, et al. N Engl J Med. 2026.</text></svg>