<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 448" width="720" height="448" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Lp(a)HORIZON, análises estendidas: nenhum grupo com benefício"><rect width="720" height="448" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Lp(a)HORIZON, análises estendidas: nenhum</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">grupo com benefício</text><text x="24" y="128" font-size="18" fill="#1f2937">Em tratamento</text><text x="24" y="148" font-size="16" fill="#4b5563">HR 0,98 (IC 95% 0,85–1,12)</text><line x1="483.5" y1="132" x2="579.0" y2="132" stroke="#0f766e" stroke-width="3"/><rect x="524.8" y="124" width="16" height="16" fill="#0f766e"/><text x="24" y="184" font-size="18" fill="#1f2937">Queda da Lp(a) ≥ 170</text><text x="24" y="204" font-size="18" fill="#1f2937">nmol/L aos 3 meses</text><text x="24" y="224" font-size="16" fill="#4b5563">HR 1,09 (IC 95% 0,92–1,29)</text><line x1="510.9" y1="188" x2="627.8" y2="188" stroke="#0f766e" stroke-width="3"/><rect x="561.6" y="180" width="16" height="16" fill="#0f766e"/><text x="24" y="262" font-size="18" fill="#1f2937">Lp(a) atingida ≤ 69,5</text><text x="24" y="282" font-size="18" fill="#1f2937">nmol/L aos 3 meses</text><text x="24" y="302" font-size="16" fill="#4b5563">HR 1,10 (IC 95% 0,93–1,29)</text><line x1="514.7" y1="266" x2="627.8" y2="266" stroke="#0f766e" stroke-width="3"/><rect x="564.7" y="258" width="16" height="16" fill="#0f766e"/><line x1="539.8" y1="104" x2="539.8" y2="322" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/><text x="300.0" y="342" font-size="15" text-anchor="middle" fill="#4b5563">0,5</text><text x="440.2" y="342" font-size="15" text-anchor="middle" fill="#4b5563">0,75</text><text x="539.8" y="342" font-size="15" text-anchor="middle" fill="#4b5563">1</text><text x="680.0" y="342" font-size="15" text-anchor="middle" fill="#4b5563