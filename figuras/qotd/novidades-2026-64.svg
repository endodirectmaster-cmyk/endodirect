<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="STAREE: atorvastatina 40 mg × placebo em 5,9 anos"><rect width="720" height="392" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">STAREE: atorvastatina 40 mg × placebo em 5,9</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">anos</text><text x="24" y="128" font-size="18" fill="#1f2937">Eventos cardiovasculares</text><text x="24" y="148" font-size="18" fill="#1f2937">maiores</text><text x="24" y="168" font-size="16" fill="#4b5563">HR 0,70 (IC 95% 0,61–0,82)</text><line x1="368.8" y1="132" x2="471.1" y2="132" stroke="#0f766e" stroke-width="3"/><rect x="408.4" y="124" width="16" height="16" fill="#0f766e"/><text x="24" y="206" font-size="18" fill="#1f2937">Morte, demência ou</text><text x="24" y="226" font-size="18" fill="#1f2937">incapacidade persistente</text><text x="24" y="246" font-size="16" fill="#4b5563">HR 0,94 (IC 95% 0,84–1,05)</text><line x1="479.4" y1="210" x2="556.6" y2="210" stroke="#0f766e" stroke-width="3"/><rect x="510.4" y="202" width="16" height="16" fill="#0f766e"/><line x1="539.8" y1="104" x2="539.8" y2="266" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/><text x="300.0" y="286" font-size="15" text-anchor="middle" fill="#4b5563">0,5</text><text x="440.2" y="286" font-size="15" text-anchor="middle" fill="#4b5563">0,75</text><text x="539.8" y="286" font-size="15" text-anchor="middle" fill="#4b5563">1</text><text x="680.0" y="286" font-size="15" text-anchor="middle" fill="#4b5563">1,5</text><text x="300" y="308" font-size="15" fill="#4b5563">← favorece a atorvastatina</text><text x="680" y="308" font-size="15" text-anchor="end" fill="#4b5563">favorece o placebo →</text><text x="24" y="338" font-size="17" fill="#4b5563">Idosos ≥ 70 anos sem DCV, diabetes ou demência. Fonte: Zoungas S, et al.</text><te