<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="AMUNDSEN: LDL-c &lt; 55 mg/dL e queda ≥ 50% em 12 meses"><rect width="720" height="322" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">AMUNDSEN: LDL-c &lt; 55 mg/dL e queda ≥ 50% em 12</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">meses</text><text x="24" y="106" font-size="18" fill="#4b5563">% dos pacientes no alvo</text><text x="238" y="148" font-size="18" text-anchor="end" fill="#1f2937">Evolocumabe antes da</text><text x="238" y="168" font-size="18" text-anchor="end" fill="#1f2937">angioplastia</text><rect x="250" y="132" width="396.0" height="40" rx="5" fill="#0f766e"/><text x="656.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">82%</text><text x="238" y="206" font-size="18" text-anchor="end" fill="#1f2937">Cuidado padrão</text><text x="238" y="226" font-size="18" text-anchor="end" fill="#1f2937">(escalonado)</text><rect x="250" y="190" width="193.2" height="40" rx="5" fill="#9ca3af"/><text x="453.2" y="217.0" font-size="20" font-weight="700" fill="#1f2937">40%</text><line x1="250" y1="126" x2="250" y2="236" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="268" font-size="17" fill="#4b5563">792/970 × 370/934. Morte ou hospitalização CV em 12 meses: 14,6% × 15,4%</text><text x="24" y="290" font-size="17" fill="#4b5563">(P = 0,59). Fonte: Montalescot G, et al. JAMA. 2026.</text></svg>