<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="PaTHway, semana 182 (3,5 anos) com palopegteriparatida"><rect width="720" height="380" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">PaTHway, semana 182 (3,5 anos) com</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">palopegteriparatida</text><text x="24" y="106" font-size="18" fill="#4b5563">% dos 73 participantes que completaram</text><text x="238" y="158" font-size="18" text-anchor="end" fill="#1f2937">Sem vitamina D ativa</text><rect x="250" y="132" width="384.0" height="40" rx="5" fill="#0f766e"/><text x="644.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">100%</text><text x="238" y="206" font-size="18" text-anchor="end" fill="#1f2937">Sem cálcio em dose</text><text x="238" y="226" font-size="18" text-anchor="end" fill="#1f2937">terapêutica</text><rect x="250" y="190" width="368.6" height="40" rx="5" fill="#0f766e"/><text x="628.6" y="217.0" font-size="20" font-weight="700" fill="#1f2937">96%</text><text x="238" y="274" font-size="18" text-anchor="end" fill="#1f2937">Normocalcemia</text><rect x="250" y="248" width="341.8" height="40" rx="5" fill="#0f766e"/><text x="601.8" y="275.0" font-size="20" font-weight="700" fill="#1f2937">89%</text><line x1="250" y1="126" x2="250" y2="294" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="326" font-size="17" fill="#4b5563">Independência: até 600 mg/dia de cálcio elementar e nenhuma vitamina D</text><text x="24" y="348" font-size="17" fill="#4b5563">ativa. Fonte: Khan AA, et al. J Clin Endocrinol Metab. 2026.</text></svg>