<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 402" width="720" height="402" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Reganho de peso por mês após suspender o tratamento"><rect width="720" height="402" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Reganho de peso por mês após suspender o</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">tratamento</text><text x="24" y="106" font-size="18" fill="#4b5563">Reganho médio (kg/mês)</text><text x="238" y="138" font-size="18" text-anchor="end" fill="#1f2937">Programa</text><text x="238" y="158" font-size="18" text-anchor="end" fill="#1f2937">comportamental (sem</text><text x="238" y="178" font-size="18" text-anchor="end" fill="#1f2937">fármaco)</text><rect x="250" y="132" width="45.0" height="40" rx="5" fill="#0f766e"/><text x="305.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">0,1 kg</text><text x="238" y="206" font-size="18" text-anchor="end" fill="#1f2937">Qualquer fármaco</text><text x="238" y="226" font-size="18" text-anchor="end" fill="#1f2937">antiobesidade</text><rect x="250" y="190" width="180.0" height="40" rx="5" fill="#0f766e"/><text x="440.0" y="217.0" font-size="20" font-weight="700" fill="#1f2937">0,4 kg</text><text x="238" y="264" font-size="18" text-anchor="end" fill="#1f2937">Semaglutida ou</text><text x="238" y="284" font-size="18" text-anchor="end" fill="#1f2937">tirzepatida</text><rect x="250" y="248" width="360.0" height="40" rx="5" fill="#0f766e"/><text x="620.0" y="275.0" font-size="20" font-weight="700" fill="#1f2937">0,8 kg</text><line x1="250" y1="126" x2="250" y2="294" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="326" font-size="17" fill="#4b5563">Modelo misto; comparação indireta com programas comportamentais. Peso</text><text x="24" y="348" font-size="17" fill="#4b5563">basal projetado em 3,9 anos (programa), 1,7 ano (qualquer fármaco) e 1,5</text><text x="24" y="370" font-size="17" fill="#4b5563">ano (semaglutida/tirzepatida). Fonte: West S, et al. BMJ. 2026.</text></svg>