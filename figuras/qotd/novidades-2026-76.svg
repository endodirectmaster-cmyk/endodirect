<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" width="720" height="548" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="CTT 2026: efeitos de bula confirmados em ECR cegos"><rect width="720" height="548" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">CTT 2026: efeitos de bula confirmados em ECR</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">cegos</text><text x="24" y="128" font-size="18" fill="#1f2937">Alteração de</text><text x="24" y="148" font-size="18" fill="#1f2937">transaminases</text><text x="24" y="168" font-size="16" fill="#4b5563">RR 1,41 (IC 95% 1,26–1,57)</text><line x1="606.9" y1="132" x2="680.0" y2="132" stroke="#0f766e" stroke-width="3"/><rect x="636.3" y="124" width="16" height="16" fill="#0f766e"/><text x="24" y="206" font-size="18" fill="#1f2937">Outras alterações de</text><text x="24" y="226" font-size="18" fill="#1f2937">provas hepáticas</text><text x="24" y="246" font-size="16" fill="#4b5563">RR 1,26 (IC 95% 1,12–1,41)</text><line x1="567.8" y1="210" x2="644.3" y2="210" stroke="#0f766e" stroke-width="3"/><rect x="598.9" y="202" width="16" height="16" fill="#0f766e"/><text x="24" y="284" font-size="18" fill="#1f2937">Alteração da composição</text><text x="24" y="304" font-size="18" fill="#1f2937">urinária</text><text x="24" y="324" font-size="16" fill="#4b5563">RR 1,18 (IC 95% 1,04–1,33)</text><line x1="543.2" y1="288" x2="624.9" y2="288" stroke="#0f766e" stroke-width="3"/><rect x="577.2" y="280" width="16" height="16" fill="#0f766e"/><text x="24" y="362" font-size="18" fill="#1f2937">Edema</text><text x="24" y="382" font-size="16" fill="#4b5563">RR 1,07 (IC 95% 1,02–1,12)</text><line x1="536.8" y1="366" x2="567.8" y2="366" stroke="#0f766e" stroke-width="3"/><rect x="544.7" y="358" width="16" height="16" fill="#0f766e"/><line x1="530.2" y1="104" x2="530.2" y2="400" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/><text x="300.0" y="420" font-size="15" text-anchor="middle" fill="#4b5563">0,5</text><text x="434.7" y="420" font-size="15" text-anchor="middle" fill="#4b5563">0,75</text><text x="530.2" y="420" font-size="15" text-anchor="middle" fill="#4b5563">1</text><text x="664.9" y="420" font-size="15" text-anchor="middle" fill="#4b5563">1,5</text><text x="300" y="442" font-size="15" fill="#4b5563">← menos com estatina</text><text x="680" y="442" font-size="15" text-anchor="end" fill="#4b5563">mais com estatina →</text><text x="24" y="472" font-size="17" fill="#4b5563">Razão de taxas (RR), estatina vs placebo, 19 ECR. Só 4 de 66 efeitos de</text><text x="24" y="494" font-size="17" fill="#4b5563">bula foram significativos; memória, sono, depressão e neuropatia não.</text><text x="24" y="516" font-size="17" fill="#4b5563">Fonte: CTT Collaboration. Lancet. 2026.</text></svg>