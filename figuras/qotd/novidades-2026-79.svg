<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Glicocorticoide oral crônico: principais causas de morte"><rect width="720" height="380" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Glicocorticoide oral crônico: principais</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">causas de morte</text><text x="24" y="106" font-size="18" fill="#4b5563">% dos óbitos</text><text x="238" y="158" font-size="18" text-anchor="end" fill="#1f2937">Doença cardiovascular</text><rect x="250" y="132" width="372.0" height="40" rx="5" fill="#0f766e"/><text x="632.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">25,6%</text><text x="238" y="216" font-size="18" text-anchor="end" fill="#1f2937">Neoplasia</text><rect x="250" y="190" width="228.1" height="40" rx="5" fill="#0f766e"/><text x="488.1" y="217.0" font-size="20" font-weight="700" fill="#1f2937">15,7%</text><text x="238" y="274" font-size="18" text-anchor="end" fill="#1f2937">Infecção</text><rect x="250" y="248" width="194.7" height="40" rx="5" fill="#0f766e"/><text x="454.7" y="275.0" font-size="20" font-weight="700" fill="#1f2937">13,4%</text><line x1="250" y1="126" x2="250" y2="294" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="326" font-size="17" fill="#4b5563">116 estudos, 51.380 pacientes; SMR combinado 1,87 (IC 95% 1,32–2,61).</text><text x="24" y="348" font-size="17" fill="#4b5563">Fonte: Limumpornpetch P, et al. J Clin Endocrinol Metab. 2026.</text></svg>