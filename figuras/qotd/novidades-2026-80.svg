<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 402" width="720" height="402" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Amenorreia hipotalâmica funcional: DMO lombar vs controle"><rect width="720" height="402" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Amenorreia hipotalâmica funcional: DMO lombar</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">vs controle</text><text x="24" y="106" font-size="18" fill="#4b5563">Diferença média padronizada (DMO da coluna lombar)</text><text x="238" y="158" font-size="18" text-anchor="end" fill="#1f2937">Estradiol transdérmico</text><rect x="250" y="132" width="384.0" height="40" rx="5" fill="#0f766e"/><text x="644.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">0,34</text><text x="238" y="216" font-size="18" text-anchor="end" fill="#1f2937">Terapia hormonal oral</text><rect x="250" y="190" width="146.8" height="40" rx="5" fill="#0f766e"/><text x="406.8" y="217.0" font-size="20" font-weight="700" fill="#1f2937">0,13</text><text x="238" y="264" font-size="18" text-anchor="end" fill="#1f2937">Anticoncepcional oral</text><text x="238" y="284" font-size="18" text-anchor="end" fill="#1f2937">combinado</text><rect x="250" y="248" width="79.1" height="40" rx="5" fill="#0f766e"/><text x="339.1" y="275.0" font-size="20" font-weight="700" fill="#1f2937">0,07</text><line x1="250" y1="126" x2="250" y2="294" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="326" font-size="17" fill="#4b5563">IC 95%: 0,03 a 0,64 (transdérmico), −0,47 a 0,72 (oral) e −0,15 a 0,30</text><text x="24" y="348" font-size="17" fill="#4b5563">(anticoncepcional); só o transdérmico exclui o zero. Fonte: Efthymiadis</text><text x="24" y="370" font-size="17" fill="#4b5563">A, et al. J Clin Endocrinol Metab. 2026.</text></svg>