<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 402" width="720" height="402" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Alça fechada em menores de 7 anos: ganho no tempo no alvo"><rect width="720" height="402" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Alça fechada em menores de 7 anos: ganho no</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">tempo no alvo</text><text x="24" y="106" font-size="18" fill="#4b5563">Aumento do tempo no alvo 70–180 mg/dL (pontos percentuais)</text><text x="238" y="158" font-size="18" text-anchor="end" fill="#1f2937">Período noturno</text><rect x="250" y="132" width="372.0" height="40" rx="5" fill="#0f766e"/><text x="632.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">16,85</text><text x="238" y="216" font-size="18" text-anchor="end" fill="#1f2937">24 horas</text><rect x="250" y="190" width="218.1" height="40" rx="5" fill="#0f766e"/><text x="478.1" y="217.0" font-size="20" font-weight="700" fill="#1f2937">9,88</text><text x="238" y="274" font-size="18" text-anchor="end" fill="#1f2937">Período diurno</text><rect x="250" y="248" width="151.9" height="40" rx="5" fill="#0f766e"/><text x="411.9" y="275.0" font-size="20" font-weight="700" fill="#1f2937">6,88</text><line x1="250" y1="126" x2="250" y2="294" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="326" font-size="17" fill="#4b5563">Mudança média com o sistema automatizado (30 estudos, 1.155 crianças);</text><text x="24" y="348" font-size="17" fill="#4b5563">9,88 pontos ≈ 2,37 h/dia. Fonte: Oktavian P, et al. J Clin Endocrinol</text><text x="24" y="370" font-size="17" fill="#4b5563">Metab. 2026.</text></svg>