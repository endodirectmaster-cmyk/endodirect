<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Crise de feocromocitoma: operar em emergência ou depois de estabilizar"><rect width="720" height="460" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Crise de feocromocitoma: operar em emergência</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">ou depois de estabilizar</text><text x="24" y="106" font-size="18" fill="#4b5563">% dos pacientes operados</text><text x="238" y="138" font-size="18" text-anchor="end" fill="#1f2937">Complicação</text><text x="238" y="158" font-size="18" text-anchor="end" fill="#1f2937">intraoperatória:</text><text x="238" y="178" font-size="18" text-anchor="end" fill="#1f2937">emergência</text><rect x="250" y="132" width="396.0" height="40" rx="5" fill="#0f766e"/><text x="656.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">80%</text><text x="238" y="196" font-size="18" text-anchor="end" fill="#1f2937">Complicação</text><text x="238" y="216" font-size="18" text-anchor="end" fill="#1f2937">intraoperatória:</text><text x="238" y="236" font-size="18" text-anchor="end" fill="#1f2937">eletiva/urgente</text><rect x="250" y="190" width="207.9" height="40" rx="5" fill="#0f766e"/><text x="467.9" y="217.0" font-size="20" font-weight="700" fill="#1f2937">42%</text><text x="238" y="274" font-size="18" text-anchor="end" fill="#1f2937">Óbito: emergência</text><rect x="250" y="248" width="89.1" height="40" rx="5" fill="#0f766e"/><text x="349.1" y="275.0" font-size="20" font-weight="700" fill="#1f2937">18%</text><text x="238" y="332" font-size="18" text-anchor="end" fill="#1f2937">Óbito: eletiva/urgente</text><rect x="250" y="306" width="2.0" height="40" rx="5" fill="#0f766e"/><text x="262.0" y="333.0" font-size="20" font-weight="700" fill="#1f2937">0%</text><line x1="250" y1="126" x2="250" y2="352" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="384" font-size="17" fill="#4b5563">Revisão da literatura com pacientes em crise submetidos a adrenalectomia</text><text x="24" y="406" font-size="17" fill="#4b5563">(complicação: 20/25 x 13/31; óbito: 6/33 x 0/64). Fonte: Scholten A, et</text><text x="24" y="428" font-size="17" fill="#4b5563">al. J Clin Endocrinol Metab. 2013.</text></svg>