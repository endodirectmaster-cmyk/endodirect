<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 496" width="720" height="496" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Feocromocitoma/paraganglioma metastático com SDHB: lesões detectadas por exame"><rect width="720" height="496" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Feocromocitoma/paraganglioma metastático com</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">SDHB: lesões detectadas por exame</text><text x="24" y="106" font-size="18" fill="#4b5563">% das lesões detectadas</text><text x="238" y="158" font-size="18" text-anchor="end" fill="#1f2937">PET 68Ga-DOTATATE</text><rect x="250" y="132" width="372.0" height="40" rx="5" fill="#0f766e"/><text x="632.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">98,6%</text><text x="238" y="216" font-size="18" text-anchor="end" fill="#1f2937">PET 18F-FDG</text><rect x="250" y="190" width="323.7" height="40" rx="5" fill="#0f766e"/><text x="583.7" y="217.0" font-size="20" font-weight="700" fill="#1f2937">85,8%</text><text x="238" y="274" font-size="18" text-anchor="end" fill="#1f2937">TC/RM</text><rect x="250" y="248" width="319.9" height="40" rx="5" fill="#0f766e"/><text x="579.9" y="275.0" font-size="20" font-weight="700" fill="#1f2937">84,8%</text><text x="238" y="332" font-size="18" text-anchor="end" fill="#1f2937">PET 18F-FDOPA</text><rect x="250" y="306" width="231.7" height="40" rx="5" fill="#0f766e"/><text x="491.7" y="333.0" font-size="20" font-weight="700" fill="#1f2937">61,4%</text><text x="238" y="390" font-size="18" text-anchor="end" fill="#1f2937">PET 18F-fluorodopamina</text><rect x="250" y="364" width="195.8" height="40" rx="5" fill="#0f766e"/><text x="455.8" y="391.0" font-size="20" font-weight="700" fill="#1f2937">51,9%</text><line x1="250" y1="126" x2="250" y2="410" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="442" font-size="17" fill="#4b5563">17 pacientes com feocromocitoma/paraganglioma metastático e SDHB;</text><text x="24" y="464" font-size="17" fill="#4b5563">análise por lesão. Fonte: Janssen I, et al. Clin Cancer Res. 2015.</text></svg>