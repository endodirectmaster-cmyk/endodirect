<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Supressão contralateral no cateterismo e cura após adrenalectomia"><rect width="720" height="322" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Supressão contralateral no cateterismo e cura</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">após adrenalectomia</text><text x="24" y="106" font-size="18" fill="#4b5563">% com cura bioquímica completa</text><text x="238" y="148" font-size="18" text-anchor="end" fill="#1f2937">Supressão</text><text x="238" y="168" font-size="18" text-anchor="end" fill="#1f2937">contralateral &gt; 50%</text><rect x="250" y="132" width="372.0" height="40" rx="5" fill="#0f766e"/><text x="632.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">98,4%</text><text x="238" y="216" font-size="18" text-anchor="end" fill="#1f2937">Supressão ≤ 50%</text><rect x="250" y="190" width="162.2" height="40" rx="5" fill="#0f766e"/><text x="422.2" y="217.0" font-size="20" font-weight="700" fill="#1f2937">42,9%</text><line x1="250" y1="126" x2="250" y2="236" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="268" font-size="17" fill="#4b5563">Cateterismo sob cosintropina; supressão = (1 − índice do lado não</text><text x="24" y="290" font-size="17" fill="#4b5563">dominante) × 100. Fonte: Okubo J, et al. J Clin Endocrinol Metab. 2024.</text></svg>