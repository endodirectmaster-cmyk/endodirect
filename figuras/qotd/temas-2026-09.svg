<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Microprolactinoma: recidiva após suspender a cabergolina"><rect width="720" height="322" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Microprolactinoma: recidiva após suspender a</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">cabergolina</text><text x="24" y="106" font-size="18" fill="#4b5563">% com recidiva da hiperprolactinemia em 24 meses</text><text x="238" y="148" font-size="18" text-anchor="end" fill="#1f2937">Suspensão antes da</text><text x="238" y="168" font-size="18" text-anchor="end" fill="#1f2937">menopausa (n = 48)</text><rect x="250" y="132" width="396.0" height="40" rx="5" fill="#0f766e"/><text x="656.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">73%</text><text x="238" y="206" font-size="18" text-anchor="end" fill="#1f2937">Suspensão após a</text><text x="238" y="226" font-size="18" text-anchor="end" fill="#1f2937">menopausa (n = 14)</text><rect x="250" y="190" width="157.3" height="40" rx="5" fill="#0f766e"/><text x="417.3" y="217.0" font-size="20" font-weight="700" fill="#1f2937">29%</text><line x1="250" y1="126" x2="250" y2="236" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="268" font-size="17" fill="#4b5563">Recidiva = prolactina acima do normal em duas dosagens. Fonte: Indirli</text><text x="24" y="290" font-size="17" fill="#4b5563">R, et al. Horm Cancer. 2019.</text></svg>