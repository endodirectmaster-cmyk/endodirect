<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Acerto do lado do adenoma: CSPI × RM (NIH, n = 501)"><rect width="720" height="322" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Acerto do lado do adenoma: CSPI × RM (NIH, n =</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">501)</text><text x="24" y="106" font-size="18" fill="#4b5563">Valor preditivo positivo (%)</text><text x="238" y="148" font-size="18" text-anchor="end" fill="#1f2937">Razão interpetrosal</text><text x="238" y="168" font-size="18" text-anchor="end" fill="#1f2937">≥1,4 (CSPI)</text><rect x="250" y="132" width="317.7" height="40" rx="5" fill="#0f766e"/><text x="577.7" y="159.0" font-size="20" font-weight="700" fill="#1f2937">69%</text><text x="238" y="216" font-size="18" text-anchor="end" fill="#1f2937">RM com lesão visível</text><rect x="250" y="190" width="396.0" height="40" rx="5" fill="#0f766e"/><text x="656.0" y="217.0" font-size="20" font-weight="700" fill="#1f2937">86%</text><line x1="250" y1="126" x2="250" y2="236" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="268" font-size="17" fill="#4b5563">CSPI: 273 de 396 adenomas laterais; RM: 171 de 201 quando positiva.</text><text x="24" y="290" font-size="17" fill="#4b5563">Fonte: Wind JJ, et al. J Clin Endocrinol Metab. 2013.</text></svg>