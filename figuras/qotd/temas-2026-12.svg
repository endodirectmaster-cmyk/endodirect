<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 496" width="720" height="496" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Sintomas de abstinência após a cura cirúrgica do hipercortisolismo"><rect width="720" height="496" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Sintomas de abstinência após a cura cirúrgica</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">do hipercortisolismo</text><text x="24" y="106" font-size="18" fill="#4b5563">% dos pacientes</text><text x="238" y="158" font-size="18" text-anchor="end" fill="#1f2937">Mialgia e artralgia</text><rect x="250" y="132" width="396.0" height="40" rx="5" fill="#0f766e"/><text x="656.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">50%</text><text x="238" y="216" font-size="18" text-anchor="end" fill="#1f2937">Fadiga</text><rect x="250" y="190" width="356.4" height="40" rx="5" fill="#0f766e"/><text x="616.4" y="217.0" font-size="20" font-weight="700" fill="#1f2937">45%</text><text x="238" y="274" font-size="18" text-anchor="end" fill="#1f2937">Fraqueza</text><rect x="250" y="248" width="269.3" height="40" rx="5" fill="#0f766e"/><text x="529.3" y="275.0" font-size="20" font-weight="700" fill="#1f2937">34%</text><text x="238" y="332" font-size="18" text-anchor="end" fill="#1f2937">Distúrbio do sono</text><rect x="250" y="306" width="229.7" height="40" rx="5" fill="#0f766e"/><text x="489.7" y="333.0" font-size="20" font-weight="700" fill="#1f2937">29%</text><text x="238" y="390" font-size="18" text-anchor="end" fill="#1f2937">Alteração do humor</text><rect x="250" y="364" width="150.5" height="40" rx="5" fill="#0f766e"/><text x="410.5" y="391.0" font-size="20" font-weight="700" fill="#1f2937">19%</text><line x1="250" y1="126" x2="250" y2="410" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="442" font-size="17" fill="#4b5563">Avaliação semanal nas 12 semanas após a cirurgia. Fonte: Zhang CD, et</text><text x="24" y="464" font-size="17" fill="#4b5563">al. Eur J Endocrinol. 2023.</text></svg>