<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Relação de clearance Ca/Cr em 1.000 operados por HPTP"><rect width="720" height="380" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Relação de clearance Ca/Cr em 1.000 operados</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">por HPTP</text><text x="24" y="106" font-size="18" fill="#4b5563">% dos pacientes</text><text x="238" y="148" font-size="18" text-anchor="end" fill="#1f2937">&lt; 0,01 (faixa típica</text><text x="238" y="168" font-size="18" text-anchor="end" fill="#1f2937">da HHF)</text><rect x="250" y="132" width="161.7" height="40" rx="5" fill="#0f766e"/><text x="421.7" y="159.0" font-size="20" font-weight="700" fill="#1f2937">19%</text><text x="238" y="206" font-size="18" text-anchor="end" fill="#1f2937">0,01 a 0,02</text><text x="238" y="226" font-size="18" text-anchor="end" fill="#1f2937">(indeterminada)</text><rect x="250" y="190" width="372.0" height="40" rx="5" fill="#0f766e"/><text x="632.0" y="217.0" font-size="20" font-weight="700" fill="#1f2937">43,7%</text><text x="238" y="274" font-size="18" text-anchor="end" fill="#1f2937">&gt; 0,02</text><rect x="250" y="248" width="317.5" height="40" rx="5" fill="#0f766e"/><text x="577.5" y="275.0" font-size="20" font-weight="700" fill="#1f2937">37,3%</text><line x1="250" y1="126" x2="250" y2="294" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="326" font-size="17" fill="#4b5563">Hiperparatireoidismo primário confirmado na cirurgia. Fonte: Moore EC,</text><text x="24" y="348" font-size="17" fill="#4b5563">et al. Endocr Pract. 2018.</text></svg>