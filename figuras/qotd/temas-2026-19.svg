<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 482" width="720" height="482" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Denosumabe em diálise: hipocalcemia nas primeiras 12 semanas"><rect width="720" height="482" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Denosumabe em diálise: hipocalcemia nas</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">primeiras 12 semanas</text><text x="24" y="106" font-size="18" fill="#4b5563">% de pacientes (incidência ponderada em 12 semanas)</text><text x="238" y="158" font-size="18" text-anchor="end" fill="#1f2937">Grave: denosumabe</text><rect x="250" y="132" width="372.0" height="40" rx="5" fill="#0f766e"/><text x="632.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">41,1%</text><text x="238" y="206" font-size="18" text-anchor="end" fill="#1f2937">Grave: BF oral</text><text x="238" y="226" font-size="18" text-anchor="end" fill="#1f2937">(comparador)</text><rect x="250" y="190" width="18.1" height="40" rx="5" fill="#9ca3af"/><text x="278.1" y="217.0" font-size="20" font-weight="700" fill="#1f2937">2%</text><text x="238" y="264" font-size="18" text-anchor="end" fill="#1f2937">Muito grave:</text><text x="238" y="284" font-size="18" text-anchor="end" fill="#1f2937">denosumabe</text><rect x="250" y="248" width="98.7" height="40" rx="5" fill="#0f766e"/><text x="358.7" y="275.0" font-size="20" font-weight="700" fill="#1f2937">10,9%</text><text x="238" y="322" font-size="18" text-anchor="end" fill="#1f2937">Muito grave: BF oral</text><text x="238" y="342" font-size="18" text-anchor="end" fill="#1f2937">(comparador)</text><rect x="250" y="306" width="3.6" height="40" rx="5" fill="#9ca3af"/><text x="263.6" y="333.0" font-size="20" font-weight="700" fill="#1f2937">0,4%</text><line x1="250" y1="126" x2="250" y2="352" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="384" font-size="17" fill="#4b5563">Mulheres de 65 anos ou mais em diálise (Medicare, 2013–2020). Grave:</text><text x="24" y="406" font-size="17" fill="#4b5563">cálcio corrigido &lt; 7,5 mg/dL ou atendimento de emergência; muito grave:</text><text x="24" y="428" font-size="17" fill="#4b5563">&lt; 6,5 mg/dL ou emergência. BF: bisfosfonato. Fonte: Bird ST, et al.</text><text x="24" y="450" font-size="17" fill="#4b5563">JAMA. 2024.</text></svg>