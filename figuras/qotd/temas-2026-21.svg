<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 402" width="720" height="402" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Teriparatida seguida de denosumabe na pré-menopausa: ganho de DMO em 48 meses"><rect width="720" height="402" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Teriparatida seguida de denosumabe na</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">pré-menopausa: ganho de DMO em 48 meses</text><text x="24" y="106" font-size="18" fill="#4b5563">% de aumento da DMO</text><text x="238" y="158" font-size="18" text-anchor="end" fill="#1f2937">Coluna lombar</text><rect x="250" y="132" width="372.0" height="40" rx="5" fill="#0f766e"/><text x="632.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">21,9%</text><text x="238" y="216" font-size="18" text-anchor="end" fill="#1f2937">Quadril total</text><rect x="250" y="190" width="166.5" height="40" rx="5" fill="#0f766e"/><text x="426.5" y="217.0" font-size="20" font-weight="700" fill="#1f2937">9,8%</text><text x="238" y="274" font-size="18" text-anchor="end" fill="#1f2937">Colo femoral</text><rect x="250" y="248" width="161.4" height="40" rx="5" fill="#0f766e"/><text x="421.4" y="275.0" font-size="20" font-weight="700" fill="#1f2937">9,5%</text><line x1="250" y1="126" x2="250" y2="294" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="326" font-size="17" fill="#4b5563">Média; 24 meses de teriparatida seguidos de 24 meses de denosumabe em</text><text x="24" y="348" font-size="17" fill="#4b5563">mulheres com osteoporose idiopática da pré-menopausa. Fonte: Shane E, et</text><text x="24" y="370" font-size="17" fill="#4b5563">al. J Clin Endocrinol Metab. 2022.</text></svg>