<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Hipercalciúria com DMO baixa: variação da DMO lombar em 1 ano"><rect width="720" height="380" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Hipercalciúria com DMO baixa: variação da DMO</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">lombar em 1 ano</text><text x="24" y="106" font-size="18" fill="#4b5563">% de variação da DMO lombar</text><text x="238" y="158" font-size="18" text-anchor="end" fill="#1f2937">Indapamida</text><rect x="250" y="132" width="46.8" height="40" rx="5" fill="#0f766e"/><text x="306.8" y="159.0" font-size="20" font-weight="700" fill="#1f2937">1%</text><text x="238" y="216" font-size="18" text-anchor="end" fill="#1f2937">Alendronato</text><rect x="250" y="190" width="271.6" height="40" rx="5" fill="#0f766e"/><text x="531.6" y="217.0" font-size="20" font-weight="700" fill="#1f2937">5,8%</text><text x="238" y="264" font-size="18" text-anchor="end" fill="#1f2937">Alendronato +</text><text x="238" y="284" font-size="18" text-anchor="end" fill="#1f2937">indapamida</text><rect x="250" y="248" width="384.0" height="40" rx="5" fill="#0f766e"/><text x="644.0" y="275.0" font-size="20" font-weight="700" fill="#1f2937">8,2%</text><line x1="250" y1="126" x2="250" y2="294" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="326" font-size="17" fill="#4b5563">Média; mulheres pós-menopausa com cálcio urinário acima de 4 mg/kg/dia e</text><text x="24" y="348" font-size="17" fill="#4b5563">DMO baixa. Fonte: Giusti A, et al. Nephrol Dial Transplant. 2009.</text></svg>