<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="FGF23 intacto separa as causas de hipofosfatemia"><rect width="720" height="344" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">FGF23 intacto separa as causas de</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">hipofosfatemia</text><text x="24" y="106" font-size="18" fill="#4b5563">FGF23 intacto (pg/mL)</text><text x="238" y="148" font-size="18" text-anchor="end" fill="#1f2937">Outras causas (inclui</text><text x="238" y="168" font-size="18" text-anchor="end" fill="#1f2937">Fanconi): maior valor</text><rect x="250" y="132" width="196.2" height="40" rx="5" fill="#0f766e"/><text x="456.2" y="159.0" font-size="20" font-weight="700" fill="#1f2937">23,9 pg/mL</text><text x="238" y="206" font-size="18" text-anchor="end" fill="#1f2937">Osteomalácia tumoral e</text><text x="238" y="226" font-size="18" text-anchor="end" fill="#1f2937">XLH: menor valor</text><rect x="250" y="190" width="312.0" height="40" rx="5" fill="#0f766e"/><text x="572.0" y="217.0" font-size="20" font-weight="700" fill="#1f2937">38 pg/mL</text><line x1="250" y1="126" x2="250" y2="236" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="268" font-size="17" fill="#4b5563">Valores extremos de cada grupo: 32 pacientes com osteomalácia induzida</text><text x="24" y="290" font-size="17" fill="#4b5563">por tumor, 28 com raquitismo ligado ao X e 16 com outras causas. Fonte:</text><text x="24" y="312" font-size="17" fill="#4b5563">Endo I, et al. Bone. 2008.</text></svg>