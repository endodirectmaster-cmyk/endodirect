<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 604" width="720" height="604" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Fratura atípica de fêmur em usuárias de bisfosfonato: razões de risco ajustadas"><rect width="720" height="604" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Fratura atípica de fêmur em usuárias de</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">bisfosfonato: razões de risco ajustadas</text><text x="24" y="128" font-size="18" fill="#1f2937">Ascendência asiática</text><text x="24" y="148" font-size="18" fill="#1f2937">(vs. branca)</text><text x="24" y="168" font-size="16" fill="#4b5563">HR 4,84 (IC 95% 3,57–6,56)</text><line x1="599.6" y1="132" x2="680.0" y2="132" stroke="#0f766e" stroke-width="3"/><rect x="631.8" y="124" width="16" height="16" fill="#0f766e"/><text x="24" y="206" font-size="18" fill="#1f2937">Idade 65–74 anos (vs. 85</text><text x="24" y="226" font-size="18" fill="#1f2937">ou mais)</text><text x="24" y="246" font-size="16" fill="#4b5563">HR 2,76 (IC 95% 1,62–4,72)</text><line x1="495.2" y1="210" x2="636.5" y2="210" stroke="#0f766e" stroke-width="3"/><rect x="557.6" y="202" width="16" height="16" fill="#0f766e"/><text x="24" y="284" font-size="18" fill="#1f2937">Glicocorticoide por 1</text><text x="24" y="304" font-size="18" fill="#1f2937">ano ou mais</text><text x="24" y="324" font-size="16" fill="#4b5563">HR 2,28 (IC 95% 1,52–3,43)</text><line x1="486.7" y1="288" x2="594.3" y2="288" stroke="#0f766e" stroke-width="3"/><rect x="532.3" y="280" width="16" height="16" fill="#0f766e"/><text x="24" y="362" font-size="18" fill="#1f2937">Fratura prévia</text><text x="24" y="382" font-size="16" fill="#4b5563">HR 1,28 (IC 95% 0,86–1,89)</text><line x1="411.5" y1="366" x2="515.5" y2="366" stroke="#0f766e" stroke-width="3"/><rect x="456.0" y="358" width="16" height="16" fill="#0f766e"/><text x="24" y="418" font-size="18" fill="#1f2937">Suspensão há 3 a 15</text><text x="24" y="438" font-size="18" fill="#1f2937">meses (vs. uso atual)</text><text x="24" y="458" font-size="16" fill="#4b5563">HR 0,52 (IC 95% 0,37–0,72)</text><line x1="300.0" y1="422" x2="388.0" y2="422" stroke="#0f766e" stroke-width="3"/><rect x="337.0" y="414" width="16" height="16" fill="#0f766e"/><line x1="431.4" y1="104" x2="431.4" y2="478" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/><text x="339.8" y="498" font-size="15" text-anchor="middle" fill="#4b5563">0,5</text><text x="393.4" y="498" font-size="15" text-anchor="middle" fill="#4b5563">0,75</text><text x="431.4" y="498" font-size="15" text-anchor="middle" fill="#4b5563">1</text><text x="485.0" y="498" font-size="15" text-anchor="middle" fill="#4b5563">1,5</text><text x="523.0" y="498" font-size="15" text-anchor="middle" fill="#4b5563">2</text><text x="576.6" y="498" font-size="15" text-anchor="middle" fill="#4b5563">3</text><text x="614.6" y="498" font-size="15" text-anchor="middle" fill="#4b5563">4</text><text x="668.2" y="498" font-size="15" text-anchor="middle" fill="#4b5563">6</text><text x="300" y="520" font-size="15" fill="#4b5563">← menor risco</text><text x="680" y="520" font-size="15" text-anchor="end" fill="#4b5563">maior risco →</text><text x="24" y="550" font-size="17" fill="#4b5563">Modelo multivariado; 196.129 mulheres com 50 anos ou mais, 277 fraturas</text><text x="24" y="572" font-size="17" fill="#4b5563">atípicas adjudicadas. Fonte: Black DM, et al. N Engl J Med. 2020.</text></svg>