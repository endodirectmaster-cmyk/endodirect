<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 438" width="720" height="438" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Radiofrequência em nódulo benigno: redução média de volume"><rect width="720" height="438" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Radiofrequência em nódulo benigno: redução</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">média de volume</text><text x="24" y="106" font-size="18" fill="#4b5563">% de redução do volume do nódulo</text><text x="238" y="158" font-size="18" text-anchor="end" fill="#1f2937">12 meses (n = 276)</text><rect x="250" y="132" width="325.0" height="40" rx="5" fill="#0f766e"/><text x="585.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">80,3%</text><text x="238" y="216" font-size="18" text-anchor="end" fill="#1f2937">24 meses (n = 198)</text><rect x="250" y="190" width="341.2" height="40" rx="5" fill="#0f766e"/><text x="601.2" y="217.0" font-size="20" font-weight="700" fill="#1f2937">84,3%</text><text x="238" y="274" font-size="18" text-anchor="end" fill="#1f2937">36 meses (n = 128)</text><rect x="250" y="248" width="361.1" height="40" rx="5" fill="#0f766e"/><text x="621.1" y="275.0" font-size="20" font-weight="700" fill="#1f2937">89,2%</text><text x="238" y="332" font-size="18" text-anchor="end" fill="#1f2937">48 meses (n = 57)</text><rect x="250" y="306" width="372.0" height="40" rx="5" fill="#0f766e"/><text x="632.0" y="333.0" font-size="20" font-weight="700" fill="#1f2937">91,9%</text><line x1="250" y1="126" x2="250" y2="352" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="384" font-size="17" fill="#4b5563">Média; estudo prospectivo multicêntrico, 5 centros coreanos, protocolo</text><text x="24" y="406" font-size="17" fill="#4b5563">único. Fonte: Jung SL, et al. Korean J Radiol. 2018.</text></svg>