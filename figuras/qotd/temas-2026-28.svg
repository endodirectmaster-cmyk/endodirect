<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="TBG após 12 semanas: estrogênio oral x transdérmico"><rect width="720" height="344" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">TBG após 12 semanas: estrogênio oral x</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">transdérmico</text><text x="24" y="106" font-size="18" fill="#4b5563">% de variação da TBG em relação ao basal</text><text x="238" y="148" font-size="18" text-anchor="end" fill="#1f2937">Estrogênios conjugados</text><text x="238" y="168" font-size="18" text-anchor="end" fill="#1f2937">orais 0,625 mg/d</text><rect x="250" y="132" width="372.0" height="40" rx="5" fill="#0f766e"/><text x="632.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">39,9%</text><text x="238" y="206" font-size="18" text-anchor="end" fill="#1f2937">Estradiol transdérmico</text><text x="238" y="226" font-size="18" text-anchor="end" fill="#1f2937">0,05 mg/d</text><rect x="250" y="190" width="3.7" height="40" rx="5" fill="#0f766e"/><text x="263.7" y="217.0" font-size="20" font-weight="700" fill="#1f2937">0,4%</text><line x1="250" y1="126" x2="250" y2="236" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="268" font-size="17" fill="#4b5563">Média; ensaio randomizado cruzado em 25 mulheres na pós-menopausa, com</text><text x="24" y="290" font-size="17" fill="#4b5563">progesterona micronizada nos dois períodos. Fonte: Shifren JL, et al.</text><text x="24" y="312" font-size="17" fill="#4b5563">Menopause. 2007.</text></svg>