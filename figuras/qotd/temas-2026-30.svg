<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Iodeto de potássio após efeito adverso de tionamida"><rect width="720" height="322" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Iodeto de potássio após efeito adverso de</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">tionamida</text><text x="24" y="106" font-size="18" fill="#4b5563">% dos 44 pacientes</text><text x="238" y="148" font-size="18" text-anchor="end" fill="#1f2937">Controlados só com</text><text x="238" y="168" font-size="18" text-anchor="end" fill="#1f2937">iodeto</text><rect x="250" y="132" width="372.0" height="40" rx="5" fill="#0f766e"/><text x="632.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">65,9%</text><text x="238" y="216" font-size="18" text-anchor="end" fill="#1f2937">Remissão só com iodeto</text><rect x="250" y="190" width="217.9" height="40" rx="5" fill="#0f766e"/><text x="477.9" y="217.0" font-size="20" font-weight="700" fill="#1f2937">38,6%</text><line x1="250" y1="126" x2="250" y2="236" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="268" font-size="17" fill="#4b5563">Seguimento mediano de 17,6 anos; dose de 10 a 400 mg/dia nos</text><text x="24" y="290" font-size="17" fill="#4b5563">controlados. Fonte: Okamura K, et al. J Clin Endocrinol Metab. 2014.</text></svg>