<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="SOMP e câncer de endométrio: metanálise de estudos observacionais"><rect width="720" height="392" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">SOMP e câncer de endométrio: metanálise de</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">estudos observacionais</text><text x="24" y="128" font-size="18" fill="#1f2937">Todas as idades</text><text x="24" y="148" font-size="16" fill="#4b5563">OR 2,79 (IC 95% 1,31–5,95)</text><line x1="440.5" y1="132" x2="661.4" y2="132" stroke="#0f766e" stroke-width="3"/><rect x="542.9" y="124" width="16" height="16" fill="#0f766e"/><text x="24" y="184" font-size="18" fill="#1f2937">Excluindo estudos com</text><text x="24" y="204" font-size="18" fill="#1f2937">mulheres acima de 54</text><text x="24" y="224" font-size="18" fill="#1f2937">anos</text><text x="24" y="244" font-size="16" fill="#4b5563">OR 4,05 (IC 95% 2,42–6,76)</text><line x1="530.1" y1="188" x2="680.0" y2="188" stroke="#0f766e" stroke-width="3"/><rect x="597.2" y="180" width="16" height="16" fill="#0f766e"/><line x1="401.1" y1="104" x2="401.1" y2="266" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/><text x="300.0" y="286" font-size="15" text-anchor="middle" fill="#4b5563">0,5</text><text x="359.2" y="286" font-size="15" text-anchor="middle" fill="#4b5563">0,75</text><text x="401.1" y="286" font-size="15" text-anchor="middle" fill="#4b5563">1</text><text x="460.3" y="286" font-size="15" text-anchor="middle" fill="#4b5563">1,5</text><text x="502.3" y="286" font-size="15" text-anchor="middle" fill="#4b5563">2</text><text x="561.5" y="286" font-size="15" text-anchor="middle" fill="#4b5563">3</text><text x="603.4" y="286" font-size="15" text-anchor="middle" fill="#4b5563">4</text><text x="662.6" y="286" font-size="15" text-anchor="middle" fill="#4b5563">6</text><text x="300" y="308" font-size="15" fill="#4b5563">← menor risco na SOMP</text><text x="680" y="308" font-size="15" text-anchor="end" fill="#4b5563">maior risco na SOMP →</text><text x="24" y="338" font-size="17" fill="#4b5563">Razão de chances (OR) e IC 95% em relação a mulheres sem SOMP. Fonte:</text><text x="24" y="360" font-size="17" fill="#4b5563">Barry JA, et al. Hum Reprod Update. 2014.</text></svg>