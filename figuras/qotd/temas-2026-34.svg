<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Depuração da testosterona: jovens x mais velhos"><rect width="720" height="322" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Depuração da testosterona: jovens x mais</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">velhos</text><text x="24" y="106" font-size="18" fill="#4b5563">Depuração metabólica aparente da testosterona (L/dia)</text><text x="238" y="158" font-size="18" text-anchor="end" fill="#1f2937">Jovens (19–35 anos)</text><rect x="250" y="132" width="384.0" height="40" rx="5" fill="#0f766e"/><text x="644.0" y="159.0" font-size="20" font-weight="700" fill="#1f2937">1821</text><text x="238" y="206" font-size="18" text-anchor="end" fill="#1f2937">Mais velhos (59–75</text><text x="238" y="226" font-size="18" text-anchor="end" fill="#1f2937">anos)</text><rect x="250" y="190" width="293.1" height="40" rx="5" fill="#0f766e"/><text x="553.1" y="217.0" font-size="20" font-weight="700" fill="#1f2937">1390</text><line x1="250" y1="126" x2="250" y2="236" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="268" font-size="17" fill="#4b5563">Média; homens sob agonista do GnRH recebendo doses fixas de enantato de</text><text x="24" y="290" font-size="17" fill="#4b5563">testosterona. Fonte: Coviello AD, et al. J Clin Endocrinol Metab. 2006.</text></svg>