<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 514" width="720" height="514" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Estrogênio e TEV: via de administração e uso sob anticoagulação"><rect width="720" height="514" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Estrogênio e TEV: via de administração e uso</text><text x="24" y="65" font-size="25" font-weight="700" fill="#1f2937">sob anticoagulação</text><text x="24" y="128" font-size="18" fill="#1f2937">Estrogênio oral x não</text><text x="24" y="148" font-size="18" fill="#1f2937">usuárias (1º TEV)</text><text x="24" y="168" font-size="16" fill="#4b5563">OR 3,50 (IC 95% 1,80–6,80)</text><line x1="530.9" y1="132" x2="680.0" y2="132" stroke="#0f766e" stroke-width="3"/><rect x="597.5" y="124" width="16" height="16" fill="#0f766e"/><text x="24" y="206" font-size="18" fill="#1f2937">Estrogênio transdérmico</text><text x="24" y="226" font-size="18" fill="#1f2937">x não usuárias (1º TEV)</text><text x="24" y="246" font-size="16" fill="#4b5563">OR 0,90 (IC 95% 0,50–1,60)</text><line x1="387.1" y1="210" x2="517.6" y2="210" stroke="#0f766e" stroke-width="3"/><rect x="445.1" y="202" width="16" height="16" fill="#0f766e"/><text x="24" y="284" font-size="18" fill="#1f2937">Hormônio x sem hormônio</text><text x="24" y="304" font-size="18" fill="#1f2937">durante anticoagulação</text><text x="24" y="324" font-size="18" fill="#1f2937">(recorrência)</text><text x="24" y="344" font-size="16" fill="#4b5563">HR 0,56 (IC 95% 0,23–1,39)</text><line x1="300.0" y1="288" x2="501.9" y2="288" stroke="#0f766e" stroke-width="3"/><rect x="391.8" y="280" width="16" height="16" fill="#0f766e"/><line x1="464.9" y1="104" x2="464.9" y2="366" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/><text x="309.4" y="386" font-size="15" text-anchor="middle" fill="#4b5563">0,25</text><text x="387.1" y="386" font-size="15" text-anchor="middle" fill="#4b5563">0,5</text><text x="432.6" y="386" font-size="15" text-anchor="middle" fill="#4b5563">0,75</text><text x="464.9" y="386" font-size="15" text-anchor="middle" fill="#4b5563">1</text><text x="510.4" y="386" font-size="15" text-anchor="middle" fill="#4b5563">1,5</text><text x="542.7" y="386" font-size="15" text-anchor="middle" fill="#4b5563">2</text><text x="588.2" y="386" font-size="15" text-anchor="middle" fill="#4b5563">3</text><text x="620.5" y="386" font-size="15" text-anchor="middle" fill="#4b5563">4</text><text x="666.0" y="386" font-size="15" text-anchor="middle" fill="#4b5563">6</text><text x="300" y="408" font-size="15" fill="#4b5563">← menor risco</text><text x="680" y="408" font-size="15" text-anchor="end" fill="#4b5563">maior risco →</text><text x="24" y="438" font-size="17" fill="#4b5563">Mulheres cis. Caso-controle ESTHER, pós-menopausa (Scarabin PY, et al.</text><text x="24" y="460" font-size="17" fill="#4b5563">Lancet. 2003) e 1.888 mulheres com menos de 60 anos anticoaguladas por</text><text x="24" y="482" font-size="17" fill="#4b5563">TEV (Martinelli I, et al. Blood. 2016).</text></svg>