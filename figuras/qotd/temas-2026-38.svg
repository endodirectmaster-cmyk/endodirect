<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 407" width="720" height="407" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Testosterona SC semanal em 63 homens trans"><rect width="720" height="407" fill="#ffffff"/><text x="24" y="34" font-size="25" font-weight="700" fill="#1f2937">Testosterona SC semanal em 63 homens trans</text><text x="24" y="75" font-size="18" fill="#4b5563">% dos pacientes</text><text x="238" y="117" font-size="18" text-anchor="end" fill="#1f2937">Testosterona na faixa</text><text x="238" y="137" font-size="18" text-anchor="end" fill="#1f2937">masculina</text><rect x="250" y="101" width="372.0" height="40" rx="5" fill="#0f766e"/><text x="632.0" y="128.0" font-size="20" font-weight="700" fill="#1f2937">100%</text><text x="238" y="175" font-size="18" text-anchor="end" fill="#1f2937">Amenorreia (53 na</text><text x="238" y="195" font-size="18" text-anchor="end" fill="#1f2937">pré-menopausa)</text><rect x="250" y="159" width="357.9" height="40" rx="5" fill="#0f766e"/><text x="617.9" y="186.0" font-size="20" font-weight="700" fill="#1f2937">96,2%</text><text x="238" y="233" font-size="18" text-anchor="end" fill="#1f2937">Preferiu a SC após</text><text x="238" y="253" font-size="18" text-anchor="end" fill="#1f2937">usar IM (22)</text><rect x="250" y="217" width="372.0" height="40" rx="5" fill="#0f766e"/><text x="632.0" y="244.0" font-size="20" font-weight="700" fill="#1f2937">100%</text><text x="238" y="291" font-size="18" text-anchor="end" fill="#1f2937">Reação local leve e</text><text x="238" y="311" font-size="18" text-anchor="end" fill="#1f2937">transitória</text><rect x="250" y="275" width="53.2" height="40" rx="5" fill="#0f766e"/><text x="313.2" y="302.0" font-size="20" font-weight="700" fill="#1f2937">14,3%</text><line x1="250" y1="95" x2="250" y2="321" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="353" font-size="17" fill="#4b5563">Doses de 50 a 150 mg/semana de cipionato ou enantato. Fonte: Spratt DI,</text><text x="24" y="375" font-size="17" fill="#4b5563">et al. J Clin Endocrinol Metab. 2017.</text></svg>