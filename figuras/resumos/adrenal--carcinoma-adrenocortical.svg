<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 632.49" width="764" height="632.49" role="img" aria-label="Carcinoma adrenocortical: o que a secreção hormonal revela"><title>Carcinoma adrenocortical: o que a secreção hormonal revela</title><defs><marker id="fnocortical-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fnocortical-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fnocortical-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fnocortical-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="762" height="630.49" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="382" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Carcinoma adrenocortical: o que a secreção hormonal revela</text><text x="382" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Secreção desordenada de vários esteroides; esteroides sexuais apontam malignidade</text><path d="M290,132 C290,157 137.7,157 137.7,182" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnocortical-ag)"/><path d="M290,132 C290,157 278.2,157 278.2,182" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnocortical-ag)"/><path d="M290,132 C290,157 430.5,157 430.5,182" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnocortical-ag)"/><path d="M137.7,216.2 C137.7,241.2 99.7,241.2 99.7,266.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnocortical-ag)"/><path d="M278.2,216.2 C278.2,241.2 306.3,241.2 306.3,266.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnocortical-ag)"/><path d="M430.5,216.2 C430.5,245.1 496.6,245.1 496.6,273.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnocortical-ag)"/><path d="M99.7,331.2 C99.7,356.2 189.4,356.2 189.4,381.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnocortical-ag)"/><path d="M306.3,331.2 C306.3,356.2 189.4,356.2 189.4,381.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnocortical-ag)"/><path d="M306.3,331.2 C306.3,360 417.5,360 417.5,388.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnocortical-ag)"/><path d="M496.6,323.5 C496.6,356.2 417.5,356.2 417.5,388.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnocortical-ag)"/><path d="M189.4,461.5 C189.4,486.5 290,486.5 290,511.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnocortical-ag)"/><path d="M417.5,453.8 C417.5,482.7 290,482.7 290,511.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnocortical-ag)"/><rect x="189" y="67" width="202" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="290" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Carcinoma adrenocortical</text><text x="290" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">funcionante em ~60%, muitas</text><text x="290" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">vezes misto</text><rect x="89.7" y="182" width="96" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="137.7" y="202.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Cortisol</text><rect x="215.7" y="182" width="125" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="278.2" y="202.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Androgênios</text><rect x="370.7" y="182" width="119.6" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="430.5" y="202.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Estrogênios</text><rect x="26.1" y="266.2" width="147.2" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="99.7" y="286.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Cushing</text><text x="99.7" y="302.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">rápido e progressivo</text><text x="99.7" y="317.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">isolado em 45%</text><rect x="203.3" y="266.2" width="205.9" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="306.3" y="286.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Virilização</text><text x="306.3" y="302.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">hirsutismo, acne, alopecia, voz</text><text x="306.3" y="317.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">na infância, mais de 80%</text><rect x="439.2" y="273.9" width="114.7" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="496.6" y="294.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Feminização</text><text x="496.6" y="310.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">às vezes</text><rect x="76.9" y="381.2" width="225" height="80.3" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="189.4" y="401.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Cushing + virilização</text><text x="189.4" y="417.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">altamente sugestivo de carcinoma</text><text x="189.4" y="432.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">Cushing com hiperandrogenismo:</text><text x="189.4" y="448.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">25%</text><rect x="331.9" y="388.9" width="171.3" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="417.5" y="409.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Esteroides sexuais</text><text x="417.5" y="425.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">bandeira de malignidade</text><text x="417.5" y="440.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">distinguem do adenoma</text><rect x="176.1" y="511.5" width="227.8" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="290" y="532.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Avaliar todos os eixos</text><text x="290" y="547.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">antes da cirurgia</text><text x="290" y="563.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">perfil vira marcador de seguimento</text><line x1="391" y1="99.5" x2="567.9" y2="99.5" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="567.9" y="72.9" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="575.9" y="88.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Não funcionante em ~40%:</text><text x="575.9" y="102" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">incidentaloma ou sintomas</text><text x="575.9" y="115.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">compressivos</text><line x1="553.9" y1="298.7" x2="567.9" y2="298.7" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="567.9" y="278.8" width="170" height="39.8" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="575.9" y="294.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Às vezes,</text><text x="575.9" y="307.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">hiperaldosteronismo</text><line x1="403.9" y1="544" x2="567.9" y2="544" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="567.9" y="524.1" width="170" height="39.8" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="575.9" y="539.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Recidiva bioquímica pode</text><text x="575.9" y="553.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">preceder a radiológica</text><text x="26.1" y="602.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Setas: esteroide secretado e quadro que ele produz. Vermelho: pistas de malignidade.</text></svg>