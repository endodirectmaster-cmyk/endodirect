f88" text-anchor="middle">efeito contrainsular</text><rect x="484.7" y="274.9" width="111.6" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="540.5" y="295.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hipertensão</text><text x="540.5" y="311.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sustentada</text><text x="540.5" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">ou lábil</text><rect x="626.3" y="274.9" width="220.7" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="736.7" y="295.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hipovolemia</text><text x="736.7" y="311.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hipotensão ortostática</text><text x="736.7" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">vasoconstrição, ADH↓, natriurese</text><rect x="453.5" y="401.8" width="174.1" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="540.5" y="422.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Alfabloqueio</text><text x="540.5" y="438.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">10 a 14 dias antes</text><text x="540.5" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">alvo PA &lt; 130×80 mmHg</text><rect x="460.9" y="528.8" width="159.3" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="540.5" y="549.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Betabloqueio</text><text x="540.5" y="565.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">só após o alfabloqueio</text><text x="540.5" y="580.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">alvo FC 60–80 bpm</text><rect x="453.8" y="655.8" width="173.4" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="540.5" y="676.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Expansão</text><text x="540.5" y="692.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">sódio 5 g/dia e salina</text><text x="540.5" y="707.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">alfa suspenso 12 h antes</text><rect x="425.9" y="782.7" width="229.3" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="540.5" y="803.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Após a ressecção</text><text x="540.5" y="819" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hipoglicemia 10–15% e hipotensão</text><text x="540.5" y="834.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">queda da supressão da insulina</text><rect x="507.5" y="362.8" width="66.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="540.5" y="374.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">bloquear α</text><rect x="516.4" y="743.7" width="48.2" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="540.5" y="755.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">cirurgia</text><text x="126.9" y="873.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Betabloqueio nunca antes do alfabloqueio: risco de crise hipertensiva por vasoconstrição α sem oposição.</text></svg>