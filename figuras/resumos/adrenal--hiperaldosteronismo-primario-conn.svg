<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 894 807.46" width="894" height="807.46" role="img" aria-label="Aldosterona autônoma: do rim à hipertensão e à renina suprimida"><title>Aldosterona autônoma: do rim à hipertensão e à renina suprimida</title><defs><marker id="fimarioconn-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fimarioconn-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fimarioconn-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fimarioconn-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="892" height="805.46" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="447" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Aldosterona autônoma: do rim à hipertensão e à renina suprimida</text><text x="447" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Renina suprimida eleva a relação aldosterona/renina; hipocalemia em só um terço</text><text x="100.2" y="103.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Origem</text><text x="100.2" y="222.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Hormônio</text><text x="100.2" y="334.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Efeitos</text><text x="100.2" y="453.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Consequências</text><text x="100.2" y="580.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Clínica</text><text x="100.2" y="715.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Risco</text><path d="M407.1,132 L407.1,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fimarioconn-ag)"/><path d="M407.1,243.6 C407.1,278.4 215.6,278.4 215.6,313.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fimarioconn-ag)"/><path d="M407.1,243.6 C407.1,274.6 395.1,274.6 395.1,305.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fimarioconn-ag)"/><path d="M215.6,347.5 C215.6,390 209.9,390 209.9,432.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fimarioconn-ag)"/><path d="M395.1,355.2 C395.1,386.2 404.8,386.2 404.8,417.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fimarioconn-ag)"/><path d="M395.1,355.2 C395.1,393.9 602,393.9 602,432.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fimarioconn-ag)"/><path d="M209.9,466.8 L209.9,544.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fimarioconn-ag)"/><path d="M407.1,243.6 C407.1,274.6 586.6,274.6 586.6,305.6" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="579.6" y1="305.6" x2="593.6" y2="305.6" stroke="#c0392b" stroke-width="3"/><path d="M586.6,355.2 C586.6,375.2 710.2,375.2 710.2,513.2 S407.1,651.1 407.1,671.1" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#fimarioconn-as)"/><rect x="311.2" y="67" width="191.8" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="407.1" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Adrenal</text><text x="407.1" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">hiperplasia bilateral 50–60%</text><text x="407.1" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">adenoma 40–50%</text><rect x="312.1" y="194" width="190.1" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="407.1" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Aldosterona autônoma</text><text x="407.1" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">independente do SRA</text><rect x="138.3" y="313.3" width="154.5" height="34.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="215.6" y="334" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Retenção de sódio</text><rect x="322.9" y="305.6" width="144.4" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="395.1" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Espoliação de K⁺</text><text x="395.1" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">perda renal de H⁺</text><rect x="129.9" y="432.6" width="159.9" height="34.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="209.9" y="453.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Expansão volêmica</text><rect x="319.9" y="417.2" width="169.9" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="404.8" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Hipocalemia</text><text x="404.8" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">em apenas um terço</text><text x="404.8" y="468.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">sua ausência não afasta</text><rect x="519.7" y="432.6" width="164.5" height="34.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="602" y="453.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Alcalose metabólica</text><rect x="497.3" y="305.6" width="178.6" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="586.6" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Renina suprimida</text><text x="586.6" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">RAR elevada no rastreio</text><rect x="136.6" y="544.2" width="146.5" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="209.9" y="564.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hipertensão</text><text x="209.9" y="580.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">5–10% das HAS</text><text x="209.9" y="595.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">20% das resistentes</text><rect x="298.1" y="671.1" width="217.9" height="80.3" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="407.1" y="691.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Dano cardiovascular e renal</text><text x="407.1" y="707.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">pelo excesso de aldosterona</text><text x="407.1" y="722.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">fibrose, HVE, AVC; maior que na</text><text x="407.1" y="738.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">HAS essencial</text><rect x="471.1" y="266.6" width="51.5" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="496.8" y="278.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" class="lbl">suprime</text><rect x="713.2" y="505.2" width="53.7" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="718.2" y="517.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="start" class="lbl">APR &lt; 1</text><line x1="516.1" y1="711.3" x2="698.2" y2="711.3" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="698.2" y="684.7" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="706.2" y="700.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Meta: desbloquear a renina</text><text x="706.2" y="713.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">(APR &gt; 1 ng/mL/h), com</text><text x="706.2" y="727.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">menor risco cardiovascular</text><text x="129.9" y="777.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Barra vermelha: supressão. Cinza tracejado: associação de risco.</text></svg>