ill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fomaadrenal-ag)"/><path d="M367.3,332.2 C367.3,367 251.5,367 251.5,401.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fomaadrenal-ag)"/><path d="M251.5,466.8 L251.5,528.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fomaadrenal-ag)"/><path d="M251.5,593.8 C251.5,628.6 378.1,628.6 378.1,663.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fomaadrenal-ag)"/><path d="M251.5,593.8 C251.5,624.8 137.8,624.8 137.8,655.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fomaadrenal-ag)"/><rect x="165.4" y="67" width="172.2" height="49.6" rx="24.805" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="251.5" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">TC sem contraste</text><text x="251.5" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">cortes finos de 3–5 mm</text><polygon points="156.1 178.6 346.9 178.6 362.9 195.7 346.9 212.9 156.1 212.9 140.1 195.7" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="251.5" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">Homogêneo e ≤ 10 UH?</text><rect x="28.3" y="274.9" width="201.7" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="129.1" y="295.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Adenoma rico em lipídios</text><text x="129.1" y="311.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">benigno; dispensa imagem de</text><text x="129.1" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">seguimento</text><polygon points="276 282.5 458.7 282.5 474.7 307.3 458.7 332.2 276 332.2 260 307.3" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="367.3" y="303.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">&gt; 4 cm e também</text><text x="367.3" y="318.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">&gt; 20 UH ou heterogêneo?</text><rect x="144" y="401.8" width="215.1" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="251.5" y="422.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Imagem complementar</text><text x="251.5" y="438.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">washout, RM ou PET</text><text x="251.5" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ou nova TC/RM em 6–12 meses</text><polygon points="154.8 528.8 348.2 528.8 364.2 561.3 348.2 593.8 154.8 593.8 138.8 561.3" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="251.5" y="549.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">Achado suspeito?</text><text x="251.5" y="565.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">washout &lt; 60%, sem queda</text><text x="251.5" y="580.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">de sinal, PET captante</text><rect x="26.2" y="655.8" width="223.3" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="137.8" y="676.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Adenoma pobre em lipídios</text><text x="137.8" y="692.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">washout ≥ 60% ou queda de sinal</text><text x="137.8" y="707.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">benigno: acompanhar</text><rect x="279.4" y="663.5" width="197.4" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="378.1" y="684.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Adrenalectomia</text><text x="378.1" y="699.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">excluir feocromocitoma antes</text><rect x="175.3" y="235.9" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="190.3" y="247.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="293.7" y="239.7" width="31.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="309.4" y="251.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não</text><rect x="393.2" y="489.8" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="398.2" y="501.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="start" class="lbl">Sim</text><rect x="293.7" y="359" width="31.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="309.4" y="371" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não</text><rect x="299.8" y="620.6" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="314.8" y="632.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="179" y="616.8" width="31.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="194.6" y="628.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não</text><line x1="474.7" y1="307.3" x2="490.8" y2="307.3" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="490.8" y="274" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="498.8" y="289.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Risco de carcinoma: ~2%</text><text x="498.8" y="303.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">abaixo de 4 cm; ~6% entre</text><text x="498.8" y="316.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">4,1 e 6 cm; ~25% acima de</text><text x="498.8" y="330" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">6 cm</text><text x="26.2" y="746.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Crescimento na reimagem: considerar cirurgia. Baixa densidade não exclui hiperfunção: 1 mg de dexametasona em todos.</text></svg>