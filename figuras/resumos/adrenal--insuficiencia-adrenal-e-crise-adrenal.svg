<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 685 649.77" width="685" height="649.77" role="img" aria-label="Onde o eixo falha: insuficiência adrenal primária × secundária"><title>Onde o eixo falha: insuficiência adrenal primária × secundária</title><defs><marker id="fiseadrenal-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fiseadrenal-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fiseadrenal-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fiseadrenal-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="683" height="647.77" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="342.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Onde o eixo falha: insuficiência adrenal primária × secundária</text><text x="342.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">O nível da lesão explica hiperpigmentação, hipercalemia e a necessidade de fludrocortisona</text><path d="M384.8,116.6 L384.8,178.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiseadrenal-ag)"/><path d="M384.8,228.2 C384.8,270.7 258,270.7 258,313.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiseadrenal-ag)"/><path d="M384.8,228.2 C384.8,259.2 447.8,259.2 447.8,290.2" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#fiseadrenal-as)"/><path d="M258,347.5 C258,390 460,39