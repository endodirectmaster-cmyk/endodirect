.6" height="80.3" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="447.8" y="310.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hiperpigmentação</text><text x="447.8" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">excesso de POMC no receptor de</text><text x="447.8" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">MSH</text><text x="447.8" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">só na primária</text><rect x="261.6" y="432.6" width="120.4" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="321.8" y="453.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Aldosterona</text><rect x="412" y="432.6" width="96" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="460" y="453.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Cortisol</text><rect x="269.1" y="528.8" width="231.4" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="384.8" y="549.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hipercalemia, renina alta</text><text x="384.8" y="565.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">falta de aldosterona: só na primária</text><text x="384.8" y="580.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">repor fludrocortisona</text><rect x="367.2" y="139.6" width="35.3" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="384.8" y="151.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">CRH</text><rect x="300.5" y="262.7" width="41.7" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="321.4" y="274.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">ACTH</text><rect x="384.4" y="251.2" width="63.8" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="416.3" y="263.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">ACTH alto</text><rect x="337.3" y="489.8" width="32" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="353.3" y="501.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">falta</text><line x1="196" y1="91.8" x2="331.3" y2="91.8" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="26" y="58.5" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="34" y="74.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Terciária: supressão do</text><text x="34" y="87.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">CRH; causa mais comum é</text><text x="34" y="101" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">a suspensão de</text><text x="34" y="114.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">glicocorticoide exógeno</text><line x1="196" y1="203.4" x2="336.8" y2="203.4" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="26" y="156.6" width="170" height="93.6" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="34" y="172.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Secundária: ACTH baixo;</text><text x="34" y="185.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">aldosterona preservada</text><text x="34" y="199.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">pela renina-angiotensina,</text><text x="34" y="212.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">sem hiperpigmentação;</text><text x="34" y="226.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">hiponatremia comum às</text><text x="34" y="239.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">duas formas</text><line x1="196" y1="330.4" x2="210" y2="330.4" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="26" y="303.8" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="34" y="319.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Primária (Addison): falha da</text><text x="34" y="332.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">própria adrenal, ACTH alto;</text><text x="34" y="346.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">autoimune em ~80%</text><text x="210" y="619.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Tracejado vermelho: retroalimentação negativa. Cinza: efeito da deficiência.</text></svg>