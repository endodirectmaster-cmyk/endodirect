o,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Benefício renal</text><text x="661.4" y="325.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">lembrar em IC, doença</text><text x="661.4" y="340.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">cardiovascular e DRC</text><rect x="121.9" y="419.6" width="189.3" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="216.5" y="440.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">↓HbA1c 1–2 pontos</text><text x="216.5" y="455.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">peso neutro, sem</text><text x="216.5" y="471.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hipoglicemia; deficiência de</text><text x="216.5" y="486.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">B12</text><text x="216.5" y="502" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">contraindicada se TFG &lt; 30</text><rect x="341.2" y="427.3" width="191.8" height="80.3" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="437.1" y="448" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">↓HbA1c 1–2 pontos</text><text x="437.1" y="463.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">ganho de peso; risco alto de</text><text x="437.1" y="478.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hipoglicemia</text><text x="437.1" y="494.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sai no basal-bolus</text><rect x="563" y="411.9" width="186.5" height="111.1" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="656.2" y="432.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">↓HbA1c &lt; 1 ponto</text><text x="656.2" y="448.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">−2 a 3 kg; queda transitória</text><text x="656.2" y="463.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">da TFG até 30%</text><text x="656.2" y="478.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">cetoacidose euglicêmica:</text><text x="656.2" y="494.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sair antes de cirurgia ou</text><text x="656.2" y="509.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">infecção</text><rect x="571.2" y="531" width="170" height="80.1" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="579.2" y="546.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Fora do SUS: AR GLP-1 e</text><text x="579.2" y="560.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">tirzepatida reduzem peso;</text><text x="579.2" y="573.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">lembrar AR GLP-1 em IC,</text><text x="579.2" y="587" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">doença cardiovascular e</text><text x="579.2" y="600.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">DRC</text><text x="113.4" y="637.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Insulina (NPH, regular, asparte) também está no SUS: sem teto de redução da HbA1c, cabe em qualquer fase.</text></svg>