<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 661.04" width="708" height="661.04" role="img" aria-label="Da hiperglicemia crônica às complicações micro e macrovasculares"><title>Da hiperglicemia crônica às complicações micro e macrovasculares</title><defs><marker id="fdodiabetes-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fdodiabetes-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fdodiabetes-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fdodiabetes-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="706" height="659.04" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="354" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Da hiperglicemia crônica às complicações micro e macrovasculares</text><text x="354" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Quatro vias lesam o endotélio; neuropatia e isquemia convergem no pé diabético</text><path d="M354,132 C354,163.4 235.2,163.4 235.2,194.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fdodiabetes-ag)"/><path d="M354,132 C354,163 491.8,163 491.8,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fdodiabetes-ag)"/><path d="M235.2,258 C235.2,293.3 93.3,293.3 93.3,328.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fdodiabetes-ag)"/><path d="M235.2,258 C235.2,297.1 264.4,297.1 264.4,336.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fdodiabetes-ag)"/><path d="M235.2,258 C235.2,289.5 443.5,289.5 443.5,320.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fdodiabetes-ag)"/><path d="M491.8,258.9 C491.8,301.5 615.6,301.5 615.6,344" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fdodiabetes-ag)"/><path d="M443.5,447.4 C443.5,478.4 354,478.4 354,509.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fdodiabetes-ag)"/><path d="M615.6,424.3 C615.6,466.8 354,466.8 354,509.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fdodiabetes-ag)"/><rect x="236.8" y="67" width="234.4" height="65" rx="32.485" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="354" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Diabetes</text><text x="354" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">exposição crônica à hiperglicemia:</text><text x="354" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">grau e duração decidem</text><rect x="112.4" y="194.9" width="245.6" height="63.1" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="126.4" y="215.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Quatro vias lesam o endotélio</text><text x="126.4" y="230.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• polióis e AGEs (glicação avançada)</text><text x="126.4" y="244.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• proteína cinase C e estresse oxidativo</text><rect x="388" y="194" width="207.6" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="491.8" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Risco aterosclerótico 2–4×</text><text x="491.8" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">principal causa de morte no</text><text x="491.8" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">diabetes</text><rect x="25.9" y="328.6" width="134.9" height="111.1" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="93.3" y="349.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Retinopatia</text><text x="93.3" y="364.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">não proliferativa →</text><text x="93.3" y="380.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">proliferativa</text><text x="93.3" y="395.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">edema macular:</text><text x="93.3" y="411" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">principal causa de</text><text x="93.3" y="426.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">baixa acuidade</text><rect x="190.8" y="336.3" width="147.2" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="264.4" y="357" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Doença renal</text><text x="264.4" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">albuminúria (RAC) e</text><text x="264.4" y="388" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">queda da TFGe</text><text x="264.4" y="403.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">principal causa de</text><text x="264.4" y="418.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">DRC terminal</text><rect x="368" y="320.9" width="151" height="126.4" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="443.5" y="341.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Neuropatia</text><text x="443.5" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">polineuropatia distal</text><text x="443.5" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">simétrica, &quot;em bota e</text><text x="443.5" y="388" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">luva&quot;</text><text x="443.5" y="403.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">autonômica:</text><text x="443.5" y="418.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">gastroparesia,</text><text x="443.5" y="434" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">hipotensão postural</text><rect x="549" y="344" width="133.1" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="615.6" y="364.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Aterosclerose</text><text x="615.6" y="380.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">coronariana,</text><text x="615.6" y="395.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">cerebrovascular e</text><text x="615.6" y="411" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">arterial periférica</text><rect x="240.4" y="509.4" width="227.2" height="95.7" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="354" y="530.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Pé diabético</text><text x="354" y="545.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">neuropatia: não percebe o trauma;</text><text x="354" y="561" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">isquemia: não cicatriza</text><text x="354" y="576.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hiperglicemia favorece infecção;</text><text x="354" y="591.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">Charcot é emergência</text><rect x="202.7" y="289.1" width="94.2" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="249.8" y="301.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">microvasculares</text><rect x="510.8" y="293.5" width="85.8" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="553.7" y="305.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">macrovascular</text><text x="25.9" y="631" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Memória metabólica: o controle precoce reduz complicações por anos; o intensivo, principalmente as microvasculares.</text></svg>