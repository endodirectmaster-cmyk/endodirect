<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 991.78" width="728" height="991.78" role="img" aria-label="Diabetes prévio × diabetes gestacional: dois caminhos até o pós-parto"><title>Diabetes prévio × diabetes gestacional: dois caminhos até o pós-parto</title><defs><marker id="fsegestacao-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fsegestacao-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fsegestacao-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fsegestacao-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="726" height="989.78" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="364" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Diabetes prévio × diabetes gestacional: dois caminhos até o pós-parto</text><text x="364" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">À esquerda, o risco da organogênese; à direita, a resistência à insulina placentária</text><path d="M153.7,124.3 C153.7,159.1 146.3,159.1 146.3,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M146.3,289.7 L146.3,351.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M146.3,447.4 C146.3,478.4 142.5,478.4 142.5,509.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M142.5,605 L142.5,682.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M142.5,762.7 C142.5,801.4 141.3,801.4 141.3,840.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M400.7,132 L400.7,209.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M400.7,274.3 L400.7,351.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M400.7,447.4 L400.7,509.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M400.7,605 L400.7,667" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M400.7,778.1 C400.7,809.1 402.3,809.1 402.3,840.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><rect x="40" y="74.7" width="227.3" height="49.6" rx="24.805" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="153.7" y="95.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Diabetes pré-gestacional</text><text x="153.7" y="111" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">DM1 ou DM2 anterior à gestação</text><rect x="297.4" y="67" width="206.6" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="400.7" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Hormônios placentários</text><text x="400.7" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">lactogênio placentário, cortisol,</text><text x="400.7" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">progesterona</text><rect x="33.1" y="194" width="226.4" height="95.7" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="146.3" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Organogênese</text><text x="146.3" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">malformações cardíacas e do tubo</text><text x="146.3" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">neural; abortamento</text><text x="146.3" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">risco proporcional à HbA1c</text><text x="146.3" y="276.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">periconcepcional</text><rect x="289.9" y="209.3" width="221.5" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="400.7" y="230" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Resistência à insulina</text><text x="400.7" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ultrapassa a reserva secretora de</text><text x="400.7" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">insulina</text><rect x="33.6" y="351.7" width="225.4" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="146.3" y="372.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Planejar a concepção</text><text x="146.3" y="388" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">HbA1c &lt; 6,5% (ideal &lt; 6%); &gt; 9%:</text><text x="146.3" y="403.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">postergar</text><text x="146.3" y="418.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ácido fólico; suspender IECA/BRA</text><text x="146.3" y="434" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">e estatina</text><rect x="293.5" y="351.7" width="214.4" height="95.7" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="400.7" y="372.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Diabetes gestacional</text><text x="400.7" y="388" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">geralmente no 2º–3º trimestre;</text><text x="400.7" y="403.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sem diabetes franco prévio</text><text x="400.7" y="418.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">TOTG 75 g em 24–28 semanas:</text><text x="400.7" y="434" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">um valor alterado basta</text><rect x="37.1" y="509.3" width="210.8" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="142.5" y="530.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Durante a gestação</text><text x="142.5" y="545.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">AAS 100 mg/dia da 12ª à 28ª</text><text x="142.5" y="561" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">semana até o parto</text><text x="142.5" y="576.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">DM2: trocar antidiabéticos orais</text><text x="142.5" y="591.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">por insulina; DM1: CGM</text><rect x="286.2" y="509.3" width="228.9" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="400.7" y="530.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Tratar</text><text x="400.7" y="545.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">dieta e exercício 1–2 semanas; se</text><text x="400.7" y="561" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">falha, insulina</text><text x="400.7" y="576.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">metas: jejum &lt; 95, 1 h &lt; 140, 2 h &lt;</text><text x="400.7" y="591.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">120</text><rect x="39.2" y="682.4" width="206.6" height="80.3" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="142.5" y="703.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">DM1: riscos próprios</text><text x="142.5" y="718.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hipoglicemia no 1º trimestre</text><text x="142.5" y="734.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">CAD, inclusive euglicêmica, no</text><text x="142.5" y="749.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">2º–3º</text><rect x="289.2" y="667" width="222.9" height="111.1" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="400.7" y="687.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Vigilância materno-fetal</text><text x="400.7" y="703.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">macrossomia, polidrâmnio,</text><text x="400.7" y="718.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">pré-eclâmpsia, distocia de ombro,</text><text x="400.7" y="734.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">cesárea</text><text x="400.7" y="749.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">neonato: hipoglicemia, icterícia,</text><text x="400.7" y="764.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">desconforto respiratório</text><rect x="26" y="840.1" width="230.7" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="141.3" y="860.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Pós-parto</text><text x="141.3" y="876.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">DM1: 50% da dose usada antes da</text><text x="141.3" y="891.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">gestação</text><text x="141.3" y="907.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">DM2: suspender a insulina;</text><text x="141.3" y="922.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">retornar a metformina</text><rect x="286.7" y="840.1" width="231.4" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="402.3" y="860.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Pós-parto</text><text x="402.3" y="876.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">suspender a insulina; TOTG 75 g</text><text x="402.3" y="891.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">em 4–12 semanas</text><text x="402.3" y="907.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">cerca de 50% de DM2 em 10 anos;</text><text x="402.3" y="922.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">amamentar</text><rect x="61.7" y="793.4" width="160.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="141.9" y="805.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">queda abrupta da resistência</text><rect x="373.6" y="162.6" width="54.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="400.7" y="174.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">induzem</text><rect x="383.2" y="801.1" width="36.6" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="401.5" y="813.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">parto</text><line x1="515.1" y1="557.2" x2="532" y2="557.2" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="532" y="503.7" width="170" height="107" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="540" y="519.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Insulina não atravessa a</text><text x="540" y="532.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">placenta de forma</text><text x="540" y="546.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">relevante; metformina e</text><text x="540" y="559.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">glibenclamida atravessam</text><text x="540" y="573.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">— glibenclamida não é</text><text x="540" y="586.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">recomendada (hipoglicemia</text><text x="540" y="600" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">neonatal, macrossomia)</text><text x="26" y="961.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">HbA1c é menos confiável na gestação: priorizar automonitorização e CGM (alvo 63–140 mg/dL, &gt; 70% no alvo).</text></svg>