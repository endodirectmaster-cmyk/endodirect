<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 622 884.26" width="622" height="884.26" role="img" aria-label="MODY2: limiar de glicose alto, sem complicações"><title>MODY2: limiar de glicose alto, sem complicações</title><defs><marker id="fesneonatal-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fesneonatal-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fesneonatal-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fesneonatal-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="620" height="882.26" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="311" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">MODY2: limiar de glicose alto, sem complicações</text><text x="311" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Nos demais MODY há complicações; na gestação, insulina só se o feto não herdou o GCK</text><text x="77.5" y="118.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Gene</text><text x="77.5" y="284.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Mecanismo</text><text x="77.5" y="441.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Clínica</text><text x="77.5" y="568.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Desfecho</text><text x="77.5" y="688.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Feto</text><text x="77.5" y="807.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Conduta</text><path d="M230.2,147.3 C230.2,201.4 221.4,201.4 221.4,255.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fesneonatal-ag)"/><path d="M221.4,305 L221.4,397.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fesneonatal-ag)"/><path d="M221.4,478.1 C221.4,509.1 230.3,509.1 230.3,540.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fesneonatal-ag)"/><path d="M221.4,478.1 C221.4,509.1 475,509.1 475,540.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fesneonatal-ag)"/><path d="M475,589.7 C475,620.7 224.6,620.7 224.6,651.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fesneonatal-ag)"/><path d="M475,589.7 C475,620.7 473.6,620.7 473.6,651.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fesneonatal-ag)"/><path d="M473.6,716.7 L473.6,778.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fesneonatal-ag)"/><path d="M454.2,162.7 C454.2,193.7 480.8,193.7 480.8,224.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fesneonatal-ag)"/><path d="M480.8,335.7 L480.8,405.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fesneonatal-ag)"/><rect x="142.8" y="82.4" width="174.8" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="230.2" y="103.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">GCK mutado: MODY2</text><text x="230.2" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">glucoquinase; portadores</text><text x="230.2" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">assintomáticos</text><rect x="347.7" y="67" width="213" height="95.7" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="454.2" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">MODY1, 3, 4 e 5</text><text x="454.2" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">HNF-4 alfa, HNF-1 alfa, IPF-1,</text><text x="454.2" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">HNF-1 beta</text><text x="454.2" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">genes que regulam a síntese de</text><text x="454.2" y="149.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">insulina</text><rect x="107.4" y="255.4" width="228" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="221.4" y="276.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Setpoint da secreção alterado</text><text x="221.4" y="291.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">limiar de glicose mais alto</text><rect x="365.4" y="224.7" width="230.7" height="111.1" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="480.8" y="245.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Diabetes com complicações</text><text x="480.8" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">MODY3: glicosúria</text><text x="480.8" y="276.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">desproporcional; MODY5: cistos</text><text x="480.8" y="291.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">renais, malformações genitais</text><text x="480.8" y="307.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">MODY4: agenesia de pâncreas em</text><text x="480.8" y="322.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">homozigose</text><rect x="111.7" y="397.7" width="219.4" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="221.4" y="418.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Hiperglicemia leve e estável</text><text x="221.4" y="434" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">igual em toda a família de</text><text x="221.4" y="449.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">eutróficos</text><text x="221.4" y="464.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ninguém rotulado como diabético</text><rect x="367.9" y="405.4" width="225.7" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="480.8" y="426.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Tratamento</text><text x="480.8" y="441.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sulfonilureia no MODY1 e MODY3</text><text x="480.8" y="457.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">insulina no MODY4 e MODY5</text><rect x="122" y="540.1" width="216.6" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="230.3" y="560.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Sem complicações crônicas</text><text x="230.3" y="576.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">a única forma; tratamento: dieta</text><polygon points="384.6 540.1 565.5 540.1 581.5 564.9 565.5 589.7 384.6 589.7 368.6 564.9" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="475" y="560.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">Gestante com GCK</text><text x="475" y="576.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">o feto herdou a mutação?</text><rect x="117.7" y="651.7" width="213.7" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="224.6" y="672.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Mesmo setpoint de glicose</text><text x="224.6" y="688" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">feto portador: tratamento não se</text><text x="224.6" y="703.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">justifica</text><rect x="361.5" y="651.7" width="224.3" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="473.6" y="672.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hiperinsulinismo fetal</text><text x="473.6" y="688" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">responde à hiperglicemia materna</text><text x="473.6" y="703.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">e cresce demais</text><rect x="388" y="778.7" width="171.2" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="473.6" y="799.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Insulina na gestante</text><text x="473.6" y="815" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">para evitar macrossomia</text><rect x="311.5" y="501.1" width="73.5" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="348.2" y="513.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">na gestação</text><rect x="334.8" y="612.7" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="349.8" y="624.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="458.6" y="612.7" width="31.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="474.3" y="624.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não</text><text x="107.4" y="854.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Suspeita: IMC normal, início antes dos 25 anos, sem autoanticorpos, 3 ou mais gerações acometidas.</text></svg>