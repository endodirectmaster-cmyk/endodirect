<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 767 661.04" width="767" height="661.04" role="img" aria-label="Idoso com diabetes: os dois perigos e como evitá-los"><title>Idoso com diabetes: os dois perigos e como evitá-los</title><defs><marker id="ftesnoidoso-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="ftesnoidoso-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="ftesnoidoso-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="ftesnoidoso-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="765" height="659.04" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="383.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Idoso com diabetes: os dois perigos e como evitá-los</text><text x="383.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Metas e fármacos pelo estado de saúde e função, não pela idade cronológica</text><text x="61.3" y="118.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Início</text><text x="61.3" y="253.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Perigo</text><text x="61.3" y="388.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Efeito</text><text x="61.3" y="553.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Conduta</text><path d="M416.1,162.7 C416.1,193.7 299.8,193.7 299.8,224.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftesnoidoso-ag)"/><path d="M416.1,162.7 C416.1,193.7 509.3,193.7 509.3,224.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftesnoidoso-ag)"/><path d="M299.8,274.3 L299.8,344" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftesnoidoso-ag)"/><path d="M509.3,274.3 L509.3,336.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftesnoidoso-ag)"/><path d="M299.8,424.3 C299.8,459.2 193.3,459.2 193.3,494" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftesnoidoso-ag)"/><path d="M299.8,424.3 C299.8,463 426.7,463 426.7,501.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftesnoidoso-ag)"/><path d="M299.8,424.3 C299.8,463 649.6,463 649.6,501.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftesnoidoso-ag)"/><rect x="254.7" y="67" width="322.8" height="95.7" rx="47.845" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="416.1" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Idoso com diabetes</text><text x="416.1" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">síndromes geriátricas: fragilidade, quedas,</text><text x="416.1" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">incontinência, polifarmácia</text><text x="416.1" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">avaliação geriátrica: cognição, depressão, função,</text><text x="416.1" y="149.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">nutrição, suporte</text><rect x="221.5" y="224.7" width="156.4" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="299.8" y="245.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hipoglicemia</text><text x="299.8" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">o maior risco no idoso</text><rect x="408" y="224.7" width="202.8" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="509.3" y="245.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hiperglicemia sintomática</text><text x="509.3" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">também deve ser evitada</text><rect x="215.5" y="344" width="168.4" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="299.8" y="364.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Consequências</text><text x="299.8" y="380.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">queda, fratura, evento</text><text x="299.8" y="395.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">cardiovascular, arritmia</text><text x="299.8" y="411" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">declínio cognitivo, morte</text><rect x="424.8" y="336.3" width="169.2" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="509.3" y="357" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Consequências</text><text x="509.3" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">desidratação, infecções,</text><text x="509.3" y="388" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">incontinência, delirium</text><text x="509.3" y="403.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">maior risco de EHH na</text><text x="509.3" y="418.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">descompensação</text><rect x="91.4" y="494" width="203.8" height="111.1" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="193.3" y="514.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Baixo risco de</text><text x="193.3" y="530.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">hipoglicemia</text><text x="193.3" y="546.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">preferir metformina, SGLT2i,</text><text x="193.3" y="561.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">GLP-1 RA, iDPP-4</text><text x="193.3" y="577.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">se insulina: basal simples com</text><text x="193.3" y="592.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">análogo de longa ação</text><rect x="325.2" y="501.7" width="203.1" height="95.7" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="426.7" y="522.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Evitar</text><text x="426.7" y="538" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">glibenclamida (sulfonilureia de</text><text x="426.7" y="553.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">longa ação)</text><text x="426.7" y="568.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">esquemas de insulina</text><text x="426.7" y="584.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">complexos</text><rect x="558.3" y="501.7" width="182.6" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="649.6" y="522.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Desintensificar</text><text x="649.6" y="538" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">A1c abaixo da meta com</text><text x="649.6" y="553.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">fármacos de risco</text><text x="649.6" y="568.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">reduzir ou retirar insulina e</text><text x="649.6" y="584.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sulfonilureia</text><rect x="310.5" y="185.7" width="94.9" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="357.9" y="197.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">supertratamento</text><text x="91.4" y="631" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">A1c menos confiável (anemia, doença renal): apoiar na glicemia capilar/CGM.</text></svg>