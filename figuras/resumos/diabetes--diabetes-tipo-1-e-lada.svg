<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 734 741.9300000000001" width="734" height="741.9300000000001" role="img" aria-label="História natural do DM1: da autoimunidade à insulina"><title>História natural do DM1: da autoimunidade à insulina</title><defs><marker id="ftipo1elada-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="ftipo1elada-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="ftipo1elada-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="ftipo1elada-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="732" height="739.9300000000001" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="367" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">História natural do DM1: da autoimunidade à insulina</text><text x="367" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Estágios 1 a 3 e o LADA, a forma de evolução arrastada no adulto</text><path d="M275,132 L275,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftipo1elada-ag)"/><path d="M275,258.9 L275,320.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftipo1elada-ag)"/><path d="M275,385.9 C275,424.6 159.2,424.6 159.2,463.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftipo1elada-ag)"/><path d="M159.2,512.9 C159.2,551.6 154.6,551.6 154.6,590.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftipo1elada-ag)"/><path d="M275,132 C275,152 438.8,152 438.8,289.9 S423,427.9 423,447.9" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#ftipo1elada-as)"/><path d="M423,528.2 C423,563.1 402.9,563.1 402.9,597.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftipo1elada-ag)"/><rect x="97.7" y="67" width="354.6" height="65" rx="32.485" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="275" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Destruição autoimune da célula β</text><text x="275" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">linfócitos T, HLA de risco (DR3/DR4) e autoanticorpos</text><text x="275" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">anti-GAD65, anti-IA2, anti-ZnT8, anti-insulina (IAA), ICA</text><rect x="157.9" y="194" width="234.2" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="275" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Estágio 1</text><text x="275" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">≥ 2 autoanticorpos + normoglicemia</text><text x="275" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">assintomático</text><rect x="137.2" y="320.9" width="275.5" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="275" y="341.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Estágio 2</text><text x="275" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">autoanticorpos + disglicemia (pré-diabetes)</text><text x="275" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">assintomático, alto risco de progressão</text><rect x="26.2" y="463.3" width="266" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="159.2" y="484" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Estágio 3: hiperglicemia clínica</text><text x="159.2" y="499.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">poliúria, polidipsia, perda de peso, cetose</text><rect x="322.2" y="447.9" width="201.7" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="423" y="468.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">LADA</text><text x="423" y="484.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">adulto com anti-GAD positivo</text><text x="423" y="499.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">sem insulina nos primeiros 6</text><text x="423" y="514.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">meses; progressão mais lenta</text><rect x="41.7" y="590.2" width="225.8" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="154.6" y="610.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Insulina obrigatória e vitalícia</text><text x="154.6" y="626.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">basal-bólus ou bomba (CSII),</text><text x="154.6" y="641.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">idealmente com CGM</text><text x="154.6" y="657.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">lua de mel: remissão parcial</text><text x="154.6" y="672.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">transitória após o início</text><rect x="297.5" y="597.9" width="210.8" height="80.3" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="402.9" y="618.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Insulina precoce no LADA</text><text x="402.9" y="634.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">preserva a função β residual</text><text x="402.9" y="649.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">evitar sulfonilureias: aceleram a</text><text x="402.9" y="664.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">exaustão das células β</text><rect x="144" y="416.6" width="146.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="217.1" y="428.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">teplizumabe pode retardar</text><rect x="441.8" y="281.9" width="147.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="446.8" y="293.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="start" class="lbl">evolução arrastada, adulto</text><line x1="452.3" y1="99.5" x2="537.8" y2="99.5" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="537.8" y="66.1" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="545.8" y="81.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Resulta em deficiência</text><text x="545.8" y="95.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">absoluta de insulina e</text><text x="545.8" y="108.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">tendência à</text><text x="545.8" y="122.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">cetose/cetoacidose</text><line x1="392.1" y1="226.5" x2="537.8" y2="226.5" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="537.8" y="193.1" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="545.8" y="208.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Dois anticorpos com</text><text x="545.8" y="222.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">glicemia normal é estágio 1</text><text x="545.8" y="235.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">— não é diagnóstico de</text><text x="545.8" y="249.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">diabetes</text><line x1="523.8" y1="488.1" x2="537.8" y2="488.1" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="537.8" y="448" width="170" height="80.1" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="545.8" y="463.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Suspeitar em &quot;DM2&quot; magro,</text><text x="545.8" y="477.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">sem síndrome metabólica,</text><text x="545.8" y="490.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">com controle que se</text><text x="545.8" y="504" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">deteriora rápido apesar de</text><text x="545.8" y="517.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">orais</text><text x="26.2" y="711.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Pico na infância/adolescência, mas ocorre em qualquer idade. Confirmação: autoanticorpos e peptídeo C baixo.</text></svg>