<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 693 500.255" width="693" height="500.255" role="img" aria-label="HbA1c falseada: a lógica é o tempo de vida da hemácia"><title>HbA1c falseada: a lógica é o tempo de vida da hemácia</title><defs><marker id="fdodiabetes-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fdodiabetes-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fdodiabetes-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fdodiabetes-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="691" height="498.255" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="346.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">HbA1c falseada: a lógica é o tempo de vida da hemácia</text><text x="346.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">O que prolonga a vida da hemácia eleva a HbA1c; o que a encurta reduz</text><text x="62" y="102.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Causa</text><text x="62" y="208.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Hemácia</text><text x="62" y="300.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">HbA1c</text><text x="62" y="408.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Conduta</text><path d="M225.1,130.1 L225.1,180.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fdodiabetes-ag)"/><path d="M527.4,130.1 L527.4,187.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fdodiabetes-ag)"/><path d="M225.1,229.7 L225.1,279.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fdodiabetes-ag)"/><path d="M527.4,222 L527.4,279.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fdodiabetes-ag)"/><path d="M225.1,313.9 C225.1,338.9 379.5,338.9 379.5,363.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fdodiabetes-ag)"/><path d="M527.4,313.9 C527.4,338.9 379.5,338.9 379.5,363.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fdodiabetes-ag)"/><rect x="92.1" y="67" width="265.9" height="63.1" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="106.1" y="87.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">• Anemia por deficiência de ferro</text><text x="106.1" y="102.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• Deficiência de vitamina B12</text><text x="106.1" y="116.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• Álcool crônico, hiperbilirrubinemia, uremia</text><rect x="388" y="67" width="278.8" height="63.1" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="402" y="87.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">• Hemólise e hemoglobinopatias</text><text x="402" y="102.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• Transfusão ou sangramento recente</text><text x="402" y="116.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• Ferro, B12, EPO; vitamina C/E em alta dose</text><rect x="155.1" y="180.1" width="140" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="225.1" y="200.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Vida da hemácia</text><text x="225.1" y="217" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">PROLONGADA</text><rect x="411.9" y="187.7" width="231.1" height="34.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="527.4" y="208.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Vida da hemácia ENCURTADA</text><rect x="114.5" y="279.7" width="221.1" height="34.3" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="225.1" y="300.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">HbA1c falsamente ELEVADA</text><rect x="414.2" y="279.7" width="226.5" height="34.3" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="527.4" y="300.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">HbA1c falsamente REDUZIDA</text><rect x="228.4" y="363.9" width="302.1" height="80.3" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="379.5" y="384.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Usar critérios glicêmicos</text><text x="379.5" y="400.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">priorizar glicemia de jejum ou TOTG</text><text x="379.5" y="415.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">anemias, hemoglobinopatias, gestação, uremia,</text><text x="379.5" y="431" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">transfusão</text><text x="92.1" y="470.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Pós-transplante: evitar a HbA1c nos primeiros 3 meses; o teste de escolha é o TOTG com 75 g.</text></svg>