<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 789 868.9000000000001" width="789" height="868.9000000000001" role="img" aria-label="Doença renal do diabetes: do rastreamento à proteção renal"><title>Doença renal do diabetes: do rastreamento à proteção renal</title><defs><marker id="fmorbidades-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fmorbidades-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fmorbidades-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fmorbidades-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="787" height="866.9000000000001" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="394.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Doença renal do diabetes: do rastreamento à proteção renal</text><text x="394.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Quem recebe cada pilar, pela albuminúria (RAC) e pela TFG</text><text x="69.7" y="103.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Rastrear</text><text x="69.7" y="230.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Confirmar</text><text x="69.7" y="357.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Prevenir</text><text x="69.7" y="484.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Critério</text><text x="69.7" y="634.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Proteger</text><text x="69.7" y="784.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Associar</text><path d="M431.4,132 L431.4,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmorbidades-ag)"/><path d="M431.4,258.9 L431.4,320.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmorbidades-ag)"/><path d="M431.4,385.9 C431.4,420.8 307.7,420.8 307.7,455.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmorbidades-ag)"/><path d="M431.4,385.9 C431.4,416.9 536.8,416.9 536.8,447.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmorbidades-ag)"/><path d="M307.7,505.2 C307.7,547.7 199.7,547.7 199.7,590.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmorbidades-ag)"/><path d="M307.7,505.2 C307.7,540 663.7,540 663.7,574.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmorbidades-ag)"/><path d="M536.8,512.9 C536.8,543.9 663.7,543.9 663.7,574.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmorbidades-ag)"/><path d="M307.7,505.2 C307.7,547.7 432.1,547.7 432.1,590.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmorbidades-ag)"/><path d="M199.7,670.6 C199.7,709.3 431.4,709.3 431.4,747.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmorbidades-ag)"/><rect x="251.2" y="67" width="360.3" height="65" rx="32.485" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="431.4" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Rastreamento anual</text><text x="431.4" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">RAC em amostra isolada + TFGe pelo CKD-EPI 2021</text><text x="431.4" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">DM2: desde o diagnóstico; DM1: após 5 anos de doença</text><rect x="262.7" y="194" width="337.4" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="431.4" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Confirmar a albuminúria</text><text x="431.4" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">pelo menos 2 de 3 amostras, em 3 a 6 meses</text><text x="431.4" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">regride em cerca de 30% sem intervenção terapêutica</text><rect x="240.3" y="320.9" width="382" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="431.4" y="341.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Metas na DRD</text><text x="431.4" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">HbA1c &lt;7,0% (7–7,9% se TFG &lt;45); PA &lt;130×80 mmHg</text><text x="431.4" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">proteína 0,8 g/kg/dia; sódio 1,5 g/dia; estatina de alta potência</text><rect x="217.3" y="455.6" width="180.8" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="307.7" y="476.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Albuminúria &gt; 30 mg/g</text><text x="307.7" y="491.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">A2/A3</text><rect x="428.1" y="447.9" width="217.3" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="536.8" y="468.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">TFG 20–60 mL/min</text><text x="536.8" y="484.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">G3a–G4, independentemente da</text><text x="536.8" y="499.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">RAC</text><rect x="99.5" y="590.2" width="200.3" height="80.3" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="199.7" y="610.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">IECA ou BRA</text><text x="199.7" y="626.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">mesmo sem hipertensão</text><text x="199.7" y="641.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">creatinina pode subir até 30%</text><text x="199.7" y="657.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">no início: não suspender</text><rect x="564.3" y="574.9" width="198.8" height="111.1" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="663.7" y="595.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">iSGLT-2</text><text x="663.7" y="611.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">piso: empagliflozina ≥20,</text><text x="663.7" y="626.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">dapagliflozina ≥25,</text><text x="663.7" y="641.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">canagliflozina ≥45</text><text x="663.7" y="657.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">abaixo de 20, manter se já</text><text x="663.7" y="672.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">iniciado; suspender na diálise</text><rect x="329.8" y="590.2" width="204.5" height="80.3" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="432.1" y="610.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Semaglutida</text><text x="432.1" y="626.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">se TFG ≥25 e RAC &gt;100 mg/g</text><text x="432.1" y="641.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">(FLOW)</text><text x="432.1" y="657.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">desfecho renal</text><rect x="263.9" y="747.9" width="334.9" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="431.4" y="768.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Finerenona (ARM não esteroidal)</text><text x="431.4" y="784.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">com IECA/BRA se TFG 25–60, RAC &gt;30 e K ≤4,8</text><text x="431.4" y="799.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">não usar se TFG &lt;20; FIDELIO (renal), FIGARO (CV)</text><rect x="328.4" y="539.7" width="82.9" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="369.9" y="551.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">se RAC &gt; 100</text><rect x="288.8" y="701.3" width="53.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="315.5" y="713.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">associar</text><text x="99.5" y="838.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Albuminúria sobe transitoriamente com exercício, IC, febre, infecção urinária, hiperglicemia ou hipertensão graves.</text></svg>