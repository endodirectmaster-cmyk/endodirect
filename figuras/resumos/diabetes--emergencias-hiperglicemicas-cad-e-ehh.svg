<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 683 783.9850000000001" width="683" height="783.9850000000001" role="img" aria-label="CAD e EHH: do precipitante ao diagnóstico"><title>CAD e EHH: do precipitante ao diagnóstico</title><defs><marker id="fcascadeehh-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fcascadeehh-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fcascadeehh-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fcascadeehh-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="681" height="781.9850000000001" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="341.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">CAD e EHH: do precipitante ao diagnóstico</text><text x="341.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Dois caminhos: cetose e acidose (CAD) ou hiperosmolaridade e desidratação (EHH)</text><text x="80.7" y="111.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Gatilho</text><text x="80.7" y="241.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Mecanismo</text><text x="80.7" y="364.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Via</text><text x="80.7" y="479.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Quadro</text><text x="80.7" y="609.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Diagnóstico</text><path d="M383.9,147.3 L383.9,197.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcascadeehh-ag)"/><path d="M383.9,277.7 L383.9,327.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcascadeehh-ag)"/><path d="M383.9,147.3 C383.9,167.3 523.5,167.3 523.5,295.5 S503.2,423.6 503.2,443.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcascadeehh-ag)"/><path d="M383.9,392.6 C383.9,417.6 214.9,417.6 214.9,442.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcascadeehh-ag)"/><path d="M214.9,507.6 C214.9,532.6 265.9,532.6 265.9,557.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcascadeehh-ag)"/><path d="M503.2,506.6 C503.2,532.1 504.6,532.1 504.6,557.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcascadeehh-ag)"/><rect x="231.7" y="67" width="304.4" height="80.3" rx="40.165" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="383.9" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Precipitante</text><text x="383.9" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">infecção (a mais comum), omissão de insulina,</text><text x="383.9" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">primo-descompensação</text><text x="383.9" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">IAM, AVC, glicocorticoide, SGLT2i, gestação</text><rect x="270.2" y="197.3" width="227.3" height="80.3" rx="40.165" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="383.9" y="218" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">CAD: deficiência de insulina</text><text x="383.9" y="233.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">+ excesso de hormônios</text><text x="383.9" y="249" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">contrarreguladores</text><text x="383.9" y="264.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">glucagon, catecolaminas, cortisol</text><rect x="283.4" y="327.7" width="201" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="383.9" y="348.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Lipólise e cetogênese</text><text x="383.9" y="364" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">cetose: β-hidroxibutirato ≥ 3,0</text><text x="383.9" y="379.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">mmol/L ou cetonúria</text><rect x="110.5" y="442.6" width="208.8" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="214.9" y="463.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Acidose</text><text x="214.9" y="478.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">pH &lt; 7,3 ou bicarbonato &lt; 18</text><text x="214.9" y="494.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">ânion-gap em geral aumentado</text><rect x="349.3" y="443.6" width="308" height="63.1" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="363.3" y="463.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">EHH: hiperosmolaridade</text><text x="363.3" y="478.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• glicemia ≥ 600; osm. efetiva &gt; 300 (total &gt; 320)</text><text x="363.3" y="493.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• desidratação profunda; rebaixamento do sensório</text><rect x="160.1" y="557.6" width="211.5" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="265.9" y="578.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">CAD</text><text x="265.9" y="593.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">glicemia ≥ 200 (ou normal) +</text><text x="265.9" y="609.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">cetose + acidose</text><text x="265.9" y="624.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">típica do DM1; euglicêmica com</text><text x="265.9" y="640" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">SGLT2i, gestação, jejum</text><rect x="401.7" y="557.6" width="205.9" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="504.6" y="578.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">EHH</text><text x="504.6" y="593.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sem cetoacidose: pH ≥ 7,3 e</text><text x="504.6" y="609.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">bicarbonato ≥ 15</text><text x="504.6" y="624.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">DM2/idoso; instala-se em dias;</text><text x="504.6" y="640" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">mortalidade mais alta</text><rect x="180.9" y="661.3" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="188.9" y="677" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">CAD euglicêmica: não</text><text x="188.9" y="690.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">descartar CAD pela</text><text x="188.9" y="703.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">glicemia; guiar-se por</text><text x="188.9" y="717.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">cetonas e pH</text><rect x="419.6" y="661.3" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="427.6" y="677" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Quadro misto:</text><text x="427.6" y="690.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">β-hidroxibutirato ≥ 3,0, pH &lt;</text><text x="427.6" y="703.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">7,3 ou bicarbonato &lt; 18</text><text x="110.5" y="754" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Tratamento: cristaloide, potássio (não iniciar insulina se K &lt; 3,5), insulina IV e tratar o precipitante.</text></svg>