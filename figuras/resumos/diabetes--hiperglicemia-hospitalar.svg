<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 383.8" width="640" height="383.8" role="img" aria-label="Antes da cirurgia: o que suspender e quando"><title>Antes da cirurgia: o que suspender e quando</title><defs><marker id="fhospitalar-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fhospitalar-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fhospitalar-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fhospitalar-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="638" height="381.8" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="320" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Antes da cirurgia: o que suspender e quando</text><text x="320" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Contagem regressiva até a cirurgia; o iDPP-4 se mantém e as pré-misturas não se usam</text><rect x="50" y="203.5" width="540" height="14" rx="4" fill="#2e7d32" fill-opacity=".85"/><text x="320" y="234.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#2e7d32" text-anchor="middle">iDPP-4: manter</text><line x1="40" y1="210.48000000000002" x2="600" y2="210.48000000000002" stroke="#0b2545" stroke-width="2.5" marker-end="url(#fhospitalar-as)"/><circle cx="50" cy="210.48000000000002" r="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/><line x1="50" y1="204.5" x2="105" y2="190.5" stroke="#c0392b" stroke-width="1.2"/><rect x="20" y="81" width="170" height="109.5" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="1.2"/><text x="105" y="96.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#8b1e14" text-anchor="middle">7 dias antes</text><text x="105" y="111.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">AR GLP-1 de longa ação</text><text x="105" y="125.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">(dulaglutida, semaglutida)</text><text x="105" y="139.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">e tirzepatida: suspender só</text><text x="105" y="153.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">com risco de broncoaspiração,</text><text x="105" y="167.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">escalonamento ou dose</text><text x="105" y="181.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">instável há &lt; 12 semanas</text><circle cx="195.8" cy="210.48000000000002" r="6" fill="#ffffff" stroke="#b7791f" stroke-width="2.5"/><line x1="195.8" y1="216.5" x2="195.8" y2="260.5" stroke="#b7791f" stroke-width="1.2"/><rect x="110.8" y="260.5" width="170" height="81.3" rx="8" fill="#fff4d6" stroke="#b7791f" stroke-width="1.2"/><text x="195.8" y="276.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#7c4a03" text-anchor="middle">3 a 4 dias antes</text><text x="195.8" y="290.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">iSGLT-2: cirurgia de grande</text><text x="195.8" y="304.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">porte ou restrição calórica.</text><text x="195.8" y="318.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">Degludeca e glargina U300:</text><text x="195.8" y="332.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">reduzir 20 a 30%, 3 dias antes</text><circle cx="347" cy="210.48000000000002" r="6" fill="#ffffff" stroke="#d9b652" stroke-width="2.5"/><line x1="347" y1="204.5" x2="347" y2="190.5" stroke="#d9b652" stroke-width="1.2"/><rect x="262" y="123.2" width="170" height="67.2" rx="8" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.2"/><text x="347" y="139" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2545" text-anchor="middle">1 dia antes (24 h)</text><text x="347" y="153.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">Secretagogos. AR GLP-1 de</text><text x="347" y="167.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">curta ação (liraglutida,</text><text x="347" y="181.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">lixisenatida): só com risco</text><circle cx="471.2" cy="210.48000000000002" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><line x1="471.2" y1="216.5" x2="471.2" y2="260.5" stroke="#2563eb" stroke-width="1.2"/><rect x="386.2" y="260.5" width="170" height="81.3" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.2"/><text x="471.2" y="276.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Noite anterior</text><text x="471.2" y="290.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">Glargina e detemir: reduzir 20</text><text x="471.2" y="304.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">a 30% a partir da noite</text><text x="471.2" y="318.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">anterior. NPH: manter a dose</text><text x="471.2" y="332.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">da noite</text><circle cx="590" cy="210.48000000000002" r="6" fill="#ffffff" stroke="#0b2545" stroke-width="2.5"/><line x1="590" y1="204.5" x2="535" y2="190.5" stroke="#0b2545" stroke-width="1.2"/><rect x="450" y="95.1" width="170" height="95.4" rx="8" fill="#0b2545" stroke="#0b2545" stroke-width="1.2"/><text x="535" y="110.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Dia da cirurgia</text><text x="535" y="125.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#e9eef7" text-anchor="middle">Metformina: suspender no dia.</text><text x="535" y="139.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#e9eef7" text-anchor="middle">NPH: −50% de manhã se</text><text x="535" y="153.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#e9eef7" text-anchor="middle">&gt; 50% da dose é NPH ou</text><text x="535" y="167.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#e9eef7" text-anchor="middle">≥ 2/3 é de manhã. Rápida:</text><text x="535" y="181.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#e9eef7" text-anchor="middle">sem doses fixas no jejum</text></svg>