<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 608 980.51" width="608" height="980.51" role="img" aria-label="Hipoglicemia: as perguntas que separam as causas"><title>Hipoglicemia: as perguntas que separam as causas</title><defs><marker id="fnodiabetes-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fnodiabetes-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fnodiabetes-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fnodiabetes-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="606" height="978.51" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="304" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Hipoglicemia: as perguntas que separam as causas</text><text x="304" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Com insulina ou secretagogo, rever a causa; sem eles, tríade de Whipple e dosagem pareada</text><path d="M304,101.3 L304,163.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M304,212.9 C304,243.9 179.4,243.9 179.4,274.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M304,212.9 C304,243.9 431.9,243.9 431.9,274.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M431.9,370.6 L431.9,432.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M431.9,497.5 C431.9,532.4 154.2,532.4 154.2,567.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M431.9,497.5 C431.9,528.5 447.3,528.5 447.3,559.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M154.2,662.9 L154.2,732.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M154.2,766.8 C154.2,797.8 183.6,797.8 183.6,828.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M154.2,766.8 C154.2,805.5 426.9,805.5 426.9,844.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><rect x="241.1" y="67" width="125.8" height="34.3" rx="17.125" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="304" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Hipoglicemia</text><polygon points="235.1 163.3 372.9 163.3 388.9 188.1 372.9 212.9 235.1 212.9 219.1 188.1" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="304" y="184" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">Usa insulina ou</text><text x="304" y="200.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">secretagogo?</text><rect x="66.6" y="274.9" width="225.7" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="179.4" y="295.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Fatores de risco</text><text x="179.4" y="311.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">dose excessiva, omissão de</text><text x="179.4" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">refeição, álcool, insuficiência renal</text><text x="179.4" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">rever a causa; ajustar</text><text x="179.4" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">insulina/secretagogo e metas</text><rect x="322.3" y="274.9" width="219.1" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="431.9" y="295.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Whipple + dosagem pareada</text><text x="431.9" y="311.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">glicemia, insulina, peptídeo C,</text><text x="431.9" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">β-hidroxibutirato</text><text x="431.9" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">colhida na vigência da</text><text x="431.9" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">hipoglicemia</text><polygon points="346.3 432.6 517.4 432.6 533.4 465 517.4 497.5 346.3 497.5 330.3 465" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="431.9" y="453.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">Insulina &gt; 3 µUI/mL</text><text x="431.9" y="468.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">e β-hidroxibutirato &lt; 2,7</text><text x="431.9" y="484.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">mmol/L?</text><rect x="26" y="567.2" width="256.5" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="154.2" y="587.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Hiperinsulinêmica</text><text x="154.2" y="603.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">a insulina suprime a cetogênese:</text><text x="154.2" y="618.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">cetoácidos baixos</text><text x="154.2" y="634.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">teste do glucagon: aumento &gt; 25 mg/dL</text><text x="154.2" y="649.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">confirma</text><rect x="312.5" y="559.5" width="269.5" height="111.1" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="447.3" y="580.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Insulina &lt; 3 µUI/mL</text><text x="447.3" y="595.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">cetoácidos presentes: hipoinsulinêmica —</text><text x="447.3" y="611.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">etilismo, doença crítica, insuficiência</text><text x="447.3" y="626.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">adrenal</text><text x="447.3" y="641.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">cetoácidos suprimidos: tumor produtor de</text><text x="447.3" y="657.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">IGF-2 (IGF-2/IGF-1 &gt; 10)</text><polygon points="55.8 732.6 252.7 732.6 268.7 749.7 252.7 766.8 55.8 766.8 39.8 749.7" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="154.2" y="753.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">Peptídeo C &gt; 0,6 ng/mL?</text><rect x="75.7" y="828.8" width="215.8" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="183.6" y="849.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Endógena</text><text x="183.6" y="865.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">insulinoma, NIPHS, secretagogo</text><text x="183.6" y="880.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">(sulfonilureia na urina positiva)</text><text x="183.6" y="895.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">Hirata: insulina muito alta e</text><text x="183.6" y="911.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">anti-insulina positivo</text><rect x="321.5" y="844.2" width="210.9" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="426.9" y="864.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Exógena</text><text x="426.9" y="880.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">insulina aplicada: insulina muito</text><text x="426.9" y="895.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">alta com peptídeo C &lt; 0,6</text><rect x="226.7" y="235.9" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="241.7" y="247.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="352.2" y="235.9" width="31.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="367.9" y="247.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não</text><rect x="278" y="524.4" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="293" y="536.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="423.9" y="520.5" width="31.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="439.6" y="532.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não</text><rect x="153.9" y="789.8" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="168.9" y="801.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="274.9" y="797.5" width="31.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="290.6" y="809.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não</text><text x="26" y="950.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Causa factícia? Pedir hipoglicemiantes orais na urina. Hirata? Anticorpo anti-insulina.</text></svg>