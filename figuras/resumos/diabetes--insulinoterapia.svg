<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 655.76" width="792" height="655.76" role="img" aria-label="Esquema basal-bólus: cada insulina, seu papel e seu ajuste"><title>Esquema basal-bólus: cada insulina, seu papel e seu ajuste</title><defs><marker id="finoterapia-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="finoterapia-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="finoterapia-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="finoterapia-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="790" height="653.76" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="396" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Esquema basal-bólus: cada insulina, seu papel e seu ajuste</text><text x="396" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">O bólus cobre a refeição e se ajusta pela pós-prandial; a basal, pela glicemia de jejum</text><path d="M488,116.6 C488,141.6 339,141.6 339,166.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#finoterapia-ag)"/><path d="M488,116.6 C488,145.5 632.2,145.5 632.2,174.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#finoterapia-ag)"/><path d="M339,277.7 L339,327.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#finoterapia-ag)"/><path d="M632.2,270 L632.2,343" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#finoterapia-ag)"/><path d="M339,454.1 C339,479.1 488,479.1 488,504.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#finoterapia-ag)"/><path d="M632.2,438.7 C632.2,471.4 488,471.4 488,504.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#finoterapia-ag)"/><rect x="372.2" y="67" width="231.6" height="49.6" rx="24.805" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="488" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Esquema basal-bólus</text><text x="488" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">o mais fisiológico; padrão no DM1</text><rect x="209.8" y="166.6" width="258.5" height="111.1" rx="55.525" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="339" y="187.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Basal (≈ 50% da dose)</text><text x="339" y="202.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">glargina, detemir, degludeca: sem pico</text><text x="339" y="218.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">pronunciado, menor hipoglicemia</text><text x="339" y="233.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">noturna</text><text x="339" y="249" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">NPH: pico 4–8 h, hipoglicemia entre</text><text x="339" y="264.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">refeições e noturna</text><rect x="498.2" y="174.3" width="268" height="95.7" rx="47.845" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="632.2" y="195" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Bólus prandial</text><text x="632.2" y="210.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">início 10–15 min, pico ~1 h: lispro,</text><text x="632.2" y="226" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">asparte, glulisina</text><text x="632.2" y="241.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">início ~30 min: regular; aplicar antes das</text><text x="632.2" y="256.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">refeições</text><rect x="214.9" y="327.7" width="248.3" height="126.4" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="339" y="348.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Ajuste pela glicemia de jejum</text><text x="339" y="364" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">alvorecer: surto matinal de</text><text x="339" y="379.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">contrarreguladores → ajustar a basal</text><text x="339" y="394.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">noturna</text><text x="339" y="410" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">Somogyi: rebote pós-hipoglicemia;</text><text x="339" y="425.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">confirmar com CGM/madrugada antes</text><text x="339" y="440.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">de reduzir</text><rect x="510.5" y="343" width="243.4" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="632.2" y="363.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Cálculo e ajuste do bólus</text><text x="632.2" y="379.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">regra dos 500 → relação</text><text x="632.2" y="394.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">insulina/carboidrato; FS = 1800/DTD</text><text x="632.2" y="410" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">correção = (glicemia atual − alvo)/FS;</text><text x="632.2" y="425.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ajustar pela pós-prandial</text><rect x="341.6" y="504.1" width="292.9" height="95.7" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="488" y="524.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hipoglicemia: principal efeito adverso</text><text x="488" y="540.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">ganho de peso comum; rodízio dos sítios evita</text><text x="488" y="555.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">lipo-hipertrofia</text><text x="488" y="571.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">no DM2: reavaliar sulfonilureia; manter</text><text x="488" y="586.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">SGLT2i/GLP-1 RA</text><line x1="195.8" y1="222.1" x2="209.8" y2="222.1" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="25.8" y="188.8" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="33.8" y="204.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Icodeca: basal semanal</text><text x="33.8" y="217.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">aprovada para DM1 e DM2;</text><text x="33.8" y="231.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">no DM1 aumentou a</text><text x="33.8" y="244.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">hipoglicemia</text><text x="209.8" y="625.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Pílulas douradas: as duas insulinas do esquema; caixas brancas: como ajustar cada uma.</text></svg>