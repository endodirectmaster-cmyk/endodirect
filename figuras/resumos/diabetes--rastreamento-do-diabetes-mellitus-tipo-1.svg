353,543.6 C353,574.6 481.2,574.6 481.2,605.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#flitustipo1-ag)"/><path d="M481.2,685.9 C481.2,716.9 126.3,716.9 126.3,747.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#flitustipo1-ag)"/><path d="M481.2,685.9 C481.2,716.9 353,716.9 353,747.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#flitustipo1-ag)"/><path d="M481.2,685.9 C481.2,716.9 579.7,716.9 579.7,747.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#flitustipo1-ag)"/><path d="M353,843.6 L353,905.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#flitustipo1-ag)"/><rect x="245.2" y="67" width="215.7" height="80.3" rx="40.165" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="353" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Parente de 1º grau</text><text x="353" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">de pessoa com DM1: risco ~15</text><text x="353" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">vezes maior</text><text x="353" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">idades: 2–4, 6–8 e 10–15 anos</text><rect x="239.4" y="209.3" width="227.2" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="353" y="230" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Dosar autoanticorpos</text><text x="353" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">anti-GAD, anti-IA2, IAA; anti-ZnT8</text><text x="353" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">se só um positivo</text><text x="353" y="276.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">se negativo: repetir; após 15 anos,</text><text x="353" y="291.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">uma única vez</text><rect x="245.5" y="367" width="215" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="353" y="387.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Confirmar em nova amostra</text><text x="353" y="403.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">toda positividade deve ser</text><text x="353" y="418.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">confirmada</text><polygon points="273.2 494 432.8 494 448.8 518.8 432.8 543.6 273.2 543.6 257.2 518.8" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="353" y="514.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">≥ 2 autoanticorpos</text><text x="353" y="530.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">confirmados?</text><rect x="116.2" y="613.3" width="226.4" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="229.4" y="634" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Um único autoanticorpo</text><text x="229.4" y="649.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">adulto com fatores de risco: anual;</text><text x="229.4" y="664.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">sem: trienal</text><rect x="372.6" y="605.6" width="217.2" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="481.2" y="626.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Avaliar perfil glicêmico</text><text x="481.2" y="641.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">GJ, HbA1c, TTGO (padrão-ouro)</text><text x="481.2" y="657.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">e/ou CGM</text><text x="481.2" y="672.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">para definir o estágio</text><rect x="26.2" y="747.9" width="200.2" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="126.3" y="768.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Estágio 1</text><text x="126.3" y="784.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">normoglicemia, assintomático</text><text x="126.3" y="799.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">monitorar: criança trimestral a</text><text x="126.3" y="815" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">anual; adulto anual, depois</text><text x="126.3" y="830.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">bienal</text><rect x="256.4" y="747.9" width="193.1" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="353" y="768.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Estágio 2</text><text x="353" y="784.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">disglicemia sem critério de</text><text x="353" y="799.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">DM, assintomático</text><text x="353" y="815" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">monitorar: criança trimestral;</text><text x="353" y="830.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">adulto semestral</text><rect x="479.6" y="747.9" width="200.2" height="95.7" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="579.7" y="768.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Estágio 3</text><text x="579.7" y="784.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hiperglicemia com critérios de</text><text x="579.7" y="799.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">DM</text><text x="579.7" y="815" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">3A assintomático; 3B</text><text x="579.7" y="830.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sintomático, insulina imediata</text><rect x="244" y="905.6" width="218" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="353" y="926.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Teplizumabe (anti-CD3)</text><text x="353" y="941.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">atrasa a progressão ao estágio 3</text><text x="353" y="957.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">em ~24 meses</text><text x="353" y="972.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">infusão IV diária por 14 dias;</text><text x="353" y="988" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">ANVISA 2026 (Tzield)</text><rect x="328.2" y="328" width="49.5" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="353" y="340" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">positivo</text><rect x="275.5" y="570.4" width="31.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="291.2" y="582.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não</text><rect x="402.1" y="566.6" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="417.1" y="578.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="298.6" y="866.6" width="108.9" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="353" y="878.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">estágio 2, ≥ 8 anos</text><text x="26.2" y="1027.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">CGM: tempo &gt; 140 mg/dL ≥ 10% indica estágio 2, mas deve ser confirmado por outro método; o TTGO é o padrão-ouro.</text></svg>