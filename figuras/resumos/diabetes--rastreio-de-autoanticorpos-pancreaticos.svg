="2.2" marker-end="url(#fncreaticos-ag)"/><path d="M255.5,574.3 L255.5,636.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fncreaticos-ag)"/><path d="M255.5,732 C255.5,763 129.9,763 129.9,794" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fncreaticos-ag)"/><path d="M255.5,732 C255.5,763 371.3,763 371.3,794" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fncreaticos-ag)"/><rect x="26" y="67" width="218.1" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="135" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Diagnóstico em cetoacidose</text><text x="135" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">20–67% das crianças são</text><text x="135" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">diagnosticadas em CAD</text><rect x="274.1" y="67" width="210.9" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="379.5" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">&gt; 85% sem história familiar</text><text x="379.5" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">justifica ir além do rastreio</text><text x="379.5" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">genético/familiar</text><rect x="150.1" y="194" width="210.9" height="95.7" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="255.5" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Rastrear a população geral</text><text x="255.5" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">integrado à puericultura e à</text><text x="255.5" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">vacinação</text><text x="255.5" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">aos 2–4 anos; repetir aos 6–8 e</text><text x="255.5" y="276.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">10–15 se negativo</text><rect x="154.3" y="351.7" width="202.4" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="255.5" y="372.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">1. Triagem inicial</text><text x="255.5" y="388" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ensaio sensível para</text><text x="255.5" y="403.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">autoanticorpos ilhóticos (IAbs)</text><rect x="144.8" y="478.6" width="221.5" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="255.5" y="499.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">2. Confirmação</text><text x="255.5" y="514.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ensaio de alta especificidade, em</text><text x="255.5" y="530.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">amostra separada</text><text x="255.5" y="545.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">regra dos 2s: 2 IAbs, 2 ensaios, 2</text><text x="255.5" y="561" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">amostras</text><rect x="145.8" y="636.3" width="219.4" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="255.5" y="657" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">3. Estagiamento metabólico</text><text x="255.5" y="672.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">estágio 1: ≥ 2 IAbs com</text><text x="255.5" y="688" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">normoglicemia</text><text x="255.5" y="703.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">estágio 2: disglicemia · estágio 3:</text><text x="255.5" y="718.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">diagnóstico clínico</text><rect x="29.1" y="794" width="201.7" height="80.3" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="129.9" y="814.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Menos cetoacidose ao</text><text x="129.9" y="831" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">diagnóstico</text><text x="129.9" y="846.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">Fr1da: de 21–36% para 3,2%;</text><text x="129.9" y="861.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">ASK: 4,5% vs 58%</text><rect x="260.8" y="794" width="221.2" height="80.3" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="371.3" y="814.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">HbA1c mais baixa</text><text x="371.3" y="830.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">maior peptídeo C residual</text><text x="371.3" y="845.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">teplizumabe atrasa o estágio 2→3</text><text x="371.3" y="861" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">em 2,7 anos (mediana)</text><rect x="293.1" y="155" width="48.9" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="317.5" y="167" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">justifica</text><rect x="223" y="439.6" width="65.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="255.5" y="451.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">se positivo</text><rect x="213.9" y="597.3" width="83.2" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="255.5" y="609.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">se confirmado</text><rect x="136.2" y="755" width="113" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="192.7" y="767" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">com monitoramento</text><line x1="360.9" y1="241.8" x2="499" y2="241.8" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="499" y="195" width="170" height="93.6" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="507" y="210.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Comunicação clara e</text><text x="507" y="224.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">pessoal (não automatizada),</text><text x="507" y="237.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">linguagem neutra, suporte</text><text x="507" y="251" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">psicossocial disponível;</text><text x="507" y="264.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">evitar estigma e ansiedade</text><text x="507" y="277.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">desnecessária</text><line x1="481.9" y1="834.2" x2="499" y2="834.2" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="499" y="794.1" width="170" height="80.1" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="507" y="809.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Custo-efetividade: análises</text><text x="507" y="823.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">do ASK e Fr1da sugerem</text><text x="507" y="836.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">viabilidade se reduzir CAD e</text><text x="507" y="850.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">melhorar a HbA1c; dados</text><text x="507" y="863.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">ainda limitados</text><text x="26" y="900.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Lacunas de evidência: rastreio em adultos, valor preditivo de um único IAb, diversidade étnica.</text></svg>