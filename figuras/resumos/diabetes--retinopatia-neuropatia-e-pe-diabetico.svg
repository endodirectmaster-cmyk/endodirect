<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 687 788.01" width="687" height="788.01" role="img" aria-label="Neuropatia diabética: do rastreio ao diagnóstico clínico"><title>Neuropatia diabética: do rastreio ao diagnóstico clínico</title><defs><marker id="fediabetico-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fediabetico-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fediabetico-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fediabetico-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="685" height="786.01" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="343.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Neuropatia diabética: do rastreio ao diagnóstico clínico</text><text x="343.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Um teste de fibras finas e um de fibras grossas; ENMG só diante de sinais de alarme</text><path d="M343.5,132 C343.5,170.6 122.5,170.6 122.5,209.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fediabetico-ag)"/><path d="M343.5,132 C343.5,174.5 346.7,174.5 346.7,217" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fediabetico-ag)"/><path d="M122.5,274.3 C122.5,313 220.2,313 220.2,351.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fediabetico-ag)"/><path d="M346.7,266.6 C346.7,309.1 220.2,309.1 220.2,351.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fediabetico-ag)"/><path d="M220.2,462.7 C220.2,493.7 222.4,493.7 222.4,524.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fediabetico-ag)"/><path d="M220.2,462.7 C220.2,497.6 467.8,497.6 467.8,532.4" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#fediabetico-as)"/><path d="M222.4,589.7 C222.4,620.7 234,620.7 234,651.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fediabetico-ag)"/><path d="M222.4,589.7 C222.4,628.4 467.1,628.4 467.1,667" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fediabetico-ag)"/><path d="M567.6,289.7 C567.6,324.5 469.5,324.5 469.5,359.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fediabetico-ag)"/><rect x="225.9" y="67" width="235.1" height="65" rx="32.485" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="343.5" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Rastrear a polineuropatia</text><text x="343.5" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">DM2: ao diagnóstico; DM1: após 5</text><text x="343.5" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">anos; reavaliação anual</text><rect x="25.9" y="209.3" width="193.2" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="122.5" y="230" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Fibras finas: um teste</text><text x="122.5" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">térmica (diapasão), dolorosa</text><text x="122.5" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">(alfinete) ou sudomotora</text><rect x="249.1" y="217" width="195.1" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="346.7" y="237.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Fibras grossas: um teste</text><text x="346.7" y="253.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">vibratória (biotesiômetro)</text><rect x="474.2" y="194" width="186.9" height="95.7" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="567.6" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Monofilamento 10 g</text><text x="567.6" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">avalia fibras grossas, com</text><text x="567.6" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">baixa sensibilidade</text><text x="567.6" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">não é o teste de rastreio da</text><text x="567.6" y="276.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">polineuropatia</text><rect x="109.3" y="351.7" width="221.9" height="111.1" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="220.2" y="372.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Escore de comprometimento</text><text x="220.2" y="388.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">neuropático</text><text x="220.2" y="404.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ECN/NDS avalia fibras finas e</text><text x="220.2" y="419.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">grossas</text><text x="220.2" y="434.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">diagnóstico definitivo e clínico:</text><text x="220.2" y="450.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ENMG desnecessária</text><rect x="361.2" y="359.3" width="216.5" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="469.5" y="380" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Risco de ulceração</text><text x="469.5" y="395.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">monofilamento 10 g ou Ipswich</text><text x="469.5" y="411" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">Touch Test</text><text x="469.5" y="426.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">exame no mínimo anual; até 1–3</text><text x="469.5" y="441.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">meses pelo risco</text><polygon points="129.1 524.7 315.6 524.7 331.6 557.2 315.6 589.7 129.1 589.7 113.1 557.2" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="222.4" y="545.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">Outra causa afastada?</text><text x="222.4" y="561" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">etilismo, B12, tireoide,</text><text x="222.4" y="576.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">fármacos, viroses crônicas</text><rect x="361.6" y="532.4" width="212.3" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="467.8" y="553.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Sinais de alarme</text><text x="467.8" y="568.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">só então ENMG ou ressonância</text><rect x="125.4" y="651.7" width="217.2" height="80.3" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="234" y="672.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Polineuropatia diabética</text><text x="234" y="688" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">diagnóstico clínico e de exclusão</text><text x="234" y="703.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">complicação crônica mais</text><text x="234" y="718.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">prevalente: até 90%</text><rect x="372.6" y="667" width="189" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="467.1" y="687.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Não atribuir ao diabetes</text><text x="467.1" y="703.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">afastar a outra causa antes</text><rect x="313.4" y="489.6" width="61.2" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="344" y="501.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">se houver</text><rect x="213.1" y="612.7" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="228.2" y="624.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="329" y="620.4" width="31.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="344.7" y="632.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não</text><rect x="486" y="316.5" width="65.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="518.5" y="328.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">serve para</text><text x="25.9" y="758" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Tracejado cinza: exceção. Vermelho: o monofilamento é triagem do pé, não rastreio da polineuropatia.</text></svg>