<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 795 768.825" width="795" height="768.825" role="img" aria-label="Risco cardiovascular no diabetes: da estratificação à meta de LDL"><title>Risco cardiovascular no diabetes: da estratificação à meta de LDL</title><defs><marker id="fnodiabetes-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fnodiabetes-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fnodiabetes-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fnodiabetes-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="793" height="766.825" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="397.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Risco cardiovascular no diabetes: da estratificação à meta de LDL</text><text x="397.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Com triglicerídeos acima de 200 mg/dL, a meta a perseguir é a do não HDL</text><path d="M396.9,153.1 L397.5,236.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M655.1,174.2 C655.1,205.2 397.5,205.2 397.5,236.2" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#fnodiabetes-as)"/><path d="M139.3,166.9 C139.3,186.9 220.1,186.9 220.1,268.9 S259.6,350.9 259.6,370.9" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#fnodiabetes-as)"/><path d="M397.5,301.2 C397.5,332.2 541.6,332.2 541.6,363.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M397.5,301.2 C397.5,336 259.6,336 259.6,370.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M259.6,435.8 C259.6,470.7 514.4,470.7 514.4,505.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M259.6,435.8 C259.6,470.7 246.3,470.7 246.3,505.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M246.3,570.5 C246.3,605.3 546.9,605.3 546.9,640.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M246.3,570.5 L246.3,632.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><rect x="26.1" y="74.4" width="226.4" height="92.5" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="40.1" y="94.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Estratificadores de ALTO risco</text><text x="40.1" y="109.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• Hipertensão, tabagismo, síndrome</text><text x="40.1" y="124.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">metabólica, DM2 &gt; 10 anos</text><text x="40.1" y="139" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• Doença renal, DCV precoce na</text><text x="40.1" y="153.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">família, CAC 10–300 UA</text><rect x="282.5" y="88.1" width="228.7" height="65" rx="32.485" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="396.9" y="108.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Pessoa com diabetes</text><text x="396.9" y="124.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">sem calculadora de risco no DM2</text><text x="396.9" y="139.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">DM1 com &lt; 20 anos: STENO</text><rect x="541.2" y="67" width="227.7" height="107.2" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="555.2" y="87.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Estratificadores de MUITO</text><text x="555.2" y="102.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">ALTO risco</text><text x="555.2" y="117.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• Prevenção secundária, estenose &gt;</text><text x="555.2" y="132.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">50%, CAC &gt; 300 UA</text><text x="555.2" y="147.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• LDL &gt; 190, CT &gt; 310; DM1 &gt; 20</text><text x="555.2" y="162" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">anos diagnosticado após os 18</text><polygon points="262.1 236.2 532.9 236.2 548.9 268.7 532.9 301.2 262.1 301.2 246.1 268.7" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="397.5" y="256.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">Muito alto risco?</text><text x="397.5" y="272.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">qualquer estratificador de muito alto risco</text><text x="397.5" y="287.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">ou 3 ou mais estratificadores de alto risco</text><polygon points="146.5 370.9 372.6 370.9 388.6 403.4 372.6 435.8 146.5 435.8 130.5 403.4" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="259.6" y="391.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">Alto risco?</text><text x="259.6" y="407.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">1 a 2 estratificadores de alto risco</text><text x="259.6" y="422.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">ou idade ♂ ≥ 50 · ♀ ≥ 56 anos</text><rect x="418.6" y="363.2" width="245.9" height="80.3" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="541.6" y="383.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Muito alto risco (qualquer idade)</text><text x="541.6" y="399.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">LDL &lt; 50 · não HDL &lt; 80 mg/dL</text><text x="541.6" y="414.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">estatina de alta potência ± ezetimiba /</text><text x="541.6" y="430.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">iPCSK9</text><polygon points="160.4 505.5 332.2 505.5 348.2 538 332.2 570.5 160.4 570.5 144.4 538" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="246.3" y="526.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">Idade intermediária?</text><text x="246.3" y="541.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">♂ 38–49 · ♀ 46–55 anos</text><text x="246.3" y="557.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sem estratificadores</text><rect x="378.2" y="505.5" width="272.4" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="514.4" y="526.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Alto risco</text><text x="514.4" y="541.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">LDL &lt; 70 · não HDL &lt; 100 mg/dL</text><text x="514.4" y="557.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">qualquer estatina, desde que atinja a meta</text><rect x="111.9" y="632.5" width="268.9" height="80.3" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="246.3" y="653.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Baixo risco</text><text x="246.3" y="668.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">♂ &lt; 38 · ♀ &lt; 46 anos, sem estratificadores</text><text x="246.3" y="684.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">LDL &lt; 100 · não HDL &lt; 130: estilo de vida</text><text x="246.3" y="699.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">(considerar estatina)</text><rect x="410.7" y="640.2" width="272.4" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="546.9" y="660.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Risco intermediário (moderado)</text><text x="546.9" y="676.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">LDL &lt; 100 · não HDL &lt; 130 mg/dL</text><text x="546.9" y="691.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">qualquer estatina, desde que atinja a meta</text><rect x="500.9" y="197.2" width="50.8" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="526.3" y="209.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">critérios</text><rect x="166.3" y="260.9" width="50.8" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="212.1" y="272.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="end" class="lbl">critérios</text><rect x="454.5" y="324.2" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="469.5" y="336.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="312.8" y="328" width="31.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="328.5" y="340" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não</text><rect x="371.9" y="462.7" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="387" y="474.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="237.2" y="462.7" width="31.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="252.9" y="474.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não</text><rect x="381.6" y="597.3" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="396.6" y="609.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="230.6" y="593.5" width="31.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="246.3" y="605.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não</text><text x="26.1" y="738.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Setas cinza: critérios. Para chegar à meta: estatina de alta potência, depois ezetimiba e/ou iPCSK9 (dobrar a dose reduz o LDL só ~6%).</text></svg>