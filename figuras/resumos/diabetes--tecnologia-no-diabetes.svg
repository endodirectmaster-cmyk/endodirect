<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 778 710.775" width="778" height="710.775" role="img" aria-label="Do sensor à decisão: os dois caminhos do dado do CGM"><title>Do sensor à decisão: os dois caminhos do dado do CGM</title><defs><marker id="fnodiabetes-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fnodiabetes-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fnodiabetes-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fnodiabetes-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="776" height="708.775" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="389" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Do sensor à decisão: os dois caminhos do dado do CGM</text><text x="389" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Alça fechada híbrida (basal automática) e relatório AGP (decisão entre consultas)</text><path d="M334.9,132 C334.9,163 117.4,163 117.4,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M334.9,132 C334.9,163 331.8,163 331.8,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M334.9,132 C334.9,163 549.3,163 549.3,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnodiabetes-ag)"/><path d="M117.4,289.7 C117.4,325 190.8,325 190.8,360.3" fill="none" stroke="#d9b652" stroke-wi