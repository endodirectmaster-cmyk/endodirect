<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 783 818.73" width="783" height="818.73" role="img" aria-label="Dois modos de estimular a célula β: incretinas e secretagogos"><title>Dois modos de estimular a célula β: incretinas e secretagogos</title><defs><marker id="fada2026sbd-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fada2026sbd-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fada2026sbd-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fada2026sbd-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="781" height="816.73" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="391.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Dois modos de estimular a célula β: incretinas e secretagogos</text><text x="391.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Via SUR1: independe da glicemia, daí a hipoglicemia; via incretina: glicose-dependente</text><path d="M132.4,147.3 C132.4,193.7 298.9,193.7 298.9,240.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fada2026sbd-ag)"/><path d="M394.2,178.1 C394.2,209.1 298.9,209.1 298.9,240.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fada2026sbd-ag)"/><path d="M298.9,335.7 C298.9,366.7 135.8,366.7 135.8,397.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fada2026sbd-ag)"/><path d="M298.9,335.7 C298.9,370.6 384.8,370.6 384.8,405.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fada2026sbd-ag)"/><path d="M135.8,493.4 C135.8,528.3 402.1,528.3 402.1,563.1" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#fada2026sbd-av)"/><path d="M384.8,485.8 C384.8,524.4 402.1,524.4 402.1,563.1" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#fada2026sbd-av)"/><path d="M135.8,493.4 C135.8,524.4 157.2,524.4 157.2,555.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fada2026sbd-ag)"/><path d="M653.2,162.7 L653.2,263.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fada2026sbd-ag)"/><path d="M653.2,312.7 C653.2,366.7 640.5,366.7 640.5,420.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fada2026sbd-ag)"/><path d="M640.5,470.4 L640.5,570.8" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#fada2026sbd-av)"/><path d="M640.5,620.4 C640.5,659.1 391.5,659.1 391.5,697.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fada2026sbd-ag)"/><rect x="25.9" y="97.7" width="213" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="132.4" y="118.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Células L intestinais</text><text x="132.4" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">GLP-1, do gene do proglucagon</text><rect x="268.9" y="67" width="250.5" height="111.1" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="394.2" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Células K (intestino delgado)</text><text x="394.2" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">GIP: gene próprio; responde a gordura</text><text x="394.2" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">e proteína</text><text x="394.2" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">estimula o glucagon na</text><text x="394.2" y="149.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">normo/hipoglicemia, inibe na</text><text x="394.2" y="164.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">hiperglicemia</text><rect x="549.4" y="82.4" width="207.7" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="653.2" y="103.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Sulfonilureias e glinidas</text><text x="653.2" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">agonistas do SUR1 na célula β</text><text x="653.2" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">glinidas: meia-vida curta,</text><text x="653.2" y="149.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">glicemia pós-prandial</text><rect x="170.3" y="240.1" width="257.1" height="95.7" rx="47.845" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="298.9" y="260.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Incretinas: GLP-1 e GIP</text><text x="298.9" y="276.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">GIP: 50–70% da insulina pós-prandial,</text><text x="298.9" y="291.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">potencializa o GLP-1</text><text x="298.9" y="307.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">GLP-1: saciedade e supressão do</text><text x="298.9" y="322.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">glucagon</text><rect x="575.6" y="263.1" width="155.3" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="653.2" y="283.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Canal K-ATP fecha</text><text x="653.2" y="299.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">despolarização</text><rect x="30.4" y="397.7" width="210.9" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="135.8" y="418.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">AGLP-1 e tirzepatida</text><text x="135.8" y="434" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">análogos do GLP-1; tirzepatida:</text><text x="135.8" y="449.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">agonista duplo GIP/GLP-1</text><text x="135.8" y="464.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">↓ HbA1c de até 2 pontos</text><text x="135.8" y="480.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">(tirzepatida: &gt; 2)</text><rect x="271.2" y="405.4" width="227.1" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="384.8" y="426.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">iDPP-4</text><text x="384.8" y="441.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">impede a DPP-4 de clivar o GLP-1</text><text x="384.8" y="457.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">endógeno</text><text x="384.8" y="472.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">efeito modesto: ↓ HbA1c &lt; 1%</text><rect x="528.3" y="420.8" width="224.3" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="640.5" y="441.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Influxo de cálcio</text><text x="640.5" y="457.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">liberação dos grânulos de insulina</text><rect x="32" y="555.4" width="250.4" height="80.3" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="157.2" y="576.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Efeitos além da insulina</text><text x="157.2" y="591.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">saciedade, ↓ glucagon, perda de peso</text><text x="157.2" y="607.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">↓ desfechos CV e renais (AGLP-1 com</text><text x="157.2" y="622.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">benefício comprovado)</text><rect x="312.4" y="563.1" width="179.4" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="402.1" y="583.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Célula β (via incretina)</text><text x="402.1" y="599.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">secreção de insulina</text><text x="402.1" y="614.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">GLICOSE-dependente</text><rect x="525.9" y="570.8" width="229.2" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="640.5" y="591.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Célula β (via SUR1)</text><text x="640.5" y="607.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">secreção INDEPENDE da glicemia</text><rect x="262.4" y="697.8" width="258.2" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="391.5" y="718.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Daí a hipoglicemia</text><text x="391.5" y="734.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">evitar glibenclamida (metabólitos ativos)</text><text x="391.5" y="749.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">preferir gliclazida MR ou glimepirida</text><rect x="193.8" y="185.7" width="43.7" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="215.6" y="197.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">GLP-1</text><rect x="331.5" y="201.1" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="346.5" y="213.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">GIP</text><rect x="292.4" y="362.6" width="98.8" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="341.8" y="374.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">GLP-1 endógeno</text><rect x="213.1" y="520.3" width="111.8" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="269" y="532.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">glicose-dependente</text><rect x="350.2" y="516.4" width="86.5" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="393.5" y="528.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">efeito modesto</text><rect x="577.2" y="512.6" width="126.7" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="640.5" y="524.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">independe da glicemia</text><text x="25.9" y="788.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Setas verdes: estímulo da célula β. iDPP-4: neutro no peso, sem benefício CV específico; não associar a AGLP-1.</text></svg>