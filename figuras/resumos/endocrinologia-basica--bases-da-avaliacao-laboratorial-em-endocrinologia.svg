<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 767 865.715" width="767" height="865.715" role="img" aria-label="Do basal ao teste dinâmico: confirmar excesso ou deficiência"><title>Do basal ao teste dinâmico: confirmar excesso ou deficiência</title><defs><marker id="fcrinologia-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fcrinologia-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fcrinologia-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fcrinologia-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="765" height="863.715" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="383.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Do basal ao teste dinâmico: confirmar excesso ou deficiência</text><text x="383.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Supressão confirma excesso; estímulo confirma deficiência</text><path d="M383.5,132 L383.5,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcrinologia-ag)"/><path d="M383.5,258.9 C383.5,289.9 262.6,289.9 262.6,320.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcrinologia-ag)"/><path d="M383.5,258.9 C383.5,305.3 508,305.3 508,351.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcrinologia-ag)"/><path d="M508,385.9 C508,432.3 270.8,432.3 270.8,478.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcrinologia-ag)"/><path d="M508,385.9 C508,432.3 495.1,432.3 495.1,478.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcrinologia-ag)"/><path d="M270.8,528.2 C270.8,566.6 197.7,566.6 197.7,605" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcrinologia-ag)"/><path d="M495.1,528.2 C495.1,559.2 570.3,559.2 570.3,590.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcrinologia-ag)"/><path d="M197.7,668 C197.7,706.4 383.5,706.4 383.5,744.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcrinologia-ag)"/><path d="M570.3,682.7 C570.3,713.7 383.5,713.7 383.5,744.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcrinologia-ag)"/><rect x="243.3" y="67" width="280.3" height="65" rx="32.485" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="383.5" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Dosagem basal pareada</text><text x="383.5" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">hormônio-alvo + trófico + clínica</text><text x="383.5" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ex.: TSH + T4 livre; cortisol + ACTH às 8 h</text><polygon points="264.6 194 502.4 194 518.4 226.5 502.4 258.9 264.6 258.9 248.6 226.5" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="383.5" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">Basal conclusivo?</text><text x="383.5" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">cortisol 8 h: &lt; 3 sugere insuficiência</text><text x="383.5" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">adrenal, &gt; 15–18 afasta</text><rect x="153.1" y="320.9" width="219" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="262.6" y="341.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Interpretar no eixo</text><text x="262.6" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">alvo baixo: trófico alto = primária;</text><text x="262.6" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">baixo/normal = central</text><text x="262.6" y="388" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">alvo alto com trófico suprimido =</text><text x="262.6" y="403.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">excesso autônomo</text><polygon points="418.1 351.7 597.9 351.7 613.9 368.8 597.9 385.9 418.1 385.9 402.1 368.8" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="508" y="372.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">Suspeita de excesso?</text><rect x="174.2" y="478.6" width="193.2" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="270.8" y="499.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Teste de supressão</text><text x="270.8" y="514.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">se não suprime, é autônomo</text><rect x="397.4" y="478.6" width="195.3" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="495.1" y="499.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Teste de estímulo</text><text x="495.1" y="514.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">se não responde, há falência</text><rect x="25.9" y="605" width="343.6" height="63.1" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="39.9" y="625.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Cortes de supressão</text><text x="39.9" y="640.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• Dexametasona 1 mg: cortisol 8 h &gt; 1,8 µg/dL → Cushing</text><text x="39.9" y="654.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• TOTG-GH: nadir de GH &gt; 0,4 ng/mL → acromegalia</text><rect x="399.6" y="590.2" width="341.5" height="92.5" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="413.6" y="610.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Cortes de estímulo</text><text x="413.6" y="625.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• Cortrosina 250 µg: cortisol &gt; 18–20 µg/dL afasta</text><text x="413.6" y="640.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">insuficiência adrenal</text><text x="413.6" y="654.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• ITT: GH &gt; 3–5 ng/mL e cortisol &gt; 18–20 µg/dL (glicemia</text><text x="413.6" y="669.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">&lt; 40 mg/dL)</text><rect x="201" y="744.7" width="365" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="383.5" y="765.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Confirmar antes de tratar</text><text x="383.5" y="781.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">diretrizes: confirmar o diagnóstico antes de tratar</text><text x="383.5" y="796.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">resultado incoerente com a clínica: pensar em interferência</text><rect x="308" y="281.9" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="323" y="293.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="390.8" y="297.3" width="109.8" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="445.7" y="309.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não: zona cinzenta</text><rect x="374.4" y="424.3" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="389.4" y="436.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="455.1" y="424.3" width="92.9" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="501.5" y="436.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não: deficiência</text><text x="25.9" y="835.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Hormônios pulsáteis (LH, GH, prolactina): um valor isolado pode enganar.</text></svg>