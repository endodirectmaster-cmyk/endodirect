" stroke-width="2.2" marker-end="url(#fcrinologia-ag)"/><rect x="25.8" y="67" width="303.5" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="177.5" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Receptor nuclear</text><text x="177.5" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">ativado por esteroides, tireoidianos e vitamina D</text><text x="177.5" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">liga-se a HRE: latência de horas a dias</text><rect x="73.1" y="194" width="208.7" height="80.3" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="177.5" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Gene (DNA)</text><text x="177.5" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">fatores de transcrição ligados a</text><text x="177.5" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">elementos responsivos no</text><text x="177.5" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">promotor</text><rect x="127.1" y="336.3" width="100.9" height="34.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="177.5" y="357" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Pré-mRNA</text><rect x="69.1" y="432.6" width="216.8" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="177.5" y="453.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">mRNA maduro</text><text x="177.5" y="468.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">capping 5', cauda poli-A, splicing</text><rect x="89" y="544.2" width="176.9" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="177.5" y="564.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Proteína</text><text x="177.5" y="580.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">traduzida nos ribossomos</text><rect x="87.2" y="655.8" width="180.7" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="177.5" y="676.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Hormônio ativo</text><text x="177.5" y="692.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">armazenado e secretado</text><rect x="121.3" y="155" width="112.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="177.5" y="167" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">regula a transcrição</text><rect x="144" y="297.3" width="67" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="177.5" y="309.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">transcrição</text><rect x="132.6" y="393.5" width="89.7" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="177.5" y="405.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">processamento</text><rect x="149.8" y="505.2" width="55.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="177.5" y="517.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">tradução</text><rect x="94.1" y="616.8" width="166.8" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="177.5" y="628.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">modificações pós-traducionais</text><line x1="281.9" y1="234.1" x2="343.2" y2="234.1" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="343.2" y="187.3" width="170" height="93.6" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="351.2" y="203" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Mutações pontuais:</text><text x="351.2" y="216.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">silenciosa, missense (troca</text><text x="351.2" y="229.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">de aminoácido), nonsense</text><text x="351.2" y="243.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">(proteína truncada);</text><text x="351.2" y="256.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">frameshift desloca o quadro</text><text x="351.2" y="270.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">de leitura</text><line x1="285.9" y1="457.4" x2="343.2" y2="457.4" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="343.2" y="410.6" width="170" height="93.6" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="351.2" y="426.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Capping 5' protege e facilita</text><text x="351.2" y="439.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">a ligação do ribossomo;</text><text x="351.2" y="453.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">cauda poli-A dá</text><text x="351.2" y="466.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">estabilidade; splicing</text><text x="351.2" y="480" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">alternativo gera múltiplas</text><text x="351.2" y="493.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">variantes de mRNA</text><line x1="266" y1="569" x2="343.2" y2="569" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="343.2" y="528.9" width="170" height="80.1" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="351.2" y="544.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Fosforilação, acetilação,</text><text x="351.2" y="558" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">metilação, ubiquitinação e</text><text x="351.2" y="571.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">glicosilação permitem que</text><text x="351.2" y="584.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">uma única proteína participe</text><text x="351.2" y="598.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">de vias diferentes</text><text x="25.8" y="731.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Por receptor de membrana, a resposta vem em segundos a minutos.</text></svg>