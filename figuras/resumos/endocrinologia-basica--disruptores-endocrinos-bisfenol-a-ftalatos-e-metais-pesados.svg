t><rect x="26" y="396.5" width="165.3" height="95.7" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="108.7" y="417.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Eixo metabólico</text><text x="108.7" y="432.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">PPARγ e adipogênese;</text><text x="108.7" y="448.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">microbiota alterada</text><text x="108.7" y="463.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">resistência à leptina e</text><text x="108.7" y="478.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">resistência insulínica</text><rect x="221.3" y="411.9" width="152.9" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="297.8" y="432.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Eixo tireoidiano</text><text x="297.8" y="448.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">TPO e NIS alterados;</text><text x="297.8" y="463.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">TSH aumenta</text><rect x="404.2" y="411.9" width="136.6" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="472.5" y="432.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Eixo adrenal</text><text x="472.5" y="448.2" font-family=