ill="#e9eef7" text-anchor="middle">não sintetiza: armazena e libera</text><text x="132" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">ADH e ocitocina</text><text x="132" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">produzidos nos núcleos</text><text x="132" y="276.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">supraóptico e paraventricular</text><rect x="268.2" y="209.3" width="213.7" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="375" y="230" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Adeno-hipófise</text><text x="375" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">tróficos: ACTH, TSH, LH e FSH,</text><text x="375" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">GH, prolactina</text><rect x="285.5" y="351.7" width="179.1" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="375" y="372.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Glândula-alvo</text><text x="375" y="388" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">adrenal, tireoide, gônadas</text><rect x="137.4" y="463.3" width="233" height="65" rx="32.485" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="253.9" y="484" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Hormônio periférico</text><text x="253.9" y="499.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">cortisol; T4/T3; esteroides sexuais</text><text x="253.9" y="514.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">e inibina B</text><rect x="115.9" y="590.2" width="275.9" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="253.9" y="610.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Exceção: feedback positivo</text><text x="253.9" y="626.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">estradiol alto e sustentado no meio do ciclo</text><text x="253.9" y="641.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">estimula o eixo → pico de LH → ovulação</text><rect x="156.8" y="155" width="72.2" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="192.9" y="167" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">fluxo axonal</text><rect x="274.4" y="162.6" width="80" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="314.4" y="174.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">sistema porta</text><rect x="354.1" y="305" width="41.8" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="375" y="317" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">trófico</text><rect x="187.3" y="551.2" width="133.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="253.9" y="563.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">estradiol (meio do ciclo)</text><text x="25.9" y="681.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Alça curta: hormônio hipofisário → hipotálamo. Ultracurta: hipotalâmico sobre a própria secreção.</text></svg>