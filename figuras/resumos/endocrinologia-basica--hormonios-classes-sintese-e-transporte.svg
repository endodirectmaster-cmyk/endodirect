<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 667.095" width="816" height="667.095" role="img" aria-label="Três classes de hormônios: do precursor ao receptor"><title>Três classes de hormônios: do precursor ao receptor</title><defs><marker id="ftransporte-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="ftransporte-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="ftransporte-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="ftransporte-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="814" height="665.095" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="408" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Três classes de hormônios: do precursor ao receptor</text><text x="408" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">A classe química define síntese, estoque, transporte, receptor e meia-vida</text><text x="115.7" y="111.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Precursor</text><text x="115.7" y="249.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Síntese</text><text x="115.7" y="379.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Estoque</text><text x="115.7" y="494.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Sangue e receptor</text><path d="M261.3,139.6 C261.3,168.5 242.1,168.5 242.1,197.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftransporte-ag)"/><path d="M242.1,293 L242.1,343" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftransporte-ag)"/><path d="M242.1,408 L242.1,458" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftransporte-ag)"/><path d="M463.8,147.3 C463.8,172.3 465,172.3 465,197.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftransporte-ag)"/><path d="M465,293 C465,318 449.5,318 449.5,343" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftransporte-ag)"/><path d="M449.5,408 L449.5,458" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftransporte-ag)"/><path d="M670.4,132 C670.4,168.5 690.7,168.5 690.7,205" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftransporte-ag)"/><path d="M690.7,285.3 L690.7,343" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftransporte-ag)"/><path d="M690.7,408 L690.7,458" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftransporte-ag)"/><rect x="174.1" y="74.7" width="174.3" height="65" rx="32.485" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="261.3" y="95.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Peptídicos</text><text x="261.3" y="111" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">pré-pró-hormônio (gene</text><text x="261.3" y="126.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">transcrito e traduzido)</text><rect x="378.4" y="67" width="170.8" height="80.3" rx="40.165" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="463.8" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Esteroides</text><text x="463.8" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">derivados do colesterol</text><text x="463.8" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">(cortisol, aldosterona,</text><text x="463.8" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">estradiol)</text><rect x="579.2" y="82.4" width="182.4" height="49.6" rx="24.805" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="670.4" y="103.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Tireoidianos (T4 e T3)</text><text x="670.4" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">tirosina + iodo</text><rect x="145.5" y="197.3" width="193.2" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="242.1" y="218" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Clivagem</text><text x="242.1" y="233.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">peptídeo-sinal sai no retículo</text><text x="242.1" y="249" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">(pré → pró)</text><text x="242.1" y="264.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">PC1/3 e PC2 clivam a</text><text x="242.1" y="279.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">pró-proteína</text><rect x="368.7" y="197.3" width="192.5" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="465" y="218" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">StAR → CYP11A1</text><text x="465" y="233.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">colesterol entra na</text><text x="465" y="249" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">mitocôndria (etapa limitante)</text><text x="465" y="264.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">vira pregnenolona; enzimas</text><text x="465" y="279.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">seguintes definem o produto</text><rect x="591.2" y="205" width="199" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="690.7" y="225.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">NIS → TPO</text><text x="690.7" y="241.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">NIS capta iodeto; TPO</text><text x="690.7" y="256.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">organifica na tireoglobulina</text><text x="690.7" y="272" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">MIT+DIT → T3; DIT+DIT → T4</text><rect x="162.9" y="343" width="158.6" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="242.1" y="363.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Grânulos</text><text x="242.1" y="379.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">secreção regulada por</text><text x="242.1" y="394.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">exocitose (Ca²⁺)</text><rect x="353.2" y="343" width="192.5" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="449.5" y="363.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Sem estoque</text><text x="449.5" y="379.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">o estímulo agudo aumenta a</text><text x="449.5" y="394.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">síntese em minutos</text><rect x="593.1" y="343" width="195.3" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="690.7" y="363.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Coloide</text><text x="690.7" y="379.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">secreta sobretudo T4; D1/D2</text><text x="690.7" y="394.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">geram T3 na periferia</text><rect x="160" y="458" width="164.2" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="242.1" y="478.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Circulam livres</text><text x="242.1" y="494.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">receptor de membrana;</text><text x="242.1" y="509.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">meia-vida de minutos</text><rect x="355" y="458" width="188.9" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="449.5" y="478.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Ligados a carreadoras</text><text x="449.5" y="494.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">CBG, SHBG; receptor</text><text x="449.5" y="509.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">nuclear; meia-vida de horas</text><rect x="597.7" y="458" width="186.1" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="690.7" y="478.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Ligados à TBG</text><text x="690.7" y="494.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">receptor nuclear; meia-vida</text><text x="690.7" y="509.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">de dias (T4 ≈ 7 dias)</text><rect x="157.1" y="531" width="170" height="80.1" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="165.1" y="546.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Catecolaminas</text><text x="165.1" y="560.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">comportam-se como</text><text x="165.1" y="573.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">peptídeos: grânulos,</text><text x="165.1" y="587" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">receptor de membrana,</text><text x="165.1" y="600.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">meia-vida curta</text><text x="145.5" y="637.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Só a fração livre é ativa: o que muda a carreadora muda o hormônio total, não o livre.</text></svg>