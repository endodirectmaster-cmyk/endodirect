<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 594.32" width="780" height="594.32" role="img" aria-label="Receptores de membrana e nucleares: da ligação à resposta"><title>Receptores de membrana e nucleares: da ligação à resposta</title><defs><marker id="fcaodesinal-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fcaodesinal-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fcaodesinal-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fcaodesinal-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="778" height="592.32" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="390" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Receptores de membrana e nucleares: da ligação à resposta</text><text x="390" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">A especificidade vem do receptor, não do hormônio: sem receptor não há efeito</text><path d="M242.9,116.6 C242.9,145.5 122.7,145.5 122.7,174.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcaodesinal-ag)"/><path d="M242.9,116.6 C242.9,149.3 318.6,149.3 318.6,182" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcaodesinal-ag)"/><path d="M242.9,116.6 C242.9,141.6 498.7,141.6 498.7,166.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcaodesinal-ag)"/><path d="M562.5,116.6 C562.5,145.5 679.9,145.5 679.9,174.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcaodesinal-ag)"/><path d="M122.7,270 C122.7,302.7 110,302.7 110,335.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcaodesinal-ag)"/><path d="M318.6,262.3 C318.6,295 297.6,295 297.6,327.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcaodesinal-ag)"/><path d="M498.7,277.7 C498.7,306.5 480.4,306.5 480.4,335.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcaodesinal-ag)"/><path d="M679.9,270 C679.9,298.8 671.9,298.8 671.9,327.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcaodesinal-ag)"/><path d="M110,415.7 C110,444.5 248,444.5 248,473.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcaodesinal-ag)"/><path d="M297.6,423.4 C297.6,448.4 248,448.4 248,473.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcaodesinal-ag)"/><path d="M480.4,415.7 C480.4,444.5 248,444.5 248,473.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcaodesinal-ag)"/><path d="M671.9,423.4 C671.9,448.4 593.9,448.4 593.9,473.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fcaodesinal-ag)"/><rect x="85.4" y="67" width="315" height="49.6" rx="24.805" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="242.9" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Hormônio hidrossolúvel</text><text x="242.9" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">não entra na célula: liga-se à porção extracelular</text><rect x="430.4" y="67" width="264.1" height="49.6" rx="24.805" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="562.5" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Hormônio lipossolúvel</text><text x="562.5" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">atravessa a membrana e age no núcleo</text><rect x="27.8" y="174.3" width="189.6" height="95.7" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="122.7" y="195" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Proteína G (GPCR)</text><text x="122.7" y="210.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">7 domínios transmembrana;</text><text x="122.7" y="226" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">a maior família</text><text x="122.7" y="241.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">ACTH, TSH, LH e FSH,</text><text x="122.7" y="256.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">PTH, glucagon</text><rect x="247.5" y="182" width="142.3" height="80.3" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="318.6" y="202.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Tirosina-quinase</text><text x="318.6" y="218.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">tem atividade</text><text x="318.6" y="233.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">enzimática própria</text><text x="318.6" y="249" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">insulina e IGF-1</text><rect x="419.7" y="166.6" width="157.8" height="111.1" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="498.7" y="187.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Citocina</text><text x="498.7" y="203.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">(JAK-STAT)</text><text x="498.7" y="219.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">sem atividade</text><text x="498.7" y="234.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">enzimática própria;</text><text x="498.7" y="249.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">recruta quinases</text><text x="498.7" y="265.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">GH, prolactina, leptina</text><rect x="607.6" y="174.3" width="144.6" height="95.7" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="679.9" y="195" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Receptor nuclear</text><text x="679.9" y="210.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">liga o DNA por dois</text><text x="679.9" y="226" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">dedos de zinco</text><text x="679.9" y="241.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">esteroides, T3,</text><text x="679.9" y="256.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">vitamina D</text><rect x="25.9" y="335.3" width="168.3" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="110" y="356" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Gs, Gi, Gq</text><text x="110" y="371.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">Gs: ↑AMPc → PKA</text><text x="110" y="387" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">Gi: ↓AMPc; Gq: PLC →</text><text x="110" y="402.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">IP3/Ca²⁺ + DAG → PKC</text><rect x="224.2" y="327.7" width="147" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="297.6" y="348.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Autofosforilação</text><text x="297.6" y="364" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">IRS-1/2 → PI3K/AKT</text><text x="297.6" y="379.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">(metabólica)</text><text x="297.6" y="394.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">e RAS/MAPK</text><text x="297.6" y="410" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">(crescimento)</text><rect x="401.1" y="335.3" width="158.5" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="480.4" y="356" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">JAK fosforila STAT</text><text x="480.4" y="371.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">STAT migra ao núcleo</text><text x="480.4" y="387" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">SOCS fazem o</text><text x="480.4" y="402.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">feedback negativo</text><rect x="589.7" y="327.7" width="164.5" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="671.9" y="348.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Fator de transcrição</text><text x="671.9" y="364" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">classe I: citoplasma,</text><text x="671.9" y="379.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ligado à HSP</text><text x="671.9" y="394.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">classe II: no núcleo,</text><text x="671.9" y="410" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">com o RXR</text><rect x="59.1" y="473.4" width="377.7" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="248" y="494.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Resposta rápida</text><text x="248" y="509.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">segundos a minutos (proteína G); minutos a horas (quinases)</text><text x="248" y="525" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">modifica proteínas já existentes, sem transcrição</text><rect x="466.9" y="473.4" width="254" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="593.9" y="494.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Resposta lenta</text><text x="593.9" y="509.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">horas a dias: altera a expressão gênica</text><text x="593.9" y="525" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">exige nova síntese proteica</text><text x="25.9" y="564.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Resistência hormonal: defeito no receptor ou pós-receptor → hormônio alto com ação baixa.</text></svg>