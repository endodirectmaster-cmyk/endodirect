path d="M222.8,228.2 C222.8,259.2 339.3,259.2 339.3,290.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ficiofisico-ag)"/><path d="M426.8,228.2 C426.8,259.2 531,259.2 531,290.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ficiofisico-ag)"/><path d="M125.3,339.8 C125.3,370.8 118.6,370.8 118.6,401.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ficiofisico-ag)"/><path d="M339.3,339.8 C339.3,370.8 118.6,370.8 118.6,401.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ficiofisico-ag)"/><path d="M531,339.8 C531,374.7 546.9,374.7 546.9,409.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ficiofisico-ag)"/><path d="M339.3,339.8 C339.3,370.8 348.5,370.8 348.5,401.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ficiofisico-ag)"/><path d="M348.5,466.8 L348.5,528.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ficiofisico-ag)"/><path d="M348.5,578.4 L348.5,640.4" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#ficiofisico-av)"/><rect x="199.1" y="67" width="235.8" height="49.6" rx="24.805" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="317" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Exercício no DM1</text><text x="317" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">iniciar com glicemia 90–250 mg/dL</text><rect x="128" y="178.6" width="189.7" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="222.8" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Aeróbico</text><text x="222.8" y="214.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">insulina exógena segue alta</text><rect x="347.7" y="178.6" width="158.3" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="426.8" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Anaeróbico ou HIIT</text><text x="426.8" y="214.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">sprints, força pesada</text><rect x="34.4" y="290.2" width="181.9" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="125.3" y="310.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Fígado</text><text x="125.3" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">glicose hepática suprimida</text><rect x="246.2" y="290.2" width="186.1" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="339.3" y="310.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Músculo</text><text x="339.3" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">GLUT4: AMPK e contração</text><rect x="462.4" y="290.2" width="137.3" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="531" y="310.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Catecolaminas</text><text x="531" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">e lactato ↑</text><rect x="25.9" y="401.8" width="185.4" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="118.6" y="422.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hipoglicemia</text><text x="118.6" y="438.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">durante o esforço</text><text x="118.6" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">HAAF embota a percepção</text><rect x="241.3" y="401.8" width="214.4" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="348.5" y="422.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Sensibilidade à insulina ↑</text><text x="348.5" y="438.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">por 24–48 h após o esforço</text><text x="348.5" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">repleção do glicogênio muscular</text><rect x="485.7" y="409.5" width="122.4" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="546.9" y="430.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Hiperglicemia</text><text x="546.9" y="445.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">transitória</text><rect x="264.6" y="528.8" width="167.8" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="348.5" y="549.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hipoglicemia tardia</text><text x="348.5" y="565.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">frequentemente noturna</text><rect x="235.9" y="640.4" width="225.2" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="348.5" y="661.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Prevenção no DM1</text><text x="348.5" y="676.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">• bolus −25–75%; basal −50–80%</text><text x="348.5" y="692.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">• sprints de 10 s; carboidrato extra</text><rect x="148.3" y="251.2" width="51.5" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="174.1" y="263.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" class="lbl">suprime</text><rect x="247.9" y="251.2" width="66.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="281.1" y="263.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">capta mais</text><rect x="300.7" y="362.8" width="86.5" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="343.9" y="374.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">após o esforço</text><rect x="322.5" y="601.4" width="52.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="348.5" y="613.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">prevenir</text><line x1="434.9" y1="91.8" x2="622.1" y2="91.8" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="622.1" y="65.2" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="630.1" y="80.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Acima de 250 mg/dL com</text><text x="630.1" y="94.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">cetonemia ≥1,5 mmol/L:</text><text x="630.1" y="107.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">adiar e corrigir</text><text x="25.9" y="731.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Setas douradas: sequência. Barra vermelha: supressão. Verde: conduta.</text></svg>