9.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="531.8" y="318.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Eritrocitose</text><text x="531.8" y="334.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">Ht &gt;54%: risco trombótico</text><rect x="112.5" y="417.2" width="203.8" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="214.4" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Células de Leydig</text><text x="214.4" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">menos testosterona endógena</text><rect x="346.3" y="417.2" width="188.2" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="440.4" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Espermatogênese</text><text x="440.4" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">comprometida; inibina B cai</text><rect x="246.6" y="528.8" width="153.7" height="80.3" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="323.5" y="549.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hipogonadismo</text><text x="323.5" y="565.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">hipogonadotrófico</text><text x="323.5" y="581.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">atrofia testicular,</text><text x="323.5" y="596.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">oligo/azoospermia</text><rect x="204.6" y="671.1" width="237.7" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="323.5" y="691.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Pós-ciclo</text><text x="323.5" y="707.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">recupera em semanas a &gt;12 meses</text><text x="323.5" y="722.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">às vezes hipogonadismo persistente</text><rect x="212.7" y="139.6" width="67.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="246.4" y="151.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" class="lbl">feedback −</text><rect x="95.6" y="251.2" width="80.6" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="135.9" y="263.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">menos GnRH</text><rect x="141.5" y="378.2" width="34" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="158.5" y="390.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">LH ↓</text><rect x="250.3" y="378.2" width="42.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="271.5" y="390.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">FSH ↓</text><rect x="278" y="632.1" width="91" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="323.5" y="644.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">suspender EAA</text><line x1="400.4" y1="569" x2="634.8" y2="569" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="634.8" y="542.3" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="642.8" y="558" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Não é hipergonadotrófico:</text><text x="642.8" y="571.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">no hipogonadismo primário</text><text x="642.8" y="584.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">LH e FSH são altos</text><text x="26.2" y="762.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Barra vermelha: inibição. Setas douradas: sequência. Verde: conduta.</text></svg>