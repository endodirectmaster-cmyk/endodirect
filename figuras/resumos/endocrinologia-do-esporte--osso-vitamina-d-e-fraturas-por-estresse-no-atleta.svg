<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 691 820.915" width="691" height="820.915" role="img" aria-label="Fratura por estresse: carga, déficit energético e remodelação"><title>Fratura por estresse: carga, déficit energético e remodelação</title><defs><marker id="fsenoatleta-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fsenoatleta-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fsenoatleta-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fsenoatleta-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="689" height="818.915" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="345.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Fratura por estresse: carga, déficit energético e remodelação</text><text x="345.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Quando o treino excede a reparação, o microdano vira fratura</text><path d="M138.3,132 C138.3,170.2 115,170.2 115,208.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsenoatleta-ag)"/><path d="M376.5,132 C376.5,163 357.6,163 357.6,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsenoatleta-ag)"/><path d="M115,242.6 C115,280.8 253.5,280.8 253.5,319" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsenoatleta-ag)"/><path d="M357.6,257 C357.6,288 253.5,288 253.5,319" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsenoatleta-ag)"/><path d="M253.5,384 L253.5,446" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsenoatleta-ag)"/><path d="M253.5,495.6 L253.5,557.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsenoatleta-ag)"/><path d="M253.5,607.2 C253.5,638.2 141.9,638.2 141.9,669.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsenoatleta-ag)"/><path d="M253.5,607.2 C253.5,638.2 382.1,638.2 382.1,669.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsenoatleta-ag)"/><rect x="30.2" y="67" width="216.1" height="65" rx="32.485" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="138.3" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Carga mecânica repetitiva</text><text x="138.3" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">aumento abrupto de volume de</text><text x="138.3" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">treino</text><rect x="276.3" y="67" width="200.5" height="65" rx="32.485" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="376.5" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Baixa disponibilidade</text><text x="376.5" y="104" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">energética</text><text x="376.5" y="119.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">cerne do RED-S e da Tríade</text><rect x="25.9" y="208.4" width="178.2" height="34.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="115" y="229.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Microdano acumulado</text><rect x="234.1" y="194" width="247" height="63.1" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="248.1" y="214.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Eixos suprimidos</text><text x="248.1" y="229.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• hipoestrogenismo; IGF-1, T3, leptina ↓</text><text x="248.1" y="243.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• cortisol ↑</text><rect x="141" y="319" width="225" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="253.5" y="339.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Osso em remodelação</text><text x="253.5" y="355.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">reabsorção osteoclástica antes da</text><text x="253.5" y="370.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">formação</text><rect x="169.3" y="446" width="168.3" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="253.5" y="466.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Janela de fragilidade</text><text x="253.5" y="482.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">transitória</text><rect x="138.5" y="557.6" width="230" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="253.5" y="578.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Fratura por estresse</text><text x="253.5" y="593.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">dor focal que piora com a atividade</text><rect x="28.4" y="669.2" width="227.1" height="95.7" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="141.9" y="689.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Alto risco</text><text x="141.9" y="705.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">colo femoral tensional, córtex tibial</text><text x="141.9" y="720.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">anterior</text><text x="141.9" y="736.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">escafoide tarsal, 5º metatarso,</text><text x="141.9" y="751.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sesamoides</text><rect x="285.5" y="669.2" width="193.2" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="382.1" y="689.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Baixo risco</text><text x="382.1" y="705.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">calcâneo, sacro, metatarsos</text><text x="382.1" y="720.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">centrais</text><text x="382.1" y="736.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">repouso relativo; progressão</text><text x="382.1" y="751.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">~10%/semana</text><rect x="166.9" y="272.8" width="34.6" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="184.3" y="284.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">ativa</text><rect x="247.4" y="280" width="116.3" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="305.6" y="292" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">favorece reabsorção</text><rect x="180.8" y="518.6" width="145.5" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="253.5" y="530.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">treino excede a reparação</text><rect x="153.5" y="630.2" width="88.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="197.7" y="642.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">sítio sob tração</text><rect x="274.9" y="630.2" width="85.8" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="317.8" y="642.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">sítio trabecular</text><line x1="368.5" y1="582.4" x2="495.1" y2="582.4" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="495.1" y="555.8" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="503.1" y="571.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">RM mostra edema na 1ª</text><text x="503.1" y="584.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">semana; a radiografia só</text><text x="503.1" y="598.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">após 2–3 semanas</text><text x="25.9" y="790.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Setas douradas: sequência causal. Alto risco: descarga e, muitas vezes, fixação cirúrgica.</text></svg>