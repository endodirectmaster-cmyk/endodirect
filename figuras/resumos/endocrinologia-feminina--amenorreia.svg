<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 466 876.18" width="466" height="876.18" role="img" aria-label="Eixo da menstruação: onde falha cada compartimento"><title>Eixo da menstruação: onde falha cada compartimento</title><defs><marker id="famenorreia-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="famenorreia-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="famenorreia-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="famenorreia-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="464" height="874.18" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="233" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Eixo da menstruação: onde falha cada</text><text x="233" y="54" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">compartimento</text><text x="233" y="73" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">FSH/LH e estradiol localizam a falha; sempre excluir gravidez antes</text><text x="233" y="89" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">(β-hCG)</text><path d="M96,312.3 C96,358.7 139.8,358.7 139.8,405" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#famenorreia-ag)"/><path d="M233,185.3 C233,224 96,224 96,262.7" fill="none"