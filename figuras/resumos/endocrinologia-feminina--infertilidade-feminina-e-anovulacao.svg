ef7" text-anchor="middle">3ª linha: casos</text><text x="742" y="115.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e9eef7" text-anchor="middle">refratários</text><line x1="24" y1="335.505" x2="812" y2="335.505" stroke="#5b6f88" stroke-width="1.5" marker-end="url(#fanovulacao-as)"/><text x="418" y="329.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-style="italic" fill="#5b6f88" text-anchor="middle">linha de indução: 1ª → 3ª</text></svg>