<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703 658.95" width="703" height="658.95" role="img" aria-label="IOP: das causas ao hipoestrogenismo e suas consequências"><title>IOP: das causas ao hipoestrogenismo e suas consequências</title><defs><marker id="fematuraiop-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fematuraiop-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fematuraiop-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fematuraiop-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="701" height="656.95" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="351.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">IOP: das causas ao hipoestrogenismo e suas consequências</text><text x="351.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Perda da função ovariana antes dos 40 anos; a terapia hormonal não é opcional</text><path d="M259.5,130.1 L259.5,192.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fematuraiop-ag)"/><path d="M259.5,257 C259.5,299.6 144.9,299.6 144.9,342.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fematuraiop-ag)"/><path d="M144.9,376.3 C144.9,418.8 259.5,418.8 259.5,461.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fematuraiop-ag)"/><path d="M393.6,399.4 C393.6,430.4 259.5,430.4 259.5,461.4" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="252.5" y1="461.4" x2="266.5" y2="461.4" stroke="#c0392b" stroke-width="3"/><rect x="136" y="67" width="247" height="63.1" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="150" y="87.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Causas</text><text x="150" y="102.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• idiopática 70–90% · iatrogênica 11,2%</text><text x="150" y="116.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• genética 10–13% · autoimune 10,5%</text><rect x="152" y="192.1" width="215.1" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="259.5" y="212.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Ovário</text><text x="259.5" y="228.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">depleção folicular (mais comum)</text><text x="259.5" y="243.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">ou disfunção folicular</text><rect x="25.8" y="342.1" width="238.2" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="144.9" y="362.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">FSH &gt; 25 UI/L · estradiol baixo</text><rect x="294" y="319" width="199.2" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="393.6" y="339.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Terapia hormonal até ~50</text><text x="393.6" y="356" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">anos</text><text x="393.6" y="371.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">estrogênio em dose maior</text><text x="393.6" y="387" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">+ progestagênio se há útero</text><rect x="150.5" y="461.4" width="217.9" height="80.3" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="259.5" y="482.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Consequências</text><text x="259.5" y="497.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">fogachos; osso −20–30%</text><text x="259.5" y="513" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">trabecular, −5–10% cortical</text><text x="259.5" y="528.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">isquemia e insuficiência cardíaca</text><rect x="302.4" y="422.4" width="48.2" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="326.5" y="434.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" class="lbl">previne</text><line x1="367" y1="224.6" x2="507.2" y2="224.6" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="507.2" y="191.2" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="515.2" y="206.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Função flutuante: 5 a 10%</text><text x="515.2" y="220.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">podem engravidar</text><text x="515.2" y="233.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">espontaneamente; oferecer</text><text x="515.2" y="247.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">contracepção</text><rect x="174.5" y="549.7" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="182.5" y="565.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Cognição: risco de</text><text x="182.5" y="578.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">demência maior quanto</text><text x="182.5" y="592.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">mais cedo a IOP</text><text x="25.8" y="629" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Dourado: causa e consequência. Vermelho ⊣: o que a terapia hormonal previne ou controla.</text></svg>