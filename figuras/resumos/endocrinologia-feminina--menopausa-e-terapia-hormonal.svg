<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 538.16" width="780" height="538.16" role="img" aria-label="Da depleção folicular aos sintomas da menopausa"><title>Da depleção folicular aos sintomas da menopausa</title><defs><marker id="fiahormonal-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fiahormonal-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fiahormonal-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fiahormonal-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="778" height="536.16" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="390" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Da depleção folicular aos sintomas da menopausa</text><text x="390" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Como a queda e a oscilação do estradiol explicam o quadro clínico</text><path d="M298,116.6 C298,147.6 194.8,147.6 194.8,178.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiahormonal-ag)"/><path d="M298,116.6 C298,147.6 373.6,147.6 373.6,178.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiahormonal-ag)"/><path d="M194.8,228.2 C194.8,263.1 191.4,263.1 191.4,297.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiahormonal-ag)"/><path d="M373.6,228.2 C373.6,259.2 391.9,259.2 391.9,290.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiahormonal-ag)"/><path d="M391.9,355.2 C391.9,390 105,390 105,424.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiahormonal-ag)"/><path d="M373.6,228.2 C373.6,248.2 509.5,248.2 509.5,326.5 S279.5,404.9 279.5,424.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiahormonal-ag)"/><path d="M373.6,228.2 C373.6,248.2 509.5,248.2 509.5,322.7 S472.4,397.2 472.4,417.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiahormonal-ag)"/><rect x="232.5" y="67" width="131" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="298" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Ovário</text><text x="298" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">depleção folicular</text><rect x="134.2" y="178.6" width="121.2" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="194.8" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Inibina B cai</text><text x="194.8" y="214.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">primeira a cair</text><rect x="285.4" y="178.6" width="176.4" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="373.6" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Estradiol oscila e cai</text><text x="373.6" y="214.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">oscilação gera sintomas</text><rect x="112.5" y="297.9" width="157.7" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="191.4" y="318.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">FSH sobe</text><text x="191.4" y="334.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">&gt; 40 UI/L, se dosado</text><rect x="300.2" y="290.2" width="183.3" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="391.9" y="310.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Neurônios KNDy</text><text x="391.9" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">hiperativos (neurocinina B)</text><text x="391.9" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">alvo do fezolinetanto</text><rect x="25.8" y="424.9" width="158.6" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="105" y="445.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Fogachos</text><text x="105" y="461.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">80%; média de 7 anos</text><rect x="214.3" y="424.9" width="130.3" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="279.5" y="445.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Geniturinária</text><text x="279.5" y="461.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">50%; progressiva</text><rect x="374.6" y="417.2" width="195.7" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="472.4" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Osso e lipídios</text><text x="472.4" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">perda óssea acelerada</text><text x="472.4" y="468.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">↑ LDL, TG, Lp(a); HDL −25%</text><rect x="167" y="255.1" width="52.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="193.1" y="267.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">precede</text><line x1="363.5" y1="91.8" x2="584.2" y2="91.8" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="584.2" y="65.2" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="592.2" y="80.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Testosterona sem mudança</text><text x="592.2" y="94.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">aguda: também vem das</text><text x="592.2" y="107.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">adrenais</text><text x="25.8" y="508.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Diagnóstico clínico: 12 meses de amenorreia; dosagens só em casos atípicos. Percentuais: frequência na menopausa.</text></svg>