-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Hipogonadismo secundário</text><text x="36" y="135.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="46" y="135.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">LH/FSH e testosterona baixos</text><text x="36" y="157.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="46" y="157.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Hiperprolactinemia, esteroides</text><text x="46" y="173.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">exógenos</text><text x="36" y="196.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="46" y="196.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Responde a gonadotrofinas (hCG</text><text x="46" y="212.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">± FSH)</text><rect x="274" y="67" width="236" height="229.4" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M274,79 Q274,67 286,67 H498 Q510,67 510,79 V93.9 H274 Z" fill="#b7791f"/><text x="392" y="85.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Testicular</text><text x="286" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b7791f" text-anchor="middle">•</text><text x="296" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Klinefelter, criptorquidia, orquite,</text><text x="296" y="129.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">QT/RT</text><text x="286" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b7791f" text-anchor="middle">•</text><text x="296" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Varicocele: causa corrigível mais</text><text x="296" y="167.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">comum</text><text x="286" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b7791f" text-anchor="middle">•</text><text x="296" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">FSH ↑ com testículos pequenos</text><text x="286" y="212.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b7791f" text-anchor="middle">•</text><text x="296" y="212.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Azoospermia não obstrutiva:</text><text x="296" y="228.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">cariótipo e microdeleção do Y</text><text x="286" y="250.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b7791f" text-anchor="middle">•</text><text x="296" y="250.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">microTESE recupera focos ± ICSI</text><rect x="524" y="67" width="236" height="229.4" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M524,79 Q524,67 536,67 H748 Q760,67 760,79 V93.9 H524 Z" fill="#2e7d32"/><text x="642" y="85.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Pós-testicular</text><text x="536" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle">•</text><text x="546" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Agenesia bilateral dos deferentes</text><text x="546" y="129.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">(CFTR)</text><text x="536" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle">•</text><text x="546" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Pós-vasectomia, obstrução</text><text x="546" y="167.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">ejaculatória</text><text x="536" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle">•</text><text x="546" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Disfunção ejaculatória:</text><text x="546" y="206.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">retrógrada, neurogênica</text><text x="536" y="228.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle">•</text><text x="546" y="228.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Obstrutiva: FSH e volume</text><text x="546" y="244.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">testicular normais</text><text x="536" y="267.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle">•</text><text x="546" y="267.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Recuperação (PESA/TESE) +</text><text x="546" y="283.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">ICSI</text><text x="24" y="314.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-style="italic" fill="#5b6f88" text-anchor="start">Nunca testosterona no hipogonadismo secundário: ela suprime a espermatogênese. QT/RT: quimio/radioterapia.</text></svg>