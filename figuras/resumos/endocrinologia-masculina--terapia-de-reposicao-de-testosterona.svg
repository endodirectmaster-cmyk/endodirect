<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 673 507.44" width="673" height="507.44" role="img" aria-label="Testosterona exógena, eixo gonadal e fertilidade"><title>Testosterona exógena, eixo gonadal e fertilidade</title><defs><marker id="fstosterona-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fstosterona-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fstosterona-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fstosterona-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="671" height="505.44" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="336.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Testosterona exógena, eixo gonadal e fertilidade</text><text x="336.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Por que quem deseja fertilidade não recebe testosterona</text><path d="M326.3,116.6 C326.3,147.6 312.7,147.6 312.7,178.6" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="305.7" y1="178.6" x2="319.7" y2="178.6" stroke="#c0392b" stroke-width="3"/><path d="M536.6,116.6 C536.6,147.6 312.7,147.6 312.7,178.6" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#fstosterona-av)"/><path d="M312.7,228.2 C312.7,259.2 428.5,259.2 428.5,290.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fstosterona-ag)"/><path d="M491.5,228.2 C491.5,259.2 428.5,259.2 428.5,290.2" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#fstosterona-av)"/><path d="M428.5,339.8 C428.5,370.8 320.4,370.8 320.4,401.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fstosterona-ag)"/><path d="M428.5,339.8 C428.5,370.8 553.7,370.8 553.7,401.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fstosterona-ag)"/><rect x="233.2" y="67" width="186.3" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="326.3" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Testosterona exógena</text><text x="326.3" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">gel ou injetável</text><rect x="449.4" y="67" width="174.4" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="536.6" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Clomifeno ou inibidor</text><text x="536.6" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">da aromatase</text><rect x="264.7" y="178.6" width="96" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="312.7" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Hipófise</text><text x="312.7" y="214.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">LH e FSH</text><rect x="390.7" y="178.6" width="201.7" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="491.5" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">hCG ± FSH</text><text x="491.5" y="214.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">no hipogonadismo secundário</text><rect x="337.2" y="290.2" width="182.6" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="428.5" y="310.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Testículo</text><text x="428.5" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">produção testicular própria</text><rect x="210.2" y="401.8" width="220.4" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="320.4" y="422.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Espermatogênese suprimida</text><text x="320.4" y="438.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">com a testosterona exógena</text><rect x="460.6" y="401.8" width="186.1" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="553.7" y="422.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Fertilidade mantida</text><text x="553.7" y="438.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">função gonadal preservada</text><rect x="293.7" y="139.6" width="51.5" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="319.5" y="151.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" class="lbl">suprime</text><rect x="405.7" y="139.6" width="37.9" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="424.6" y="151.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">eleva</text><rect x="340" y="251.2" width="61.2" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="370.6" y="263.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">LH e FSH</text><rect x="433.3" y="251.2" width="53.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="460" y="263.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">estimula</text><rect x="336.1" y="362.8" width="76.7" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="374.5" y="374.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">sem LH/FSH</text><rect x="451.8" y="362.8" width="78.7" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="491.1" y="374.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">com estímulo</text><line x1="196.2" y1="91.8" x2="233.2" y2="91.8" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="26.2" y="65.2" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="34.2" y="80.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Desejo de fertilidade a curto</text><text x="34.2" y="94.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">prazo: contraindicação</text><text x="34.2" y="107.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">absoluta à reposição</text><line x1="196.2" y1="426.6" x2="210.2" y2="426.6" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="26.2" y="386.6" width="170" height="80.1" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="34.2" y="402.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Escolha inicial: reposição</text><text x="34.2" y="415.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">sem desejo de fertilidade;</text><text x="34.2" y="429.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">indução de</text><text x="34.2" y="442.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">espermatogênese se há</text><text x="34.2" y="456" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">desejo</text><text x="210.2" y="477.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Verde: estímulo. Vermelho com barra: supressão.</text></svg>