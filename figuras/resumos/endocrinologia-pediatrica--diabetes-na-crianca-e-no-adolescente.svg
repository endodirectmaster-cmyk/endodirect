th="1.5"/><text x="305.5" y="302.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Moderada</text><text x="305.5" y="317.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">pH &lt; 7,2</text><text x="305.5" y="333.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ou HCO₃⁻ &lt; 10</text><rect x="393.9" y="281.6" width="109.7" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="448.8" y="302.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Grave</text><text x="448.8" y="317.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">pH &lt; 7,1</text><text x="448.8" y="333.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">ou HCO₃⁻ &lt; 5</text><rect x="198.3" y="396.5" width="207.3" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="302" y="417.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Reidratação cuidadosa</text><text x="302" y="432.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">sem bolus excessivos de fluido</text><rect x="118.2" y="496.2" width="157.1" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="196.8" y="516.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Insulina regular EV</text><text x="196.8" y="532.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">0,05–0,1 U/kg/h</text><text x="196.8" y="547.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">após início da volemia</text><rect x="305.3" y="503.8" width="180.5" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="395.6" y="524.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Potássio</text><text x="395.6" y="540.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">reposição e monitorização</text><rect x="212.5" y="611.1" width="179" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="302" y="631.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Risco: edema cerebral</text><text x="302" y="647.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">principal causa de morte</text><text x="302" y="662.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">na CAD pediátrica</text><line x1="391.5" y1="643.6" x2="591.9" y2="643.6" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="591.9" y="603.5" width="170" height="80.1" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="599.9" y="619.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Evitar quedas rápidas de</text><text x="599.9" y="632.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">glicemia/osmolaridade e</text><text x="599.9" y="646.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">bolus excessivos; vigiar</text><text x="599.9" y="659.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">cefaleia e alteração de</text><text x="599.9" y="673" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">consciência</text><text x="26.1" y="702.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Gravidade definida pela acidose (pH venoso; HCO₃⁻: bicarbonato, mmol/L).</text></svg>