t-size="10.5" fill="#1f2f45" text-anchor="start">perdedora de sal (17-OHP e</text><text x="520.8" y="614.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">eletrólitos)</text><text x="76" y="858.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Dourado: via androgênica. Vermelho ⊣: ponto do defeito no DDS 46,XY.</text></svg>