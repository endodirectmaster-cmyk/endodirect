<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 341.56" width="640" height="341.56" role="img" aria-label="HAC por 21-hidroxilase: quando cada forma se apresenta"><title>HAC por 21-hidroxilase: quando cada forma se apresenta</title><defs><marker id="fngenitahac-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fngenitahac-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fngenitahac-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fngenitahac-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="638" height="339.56" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="320" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">HAC por 21-hidroxilase: quando cada forma se apresenta</text><text x="320" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Da genitália atípica ao nascer à forma não clássica no adulto (escala de idade não proporcional)</text><rect x="50" y="175.3" width="270" height="14" rx="4" fill="#c0392b" fill-opacity=".85"/><text x="185" y="206.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">Forma clássica</text><rect x="384.8" y="175.3" width="205.2" height="14" rx="4" fill="#d9b652" fill-opacity=".85"/><text x="487.4" y="206.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#d9b652" text-anchor="middle">Forma não clássica</text><line x1="40" y1="182.32" x2="600" y2="182.32" stroke="#0b2545" stroke-width="2.5" marker-end="url(#fngenitahac-as)"/><circle cx="50" cy="182.32" r="6" fill="#ffffff" stroke="#0b2545" stroke-width="2.5"/><line x1="50" y1="176.3" x2="105" y2="162.3" stroke="#0b2545" stroke-width="1.2"/><rect x="20" y="81" width="170" height="81.3" rx="8" fill="#0b2545" stroke="#0b2545" stroke-width="1.2"/><text x="105" y="96.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Nascimento</text><text x="105" y="111.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#e9eef7" text-anchor="middle">Menina: genitália ambígua</text><text x="105" y="125.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#e9eef7" text-anchor="middle">(HAC até prova em contrário).</text><text x="105" y="139.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#e9eef7" text-anchor="middle">Menino: fenotipicamente</text><text x="105" y="153.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#e9eef7" text-anchor="middle">normal</text><circle cx="136.4" cy="182.32" r="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/><line x1="136.4" y1="188.3" x2="136.4" y2="232.3" stroke="#2e7d32" stroke-width="1.2"/><rect x="51.4" y="232.3" width="170" height="53.2" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.2"/><text x="136.4" y="248.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1b5e20" text-anchor="middle">Triagem neonatal</text><text x="136.4" y="262.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">17-OH-progesterona: permite</text><text x="136.4" y="276.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">tratar antes da crise</text><circle cx="228.2" cy="182.32" r="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/><line x1="228.2" y1="176.3" x2="281" y2="162.3" stroke="#c0392b" stroke-width="1.2"/><rect x="196" y="81" width="170" height="81.3" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="1.2"/><text x="281" y="96.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#8b1e14" text-anchor="middle">2ª–3ª semana</text><text x="281" y="111.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">Crise perdedora de sal:</text><text x="281" y="125.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">vômitos, desidratação,</text><text x="281" y="139.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">hiponatremia, hipercalemia,</text><text x="281" y="153.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">hipoglicemia, choque</text><circle cx="320" cy="182.32" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><line x1="320" y1="188.3" x2="320" y2="232.3" stroke="#2563eb" stroke-width="1.2"/><rect x="235" y="232.3" width="170" height="67.2" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.2"/><text x="320" y="248.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Lactância</text><text x="320" y="262.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">Hidrocortisona +</text><text x="320" y="276.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">fludrocortisona e sal em todo</text><text x="320" y="290.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">lactente com HAC clássica</text><circle cx="460.4" cy="182.32" r="6" fill="#ffffff" stroke="#b7791f" stroke-width="2.5"/><line x1="460.4" y1="176.3" x2="460.4" y2="162.3" stroke="#b7791f" stroke-width="1.2"/><rect x="375.4" y="81" width="170" height="81.3" rx="8" fill="#fff4d6" stroke="#b7791f" stroke-width="1.2"/><text x="460.4" y="96.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#7c4a03" text-anchor="middle">Infância tardia e</text><text x="460.4" y="111.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#7c4a03" text-anchor="middle">adolescência</text><text x="460.4" y="126.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">Pubarca precoce, idade</text><text x="460.4" y="140.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">óssea avançada, hirsutismo,</text><text x="460.4" y="154.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">acne, sem perda de sal</text><circle cx="590" cy="182.32" r="6" fill="#ffffff" stroke="#5b6f88" stroke-width="2.5"/><line x1="590" y1="188.3" x2="535" y2="232.3" stroke="#5b6f88" stroke-width="1.2"/><rect x="450" y="232.3" width="170" height="67.2" rx="8" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/><text x="535" y="248.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f2f45" text-anchor="middle">Vida adulta</text><text x="535" y="262.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">Não clássica achada ao</text><text x="535" y="276.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">investigar hiperandrogenismo</text><text x="535" y="290.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">ou SOP</text></svg>