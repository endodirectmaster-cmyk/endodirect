<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 746 502.15999999999997" width="746" height="502.15999999999997" role="img" aria-label="Hipotireoidismo congênito: onde está o defeito e o que a triagem vê"><title>Hipotireoidismo congênito: onde está o defeito e o que a triagem vê</title><defs><marker id="focongenito-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="focongenito-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="focongenito-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="focongenito-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="744" height="500.15999999999997" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="373" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Hipotireoidismo congênito: onde está o defeito e o que a triagem vê</text><text x="373" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">A forma central escapa da triagem baseada só em TSH</text><path d="M373,116.6 C373,145.5 189.4,145.5 189.4,174.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#focongenito-ag)"/><path d="M373,116.6 C373,141.6 352.8,141.6 352.8,166.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#focongenito-ag)"/><path d="M373,116.6 C373,145.5 536.5,145.5 536.5,174.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#focongenito-ag)"/><path d="M189.4,223.9 C189.4,256.6 86.6,256.6 86.6,289.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#focongenito-ag)"/><path d="M352.8,231.6 C352.8,256.6 269.9,256.6 269.9,281.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#focongenito-ag)"/><path d="M352.8,231.6 C352.8,256.6 468.7,256.6 468.7,281.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#focongenito-ag)"/><path d="M536.5,223.9 C536.5,252.7 647.3,252.7 647.3,281.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#focongenito-ag)"/><path d="M86.6,338.9 C86.6,367.7 174.7,367.7 174.7,396.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#focongenito-ag)"/><path d="M269.9,346.6 C269.9,371.5 388.3,371.5 388.3,396.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#focongenito-ag)"/><path d="M468.7,346.6 C468.7,371.5 388.3,371.5 388.3,396.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#focongenito-ag)"/><path d="M647.3,346.6 C647.3,371.5 586.6,371.5 586.6,396.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#focongenito-ag)"/><rect x="265.7" y="67" width="214.6" height="49.6" rx="24.805" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="373" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Hipotireoidismo congênito</text><text x="373" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ao nascer: sutil ou ausente</text><rect x="138" y="174.3" width="102.7" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="189.4" y="195" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Hipófise</text><text x="189.4" y="210.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">falta de TSH</text><rect x="270.7" y="166.6" width="164.2" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="352.8" y="187.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Tireoide</text><text x="352.8" y="202.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">defeito na glândula</text><text x="352.8" y="218.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">ou na síntese hormonal</text><rect x="464.9" y="174.3" width="143" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="536.5" y="195" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Fatores externos</text><text x="536.5" y="210.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">maternos ou iodo</text><rect x="26.1" y="289.3" width="121.1" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="86.6" y="310" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Central (raro)</text><text x="86.6" y="325.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hipopituitarismo</text><rect x="177.2" y="281.6" width="185.4" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="269.9" y="302.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Disgenesia</text><text x="269.9" y="317.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">agenesia, hipoplasia</text><text x="269.9" y="333.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ou ectopia (a mais comum)</text><rect x="392.6" y="281.6" width="152.2" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="468.7" y="302.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Disormonogênese</text><text x="468.7" y="317.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">defeito de síntese</text><text x="468.7" y="333.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">pode dar bócio</text><rect x="574.8" y="281.6" width="145.1" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="647.3" y="302.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Transitório</text><text x="647.3" y="317.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">iodo, anticorpos</text><text x="647.3" y="333.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ou drogas maternas</text><rect x="76" y="396.5" width="197.4" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="174.7" y="417.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">TSH normal ou baixo</text><text x="174.7" y="432.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">escapa à triagem só por TSH</text><rect x="303.4" y="396.5" width="169.8" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="388.3" y="417.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Permanente primário</text><text x="388.3" y="432.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">levotiroxina precoce</text><rect x="503.2" y="396.5" width="166.8" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="586.6" y="417.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Pode ser passageiro</text><text x="586.6" y="432.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">reavaliar após ~3 anos</text><text x="26.1" y="472.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Central: suspeitar em defeitos de linha média, hipoglicemia, micropênis ou icterícia colestática.</text></svg>