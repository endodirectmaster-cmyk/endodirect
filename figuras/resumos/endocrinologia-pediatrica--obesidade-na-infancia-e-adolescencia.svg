<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 287.65" width="784" height="287.65" role="img" aria-label="A régua do IMC muda aos 5 anos: diga a idade antes do número"><title>A régua do IMC muda aos 5 anos: diga a idade antes do número</title><defs><marker id="folescencia-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="folescencia-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="folescencia-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="folescencia-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="782" height="285.65" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="392" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">A régua do IMC muda aos 5 anos: diga a idade antes do número</text><text x="392" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Escore-Z do IMC pelas curvas da OMS, padrão diagnóstico primário no Brasil</text><rect x="24" y="67" width="236" height="174.7" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M24,79 Q24,67 36,67 H248 Q260,67 260,79 V93.9 H24 Z" fill="#2563eb"/><text x="142" y="85.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Menor de 5 anos (OMS 2006)</text><text x="36" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2