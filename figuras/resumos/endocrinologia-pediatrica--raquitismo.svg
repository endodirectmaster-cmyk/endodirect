<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 663.2249999999999" width="745" height="663.2249999999999" role="img" aria-label="Duas vias para o raquitismo: falta de vitamina D ou perda de fosfato"><title>Duas vias para o raquitismo: falta de vitamina D ou perda de fosfato</title><defs><marker id="fraquitismo-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fraquitismo-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fraquitismo-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fraquitismo-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="743" height="661.2249999999999" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="372.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Duas vias para o raquitismo: falta de vitamina D ou perda de fosfato</text><text x="372.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">As duas convergem no fósforo baixo e na fise mal mineralizada</text><text x="78.8" y="103.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Causa</text><text x="78.8" y="222.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Mediador</text><text x="78.8" y="334.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Laboratório</text><text x="78.8" y="453.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Osso</text><text x="78.8" y="579.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Clínica</text><path d="M225.6,132 C225.6,163 213.5,163 213.5,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fraquitismo-ag)"/><path d="M448.4,124.3 C448.4,159.1 441.7,159.1 441.7,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fraquitismo-ag)"/><path d="M213.5,243.6 C213.5,274.6 196.5,274.6 196.5,305.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fraquitismo-ag)"/><path d="M441.7,243.6 C441.7,274.6 420,274.6 420,305.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fraquitismo-ag)"/><path d="M196.5,355.2 C196.5,390 220.4,390 220.4,424.9" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#fraquitismo-as)"/><path d="M196.5,355.2 C196.5,386.2 444.1,386.2 444.1,417.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fraquitismo-ag)"/><path d="M420,355.2 C420,386.2 444.1,386.2 444.1,417.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fraquitismo-ag)"/><path d="M444.1,482.2 C444.1,513.2 321.9,513.2 321.9,544.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fraquitismo-ag)"/><rect x="114.1" y="67" width="223.1" height="65" rx="32.485" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="225.6" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Deficiência de vitamina D</text><text x="225.6" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">pouco sol, pele escura</text><text x="225.6" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">aleitamento sem suplementação</text><rect x="367.2" y="74.7" width="162.5" height="49.6" rx="24.805" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="448.4" y="95.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Excesso de FGF23</text><text x="448.4" y="111" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ligado ao X (PHEX)</text><rect x="108.7" y="194" width="209.6" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="213.5" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">PTH alto</text><text x="213.5" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">mantém o cálcio normal-baixo</text><rect x="348.3" y="194" width="186.8" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="441.7" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Rim</text><text x="441.7" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">fosfatúria; 1,25-OH-D baixa</text><rect x="113.4" y="305.6" width="166.3" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="196.5" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Calciopênico</text><text x="196.5" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">P baixo, 25-OH-D baixa</text><rect x="309.7" y="305.6" width="220.7" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="420" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Fosfopênico</text><text x="420" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">P baixo; PTH e 25-OH-D normais</text><rect x="113.2" y="424.9" width="214.4" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="220.4" y="445.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hipocalcemia</text><text x="220.4" y="461.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">tetania ou convulsão no lactente</text><rect x="357.6" y="417.2" width="172.9" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="444.1" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Placa de crescimento</text><text x="444.1" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">mineralização deficiente</text><text x="444.1" y="468.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">fosfatase alcalina alta</text><rect x="189.3" y="544.2" width="265.3" height="63.1" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="203.3" y="564.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Sinais e radiografia</text><text x="203.3" y="579.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• punhos largos, rosário, pernas arqueadas</text><text x="203.3" y="594.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• RX: metáfises em taça, desfiadas</text><rect x="186" y="155" width="67" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="219.6" y="167" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">secundário</text><rect x="172.4" y="382" width="72.2" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="208.5" y="394" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">forma grave</text><line x1="530.6" y1="449.7" x2="549.1" y2="449.7" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="549.1" y="423" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="557.1" y="438.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Fosfatase alcalina baixa</text><text x="557.1" y="452.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">com clínica parecida sugere</text><text x="557.1" y="465.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">hipofosfatasia</text><text x="108.7" y="633.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Esquerda: via calciopênica (a mais comum). Direita: via fosfopênica. Tracejado: complicação.</text></svg>