<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 754 336.69" width="754" height="336.69" role="img" aria-label="Escada do tratamento da obesidade na criança e no adolescente"><title>Escada do tratamento da obesidade na criança e no adolescente</title><defs><marker id="folescencia-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="folescencia-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="folescencia-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="folescencia-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="752" height="334.69" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="377" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Escada do tratamento da obesidade na criança e no adolescente</text><text x="377" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Remédio e cirurgia somam-se ao estilo de vida; nunca o substituem</text><rect x="24" y="280.7" width="160" height="0" fill="#e2e8f0" fill-opacity=".55"/><rect x="24" y="187" width="160" height="93.7" rx="10" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="104" y="206.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Estilo de vida</text><text x="104" y="222.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">base mantida sempre</text><text x="104" y="237.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">≥ 26 h de contato</text><text x="104" y="253" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">em até 12 meses</text><path d="M187,233.8 L202,193.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#folescencia-ag)"/><rect x="206" y="240.7" width="160" height="40" fill="#e2e8f0" fill-opacity=".55"/><rect x="206" y="147" width="160" height="93.7" rx="10" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="286" y="166.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Farmacoterapia</text><text x="286" y="182.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">arGLP-1 a partir dos</text><text x="286" y="197.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">12 anos; off-label é</text><text x="286" y="213" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">alternativa real</text><path d="M369,193.8 L384,153.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#folescencia-ag)"/><rect x="388" y="200.7" width="160" height="80" fill="#e2e8f0" fill-opacity=".55"/><rect x="388" y="107" width="160" height="93.7" rx="10" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="468" y="126.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Resposta em 6</text><text x="468" y="143" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">meses</text><text x="468" y="158.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">IMC caiu &lt; 5%: trocar,</text><text x="468" y="173.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">associar ou</text><text x="468" y="189.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">descontinuar</text><path d="M551,153.8 L566,113.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#folescencia-ag)"/><rect x="570" y="160.7" width="160" height="120" fill="#e2e8f0" fill-opacity=".55"/><rect x="570" y="67" width="160" height="93.7" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="650" y="86.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Cirurgia bariátrica</text><text x="650" y="102.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">16 a 18 anos;</text><text x="650" y="117.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">IMC ≥ 35 e comorbidade</text><text x="650" y="133" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">ou IMC ≥ 40 sem ela</text><line x1="24" y1="298.69" x2="730" y2="298.69" stroke="#5b6f88" stroke-width="1.5" marker-end="url(#folescencia-as)"/><text x="377" y="292.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-style="italic" fill="#5b6f88" text-anchor="middle">gravidade e falta de resposta</text></svg>