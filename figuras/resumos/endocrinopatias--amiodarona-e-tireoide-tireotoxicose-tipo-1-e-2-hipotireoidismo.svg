<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 538.16" width="780" height="538.16" role="img" aria-label="Amiodarona e tireoide: do iodo e do fármaco às quatro apresentações"><title>Amiodarona e tireoide: do iodo e do fármaco às quatro apresentações</title><defs><marker id="fireoidismo-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fireoidismo-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fireoidismo-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fireoidismo-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="778" height="536.16" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="390" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Amiodarona e tireoide: do iodo e do fármaco às quatro apresentações</text><text x="390" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Sobrecarga de iodo e ação da molécula explicam as quatro apresentações</text><path d="M390,132 C390,163 302.4,163 302.4,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M390,132 C390,163 488.7,163 488.7,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M302.4,243.6 C302.4,274.6 142,274.6 142,305.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M302.4,243.6 C302.4,274.6 312.4,274.6 312.4,305.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M488.7,243.6 C488.7,274.6 472.8,274.6 472.8,305.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M488.7,243.6 C488.7,274.6 645,274.6 645,305.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M142,355.2 C142,386.2 102.8,386.2 102.8,417.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M312.4,355.2 C312.4,386.2 293.8,386.2 293.8,417.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M472.8,355.2 C472.8,386.2 491.7,386.2 491.7,417.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M645,355.2 C645,386.2 679.7,386.2 679.7,417.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><rect x="291.4" y="67" width="197.3" height="65" rx="32.485" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="390" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Amiodarona</text><text x="390" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">~75 mg de iodo/comprimido</text><text x="390" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">meia-vida 40–100 dias</text><rect x="218.7" y="194" width="167.4" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="302.4" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Sobrecarga de iodo</text><text x="302.4" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">35 a 50× a necessidade</text><rect x="416.1" y="194" width="145.1" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="488.7" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Ação do fármaco</text><text x="488.7" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">semelhante a T4/T3</text><rect x="62.3" y="305.6" width="159.3" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="142" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Wolff-Chaikoff</text><text x="142" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">bloqueia organificação</text><rect x="251.6" y="305.6" width="121.6" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="312.4" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Jod-Basedow</text><text x="312.4" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">iodo ↑ síntese</text><rect x="403.2" y="305.6" width="139.2" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="472.8" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Inibe D1 e D2</text><text x="472.8" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">↓conversão T4→T3</text><rect x="572.3" y="305.6" width="145.3" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="645" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Toxicidade direta</text><text x="645" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">lise do tireócito</text><rect x="26" y="417.2" width="153.6" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="102.8" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Hipotireoidismo</text><text x="102.8" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">falha em escapar</text><text x="102.8" y="468.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">LT4; mantém a droga</text><rect x="209.6" y="417.2" width="168.4" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="293.8" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">TIA tipo 1</text><text x="293.8" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">Graves/bócio; Doppler ↑</text><text x="293.8" y="468.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">tiamazol ± perclorato</text><rect x="408" y="417.2" width="167.4" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="491.7" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Pseudo-TSHoma</text><text x="491.7" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">↑TSH ↑T4 ↓T3</text><text x="491.7" y="468.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">normaliza em ~3 meses</text><rect x="605.4" y="417.2" width="148.6" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="679.7" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">TIA tipo 2</text><text x="679.7" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">destrutiva; Doppler ↓</text><text x="679.7" y="468.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">prednisona</text><rect x="260.9" y="266.6" width="93" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="307.4" y="278.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">doença de base</text><rect x="441.6" y="378.2" width="81.3" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="482.2" y="390.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">D2 hipofisária</text><text x="26" y="508.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">HIA: áreas iodo-suficientes. TIA: iodo-deficientes; pode surgir meses após suspender. TSH é o marcador mais confiável.</text></svg>