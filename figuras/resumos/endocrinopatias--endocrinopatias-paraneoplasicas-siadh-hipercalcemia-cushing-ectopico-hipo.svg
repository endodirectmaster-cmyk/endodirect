<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 801 426.54999999999995" width="801" height="426.54999999999995" role="img" aria-label="Síndromes paraneoplásicas: do tumor ao mediador e à pista laboratorial"><title>Síndromes paraneoplásicas: do tumor ao mediador e à pista laboratorial</title><defs><marker id="ftopicohipo-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="ftopicohipo-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="ftopicohipo-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="ftopicohipo-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="799" height="424.54999999999995" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="400.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Síndromes paraneoplásicas: do tumor ao mediador e à pista laboratorial</text><text x="400.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Quatro síndromes clássicas, cada uma com um mediador e um achado que a denuncia</text><path d="M123.9,139.6 L123.9,209.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftopicohipo-ag)"/><path d="M293.2,147.3 L293.2,209.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftopicohipo-ag)"/><path d="M470.2,139.6 C470.2,174.5 463.5,174.5 463.5,209.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftopicohipo-ag)"/><path d="M658.2,139.6 L658.2,209.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftopicohipo-ag)"/><path d="M123.9,243.6 C123.9,274.6 113.3,274.6 113.3,305.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftopicohipo-ag)"/><path d="M293.2,243.6 C293.2,274.6 305.5,274.6 305.5,305.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftopicohipo-ag)"/><path d="M463.5,243.6 C463.5,274.6 492.5,274.6 492.5,305.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftopicohipo-ag)"/><path d="M658.2,243.6 C658.2,274.6 689.9,274.6 689.9,305.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#ftopicohipo-ag)"/><rect x="58.2" y="74.7" width="131.3" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="123.9" y="95.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">CPPC</text><text x="123.9" y="111" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">&gt;70% das SIADH</text><text x="123.9" y="126.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">tumorais</text><rect x="219.6" y="67" width="147.2" height="80.3" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="293.2" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Carcinomas</text><text x="293.2" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">escamoso: pulmão,</text><text x="293.2" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">cabeça/pescoço</text><text x="293.2" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">renal, mama, bexiga</text><rect x="396.8" y="74.7" width="146.9" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="470.2" y="95.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">CPPC, carcinoide</text><text x="470.2" y="111" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">TNE pancreático</text><text x="470.2" y="126.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">medular de tireoide</text><rect x="573.7" y="74.7" width="169.1" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="658.2" y="95.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Mesenquimal grande</text><text x="658.2" y="111" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">fibrosarcoma</text><text x="658.2" y="126.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">mesotelioma</text><rect x="75.9" y="209.3" width="96" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="123.9" y="230" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">ADH</text><rect x="245.2" y="209.3" width="96" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="293.2" y="230" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">PTHrP</text><rect x="415.5" y="209.3" width="96" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="463.5" y="230" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">ACTH</text><rect x="610.2" y="209.3" width="96" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="658.2" y="230" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">IGF-2</text><rect x="25.9" y="305.6" width="174.8" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="113.3" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">SIADH</text><text x="113.3" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">Na &lt;135, Osm urin. &gt;100</text><text x="113.3" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">ácido úrico &lt;4</text><rect x="230.7" y="305.6" width="149.7" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="305.5" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Hipercalcemia</text><text x="305.5" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">PTH suprimido (&lt;20)</text><text x="305.5" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">PTHrP elevado</text><rect x="410.4" y="305.6" width="164.2" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="492.5" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Cushing ectópico</text><text x="492.5" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">K baixo, ACTH elevado</text><text x="492.5" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sem gradiente petroso</text><rect x="604.6" y="305.6" width="170.6" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="689.9" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Hipoglicemia</text><text x="689.9" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">insulina e pept. C baixos</text><text x="689.9" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">IGF-2/IGF-1 &gt;10</text><rect x="84.1" y="266.6" width="69" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="118.6" y="278.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">retém água</text><rect x="251.4" y="266.6" width="95.9" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="299.4" y="278.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">~80% dos casos</text><rect x="430" y="266.6" width="95.9" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="478" y="278.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">&gt;90% dos casos</text><text x="25.9" y="396.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Efeito independe do tamanho tumoral e pode preceder o diagnóstico oncológico.</text></svg>