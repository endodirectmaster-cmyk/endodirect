a,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">cortisol e ACTH baixos</text><rect x="313.7" y="201.6" width="107" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="367.2" y="222.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Hipotálamo</text><text x="367.2" y="238" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">CRH</text><rect x="199.5" y="320.9" width="96" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="247.5" y="341.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Hipófise</text><text x="247.5" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">ACTH</text><rect x="26.2" y="432.6" width="204.5" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="128.5" y="453.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Fasciculada e reticular</text><text x="128.5" y="468.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">atrofia: ↓cortisol, ↓androgênios</text><rect x="260.7" y="432.6" width="208.1" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="364.7" y="453.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Glomerulosa poupada</text><text x="364.7" y="468.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">depende de angiotensina II e K</text><rect x="36.5" y="551.8" width="226.4" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="149.7" y="572.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">IA secundária/terciária</text><text x="149.7" y="588.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">na retirada abrupta ou no estresse</text><rect x="292.9" y="544.2" width="165.6" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="375.7" y="564.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Hipercalemia rara</text><text x="375.7" y="580.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">aldosterona preservada</text><text x="375.7" y="595.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">difere da IA primária</text><rect x="186.9" y="155" width="52.8" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="213.2" y="167" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">excesso</text><rect x="286.8" y="278.1" width="41.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="307.4" y="290.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">↓CRH</text><rect x="164.2" y="393.6" width="47.6" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="188" y="405.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">↓ACTH</text><line x1="295.5" y1="345.7" x2="482.8" y2="345.7" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="482.8" y="312.4" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="490.8" y="328.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Recuperação hierárquica:</text><text x="490.8" y="341.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">CRH/ACTH antes da</text><text x="490.8" y="355" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">adrenal; 6–12 meses ou</text><text x="490.8" y="368.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">mais</text><text x="26.2" y="635.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Barra vermelha: retroalimentação negativa do glicocorticoide. Cinza tracejado: a glomerulosa depende menos do ACTH.</text></svg>