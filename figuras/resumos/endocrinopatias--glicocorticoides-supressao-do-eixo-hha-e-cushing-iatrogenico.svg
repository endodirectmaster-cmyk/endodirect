<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 679 665.13" width="679" height="665.13" role="img" aria-label="Glicocorticoide exógeno, eixo HHA e Cushing iatrogênico"><title>Glicocorticoide exógeno, eixo HHA e Cushing iatrogênico</title><defs><marker id="fatrogenico-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fatrogenico-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fatrogenico-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fatrogenico-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="677" height="663.13" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="339.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Glicocorticoide exógeno, eixo HHA e Cushing iatrogênico</text><text x="339.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">O mesmo excesso gera Cushing nos tecidos e insuficiência adrenal na retirada</text><path d="M247.5,132 C247.5,163 179,163 179,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fatrogenico-ag)"/><path d="M247.5,132 C247.5,166.8 367.2,166.8 367.2,201.6" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="360.2" y1="201.6" x2="374.2" y2="201.6" stroke="#c0392b" stroke-width="3"/><path d="M247.5,132 C247.5,152 48.3,152 48.3,226.5 S247.5,300.9 247.5,320.9" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="240.5" y1="320.9" x2="254.5" y2="32