<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 815 517.52" width="815" height="517.52" role="img" aria-label="Lítio: três alvos endócrinos, três mecanismos, três condutas"><title>Lítio: três alvos endócrinos, três mecanismos, três condutas</title><defs><marker id="fidonefroge-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fidonefroge-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fidonefroge-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fidonefroge-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="813" height="515.52" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="407.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Lítio: três alvos endócrinos, três mecanismos, três condutas</text><text x="407.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Tireoide, paratireoide e ducto coletor renal: do mecanismo ao tratamento mantendo o lítio</text><text x="116.4" y="103.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Fármaco</text><text x="116.4" y="210.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Alvo e mecanismo</text><text x="116.4" y="318.1" font-family="-apple-system,