#5b6f88" text-anchor="start">hormônio livre (fração ativa)</text><rect x="28" y="408" width="764" height="43.9" rx="6" fill="#e8f0fe"/><rect x="28" y="408" width="3.5" height="43.9" rx="1.5" fill="#2563eb"/><text x="39" y="424.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#1f2f45" text-anchor="start"><tspan font-weight="700">Soluções práticas: </tspan>T4 livre; testosterona livre/biodisponível ou cálculo por SHBG + albumina;</text><text x="39" y="438.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#1f2f45" text-anchor="start">cálcio corrigido = Ca medido + 0,8 × (4 − albumina g/dL), ou cálcio iônico direto.</text></svg>