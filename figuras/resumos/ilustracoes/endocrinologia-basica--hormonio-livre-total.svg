fill="#0f172a" text-anchor="middle">Hormônio livre × total: quando a carreadora muda, o total engana</text><text x="410" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Só a fração livre é biologicamente ativa; ela continua sendo a leitura correta quando a proteína carreadora muda.</text><rect x="28" y="72" width="244" height="298" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="150" y="96" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#0b2545" text-anchor="middle">Carreadoras normais</text><text x="150" y="114" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle">situação de referência</text><rect x="44" y="138" width="212" height="120" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><ellipse cx="78" cy="168" rx="17" ry="11" fill="#efe9fe" stroke="#6d28d9" stroke-width="1.5"/><circle cx="78" cy="168" r="5" fill="#efc96a" stroke="#b7791f" stroke-width="1.4"/><ellipse cx="170" cy="168" rx="17" ry="11" fill="#efe9fe" stroke="#6d28d9" stroke-width="1.5"/><circle cx="170" cy="168" r="5" fill="#efc96a" stroke="#b7791f" stroke-width="1.4"/><ellipse cx="78" cy="236" rx="17" ry="11" fill="#efe9fe" stroke="#6d28d9" stroke-width="1.5"/><circle cx="78" cy="236" r="5" fill="#efc96a" stroke="#b7791f" stroke-width="1.4"/><ellipse cx="170" cy="236" rx="17" ry="11" fill="#efe9fe" stroke="#6d28d9" stroke-width="1.5"/><circle cx="170" cy="236" r="5" fill="#efc96a" stroke="#b7791f" stroke-width="1.4"/><circle cx="124" cy="202" r="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.3" stroke-dasharray="2.5 2"/><circle cx="124" cy="202" r="5" fill="#efc96a" stroke="#b7791f" stroke-width="1.4"/><circle cx="216" cy="202" r="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.3" stroke-dasharray="2.5 2"/><circle cx="216" cy="202" r="5" fill="#efc96a" strok