<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 384" width="820" height="384" role="img" aria-label="Modos de ação dos hormônios: endócrino, parácrino e autócrino"><title>Modos de ação dos hormônios: endócrino, parácrino e autócrino</title><defs><marker id="a-s" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="a-n" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#0b2545"/></marker><marker id="a-g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker><marker id="a-r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="a-b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2563eb"/></marker><marker id="a-p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#6d28d9"/></marker><marker id="a-t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#0f766e"/></marker><marker id="a-a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#b7791f"/></marker><marker id="i-r" markerWidth="12" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M3,1 L3,13" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/></marker></defs><rect x="1" y="1" width="818" height="382" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="410" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Modos de ação dos hormônios: endócrino, parácrino e autócrino</text><text x="410" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">O endócrino cai no sangue e age à distância; o parácrino age na célula vizinha; o autócrino, na própria célula que o secretou.</text><rect x="36" y="72" width="240" height="228" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="156" y="96" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#c0392b" text-anchor="middle">Endócrino</text><text x="156" y="114" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle">cai no sangue e age à distância</text><text x="156" y="286" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#1f2f45" text-anchor="middle">insulina do pâncreas no músculo</text><text x="92" y="140" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-style="italic" fill="#7c4a03" text-anchor="middle">pâncreas</text><ellipse cx="92" cy="170" rx="34" ry="20" fill="#fff4d6" stroke="#b7791f" stroke-width="1.8"/><circle cx="81.8" cy="172" r="6.4" fill="#eef0fb" stroke="#7c86c9" stroke-width="1.2"/><path d="M92,192 L92,226" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" marker-end="url(#a-a)"/><rect x="50" y="230" width="212" height="28" rx="14" fill="#fdecec" stroke="#e7a3a0" stroke-width="1.4"/><text x="72" y="248" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-style="italic" fill="#8b1e14" text-anchor="middle">sangue</text><circle cx="116" cy="247" r="4.6" fill="#c0392b" stroke="#ffffff" stroke-width="1"/><circle cx="142" cy="241" r="4.6" fill="#c0392b" stroke="#ffffff" stroke-width="1"/><circle cx="168" cy="247" r="4.6" fill="#c0392b" stroke="#ffffff" stroke-width="1"/><path d="M184,244 L250,244" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round" marker-end="url(#a-r)"/><text x="222" y="140" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-style="italic" fill="#1e40af" text-anchor="middle">músculo</text><ellipse cx="222" cy="170" rx="34" ry="20" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.8"/><circle cx="211.8" cy="172" r="6.4" fill="#eef0fb" stroke="#7c86c9" stroke-width="1.2"/><g transform="translate(232,189) rotate(180)"><path d="M-6,-1 L-6,-8 M6,-1 L6,-8 M-6,-1 Q0,4 6,-1" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/></g><path d="M232,228 L232,204" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round" marker-end="url(#a-r)"/><rect x="290" y="72" width="240" height="228" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="410" y="96" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">Parácrino</text><text x="410" y="114" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle">age na célula vizinha</text><text x="410" y="286" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#1f2f45" text-anchor="middle">somatostatina das células δ na ilhota</text><ellipse cx="410" cy="200" rx="108" ry="56" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/><text x="410" y="136" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-style="italic" fill="#5b6f88" text-anchor="middle">ilhota</text><ellipse cx="410" cy="200" rx="26" ry="22" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.8"/><circle cx="402.2" cy="202.2" r="7.04" fill="#eef0fb" stroke="#7c86c9" stroke-width="1.2"/><text x="417.3" y="204.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle">δ</text><ellipse cx="330" cy="200" rx="24" ry="20" fill="#eef2f7" stroke="#5b6f88" stroke-width="1.8"/><circle cx="322.8" cy="202" r="6.4" fill="#eef0fb" stroke="#7c86c9" stroke-width="1.2"/><text x="336.7" y="204.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5b6f88" text-anchor="middle">α</text><ellipse cx="490" cy="200" rx="24" ry="20" fill="#eef2f7" stroke="#5b6f88" stroke-width="1.8"/><circle cx="482.8" cy="202" r="6.4" fill="#eef0fb" stroke="#7c86c9" stroke-width="1.2"/><text x="496.7" y="204.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5b6f88" text-anchor="middle">β</text><circle cx="372" cy="186" r="4.6" fill="#0f766e" stroke="#ffffff" stroke-width="1"/><circle cx="448" cy="186" r="4.6" fill="#0f766e" stroke="#ffffff" stroke-width="1"/><path d="M382,200 L360,200" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#i-r)"/><path d="M438,200 L460,200" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#i-r)"/><text x="410" y="244" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-style="italic" fill="#8b1e14" text-anchor="middle">inibe as células α e β</text><rect x="544" y="72" width="240" height="228" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="664" y="96" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle">Autócrino</text><text x="664" y="114" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle">age na própria célula que o secretou</text><text x="664" y="286" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#1f2f45" text-anchor="middle">IGF-1 em alguns tumores</text><ellipse cx="664" cy="212" rx="52" ry="34" fill="#efe9fe" stroke="#6d28d9" stroke-width="1.8"/><circle cx="648.4" cy="215.4" r="10.88" fill="#eef0fb" stroke="#7c86c9" stroke-width="1.2"/><g transform="translate(690,182) rotate(26)"><path d="M-6,-1 L-6,-8 M6,-1 L6,-8 M-6,-1 Q0,4 6,-1" fill="none" stroke="#6d28d9" stroke-width="2.6" stroke-linecap="round"/></g><path d="M634,182 C624,130 704,122 696,166" fill="none" stroke="#6d28d9" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-p)"/><circle cx="638" cy="150" r="4.6" fill="#6d28d9" stroke="#ffffff" stroke-width="1"/><circle cx="666" cy="138" r="4.6" fill="#6d28d9" stroke="#ffffff" stroke-width="1"/><circle cx="692" cy="142" r="4.6" fill="#6d28d9" stroke="#ffffff" stroke-width="1"/><text x="664" y="262" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-style="italic" fill="#4c1d95" text-anchor="middle">célula tumoral</text><rect x="36" y="314" width="748" height="43.9" rx="6" fill="#e8f0fe"/><rect x="36" y="314" width="3.5" height="43.9" rx="1.5" fill="#2563eb"/><text x="47" y="330.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#1f2f45" text-anchor="start">A especificidade da resposta vem do receptor, não do hormônio: o T3 circula por todo o corpo, mas só produz efeito onde há receptor</text><text x="47" y="344.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#1f2f45" text-anchor="start">nuclear (TR).</text></svg>