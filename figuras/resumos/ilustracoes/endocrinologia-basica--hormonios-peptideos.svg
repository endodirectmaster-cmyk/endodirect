lvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#5b6f88" text-anchor="middle">+</text><text x="219" y="452" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-style="italic" fill="#1f2f45" text-anchor="middle">equimolares: uma insulina para cada peptídeo C</text><rect x="414" y="282" width="370" height="182" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="430" y="306" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="start">Meia-vida</text><text x="508" y="344" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="end">insulina</text><rect x="518" y="332" width="31.666666666666664" height="16" rx="4" fill="#2563eb"/><text x="557.7" y="344" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">~4–6 min</text><text x="508" y="376" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#9a4a06" text-anchor="end">peptídeo C</text><rect x="518" y="364" width="190" height="16" rx="4" fill="#ea7a12"/><text x="716" y="376" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">~30 min</text><text x="599" y="409" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#0b2545" text-anchor="middle">Dura mais que a insulina: o peptídeo C é o</text><text x="599" y="423.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#0b2545" text-anchor="middle">marcador da secreção endógena de insulina.</text><rect x="36" y="476" width="748" height="43.9" rx="6" fill="#f6f2e6"/><rect x="36" y="476" width="3.5" height="43.9" rx="1.5" fill="#d9b652"/><text x="47" y="492.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#1f2f45" text-anchor="start">Outros exemplos: POMC → ACTH + α/β-MSH + β-endorfina + β-lipotropina; pró-PTH → PTH(1–84); pró-glucagon, que gera GLP-1 no</text><text x="47" y="506.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#1f2f45" text-anchor="start">intestino.</text></svg>