t-anchor="middle">Peptídeo C: o marcador da secreção endógena de insulina</text><text x="410" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">As convertases clivam a pró-insulina em insulina e peptídeo C, equimolares; o peptídeo C tem meia-vida maior que a insulina.</text><rect x="36" y="84" width="366" height="196" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="52" y="108" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="start">Da pró-insulina à insulina</text><text x="107" y="130" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="middle">pró-insulina</text><path d="M86,140 L86,204" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/><path d="M128,154 L128,204" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/><path d="M86,210 C86,250 128,250 128,210" fill="none" stroke="#ea7a12" stroke-width="7" stroke-linecap="round"/><path d="M81,198 L91,216" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/><path d="M123,198 L133,216" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/><path d="M170,176 L222,176" fill="none" stroke="#5b6f88" stroke-width="2" stroke-linecap="round" marker-end="url(#a-s)"/><rect x="158.2" y="190" width="75.6" height="20" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1"/><text x="196" y="204" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#8b1e14" text-anchor="middle">PC1/3, PC2</text><path d="M248,146 L248,198" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/><path d="M268,158 L268,198" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/><text x="258" y="224" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">insulina</text><text x="292" y="182" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#5b6f88" text-anchor="middle">+</text><path d="M314,176 q10,-14 20,0 t20,0 t20,0" fill="none" stroke="#ea7a12" stroke-width="7" stroke-linecap="round"/><text x="344" y="224" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#9a4a06" text-anchor="middle">peptídeo C</text><text x="219" y="266" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#1f2f45" text-anchor="middle">equimolares: uma insulina para cada peptídeo C</text><rect x="414" y="84" width="370" height="196" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="430" y="108" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="start">Meia-vida</text><text x="508" y="146" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="end">insulina</text><rect x="518" y="134" width="31.7" height="16" rx="4" fill="#2563eb"/><text x="557.7" y="146" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">~4–6 min</text><text x="508" y="178" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#9a4a06" text-anchor="end">peptídeo C</text><rect x="518" y="166" width="190.0" height="16" rx="4" fill="#ea7a12"/><text x="716" y="178" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">~30 min</text><text x="599" y="215.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0b2545" text-anchor="middle">Dura mais que a insulina: o peptídeo C é o</text><text x="599" y="230.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0b2545" text-anchor="middle">marcador da secreção endógena de insulina.</text><rect x="36" y="294" width="748" height="206" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="52" y="318" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="start">Na prática: hipoglicemia com insulina alta</text><line x1="50" y1="444" x2="186" y2="444" stroke="#94a3b8" stroke-width="1.4"/><rect x="64" y="368" width="40" height="76" rx="4" fill="#2563eb"/><text x="84" y="360" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">alta</text><text x="84" y="460" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">insulina</text><rect x="134" y="432" width="40" height="12" rx="4" fill="#ea7a12"/><text x="154" y="424" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#9a4a06" text-anchor="middle">baixo/suprimido</text><text x="154" y="460" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#9a4a06" text-anchor="middle">peptídeo C</text><path d="M202,406 L238,406" fill="none" stroke="#5b6f88" stroke-width="2" stroke-linecap="round" marker-end="url(#a-s)"/><rect x="244" y="380" width="152" height="52" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="320" y="403" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#8b1e14" text-anchor="middle">insulina exógena</text><text x="320" y="417.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-s