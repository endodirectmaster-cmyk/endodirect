<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 606" width="820" height="606" role="img" aria-label="Transporte no sangue: só a fração livre é biologicamente ativa"><title>Transporte no sangue: só a fração livre é biologicamente ativa</title><defs><marker id="a-s" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="a-n" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#0b2545"/></marker><marker id="a-g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker><marker id="a-r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="a-b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2563eb"/></marker><marker id="a-p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#6d28d9"/></marker><marker id="a-t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#0f766e"/></marker><marker id="a-a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#b7791f"/></marker><marker id="i-r" markerWidth="12" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M3,1 L3,13" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/></marker></defs><rect x="1" y="1" width="818" height="604" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="410" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Transporte no sangue: só a fração livre é biologicamente ativa</text><text x="410" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Os hormônios lipossolúveis viajam ligados a carreadoras;</text><text x="410" y="67" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">o pool ligado é um reservatório que tampona oscilações e prolonga a meia-vida.</text><rect x="36" y="84" width="400" height="210" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="52" y="108" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="start">No sangue</text><rect x="52" y="120" width="252" height="158" rx="14" fill="#fdecec" stroke="#e7a3a0" stroke-width="1.4"/><text x="64" y="138" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#8b1e14" text-anchor="start">sangue</text><ellipse cx="92" cy="178" rx="15" ry="9" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.6"/><circle cx="100" cy="171" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><ellipse cx="140" cy="160" rx="15" ry="9" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.6"/><circle cx="148" cy="153" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><ellipse cx="124" cy="210" rx="15" ry="9" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.6"/><circle cx="132" cy="203" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><text x="118" y="239" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">pool ligado:</text><text x="118" y="253.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">reservatório</text><path d="M172,180 L214,180" fill="none" stroke="#5b6f88" stroke-width="2" stroke-linecap="round" marker-end="url(#a-s)"/><path d="M214,194 L172,194" fill="none" stroke="#5b6f88" stroke-width="2" stroke-linecap="round" marker-end="url(#a-s)"/><circle cx="238" cy="172" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><circle cx="254" cy="196" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><circle cx="234" cy="210" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><text x="246" y="239" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#7c4a03" text-anchor="middle">fração</text><text x="246" y="253.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#7c4a03" text-anchor="middle">livre</text><ellipse cx="376" cy="190" rx="44" ry="34" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.8"/><circle cx="386" cy="192" r="19" fill="#eef0fb" stroke="#7c86c9" stroke-width="1.4"/><ellipse cx="388" cy="192" rx="11" ry="9" fill="#efe9fe" stroke="#6d28d9" stroke-width="1.6"/><text x="388" y="196" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">R</text><path d="M266,190 L373,191" fill="none" stroke="#b7791f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-a)"/><text x="376" y="146" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#134e4a" text-anchor="middle">célula-alvo</text><text x="376" y="241" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1b5e20" text-anchor="middle">só a livre é</text><text x="376" y="255.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1b5e20" text-anchor="middle">biologicamente</text><text x="376" y="269.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1b5e20" text-anchor="middle">ativa</text><rect x="450" y="84" width="334" height="210" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="466" y="108" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="start">Carreadoras</text><text x="466" y="132" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="start">TBG</text><text x="582" y="132" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">tireoidianos (T4/T3)</text><text x="466" y="154" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="start">CBG/transcortina</text><text x="582" y="154" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">cortisol</text><text x="466" y="176" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="start">SHBG</text><text x="582" y="176" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">testosterona e estradiol</text><text x="466" y="198" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="start">DBP</text><text x="582" y="198" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">vitamina D</text><text x="466" y="220" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="start">albumina/TTR</text><text x="582" y="220" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">menor afinidade, alta capacidade</text><line x1="466" y1="238" x2="768" y2="238" stroke="#e2e8f0" stroke-width="1.2"/><text x="466" y="256" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1b5e20" text-anchor="start">Fração livre (a que age)</text><rect x="475" y="266" width="74" height="20" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1"/><text x="512" y="280" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1b5e20" text-anchor="middle">T4 ≈ 0,03%</text><rect x="565.8" y="266" width="108.3" height="20" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1"/><text x="620" y="280" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1b5e20" text-anchor="middle">testosterona ≈ 2%</text><rect x="682.5" y="266" width="81.1" height="20" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1"/><text x="723" y="280" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1b5e20" text-anchor="middle">cortisol ≈ 5%</text><text x="36" y="326" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0b2545" text-anchor="start">Regra de ouro: o que muda a carreadora muda o total, não o livre</text><text x="784" y="326" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="end">esquema fora de escala</text><rect x="36" y="340" width="240" height="204" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="156" y="364" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Carreadora normal</text><text x="156" y="382" font-family="-apple-system,