">constante por feedback</text><rect x="290" y="340" width="240" height="204" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="410" y="364" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">Carreadora ↑</text><text x="410" y="382" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle">gravidez, estrogênio/ACO</text><rect x="304" y="394" width="212" height="76" rx="12" fill="#fdecec" stroke="#e7a3a0" stroke-width="1.2"/><ellipse cx="334" cy="428" rx="15" ry="9" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.6"/><circle cx="342" cy="421" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><ellipse cx="374" cy="420" rx="15" ry="9" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.6"/><circle cx="382" cy="413" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><ellipse cx="414" cy="434" rx="15" ry="9" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.6"/><circle cx="422" cy="427" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><ellipse cx="354" cy="450" rx="15" ry="9" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.6"/><circle cx="362" cy="443" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><ellipse cx="394" cy="454" rx="15" ry="9" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.6"/><circle cx="402" cy="447" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><circle cx="462" cy="418" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><circle cx="482" cy="438" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><text x="472" y="462" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7c4a03" text-anchor="middle">livre</text><rect x="337.4" y="477.8" width="49.2" height="20.5" rx="10.3" fill="#e8f0fe" stroke="#2563eb" stroke-width="1"/><text x="362" y="492.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">total ↑</text><rect x="432.9" y="477.8" width="50.2" height="20.5" rx="10.3" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1"/><text x="458" y="492.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1b5e20" text-anchor="middle">livre =</text><text x="410" y="513" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">ex.: TBG ↑ → T4 total ↑,</text><text x="410" y="527.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">T4 livre normal</text><rect x="544" y="340" width="240" height="204" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="664" y="364" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Carreadora ↓</text><text x="664" y="382" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle">síndrome nefrótica (perda na urina)</text><rect x="558" y="394" width="212" height="76" rx="12" fill="#fdecec" stroke="#e7a3a0" stroke-width="1.2"/><ellipse cx="588" cy="428" rx="15" ry="9" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.6"/><circle cx="596" cy="421" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><circle cx="716" cy="418" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><circle cx="736" cy="438" r="5" fill="#b7791f" stroke="#ffffff" stroke-width="1"/><text x="726" y="462" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7c4a03" text-anchor="middle">livre</text><rect x="591.4" y="477.8" width="49.2" height="20.5" rx="10.3" fill="#fdecec" stroke="#c0392b" stroke-width="1"/><text x="616" y="492.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#8b1e14" text-anchor="middle">total ↓</text><rect x="686.9" y="477.8" width="50.2" height="20.5" rx="10.3" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1"/><text x="712" y="492.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1b5e20" text-anchor="middle">livre =</text><text x="664" y="513" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">ex.: T4 total e 25(OH)D</text><text x="664" y="527.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">total baixos</text><rect x="36" y="558" width="748" height="29.4" rx="6" fill="#e8f0fe"/><rect x="36" y="558" width="3.5" height="29.4" rx="1.5" fill="#2563eb"/><text x="47" y="574.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#1f2f45" text-anchor="start">Com a carreadora alterada, dose frações livres, cortisol salivar ou índices (ex.: testosterona livre calculada pela equação de Vermeulen).</text></svg>