<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-label="Imprinting genômico: a expressão depende da origem parental do alelo"><title>Imprinting genômico: a expressão depende da origem parental do alelo</title><defs><marker id="a-s" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="a-n" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#0b2545"/></marker><marker id="a-g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker><marker id="a-r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="a-b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2563eb"/></marker><marker id="a-p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#6d28d9"/></marker><marker id="a-t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#0f766e"/></marker><marker id="a-a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#b7791f"/></marker><marker id="i-r" markerWidth="12" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M3,1 L3,13" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/></marker></defs><rect x="1" y="1" width="818" height="518" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="410" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Imprinting genômico: a expressão depende da origem parental do alelo</text><text x="410" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Expressão monoalélica: só o alelo materno ou só o paterno é ativado.</text><text x="410" y="67" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">A doença aparece quando o alelo funcional é deletado ou mutado — o silenciado não compensa.</text><rect x="36" y="84" width="240" height="352" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="156" y="110" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0b2545" text-anchor="middle">O princípio</text><text x="156" y="128" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle">mecanismo epigenético</text><text x="52" y="158" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1b5e20" text-anchor="start">Expressão normal</text><rect x="52" y="168" width="112" height="16" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="108" y="180" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1b5e20" text-anchor="middle">alelo ativo</text><path d="M170,176 L196,176" fill="none" stroke="#2e7d32" stroke-width="2" stroke-linecap="round" marker-end="url(#a-g)"/><text x="200" y="180" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1b5e20" text-anchor="start">expressão</text><rect x="52" y="194" width="112" height="16" rx="8" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/><text x="108" y="206" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="middle">alelo silenciado</text><text x="52" y="234" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">um vem da mãe, o outro do pai</text><line x1="50" y1="252" x2="262" y2="252" stroke="#e2e8f0" stroke-width="1.2"/><text x="52" y="278" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#8b1e14" text-anchor="start">Doença</text><rect x="52" y="288" width="136" height="16" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="120" y="300" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#8b1e14" text-anchor="middle">deletado ou mutado</text><text x="196" y="300" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#8b1e14" text-anchor="start">sem</text><text x="196" y="314" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#8b1e14" text-anchor="start">expressão</text><rect x="52" y="314" width="112" height="16" rx="8" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/><text x="108" y="326" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="middle">alelo silenciado</text><text x="52" y="356" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" font-style="italic" fill="#8b1e14" text-anchor="start">o silenciado não compensa</text><rect x="290" y="84" width="240" height="352" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="410" y="110" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0b2545" text-anchor="middle">15q11-q13</text><text x="41