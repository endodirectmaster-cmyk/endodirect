ado</text><line x1="558" y1="280" x2="770" y2="280" stroke="#e2e8f0" stroke-width="1.2"/><rect x="560" y="298" width="100" height="16" rx="8" fill="#efe9fe" stroke="#6d28d9" stroke-width="1.5"/><rect x="668" y="298" width="100" height="16" rx="8" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><rect x="711" y="298" width="14" height="16" fill="#c0392b"/><path d="M714,302 L722,310 M722,302 L714,310" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/><text x="610" y="328" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">materno</text><text x="718" y="328" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#134e4a" text-anchor="middle">paterno</text><text x="560" y="346.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Pseudopseudo-</text><text x="560" y="361.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">hipoparatireoidismo</text><text x="560" y="377" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">só o fenótipo ósseo; cálcio e PTH</text><text x="560" y="391.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">normais</text><rect x="36" y="450" width="748" height="43.9" rx="6" fill="#e8f0fe"/><rect x="36" y="450" width="3.5" height="43.9" rx="1.5" fill="#2563eb"/><text x="47" y="466.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#1f2f45" text-anchor="start">Diagnóstico: análise de metilação (Prader-Willi, pseudo-hipoparatireoidismo).</text><text x="47" y="480.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,