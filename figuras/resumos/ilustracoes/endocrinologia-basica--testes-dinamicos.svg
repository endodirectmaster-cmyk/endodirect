<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-label="Testes basais e dinâmicos: suprimir o excesso, estimular a deficiência"><title>Testes basais e dinâmicos: suprimir o excesso, estimular a deficiência</title><defs><marker id="a-s" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="a-n" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#0b2545"/></marker><marker id="a-g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker><marker id="a-r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="a-b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2563eb"/></marker><marker id="a-p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#6d28d9"/></marker><marker id="a-t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#0f766e"/></marker><marker id="a-a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#b7791f"/></marker><marker id="i-r" markerWidth="12" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M3,1 L3,13" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/></marker></defs><rect x="1" y="1" width="818" height="498" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="410" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Testes basais e dinâmicos: suprimir o excesso, estimular a deficiência</text><text x="410" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">A dosagem basal serve quando o hormônio é estável; na zona cinzenta, o teste dinâmico decide.</text><text x="36" y="93" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Cortisol basal</text><text x="36" y="108" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="start">às 8 h</text><path d="M176,80 L370,80 L370,110 L176,110 A8,8 0 0 1 168,102 L168,88 A8,8 0 0 1 176,80 Z" fill="#fdecec" stroke="#c0392b" stroke-width="1.4"/><path d="M370,80 L600,80 L600,110 L370,110 Z" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/><path d="M600,80 L782,80 A8,8 0 0 1 790,88 L790,102 A8,8 0 0 1 782,110 L600,110 Z" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.4"/><text x="269" y="99" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#8b1e14" text-anchor="middle">sugere insuficiência adrenal</text><text x="485" y="99" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1f2f45" text-anchor="middle">zona cinzenta: teste dinâmico</text><text x="695" y="99" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1b5e20" text-anchor="middle">praticamente a exclui</text><line x1="370" y1="110" x2="370" y2="116" stroke="#1f2f45" stroke-width="1.2"/><text x="370" y="129" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1f2f45" text-anchor="middle">3 µg/dL</text><line x1="600" y1="110" x2="600" y2="116" stroke="#1f2f45" stroke-width="1.2"/><text x="600" y="129" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1f2f45" text-anchor="middle">15–18 µg/dL</text><rect x="28" y="150" width="374" height="330" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="215" y="174" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">Confirmar excesso → supressão</text><text x="215" y="192" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6f88" text-anchor="middle">se não suprime, é autônomo</text><path d="M72,316 L72,208" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#a-s)"/><path d="M72,316 L266,316" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#a-s)"/><text x="60" y="266" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="middle" transform="rotate(-90 60 262)">nível do hormônio</text><text x="150" y="332" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle">basal</text><text x="242" y="332" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle">após supressão</text><line x1="72" y1="282" x2="256" y2="282" stroke="#5b6f88" stroke-width="1.3" stroke-dasharray="5 4"/><text x="78" y="276" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">ponto de corte</text><path d="M150,226 L242,230" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/><circle cx="150" cy="226" r="4" fill="#c0392b"/><circle cx="242" cy="230" r="4.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.2"/><text x="276" y="227" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#8b1e14" text-anchor="start">autônomo:</text><text x="276" y="241" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#8b1e14" text-anchor="start">não suprime</text><path d="M150,234 L242,302" fill="none" stroke="#2e7d32" stroke-width="2.2" stroke-linecap="round"/><circle cx="150" cy="234" r="4" fill="#2e7d32"/><circle cx="242" cy="302" r="4.5" fill="#2e7d32" stroke="#ffffff" stroke-width="1.2"/><text x="276" y="299" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1b5e20" text-anchor="start">normal:</text><text x="276" y="313" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1b5e20" text-anchor="start">suprime</text><rect x="42" y="350" width="346" height="58" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><rect x="42" y="350" width="3.5" height="58" rx="1.5" fill="#c0392b"/><text x="55" y="368" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1f2f45" text-anchor="start">Dexametasona 1 mg às 23 h</text><text x="55" y="384" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">cortisol das 8 h &gt; 1,8 µg/dL (50 nmol/L):</text><text x="55" y="398.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">positivo para Cushing</text><rect x="42" y="416" width="346" height="58" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><rect x="42" y="416" width="3.5" height="58" rx="1.5" fill="#c0392b"/><text x="55" y="434" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1f2f45" text-anchor="start">TOTG com GH (75 g)</text><text x="55" y="450" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">nadir de GH &gt; 0,4 ng/mL (ensaios ultrassensíveis):</text><text x="55" y="464.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">não suprime → acromegalia</text><rect x="418" y="150" width="374" height="330" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="605" y="174" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">Confirmar deficiência → estímulo</text><text x="605" y="192" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6f88" text-anchor="middle">se não responde, há falência</text><path d="M462,316 L462,208" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#a-s)"/><path d="M462,316 L656,316" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#a-s)"/><text x="450" y="266" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="middle" transform="rotate(-90 450 262)">nível do hormônio</text><text x="540" y="332" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle">basal</text><text x="632" y="332" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle">após estímulo</text><line x1="462" y1="242" x2="646" y2="242" stroke="#5b6f88" stroke-width="1.3" stroke-dasharray="5 4"/><text x="468" y="236" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">ponto de corte</text><path d="M540,298 L632,222" fill="none" stroke="#2e7d32" stroke-width="2.2" stroke-linecap="round"/><circle cx="540" cy="298" r="4" fill="#2e7d32"/><circle cx="632" cy="222" r="4.5" fill="#2e7d32" stroke="#ffffff" stroke-width="1.2"/><text x="666" y="219" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1b5e20" text-anchor="start">normal:</text><text x="666" y="233" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1b5e20" text-anchor="start">responde</text><path d="M540,306 L632,302" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/><circle cx="540" cy="306" r="4" fill="#c0392b"/><circle cx="632" cy="302" r="4.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.2"/><text x="666" y="299" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#8b1e14" text-anchor="start">falência:</text><text x="666" y="313" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#8b1e14" text-anchor="start">não responde</text><rect x="432" y="350" width="346" height="58" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><rect x="432" y="350" width="3.5" height="58" rx="1.5" fill="#2563eb"/><text x="445" y="368" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1f2f45" text-anchor="start">Cortrosina (ACTH sintético 250 µg IV/IM)</text><text x="445" y="384" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">cortisol aos 30–60 min &gt; 18–20 µg/dL:</text><text x="445" y="398.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">exclui insuficiência adrenal</text><rect x="432" y="416" width="346" height="58" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><rect x="432" y="416" width="3.5" height="58" rx="1.5" fill="#2563eb"/><text x="445" y="434" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1f2f45" text-anchor="start">ITT: padrão-ouro para os eixos GH e ACTH</text><text x="445" y="450" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">exige glicemia &lt; 40 mg/dL; resposta normal:</text><text x="445" y="464.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">GH &gt; 3–5 ng/mL e cortisol &gt; 18–20 µg/dL</text></svg>