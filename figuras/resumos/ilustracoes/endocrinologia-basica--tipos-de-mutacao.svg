-weight="700" fill="#0f172a" text-anchor="middle">Tipos de mutação: perda de função, ganho de função e dominante-negativo</text><text x="410" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">O raciocínio de prova segue a cadeia: fenótipo característico → gene → tipo de mutação (perda × ganho de função) → padrão de</text><text x="410" y="67" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">herança.</text><rect x="36" y="84" width="240" height="400" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="156" y="110" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#c0392b" text-anchor="middle">Perda de função</text><text x="156" y="128" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle">inativadora · costuma ser recessiva</text><rect x="64" y="144" width="80" height="16" rx="8" fill="#eef2f7" stroke="#5b6f88" stroke-width="1.5"/><rect x="97" y="144" width="14" height="16" fill="#c0392b"/><path d="M100,148 L108,156 M108,148 L100,156" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/><rect x="168" y="144" width="80" height="16" rx="8" fill="#eef2f7" stroke="#5b6f88" stroke-width="1.5"/><rect x="201" y="144" width="14" height="16" fill="#c0392b"/><path d="M204,148 L212,156 M212,148 L204,156" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/><text x="104" y="176" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8b1e14" text-anchor="middle">alelo mutante</text><text x="208" y="176" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8b1e14" text-anchor="middle">alelo mutante</text><path d="M104,188 L134,218" fill="none" stroke="#5b6f88" stroke-width="2" stroke-linecap="round" marker-end="url(#a-s)"/><path d="M208,188 L178,218" fill="none" stroke="#5b6f88" stroke-width="2" stroke-linecap="round" marker-end="url(#a-s)"/><ellipse cx="156" cy="248" rx="52" ry="24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/><text x="156" y="252" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-style="italic" fill="#94a3b8" text-anchor="middle">produto</text><text x="156" y="292" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8b1e14" text-anchor="middle">reduz quantidade/atividade</text><text x="156" y="318" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#8b1e14" text-anchor="middle">exige os dois alelos</text><text x="156" y="333.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#8b1e14" text-anchor="middle">comprometidos</text><line x1="50" y1="350" x2="262" y2="350" stroke="#e2e8f0" stroke-width="1.2"/><text x="50" y="368" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="start">Exemplos</text><text x="50" y="385" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">Enzima: CYP21A2 → HAC por</text><text x="50" y="399.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">deficiência de 21-hidroxilase</text><text x="50" y="420.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">Receptor: de andrógeno (ligado ao X) →</text><text x="50" y="434.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">insensibilidade androgênica</text><rect x="290" y="84" 