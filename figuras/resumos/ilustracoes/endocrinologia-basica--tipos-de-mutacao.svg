em,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="start">Exemplos</text><text x="558" y="385" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">Resistência ao hormônio tireoidiano β: o</text><text x="558" y="399.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">TRβ mutante bloqueia o TRβ normal →</text><text x="558" y="413.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">T4L/T3 elevados com TSH normal ou</text><text x="558" y="427.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="start">aumentado</text><rect x="36" y="498" width="748" height="43.9" rx="6" fill="#e8f0fe"/><rect x="36" y="498" width="3.5" height="43.9" rx="1.5" fill="#2563eb"/><text x="47" y="514.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#1f2f45" text-anchor="start">Sensor alterado — CaSR (sensor de cálcio da paratireoide e do rim): perda de função → hipercalcemia hipocalciúrica familiar (HHF);</text><text x="47" y="528.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#1f2f45" text-anchor="start">ganho de função → hipocalcemia autossômica dominante.</text></svg>