roke="#c0392b" stroke-width="1.5"/><text x="336.5" y="286.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Colesterol total e LDL altos</text><rect x="238.1" y="350.5" width="196.7" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="336.5" y="371.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Tratar a causa</text><text x="336.5" y="386.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">levotiroxina antes da estatina</text><text x="336.5" y="402.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">perfil melhora ou normaliza</text><text x="25.8" y="441.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Hipotireoidismo e nefrótica também elevam a Lp(a). Na nefrótica, a dislipidemia resolve com a proteinúria.</text></svg>