<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 649 842.27" width="649" height="842.27" role="img" aria-label="Da resistência insulínica à tríade: TG alto, HDL baixo, LDL denso"><title>Da resistência insulínica à tríade: TG alto, HDL baixo, LDL denso</title><defs><marker id="fecundarias-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fecundarias-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fecundarias-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fecundarias-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="647" height="840.27" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="324.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Da resistência insulínica à tríade: TG alto, HDL baixo, LDL denso</text><text x="324.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">As causas convergem para mais VLDL hepático e menos atividade da lipase lipoproteica</text><path d="M125.5,116.6 C125.5,147.6 145,147.6 145,178.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fecundarias-ag)"/><path d="M347,116.6 C347,147.6 145,147.6 145,178.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fecundarias-ag)"/><path d="M347,116.6 C347,151.5 332.4,151.5 332.4,186.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fecundarias-ag)"/><path d="M332.4,220.5 L332.4,290.2" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="325.4" y1="290.2" x2="339.4" y2="290.2" stroke="#c0392b" stroke-width="3"/><path d="M145,228.2 C145,248.2 214.1,248.2 214.1,322.7 S232.5,397.2 232.5,417.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fecundarias-ag)"/><path d="M332.4,355.2 C332.4,386.2 232.5,386.2 232.5,417.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fecundarias-ag)"/><path d="M232.5,451.4 L232.5,513.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fecundarias-ag)"/><path d="M232.5,563.1 L232.5,625.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fecundarias-ag)"/><path d="M232.5,674.7 C232.5,705.7 120.9,705.7 120.9,736.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fecundarias-ag)"/><path d="M232.5,674.7 C232.5,705.7 308,705.7 308,736.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fecundarias-ag)"/><rect x="26" y="67" width="199.1" height="49.6" rx="24.805" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="125.5" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Álcool e açúcar</text><text x="125.5" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">carboidrato refinado, frutose</text><rect x="255" y="67" width="184" height="49.6" rx="24.805" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="347" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Resistência insulínica</text><text x="347" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">obesidade, diabetes</text><rect x="60.1" y="178.6" width="169.9" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="145" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Fígado</text><text x="145" y="214.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">superprodução de VLDL</text><rect x="260" y="186.3" width="144.9" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="332.4" y="207" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">apoC-III elevada</text><rect x="240.1" y="290.2" width="184.7" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="332.4" y="310.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Lipase lipoproteica</text><text x="332.4" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">menor depuração de VLDL</text><text x="332.4" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">e quilomícrons</text><rect x="151.8" y="417.2" width="161.4" height="34.3" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="232.5" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hipertrigliceridemia</text><rect x="125.7" y="513.4" width="213.7" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="232.5" y="534.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">CETP mais ativa</text><text x="232.5" y="549.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">leva TG do VLDL ao HDL e LDL</text><rect x="152.5" y="625.1" width="160" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="232.5" y="645.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Lipase hepática</text><text x="232.5" y="661.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">remodela as partículas</text><rect x="60.4" y="736.7" width="121.1" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="120.9" y="757.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">HDL baixo</text><text x="120.9" y="773" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">encolhe (HDL3)</text><rect x="211.4" y="736.7" width="193.2" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="308" y="757.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">LDL pequeno e denso</text><text x="308" y="773" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">fenótipo B, mais aterogênico</text><rect x="315.1" y="247.4" width="34.6" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="332.4" y="259.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" class="lbl">inibe</text><line x1="313.2" y1="434.3" x2="453" y2="434.3" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="453" y="401" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="461" y="416.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Com predisposição</text><text x="461" y="430.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">genética, pode chegar à</text><text x="461" y="443.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">quilomicronemia e à</text><text x="461" y="457" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">pancreatite</text><text x="26" y="812.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Seta vermelha com barra: inibição. HDL baixo, TG alto e LDL denso formam a tríade da resistência insulínica.</text></svg>