font-size="11.5" fill="#1f2f45" text-anchor="start">• lipólise; efeito anti-insulínico</text><text x="45.9" y="446.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• ↑ gliconeogênese, ↓ captação muscular de glicose</text><rect x="373.2" y="403.3" width="106.9" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="426.7" y="424" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Fígado</text><text x="426.7" y="439.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">produz IGF-1</text><rect x="136.3" y="509.6" width="239.4" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="256" y="530.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">IGF-1</text><text x="256" y="545.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">exame de rastreio e de seguimento</text><rect x="162" y="609.2" width="188" height="63.1" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="176" y="629.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Ação via IGF-1</text><text x="176" y="644.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• mitogênica e antiapoptótica</text><text x="176" y="659.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• proliferação de condrócitos</text><rect x="161.5" y="722.3" width="188.9" height="65" rx="10" fill="#e6f4ea" stroke="#2e