ont-size="10.5" fill="#1f2f45" text-anchor="start">curativa</text><line x1="350.5" y1="754.8" x2="499.9" y2="754.8" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="499.9" y="728.1" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="507.9" y="743.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Antes do fechamento</text><text x="507.9" y="757.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">epifisário, o mesmo excesso</text><text x="507.9" y="770.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">causa gigantismo</text><text x="26.1" y="813.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Setas douradas: estímulo. Barra vermelha: bloqueio farmacológico.</text></svg>