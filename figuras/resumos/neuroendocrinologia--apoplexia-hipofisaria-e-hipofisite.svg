<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 826 776.74" width="826" height="776.74" role="img" aria-label="Apoplexia hipofisária: do infarto do adenoma às manifestações"><title>Apoplexia hipofisária: do infarto do adenoma às manifestações</title><defs><marker id="fhipofisite-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fhipofisite-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fhipofisite-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fhipofisite-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="824" height="774.74" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="413" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Apoplexia hipofisária: do infarto do adenoma às manifestações</text><text x="413" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Isquemia ou hemorragia aguda comprimem estruturas vizinhas e derrubam o ACTH</text><path d="M321,116.6 C321,147.6 235.2,147.6 235.2,178.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fhipofisite-ag)"/><path d="M321,116.6 C321,147.6 439.3,147.6 439.3,178.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fhipofisite-ag)"/><path d="M235.2,228.2 C235.2,259.2 321,259.2 321,290.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fhipofisite-ag)"/><path d="M439.3,228.2 C439.3,259.2 321,259.2 321,290.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fhipofisite-ag)"/><path d="M321,355.2 C321,386.2 109.7,386.2 109.7,417.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fhipofisite-ag)"/><path d="M321,355.2 C321,386.2 307.4,386.2 307.4,417.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fhipofisite-ag)"/><path d="M321,355.2 C321,386.2 518.7,386.2 518.7,417.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fhipofisite-ag)"/><path d="M518.7,466.8 L518.7,528.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fhipofisite-ag)"/><path d="M518.7,593.8 C518.7,624.8 321,624.8 321,655.8" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#fhipofisite-av)"/><rect x="213.1" y="67" width="215.8" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="321" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Adenoma hipofisário</text><text x="321" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">2 a 12% evoluem com apoplexia</text><rect x="131.9" y="178.6" width="206.6" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="235.2" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Isquemia</text><text x="235.2" y="214.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">expansão supera o suprimento</text><rect x="368.5" y="178.6" width="141.6" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="439.3" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Hemorragia</text><text x="439.3" y="214.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">fragilidade vascular</text><rect x="225.1" y="290.2" width="191.8" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="321" y="310.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Apoplexia</text><text x="321" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">infarto ou hemorragia aguda</text><text x="321" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">cefaleia súbita em trovoada</text><rect x="26.2" y="417.2" width="167" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="109.7" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Quiasma</text><text x="109.7" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">hemianopsia bitemporal</text><rect x="223.2" y="417.2" width="168.4" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="307.4" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Seio cavernoso</text><text x="307.4" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">oftalmoplegia (III, IV, VI)</text><rect x="421.7" y="417.2" width="194.1" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="518.7" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Queda de ACTH</text><text x="518.7" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">insuficiência adrenal aguda</text><rect x="427.1" y="528.8" width="183.3" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="518.7" y="549.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Maior ameaça à vida</text><text x="518.7" y="565.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hipotensão, choque</text><text x="518.7" y="580.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hiponatremia, hipoglicemia</text><rect x="213.5" y="655.8" width="215" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="321" y="676.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Glicocorticoide EV imediato</text><text x="321" y="692.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hidrocortisona 100 a 200 mg</text><text x="321" y="707.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">ou dexametasona 4 mg</text><rect x="395.1" y="616.8" width="49.5" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="419.9" y="628.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">tratar já</text><line x1="428.9" y1="91.8" x2="629.8" y2="91.8" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="629.8" y="58.5" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="637.8" y="74.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Desencadeantes: cirurgia,</text><text x="637.8" y="87.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">trauma craniano,</text><text x="637.8" y="101" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">radioterapia, anticoagulação</text><text x="637.8" y="114.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">e agonista dopaminérgico</text><line x1="416.9" y1="322.7" x2="629.8" y2="322.7" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="629.8" y="296.1" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="637.8" y="311.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Diagnóstico por RM; a TC</text><text x="637.8" y="325.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">pode ser normal nas</text><text x="637.8" y="338.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">primeiras horas</text><line x1="428.5" y1="688.3" x2="629.8" y2="688.3" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="629.8" y="661.6" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="637.8" y="677.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Não esperar exames.</text><text x="637.8" y="690.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Cirurgia só se rebaixamento</text><text x="637.8" y="704.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">ou perda visual importante</text><text x="26.2" y="746.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Setas douradas: sequência causal. Verde: conduta.</text></svg>