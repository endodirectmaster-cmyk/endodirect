="12" fill="#e9eef7" text-anchor="middle">sono, temperatura, sede</text><rect x="155.9" y="397.5" width="212.4" height="63.1" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="169.9" y="417.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Ao diagnóstico</text><text x="169.9" y="432.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• GH 75%, gonadotrofinas 40%</text><text x="169.9" y="447.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• ACTH e TSH 25%; DI 17 a 38%</text><rect x="398.3" y="396.5" width="226.8" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="511.7" y="417.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Obesidade hipotalâmica</text><text x="511.7" y="432.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">piora no pós-operatório</text><text x="511.7" y="448.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">estilo de vida + agonista de GLP-1</text><text x="25.9" y="487.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Cinza: frequência das deficiências ao diagnóstico.</text></svg>