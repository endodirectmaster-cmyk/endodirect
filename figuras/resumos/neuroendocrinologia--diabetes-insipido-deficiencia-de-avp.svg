<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 807 699.475" width="807" height="699.475" role="img" aria-label="Onde a ação da AVP falha: deficiência × resistência"><title>Onde a ação da AVP falha: deficiência × resistência</title><defs><marker id="fenciadeavp-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fenciadeavp-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fenciadeavp-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fenciadeavp-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="805" height="697.475" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="403.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Onde a ação da AVP falha: deficiência × resistência</text><text x="403.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Da neuro-hipófise ao ducto coletor; falha em qualquer ponto gera poliúria hipotônica</text><path d="M311.5,130.1 L311.5,180.1" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="304.5" y1="180.1" x2="318.5" y2="180.1" stroke="#c0392b" stroke-width="3"/><path d="M311.5,229.7 C311.5,266.2 299.8,266.2 299.8,302.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fenciadeavp-ag)"/><path d="M299.8,337 C299.8,373.5 311.5,373.5 311.5,410" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fenciadeavp-ag)"/><path d="M120.1,344.6 C120.1,377.3 311.5,377.3 311.5,410" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#fenciadeavp-av)"/><path d="M491.2,360 C491.2,385 311.5,385 311.5,410" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="304.5" y1="410" x2="318.5" y2="410" stroke="#c0392b" stroke-width="3"/><path d="M311.5,459.6 L311.5,509.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fenciadeavp-ag)"/><path d="M311.5,559.2 L311.5,609.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fenciadeavp-ag)"/><rect x="179.2" y="67" width="264.6" height="63.1" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="193.2" y="87.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Deficiência de AVP (central)</text><text x="193.2" y="102.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• cirurgia ou tumor selar, apoplexia, trauma</text><text x="193.2" y="116.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• hipofisite, infiltrativas, idiopático</text><rect x="202.5" y="180.1" width="218.1" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="311.5" y="200.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Hipotálamo e neuro-hipófise</text><text x="311.5" y="216.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">produzem e secretam AVP</text><rect x="26" y="295" width="188.2" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="120.1" y="315.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Desmopressina</text><text x="120.1" y="331.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">tratamento da forma central</text><rect x="244.3" y="302.7" width="111.2" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="299.8" y="323.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">AVP (ADH)</text><rect x="385.4" y="279.7" width="211.5" height="80.3" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="491.2" y="300.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Resistência à AVP</text><text x="491.2" y="316.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">(nefrogênico)</text><text x="491.2" y="332.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">lítio, hipercalcemia, hipocalemia</text><text x="491.2" y="347.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">doença renal, forma hereditária</text><rect x="251.1" y="410" width="120.8" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="311.5" y="430.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Ducto coletor</text><text x="311.5" y="446.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">receptor V2</text><rect x="225.5" y="509.6" width="172" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="311.5" y="530.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Aquaporinas</text><text x="311.5" y="545.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">reabsorção de água livre</text><rect x="235" y="609.2" width="153" height="34.3" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="311.5" y="629.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Urina concentrada</text><line x1="397.5" y1="534.4" x2="611" y2="534.4" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="611" y="501.1" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="619" y="516.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Sem ação da AVP: urina</text><text x="619" y="530.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">diluída, diurese acima de 50</text><text x="619" y="543.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">mL/kg em 24 horas, sede e</text><text x="619" y="557.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">polidipsia</text><line x1="388" y1="626.4" x2="611" y2="626.4" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="611" y="599.7" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="619" y="615.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Polidipsia primária: excesso</text><text x="619" y="628.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">de água ingerida; concentra</text><text x="619" y="642.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">com a restrição</text><text x="26" y="669.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Barra vermelha: onde cada forma bloqueia. Verde: após desmopressina, a urina concentra no central e não no nefrogênico.</text></svg>