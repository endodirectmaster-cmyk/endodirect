<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 638 908.4449999999999" width="638" height="908.4449999999999" role="img" aria-label="Freio dopaminérgico da prolactina e por que o excesso dá sintomas"><title>Freio dopaminérgico da prolactina e por que o excesso dá sintomas</title><defs><marker id="folactinoma-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="folactinoma-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="folactinoma-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="folactinoma-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="636" height="906.4449999999999" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="319" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Freio dopaminérgico da prolactina e por que o excesso dá</text><text x="319" y="54" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">sintomas</text><text x="319" y="73" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Perder a dopamina ou estimular o lactotrofo eleva a PRL; a PRL suprime o GnRH via kisspeptina</text><path d="M177.2,406 C177.2,437 319,437 319,468" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#folactinoma-ag)"/><path d="M197.7,146.3 C197.7,188.3 193.7,188.3 193.7,230.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#folactinoma-ag)"/><path d="M429.2,154 C429.2,192.2 193.7,192.2 193.7,230.4" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="186.7" y1="230.4" x2="200.7" y2="230.4" stroke="#c0392b" stroke-width="3"/><path d="M193.7,264.6 C193.7,302.8 438.7,302.8 438.7,341" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="431.7" y1="341" x2="445.7" y2="341" stroke="#c0392b" stroke-width="3"/><path d="M432.1,279 C432.1,310 438.7,310 438.7,341" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#folactinoma-av)"/><path d="M438.7,406 C438.7,437 319,437 319,468" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#folactinoma-ag)"/><path d="M319,502.3 C319,533.3 97.9,533.3 97.9,564.3" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="90.9" y1="564.3" x2="104.9" y2="564.3" stroke="#c0392b" stroke-width="3"/><path d="M319,502.3 C319,533.3 286.5,533.3 286.5,564.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#folactinoma-ag)"/><path d="M319,502.3 C319,533.3 507.6,533.3 507.6,564.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#folactinoma-ag)"/><path d="M97.9,613.9 L97.9,675.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#folactinoma-ag)"/><path d="M97.9,710.1 C97.9,741.1 319,741.1 319,772.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#folactinoma-ag)"/><rect x="72.5" y="341" width="209.4" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="177.2" y="361.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Fármacos</text><text x="177.2" y="377.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">antipsicóticos, metoclopramida,</text><text x="177.2" y="392.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">domperidona</text><rect x="102.5" y="96.7" width="190.4" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="197.7" y="117.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Hipotálamo</text><text x="197.7" y="133" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">células tuberoinfundibulares</text><rect x="322.9" y="89" width="212.6" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="429.2" y="109.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Efeito de haste</text><text x="429.2" y="125.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">massa selar corta a dopamina</text><text x="429.2" y="140.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">PRL em geral &lt; 100–150 ng/mL</text><rect x="95.6" y="230.4" width="196.2" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="193.7" y="251.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Dopamina (receptor D2)</text><rect x="321.8" y="216" width="220.5" height="63.1" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="335.8" y="236.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Estimulam a PRL</text><text x="335.8" y="251.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• Estrogênio: transcrição do gene</text><text x="335.8" y="265.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• TRH↑ no hipotireoidismo primário</text><rect x="311.9" y="341" width="253.6" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="438.7" y="361.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Lactotrofos (hipófise anterior)</text><text x="438.7" y="377.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">prolactinoma: secretor mais comum</text><text x="438.7" y="392.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">PRL &gt; 250 ng/mL: sugere prolactinoma</text><rect x="260.3" y="468" width="117.3" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="319" y="488.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Prolactina ↑</text><rect x="26" y="564.3" width="143.8" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="97.9" y="585" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Núcleo arqueado</text><text x="97.9" y="600.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">kisspeptina ↓</text><rect x="199.8" y="564.3" width="173.4" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="286.5" y="585" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Mama</text><text x="286.5" y="600.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">galactorreia (ação direta)</text><rect x="403.2" y="564.3" width="208.7" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="507.6" y="585" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Adrenais</text><text x="507.6" y="600.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">andrógenos ↑: acne, hirsutismo</text><rect x="31" y="675.9" width="133.8" height="34.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="97.9" y="696.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">GnRH pulsátil ↓</text><rect x="213.2" y="772.1" width="211.6" height="80.3" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="319" y="792.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Hipogonadismo</text><text x="319" y="809.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">hipogonadotrófico</text><text x="319" y="824.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">amenorreia, ↓libido, infertilidade</text><text x="319" y="840" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">prolongado → osteoporose</text><rect x="276.6" y="294.8" width="79.3" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="316.2" y="306.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" class="lbl">freio principal</text><text x="26" y="878.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Vermelho ⊣: inibição. Verde: estímulo. O hipogonadismo é central, não ação direta da PRL na gônada.</text></svg>