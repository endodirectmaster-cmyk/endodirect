<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 303.9" width="784" height="303.9" role="img" aria-label="Interações entre as reposições no hipopituitarismo"><title>Interações entre as reposições no hipopituitarismo</title><defs><marker id="ftuitarismo-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="ftuitarismo-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="ftuitarismo-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="ftuitarismo-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="782" height="301.9" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="392" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Interações entre as reposições no hipopituitarismo</text><text x="392" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">O que cada reposição faz nos outros eixos: a parte que decide a ordem</text><rect x="24" y="67" width="236" height="190.9" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M24,79 Q24,67 36,67 H248 Q260,67 260,79 V93.9 H24 Z" fill="#0b2545"/><text x="142" y="85.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Levotiroxina</text><text x="36" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="46" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">↓ Cortisol: pode precipitar crise</text><text x="46" y="129.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">adrenal</text><text x="36" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="46" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Mecanismo: ↑ 11β-HSD2 renal,</text><text x="46" y="167.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">catabolismo do cortisol</text><text x="36" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="46" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">↑ IGF-1</text><text x="36" y="212.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="46" y="212.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Tratar a insuficiência adrenal</text><text x="46" y="228.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">antes; monitorar o IGF-1 em</text><text x="46" y="244.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">quem repõe GH</text><rect x="274" y="67" width="236" height="190.9" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M274,79 Q274,67 286,67 H498 Q510,67 510,79 V93.9 H274 Z" fill="#d9b652"/><text x="392" y="85.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">GH</text><text x="286" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#d9b652" text-anchor="middle">•</text><text x="296" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">↓ Cortisol: ↓ 11β-HSD1 (cortisona</text><text x="296" y="129.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">→ cortisol)</text><text x="286" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#d9b652" text-anchor="middle">•</text><text x="296" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">↓ T4 livre: ativa a deiodinase tipo</text><text x="296" y="167.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">1 (T4 → T3)</text><text x="286" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#d9b652" text-anchor="middle">•</text><text x="296" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Tratar a insuficiência adrenal</text><text x="296" y="206.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">antes de iniciar GH</text><text x="286" y="228.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#d9b652" text-anchor="middle">•</text><text x="296" y="228.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Reajustar a levotiroxina 6</text><text x="296" y="244.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">semanas após iniciar GH</text><rect x="524" y="67" width="236" height="190.9" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M524,79 Q524,67 536,67 H748 Q760,67 760,79 V93.9 H524 Z" fill="#6d28d9"/><text x="642" y="85.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Estrogênio oral</text><text x="536" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6d28d9" text-anchor="middle">•</text><text x="546" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">↓ IGF-1: SOCS-2 bloqueia o GH</text><text x="546" y="129.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">no fígado</text><text x="536" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6d28d9" text-anchor="middle">•</text><text x="546" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">↓ T4 livre: ↑ TBG reduz as frações</text><text x="546" y="167.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">livres</text><text x="536" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6d28d9" text-anchor="middle">•</text><text x="546" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Mulher em uso de GH: preferir</text><text x="546" y="206.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">estrogênio transdérmico</text><text x="536" y="228.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6d28d9" text-anchor="middle">•</text><text x="546" y="228.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Se oral: considerar aumentar a</text><text x="546" y="244.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">dose de GH, não reduzir</text><text x="24" y="275.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-style="italic" fill="#5b6f88" text-anchor="start">Prioridade de reposição: corticotrófico → tireotrófico → gonadotrófico → somatotrófico.</text></svg>