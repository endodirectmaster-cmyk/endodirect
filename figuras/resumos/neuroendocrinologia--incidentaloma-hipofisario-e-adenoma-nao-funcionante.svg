<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 402.54999999999995" width="794" height="402.54999999999995" role="img" aria-label="Adenoma não funcionante: o que a massa comprime e o que isso produz"><title>Adenoma não funcionante: o que a massa comprime e o que isso produz</title><defs><marker id="funcionante-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="funcionante-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="funcionante-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="funcionante-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="792" height="400.54999999999995" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="397" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Adenoma não funcionante: o que a massa comprime e o que isso produz</text><text x="397" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Sem hipersecreção, o tumor se revela pelo efeito de massa — por isso o diagnóstico tende a ser tardio</text><path d="M397,132 C397,157 121.5,157 121.5,182" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#funcionante-ag)"/><path d="M397,132 C397,157 305.1,157 305.1,182" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#funcionante-ag)"/><path d="M397,132 C397,157 474.7,157 474.7,182" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#funcionante-ag)"/><path d="M397,132 C397,157 663.7,157 663.7,182" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#funcionante-ag)"/><path d="M121.5,231.6 L121.8,281.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#funcionante-ag)"/><path d="M305.1,231.6 C305.1,260.4 338.5,260.4 338.5,289.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#funcionante-ag)"/><path d="M474.7,231.6 C474.7,256.6 535.9,256.6 535.9,281.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#funcionante-ag)"/><path d="M663.7,231.6 C663.7,260.4 705.5,260.4 705.5,289.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#funcionante-ag)"/><rect x="283.4" y="67" width="227.1" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="397" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Adenoma não funcionante</text><text x="397" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">maioria de linhagem gonadotrófica</text><text x="397" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">sem síndrome de hipersecreção</text><rect x="39.4" y="182" width="164.2" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="121.5" y="202.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Quiasma óptico</text><text x="121.5" y="218.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">contato ou compressão</text><rect x="233.6" y="182" width="143" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="305.1" y="202.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Haste hipofisária</text><text x="305.1" y="218.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">compressão</text><rect x="406.6" y="182" width="136.1" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="474.7" y="202.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Hipófise normal</text><text x="474.7" y="218.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">compressão</text><rect x="572.7" y="182" width="181.9" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="663.7" y="202.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Seio cavernoso</text><text x="663.7" y="218.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">invasão: Knosp 3A, 3B e 4</text><rect x="25.8" y="281.6" width="192" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="121.8" y="302.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hemianopsia bitemporal</text><text x="121.8" y="317.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">neuro-oftalmo obrigatória</text><text x="121.8" y="333.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">mesmo sem queixa visual</text><rect x="247.9" y="289.3" width="181.2" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="338.5" y="310" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Hiperprolactinemia</text><text x="338.5" y="325.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">efeito haste, não secreção</text><rect x="459.1" y="281.6" width="153.7" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="535.9" y="302.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Hipopituitarismo</text><text x="535.9" y="317.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">GH → LH/FSH → TSH</text><text x="535.9" y="333.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">→ ACTH → prolactina</text><rect x="642.8" y="289.3" width="125.4" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="705.5" y="310" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Cura cirúrgica</text><text x="705.5" y="325.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">menos provável</text><text x="25.8" y="372.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Deficiência de AVP praticamente exclui adenoma: pensar em craniofaringioma, hipofisite ou metástase.</text></svg>