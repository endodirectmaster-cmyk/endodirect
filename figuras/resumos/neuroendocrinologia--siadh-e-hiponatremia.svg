<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 730.195" width="700" height="730.195" role="img" aria-label="SIADH: do ADH não suprimido à hiponatremia euvolêmica"><title>SIADH: do ADH não suprimido à hiponatremia euvolêmica</title><defs><marker id="fponatremia-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fponatremia-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fponatremia-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fponatremia-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="698" height="728.195" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="350" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">SIADH: do ADH não suprimido à hiponatremia euvolêmica</text><text x="350" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">O ADH segue agindo apesar do plasma hipotônico; o rim retém água livre e concentra a urina</text><path d="M296.9,130.1 L296.9,180.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fponatremia-ag)"/><path d="M296.9,214.3 L296.9,264.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fponatremia-ag)"/><path d="M296.9,313.9 C296.9,338.9 185.1,338.9 185.1,363.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fponatremia-ag)"/><path d="M296.9,313.9 C296.9,342.8 411.2,342.8 411.2,371.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fponatremia-ag)"/><path d="M185.1,444.3 C185.1,473.1 138.3,473.1 138.3,501.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fponatremia-ag)"/><path d="M411.2,436.6 C411.2,465.4 424.4,465.4 424.4,494.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fponatremia-ag)"/><path d="M424.4,559.2 L424.4,609.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fponatremia-ag)"/><path d="M507.9,404.1 H580 Q590,404.1 590,394.1 V207.2 Q590,197.2 580,197.2 H383.2" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#fponatremia-ar)"/><text x="596" y="304.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="start" class="lbl">não suprime</text><rect x="108.7" y="67" width="376.4" height="63.1" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="122.7" y="87.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Causas</text><text x="122.7" y="102.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• neoplasia (pequenas células do pulmão), SNC, pneumopatia</text><text x="122.7" y="116.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• fármacos (ISRS, carbamazepina), dor, náusea, pós-operatório</text><rect x="212.6" y="180.1" width="168.6" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="296.9" y="200.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">ADH não suprimido</text><rect x="235.3" y="264.3" width="123.2" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="296.9" y="285" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Rim</text><text x="296.9" y="300.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">retém água livre</text><rect x="85.9" y="363.9" width="198.5" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="185.1" y="384.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Urina inapropriadamente</text><text x="185.1" y="400.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">concentrada</text><text x="185.1" y="416.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">Osm urinária &gt; 100 mOsm/kg</text><text x="185.1" y="431.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">Na urinário &gt; 30 mEq/L</text><rect x="314.4" y="371.6" width="193.6" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="411.2" y="392.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Hiponatremia hipotônica</text><text x="411.2" y="408.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">euvolêmica</text><text x="411.2" y="424.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">ácido úrico e ureia baixos</text><rect x="25.8" y="501.9" width="225" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="138.3" y="522.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Salina isotônica pode piorar</text><text x="138.3" y="538.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">o rim excreta o sal e retém a água</text><rect x="280.8" y="494.3" width="287.2" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="424.4" y="515" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Diagnóstico de exclusão</text><text x="424.4" y="530.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">excluir hipotireoidismo e insuficiência adrenal</text><text x="424.4" y="545.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sem diurético, hipovolemia ou edema</text><rect x="334.7" y="609.2" width="179.4" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="424.4" y="629.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">SIADH crônico</text><text x="424.4" y="645.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">restrição hídrica (1ª linha)</text><text x="424.4" y="660.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">tratar a causa de base</text><text x="25.8" y="700.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Tracejado: o plasma hipotônico deveria suprimir o ADH; no SIADH, não suprime. Na SPCS há hipovolemia.</text></svg>