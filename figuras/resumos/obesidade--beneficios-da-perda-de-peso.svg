<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270.24" width="700" height="270.24" role="img" aria-label="DPP e DPPOS: o benefício precoce dura mesmo com reganho"><title>DPP e DPPOS: o benefício precoce dura mesmo com reganho</title><defs><marker id="ferdadepeso-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="ferdadepeso-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="ferdadepeso-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="ferdadepeso-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="698" height="268.24" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="350" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">DPP e DPPOS: o benefício precoce dura mesmo com reganho</text><text x="350" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">No DPPOS a incidência deixou de diferir: caiu nos outros braços, não houve rebote</text><rect x="50" y="161.2" width="114" height="14" rx="4" fill="#d9b652" fill-opacity=".85"/><text x="107" y="192.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#d9b652" text-anchor="middle">DPP</text><rect x="164" y="161.2" width="486" height="14" rx="4" fill="#0b2545" fill-opacity=".85"/><text x="407" y="192.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#0b2545" text-anchor="middle">DPPOS: todos recebem o currículo de estilo de vida</text><line x1="40" y1="168.24" x2="660" y2="168.24" stroke="#0b2545" stroke-width="2.5" marker-end="url(#ferdadepeso-as)"/><text x="660" y="218.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="end">anos desde a randomização</text><circle cx="50" cy="168.24" r="6" fill="#ffffff" stroke="#0b2545" stroke-width="2.5"/><line x1="50" y1="162.2" x2="83.5" y2="148.2" stroke="#0b2545" stroke-width="1.2"/><rect x="20" y="95.1" width="127" height="53.2" rx="8" fill="#0b2545" stroke="#0b2545" stroke-width="1.2"/><text x="83.5" y="110.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Início</text><text x="83.5" y="125.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#e9eef7" text-anchor="middle">3.234 adultos de alto</text><text x="83.5" y="139.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#e9eef7" text-anchor="middle">risco para DM2</text><circle cx="92" cy="168.24" r="6" fill="#ffffff" stroke="#d9b652" stroke-width="2.5"/><line x1="92" y1="162.2" x2="216.5" y2="148.2" stroke="#d9b652" stroke-width="1.2"/><rect x="153" y="81" width="127" height="67.2" rx="8" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.2"/><text x="216.5" y="96.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2545" text-anchor="middle">1 ano</text><text x="216.5" y="111.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">intensivo perde ~7 kg</text><text x="216.5" y="125.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">e depois reganha boa</text><text x="216.5" y="139.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">parte</text><circle cx="164" cy="168.24" r="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/><line x1="164" y1="162.2" x2="349.5" y2="148.2" stroke="#2e7d32" stroke-width="1.2"/><rect x="286" y="81" width="127" height="67.2" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.2"/><text x="349.5" y="96.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1b5e20" text-anchor="middle">2,8 anos</text><text x="349.5" y="111.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">diabetes −58% com</text><text x="349.5" y="125.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">estilo de vida, −31%</text><text x="349.5" y="139.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">com metformina</text><circle cx="452" cy="168.24" r="6" fill="#ffffff" stroke="#d9b652" stroke-width="2.5"/><line x1="452" y1="162.2" x2="482.5" y2="148.2" stroke="#d9b652" stroke-width="1.2"/><rect x="419" y="95.1" width="127" height="53.2" rx="8" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.2"/><text x="482.5" y="110.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2545" text-anchor="middle">10 anos</text><text x="482.5" y="125.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">intensivo ainda ~2 kg</text><text x="482.5" y="139.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">abaixo do basal</text><circle cx="650" cy="168.24" r="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/><line x1="650" y1="162.2" x2="616.5" y2="148.2" stroke="#2e7d32" stroke-width="1.2"/><rect x="553" y="81" width="127" height="67.2" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.2"/><text x="616.5" y="96.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1b5e20" text-anchor="middle">15 anos</text><text x="616.5" y="111.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">diabetes −27% (HR</text><text x="616.5" y="125.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">0,73), com perdas já</text><text x="616.5" y="139.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2f45" text-anchor="middle">equiparadas</text></svg>