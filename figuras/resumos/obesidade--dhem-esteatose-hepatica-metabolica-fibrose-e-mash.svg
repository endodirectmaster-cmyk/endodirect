5" stroke-width="1.5"/><text x="220.5" y="324.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">DHEM / MASLD</text><text x="220.5" y="340" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">esteatose em ≥ 5% dos</text><text x="220.5" y="355.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">hepatócitos</text><text x="220.5" y="370.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">+ ≥ 1 fator de disfunção metabólica</text><rect x="25.8" y="446" width="184" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="117.7" y="466.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Fora do fígado</text><text x="117.7" y="482.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">mortalidade CV 64% maior</text><text x="117.7" y="497.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">câncer extra-hepático 1,5×</text><rect x="239.7" y="453.7" width="175.5" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="327.5" y="474.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">MASH</text><text x="327.5" y="490" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">inflamação e balonização</text><rect x="35.8" y="573" width="191.1" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="131.