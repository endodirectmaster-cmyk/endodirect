<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 342.4" width="784" height="342.4" role="img" aria-label="Fármacos e peso: o que engorda, o que é neutro e o que reduz"><title>Fármacos e peso: o que engorda, o que é neutro e o que reduz</title><defs><marker id="forfarmacos-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="forfarmacos-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="forfarmacos-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="forfarmacos-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="782" height="340.4" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="392" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Fármacos e peso: o que engorda, o que é neutro e o que reduz</text><text x="392" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Por classe, para escolher a alternativa de eficácia equivalente</text><rect x="24" y="67" width="236" height="229.4" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M24,79 Q24,67 36,67 H248 Q260,67 260,79 V93.9 H24 Z" fill="#c0392b"/><text x="142" y="85.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Aumentam o peso</text><text x="36" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c0392b" text-anchor="middle">•</text><text x="46" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Insulina, sulfonilureias e</text><text x="46" y="129.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">glitazonas (até 10 kg)</text><text x="36" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c0392b" text-anchor="middle">•</text><text x="46" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Betabloqueadores tradicionais (↓</text><text x="46" y="167.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">taxa metabólica até 10%)</text><text x="36" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c0392b" text-anchor="middle">•</text><text x="46" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Valproato, gabapentina e</text><text x="46" y="206.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">pregabalina</text><text x="36" y="228.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c0392b" text-anchor="middle">•</text><text x="46" y="228.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Olanzapina, clozapina,</text><text x="46" y="244.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">paroxetina, mirtazapina e lítio</text><text x="36" y="267.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c0392b" text-anchor="middle">•</text><text x="46" y="267.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Medroxiprogesterona de depósito</text><text x="46" y="283.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">e corticoides</text><rect x="274" y="67" width="236" height="229.4" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M274,79 Q274,67 286,67 H498 Q510,67 510,79 V93.9 H274 Z" fill="#5b6f88"/><text x="392" y="85.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Neutros ou discretos</text><text x="286" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6f88" text-anchor="middle">•</text><text x="296" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Metformina, inibidores da DPP-4</text><text x="296" y="129.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">e acarbose</text><text x="286" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6f88" text-anchor="middle">•</text><text x="296" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">IECA, BRA e bloqueadores dos</text><text x="296" y="167.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">canais de cálcio</text><text x="286" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6f88" text-anchor="middle">•</text><text x="296" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Lamotrigina, levetiracetam e</text><text x="296" y="206.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">fenitoína</text><text x="286" y="228.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6f88" text-anchor="middle">•</text><text x="296" y="228.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Ziprasidona e aripiprazol</text><text x="286" y="250.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6f88" text-anchor="middle">•</text><text x="296" y="250.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Loratadina, o anti-H1 mais neutro</text><rect x="524" y="67" width="236" height="229.4" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M524,79 Q524,67 536,67 H748 Q760,67 760,79 V93.9 H524 Z" fill="#2e7d32"/><text x="642" y="85.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Reduzem o peso</text><text x="536" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle">•</text><text x="546" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Agonistas do receptor de GLP-1 e</text><text x="546" y="129.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">tirzepatida</text><text x="536" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle">•</text><text x="546" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Inibidores do SGLT2 (glicosúria)</text><text x="536" y="173.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle">•</text><text x="546" y="173.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Topiramato e zonisamida</text><text x="536" y="196.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle">•</text><text x="546" y="196.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Bupropiona (perda discreta)</text><text x="24" y="314.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-style="italic" fill="#5b6f88" text-anchor="start">Fluoxetina e sertralina reduzem o peso em uso inferior a 1 ano e o aumentam depois.</text></svg>