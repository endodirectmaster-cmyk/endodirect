0" fill="#1b5e20" text-anchor="middle">metabólicas</text><text x="673.7" y="373.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hipertrigliceridemia, ↓ HDL</text><text x="673.7" y="388.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">esteatose, ↑ transaminases</text><rect x="289.6" y="463.3" width="176" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="377.6" y="484" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Resistência insulínica</text><text x="377.6" y="499.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hiperglicemia sem cetose</text><rect x="495.6" y="463.3" width="191.8" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="591.5" y="484" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Pancreatite</text><text x="591.5" y="499.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">na hipertrigliceridemia grave</text><rect x="302.2" y="416.6" width="45.6" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="325" y="428.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">agrava</text><line x1="195.9" y1="361.1" x2="209.9" y2="361.1" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="25.9" y="334.5" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="33.9" y="350.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Metreleptina repõe a</text><text x="33.9" y="363.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">leptina: reduz fome, glicada,</text><text x="33.9" y="377" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">triglicerídeos e esteatose</text><line x1="195.9" y1="488.1" x2="289.6" y2="488.1" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="25.9" y="461.4" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="33.9" y="477.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Metformina é 1ª linha;</text><text x="33.9" y="490.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">insulina costuma exigir &gt; 2</text><text x="33.9" y="504" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">U/kg</text><text x="209.9" y="538.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Leptina baixa não serve como critério diagnóstico.</text></svg>