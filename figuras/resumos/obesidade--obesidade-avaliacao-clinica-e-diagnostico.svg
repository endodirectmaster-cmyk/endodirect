inal</text><text x="24" y="330" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-style="italic" fill="#5b6f88" text-anchor="start">No idoso, preferir TC/RM e DXA: a bioimpedância subestima a massa magra justamente nessa faixa.</text></svg>