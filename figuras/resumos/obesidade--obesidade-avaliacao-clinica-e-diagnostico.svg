<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 826 358" width="826" height="358" role="img" aria-label="Métodos de composição corporal: o que cada um mede e onde falha"><title>Métodos de composição corporal: o que cada um mede e onde falha</title><defs><marker id="fiagnostico-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fiagnostico-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fiagnostico-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fiagnostico-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="824" height="356" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="413" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Métodos de composição corporal: o que cada um mede e onde falha</text><text x="413" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">O IMC não distingue gordura de massa magra nem mostra a distribuição</text><rect x="24" y="67" width="184" height="245" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M24,79 Q24,67 36,67 H196 Q208,67 208,79 V92.6 H24 Z" fill="#d9b652"/><text x="116" y="84.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2545" text-anchor="middle">Bioimpedância</text><text x="36" y="110.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#d9b652" text-anchor="middle">•</text><text x="46" y="110.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">Portátil, barata, não</text><text x="46" y="125.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">operador-dependente</text><text x="36" y="146.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#d9b652" text-anchor="middle">•</text><text x="46" y="146.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">Não avalia VAT nem</text><text x="46" y="161.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">gordura ectópica</text><text x="36" y="182.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#d9b652" text-anchor="middle">•</text><text x="46" y="182.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">Depende da hidratação;</text><text x="46" y="197.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">ângulo de fase menor =</text><text x="46" y="212.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">pior prognóstico</text><text x="36" y="233.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#d9b652" text-anchor="middle">•</text><text x="46" y="233.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">Subestima massa magra</text><text x="46" y="248.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">no idoso</text><text x="36" y="269.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#d9b652" text-anchor="middle">•</text><text x="46" y="269.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">Contraindicada:</text><text x="46" y="284" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">marca-passo, gestação,</text><text x="46" y="299" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">implantes metálicos</text><rect x="222" y="67" width="184" height="245" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M222,79 Q222,67 234,67 H394 Q406,67 406,79 V92.6 H222 Z" fill="#0b2545"/><text x="314" y="84.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">DXA</text><text x="234" y="110.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#0b2545" text-anchor="middle">•</text><text x="244" y="110.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">Padrão-ouro de</text><text x="244" y="125.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">composição corporal</text><text x="234" y="146.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#0b2545" text-anchor="middle">•</text><text x="244" y="146.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">Erro de 1% para osso e 3%</text><text x="244" y="161.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">para gordura</text><text x="234" y="182.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#0b2545" text-anchor="middle">•</text><text x="244" y="182.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">Imprecisa para VAT</text><text x="234" y="203.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#0b2545" text-anchor="middle">•</text><text x="244" y="203.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">Limite de peso do aparelho</text><text x="244" y="218.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">nos superobesos</text><text x="234" y="239.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#0b2545" text-anchor="middle">•</text><text x="244" y="239.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">Marcas não comparáveis</text><text x="244" y="254.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">entre si</text><rect x="420" y="67" width="184" height="245" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M420,79 Q420,67 432,67 H592 Q604,67 604,79 V92.6 H420 Z" fill="#2e7d32"/><text x="512" y="84.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">TC e RM</text><text x="432" y="110.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#2e7d32" text-anchor="middle">•</text><text x="442" y="110.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">Padrão-ouro da gordura</text><text x="442" y="125.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">abdominal segmentar</text><text x="432" y="146.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#2e7d32" text-anchor="middle">•</text><text x="442" y="146.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">TC no corte L4-L5: VAT ≥</text><text x="442" y="161.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">100 cm² = risco</text><text x="442" y="176.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">cardiometabólico</text><text x="432" y="197.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#2e7d32" text-anchor="middle">•</text><text x="442" y="197.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">Avaliam gordura ectópica</text><text x="432" y="218.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#2e7d32" text-anchor="middle">•</text><text x="442" y="218.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">Alto custo; TC com</text><text x="442" y="233.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">radiação, RM sem</text><rect x="618" y="67" width="184" height="245" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M618,79 Q618,67 630,67 H790 Q802,67 802,79 V92.6 H618 Z" fill="#6d28d9"/><text x="710" y="84.6" font-family