<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 783 635.13" width="783" height="635.13" role="img" aria-label="Como a adiposidade eleva a pressão arterial"><title>Como a adiposidade eleva a pressão arterial</title><defs><marker id="fsegestacao-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fsegestacao-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fsegestacao-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fsegestacao-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="781" height="633.13" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="391.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Como a adiposidade eleva a pressão arterial</text><text x="391.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Mecanismos da hipertensão na obesidade e seu perfil hemodinâmico</text><path d="M299.5,132 C299.5,163 113.3,163 113.3,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M299.5,132 C299.5,163 306.2,163 306.2,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M299.5,132 C299.5,163 492.4,163 492.4,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M306.2,243.6 C306.2,274.6 299.5,274.6 299.5,305.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M492.4,243.6 C492.4,274.6 299.5,274.6 299.5,305.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M113.3,243.6 C113.3,263.6 169.5,263.6 169.5,338.1 S299.5,412.6 299.5,432.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M299.5,370.6 L299.5,432.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><path d="M299.5,497.5 L299.5,559.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fsegestacao-ag)"/><rect x="184.2" y="67" width="230.6" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="299.5" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Excesso de peso</text><text x="299.5" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">sobretudo adiposidade visceral</text><text x="299.5" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">65 a 75% do risco de HAS primária</text><rect x="25.9" y="194" width="174.8" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="113.3" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Ativação simpática</text><text x="113.3" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">predomínio sobre o vagal</text><rect x="230.7" y="194" width="151" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="306.2" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Hiperinsulinemia</text><text x="306.2" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">retém sódio e água</text><rect x="411.7" y="194" width="161.4" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="492.4" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Compressão renal</text><text x="492.4" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">gordura retroperitoneal</text><rect x="195.5" y="305.6" width="208.1" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="299.5" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">SRAA ativado</text><text x="299.5" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">ATII e aldosterona do adipócito</text><text x="299.5" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">↑ reabsorção de sódio</text><rect x="175.7" y="432.6" width="247.6" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="299.5" y="453.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Hipertensão arterial</text><text x="299.5" y="468.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">↑ débito cardíaco e volume plasmático</text><text x="299.5" y="484.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">resistência periférica normal</text><rect x="216.5" y="559.5" width="166" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="299.5" y="580.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Lesão de órgão-alvo</text><text x="299.5" y="595.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">mais HVE e lesão renal</text><rect x="264.5" y="266.6" width="76.7" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="302.9" y="278.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">via parácrina</text><rect x="378.6" y="266.6" width="34.6" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="396" y="278.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">ativa</text><line x1="423.3" y1="465" x2="587.1" y2="465" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="587.1" y="438.4" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="595.1" y="454.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Aferição: manguito estreito</text><text x="595.1" y="467.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">superestima e largo</text><text x="595.1" y="481" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">subestima a pressão.</text></svg>