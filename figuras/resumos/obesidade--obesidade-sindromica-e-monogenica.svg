<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 636 838.1800000000001" width="636" height="838.1800000000001" role="img" aria-label="Via leptina–melanocortina: onde cai cada defeito monogênico"><title>Via leptina–melanocortina: onde cai cada defeito monogênico</title><defs><marker id="fmonogenica-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fmonogenica-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fmonogenica-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fmonogenica-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="634" height="836.1800000000001" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="318" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Via leptina–melanocortina: onde cai cada defeito monogênico</text><text x="318" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Cada defeito cai em um ponto da via, e isso explica quem responde a qual tratamento</text><path d="M136,132 C136,163 226,163 226,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmonogenica-ag)"/><path d="M350.8,132 C350.8,163 226,163 226,194" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#fmonogenica-av)"/><path d="M226,258.9 L226,320.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmonogenica-ag)"/><path d="M226,385.9 L226,447.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmonogenica-ag)"/><path d="M226,512.9 C226,555.4 126.1,555.4 126.1,597.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmonogenica-ag)"/><path d="M126.1,632.2 C126.1,674.7 226,674.7 226,717.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmonogenica-ag)"/><path d="M289,655.2 C289,686.2 226,686.2 226,717.2" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#fmonogenica-av)"/><rect x="26.2" y="67" width="219.6" height="65" rx="32.485" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="136" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Leptina</text><text x="136" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">defeito: leptina baixa</text><text x="136" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">estatura normal, mais infecções</text><rect x="275.7" y="67" width="150.1" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="350.8" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Metreleptina</text><text x="350.8" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">leptina recombinante</text><text x="350.8" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">só no defeito de LEP</text><rect x="121.2" y="194" width="209.6" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="226" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Receptor de leptina (LEPR)</text><text x="226" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">no núcleo arqueado</text><text x="226" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">defeito: estatura final baixa</text><rect x="145" y="320.9" width="162.1" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="226" y="341.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">POMC</text><text x="226" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">defeito: cabelos ruivos,</text><text x="226" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">insuficiência adrenal</text><rect x="138.2" y="447.9" width="175.5" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="226" y="468.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PCSK1 cliva a POMC</text><text x="226" y="484.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">defeito: diarreia neonatal,</text><text x="226" y="499.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">pró-insulina alta</text><rect x="78.1" y="597.9" width="96" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="126.1" y="618.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">α-MSH</text><rect x="204.1" y="574.9" width="169.8" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="289" y="595.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Setmelanotide</text><text x="289" y="611.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">agonista do MC4R</text><text x="289" y="626.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">LEPR, POMC, PCSK1 e</text><text x="289" y="641.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">Bardet–Biedl</text><rect x="111" y="717.2" width="230" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="226" y="737.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">MC4R</text><text x="226" y="753.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">defeito: o mais comum (~5%)</text><text x="226" y="768.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">estatura elevada, DMO aumentada</text><rect x="244.8" y="155" width="87.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="288.4" y="167" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">repõe a leptina</text><rect x="148" y="547.4" width="56" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="176" y="559.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">clivagem</text><rect x="230.5" y="678.2" width="54.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="257.5" y="690.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">agonista</text><line x1="330.8" y1="226.5" x2="439.8" y2="226.5" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="439.8" y="199.8" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="447.8" y="215.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Leptina proporcional à</text><text x="447.8" y="228.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">massa gorda; não responde</text><text x="447.8" y="242.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">à leptina exógena</text><line x1="341" y1="749.7" x2="439.8" y2="749.7" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="439.8" y="723.1" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="447.8" y="738.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Sem terapia dirigida: o alvo</text><text x="447.8" y="752.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">do setmelanotide é o</text><text x="447.8" y="765.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">próprio receptor defeituoso</text><text x="26.2" y="808.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Dourado: sequência do sinal; verde: onde o fármaco age. Qualquer defeito: hiperfagia e obesidade precoce.</text></svg>