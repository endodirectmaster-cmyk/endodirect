"151.3" width="116.2" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="438.1" y="172" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Má absorção</text><text x="438.1" y="187.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">bypass e DBP</text><rect x="526.2" y="151.3" width="143.8" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="598.1" y="172" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">↓ Acidez gástrica</text><text x="598.1" y="187.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">↓ fator intrínseco</text><rect x="25.8" y="258.5" width="174.1" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="112.9" y="279.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Proteína</text><text x="112.9" y="294.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">edema: hipoalbuminemia</text><text x="112.9" y="310.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">repor 60–75 g/dia</text><rect x="229.9" y="250.9" width="203.1" height="80.3" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="331.5" y="271.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Ferro</text><text x="331.5" y="287.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">até 60%; duodeno excluído no</text><text x="331.5" y="302.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">bypass</text><text x="331.5" y="317.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">IV se moderada/grave</text><rect x="463.1" y="258.5" width="155.7" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="540.9" y="279.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Osso</text><text x="540.9" y="294.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">fratura ↑ em 2–5 anos</text><text x="540.9" y="310.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">citrato; vit. D 30–60</text><rect x="648.8" y="258.5" width="202.4" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="750" y="279.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Vitamina B12</text><text x="750" y="294.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">também por desabsorção ileal</text><text x="750" y="310.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">1.000 µg VO ou IM</text><rect x="339.4" y="381.2" width="198.1" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="438.5" y="401.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Suplementação vitalícia</text><text x="438.5" y="417.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">exames aos 3, 6, 12 meses e</text><text x="438.5" y="432.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">anual</text><text x="25.8" y="472.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">↓ acidez piora o ferro (férrico → ferroso) e o carbonato de cálcio. B12: o ácido metilmalônico sobe antes da B12 sérica cair. DBP: derivação biliopancreática.</text></svg>