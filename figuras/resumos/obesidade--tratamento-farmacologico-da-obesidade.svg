-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Sibutramina: ↑ serotonina e</text><text x="46" y="129.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">noradrenalina; ↓ NPY, ↑ POMC</text><text x="36" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="46" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Bupropiona: estimula neurônios</text><text x="46" y="167.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">POMC</text><text x="36" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="46" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Naltrexona: bloqueia a</text><text x="46" y="206.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">retroinibição do POMC pela</text><text x="46" y="222.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">β-endorfina</text><text x="36" y="244.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="46" y="244.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Análogos GLP-1: ↑ POMC/CART,</text><text x="46" y="261.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">↓ NPY/AgRP</text><rect x="274" y="67" width="236" height="224.1" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M274,79 Q274,67 286,67 H498 Q510,67 510,79 V93.9 H274 Z" fill="#6d28d9"/><text x="392" y="85.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Hedônico: recompensa</text><text x="286" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6d28d9" text-anchor="middle">•</text><text x="296" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Bupropiona: ↑ dopamina no</text><text x="296" y="129.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">núcleo accumbens</text><text x="286" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6d28d9" text-anchor="middle">•</text><text x="296" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Naltrexona: antagoniza</text><text x="296" y="167.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">receptores opioides no circuito</text><text x="286" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6d28d9" text-anchor="middle">•</text><text x="296" y="190.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Semaglutida: área tegmental</text><text x="296" y="206.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">ventral e núcleo accumbens</text><text x="286" y="228.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6d28d9" text-anchor="middle">•</text><text x="296" y="228.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Tirzepatida: pré-frontal,</text><text x="296" y="244.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">hipocampo, hipotálamo lateral</text><rect x="524" y="67" width="236" height="224.1" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M524,79 Q524,67 536,67 H748 Q760,67 760,79 V110.8 H524 Z" fill="#d9b652"/><text x="642" y="85.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Periferia: tubo digestivo e</text><text x="642" y="102.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">pâncreas</text><text x="536" y="130.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#d9b652" text-anchor="middle">•</text><text x="546" y="130.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Orlistate: inibe lipases gástrica e</text><text x="546" y="146.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">pancreática</text><text x="536" y="168.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#d9b652" text-anchor="middle">•</text><text x="546" y="168.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Absorção de triglicerídeos −30%;</text><text x="546" y="184.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">ação não sistêmica</text><text x="536" y="207.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#d9b652" text-anchor="middle">•</text><text x="546" y="207.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Análogos: retardam o</text><text x="546" y="223.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">esvaziamento gástrico e reduzem</text><text x="546" y="239.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">glucagon</text><text x="536" y="261.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#d9b652" text-anchor="middle">•</text><text x="546" y="261.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Tirzepatida: ↑↑ insulina por duplo</text><text x="546" y="278.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">estímulo da célula β</text><text x="24" y="309.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-style="italic" fill="#5b6f88" text-anchor="start">O fármaco só se justifica junto de orientação dietética e mudança de estilo de vida.</text></svg>