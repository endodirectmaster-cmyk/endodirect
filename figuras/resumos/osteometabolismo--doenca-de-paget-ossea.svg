rl(#fpagetossea-ag)"/><path d="M404.5,655.2 L404.5,717.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fpagetossea-ag)"/><path d="M404.5,782.2 C404.5,813.2 96.4,813.2 96.4,844.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fpagetossea-ag)"/><path d="M404.5,782.2 C404.5,813.2 272.2,813.2 272.2,844.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fpagetossea-ag)"/><path d="M404.5,782.2 C404.5,817 460.2,817 460.2,851.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fpagetossea-ag)"/><path d="M404.5,782.2 C404.5,813.2 677.9,813.2 677.9,844.2" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#fpagetossea-as)"/><rect x="294.2" y="67" width="220.6" height="65" rx="32.485" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="404.5" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Predisposição</text><text x="404.5" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">SQSTM1/p62; idosos &gt; 55 anos</text><text x="404.5" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">possível gatilho viral (debatido)</text><rect x="315" y="194" width="179" height="80.3" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="404.5" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Osteoclastos gigantes</text><text x="404.5" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">hiperativos</text><text x="404.5" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">reabsorção acelerada e</text><text x="404.5" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">desorganizada</text><rect x="300.1" y="336.3" width="208.7" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="404.5" y="357" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Fase quente</text><text x="404.5" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">osteolítica: destruição cortical e</text><text x="404.5" y="388" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">trabecular</text><rect x="305.1" y="463.3" width="198.8" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="404.5" y="484" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Fase mista</text><text x="404.5" y="499.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">esclerose e rarefação; a mais</text><text x="404.5" y="514.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">comum</text><rect x="323.5" y="590.2" width="162.1" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="404.5" y="610.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Fase fria</text><text x="404.5" y="626.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">espessamento cortical,</text><text x="404.5" y="641.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">alargamento ósseo</text><rect x="296.6" y="717.2" width="215.8" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="404.5" y="737.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Osso em mosaico</text><text x="404.5" y="753.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">aumentado e hipervascularizado</text><text x="404.5" y="768.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">frágil: dor, deformidade, fratura</text><rect x="26" y="844.2" width="140.9" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="96.4" y="864.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Crânio</text><text x="96.4" y="880.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">surdez</text><text x="96.4" y="895.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">invaginação basilar</text><rect x="196.8" y="844.2" width="150.8" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="272.2" y="864.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Coluna</text><text x="272.2" y="880.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">compressão medular</text><text x="272.2" y="895.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ou radicular</text><rect x="377.6" y="851.9" width="165.3" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="460.2" y="872.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Hipervascularização</text><text x="460.2" y="888.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">IC de alto débito</text><rect x="572.9" y="844.2" width="210.2" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="677.9" y="864.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Osteossarcoma</text><text x="677.9" y="880.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">raro e grave</text><text x="677.9" y="895.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">suspeitar na piora súbita da dor</text><rect x="480.1" y="805.2" width="122.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="541.2" y="817.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">doença de longa data</text><text x="26" y="935.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Dourado: sequência da doença. Cinza tracejado: evolução tardia. Vermelho: osso doente e complicação mais temida.</text></svg>