xt-anchor="middle">maligna</text><polygon points="228.9 305.6 385 305.6 401 322.7 385 339.8 228.9 339.8 212.9 322.7" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="307" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">Qual fração sobe?</text><rect x="431" y="297.9" width="111.9" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="486.9" y="318.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Mieloma</text><text x="486.9" y="334.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">osteólise local</text><rect x="572.9" y="290.2" width="219.3" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="682.5" y="310.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Endócrinas</text><text x="682.5" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hipertireoidismo, feocromocitoma</text><text x="682.5" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">insuficiência adrenal</text><rect x="202.6" y="417.2" width="175.5" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="290.3" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Granulomatose</text><text x="290.3" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">produção macrofágica de</text><text x="290.3" y="468.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">1α-hidroxilase</text><rect x="408.1" y="424.9" width="207.4" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="511.8" y="445.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Intoxicação por vitamina D</text><text x="511.8" y="461.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">1,25 normal ou pouco alterada</text><rect x="299.3" y="544.2" width="219.3" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="409" y="564.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Corticoide</text><text x="409" y="580.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">na intoxicação, também restringir</text><text x="409" y="595.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">cálcio</text><rect x="124.3" y="247.4" width="50.8" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="149.7" y="259.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">elevado</text><rect x="269.7" y="370.5" width="58" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="298.6" y="382.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">só a 1,25</text><rect x="360.3" y="374.4" width="98.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="409.4" y="386.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">25-OH muito alta</text><text x="25.8" y="635.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Exames pedidos em conjunto após o PTH suprimido; em verde, o diagnóstico que cada um sustenta.</text></svg>