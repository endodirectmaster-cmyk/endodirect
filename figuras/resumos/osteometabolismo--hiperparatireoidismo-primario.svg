<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 743 553.52" width="743" height="553.52" role="img" aria-label="Hiperparatireoidismo primário: PTH autônomo e órgãos-alvo"><title>Hiperparatireoidismo primário: PTH autônomo e órgãos-alvo</title><defs><marker id="fmoprimario-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fmoprimario-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fmoprimario-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fmoprimario-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="741" height="551.52" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="371.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Hiperparatireoidismo primário: PTH autônomo e órgãos-alvo</text><text x="371.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">A paratireoide deixa de obedecer ao cálcio; ossos, cálculos, gemidos e transtornos psíquicos</text><path d="M318.4,132 L318.4,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmoprimario-ag)"/><path d="M318.4,258.9 C318.4,289.9 98.8,289.9 98.8,320.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmoprimario-ag)"/><path d="M318.4,258.9 C318.4,289.9 285.5,289.9 285.5,320.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmoprimario-ag)"/><path d="M318.4,258.9 C318.4,289.9 505.2,289.9 505.2,320.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fmoprimario-ag)"/><path d="M98.8,385.9 C98.8,416.9 221.6,416.9 221.6,447.9" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#fmoprimario-as)"/><path d="M285.5,385.9 C285.5,416.9 440.6,416.9 440.6,447.9" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#fmoprimario-as)"/><path d="M478.3,226.5 H623 Q633,226.5 633,216.5 V109.5 Q633,99.5 623,99.5 H441.6" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#fmoprimario-ar)"/><text x="639" y="167" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="start" class="lbl">não suprime</text><rect x="197.3" y="67" width="242.3" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="318.4" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Paratireoide autônoma</text><text x="318.4" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">adenoma único 80–85%</text><text x="318.4" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">hiperplasia 10–15%, carcinoma &lt; 1%</text><rect x="158.6" y="194" width="319.7" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="318.4" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hiperparatireoidismo primário</text><text x="318.4" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">cálcio alto, PTH alto ou inapropriadamente normal</text><text x="318.4" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">fósforo baixo ou normal-baixo; 80% assintomáticos</text><rect x="25.9" y="320.9" width="145.8" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="98.8" y="341.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Ossos</text><text x="98.8" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">perda cortical</text><text x="98.8" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">osteíte fibrosa (rara)</text><rect x="201.7" y="320.9" width="167.7" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="285.5" y="341.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Rim</text><text x="285.5" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">litíase, nefrocalcinose</text><text x="285.5" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">poliúria (DI nefrogênico)</text><rect x="399.4" y="320.9" width="211.6" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="505.2" y="341.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">TGI e neuropsiquiátrico</text><text x="505.2" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">constipação, úlcera, pancreatite</text><text x="505.2" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">fadiga, depressão</text><rect x="114.4" y="447.9" width="214.3" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="221.6" y="468.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">DXA com 1/3 distal do rádio</text><text x="221.6" y="484.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sítio cortical, mais afetado</text><rect x="358.7" y="447.9" width="163.7" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="440.6" y="468.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Imagem renal e TFG</text><text x="440.6" y="484.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">litíase e função renal</text><rect x="269" y="155" width="98.8" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="318.4" y="167" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">PTH em excesso</text><rect x="138" y="408.9" width="44.3" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="160.2" y="420.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">avaliar</text><rect x="340.9" y="408.9" width="44.3" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="363" y="420.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">avaliar</text><text x="25.9" y="523.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Tracejado vermelho: retroalimentação pelo cálcio, perdida no hiperparatireoidismo primário. Verde: avaliação de órgão-alvo.</text></svg>