<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 645 886.445" width="645" height="886.445" role="img" aria-label="Sem PTH: por que o cálcio cai e o fósforo sobe"><title>Sem PTH: por que o cálcio cai e o fósforo sobe</title><defs><marker id="fpocalcemia-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fpocalcemia-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fpocalcemia-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fpocalcemia-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="643" height="884.445" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="322.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Sem PTH: por que o cálcio cai e o fósforo sobe</text><text x="322.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Da falta de PTH aos sintomas e à lógica do tratamento crônico</text><text x="125.4" y="102.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Causa</text><text x="125.4" y="220.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Paratireoides</text><text x="125.4" y="332.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Sem ação do PTH</text><text x="125.4" y="436.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Sangue</text><text x="125.4" y="548" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Clínica e tratamento</text><text x="125.4" y="675" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Risco</text><text x="125.4" y="802" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Meta</text><path d="M260.4,130.1 C260.4,161.1 387.2,161.1 387.2,192.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fpocalcemia-ag)"/><path d="M482.2,123.3 C482.2,157.7 387.2,157.7 387.2,192.1" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="380.2" y1="192.1" x2="394.2" y2="192.1" stroke="#c0392b" stroke-width="3"/><path d="M387.2,241.7 C387.2,272.7 283.9,272.7 283.9,303.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fpocalcemia-ag)"/><path d="M387.2,241.7 C387.2,272.7 485.8,272.7 485.8,303.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fpocalcemia-ag)"/><path d="M283.9,353.3 L283.9,415.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fpocalcemia-ag)"/><path d="M485.8,353.3 L485.8,415.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fpocalcemia-ag)"/><path d="M283.9,449.5 C283.9,480.5 264.9,480.5 264.9,511.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fpocalcemia-ag)"/><path d="M283.9,449.5 C283.9,484.4 511.5,484.4 511.5,519.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fpocalcemia-ag)"/><path d="M511.5,568.8 C511.5,603.7 387.2,603.7 387.2,638.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fpocalcemia-ag)"/><path d="M387.2,703.5 L387.2,765.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fpocalcemia-ag)"/><rect x="180.4" y="67" width="160" height="63.1" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="194.4" y="87.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2f45" text-anchor="start">Causas</text><text x="194.4" y="102.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• pós-cirúrgica (80%)</text><text x="194.4" y="116.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2f45" text-anchor="start">• autoimune (20%)</text><rect x="370.4" y="73.7" width="223.6" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="482.2" y="94.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hipomagnesemia</text><text x="482.2" y="110" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">bloqueia secreção e ação do PTH</text><rect x="288.2" y="192.1" width="198.1" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="387.2" y="212.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PTH baixo</text><text x="387.2" y="228.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">ou inapropriadamente normal</text><rect x="200.3" y="303.7" width="167.2" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="283.9" y="324.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Sem 1α-hidroxilação</text><text x="283.9" y="340" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">falta vitamina D ativa</text><rect x="397.5" y="303.7" width="176.7" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="485.8" y="324.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Sem efeito fosfatúrico</text><text x="485.8" y="340" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">fósforo retido</text><rect x="223.3" y="415.3" width="121.2" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="283.9" y="436" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Cálcio baixo</text><rect x="426" y="415.3" width="119.6" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="485.8" y="436" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Fósforo alto</text><rect x="155.5" y="511.5" width="218.6" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="264.9" y="532.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hiperexcitabilidade</text><text x="264.9" y="547.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">tetania, Chvostek e Trousseau</text><text x="264.9" y="563.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">QT longo; crônico: catarata, Fahr</text><rect x="404.2" y="519.2" width="214.7" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="511.5" y="539.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Cálcio oral + calcitriol</text><text x="511.5" y="555.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">calcitriol supre a 1α-hidroxilação</text><rect x="271.2" y="638.5" width="232" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="387.2" y="659.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hipercalciúria</text><text x="387.2" y="674.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sem PTH, falta reabsorção tubular</text><text x="387.2" y="690.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">nefrolitíase; tiazídico reduz calciúria</text><rect x="283.2" y="765.5" width="208" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="387.2" y="786.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Cálcio 8–8,5 mg/dL</text><text x="387.2" y="801.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">metade inferior da normalidade</text><text x="387.2" y="817.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">calciúria &lt; 4 mg/kg/dia</text><rect x="379.1" y="476.4" width="37.2" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="397.7" y="488.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">tratar</text><rect x="423" y="595.7" width="52.8" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="449.4" y="607.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">excesso</text><rect x="368" y="726.5" width="38.5" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="387.2" y="738.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">evitar</text><text x="155.5" y="856.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Setas douradas: sequência. Barra vermelha: bloqueio do PTH pelo magnésio baixo.</text></svg>