<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 701 532.88" width="701" height="532.88" role="img" aria-label="Três caminhos para o mesmo defeito de mineralização"><title>Três caminhos para o mesmo defeito de mineralização</title><defs><marker id="fraquitismo-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fraquitismo-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fraquitismo-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fraquitismo-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="699" height="530.88" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="350.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Três caminhos para o mesmo defeito de mineralização</text><text x="350.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Calcipênico, fosfopênico e hipofosfatasia levam ao osteoide não mineralizado</text><text x="65.2" y="103.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Causa</text><text x="65.2" y="218.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Distúrbio</text><text x="65.2" y="333.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Osso</text><text x="65.2" y="448.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Idade</text><path d="M181.2,132 C181.2,160.8 186.7,160.8 186.7,189.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fraquitismo-ag)"/><path d="M390,132 C390,157 381.1,157 381.1,182" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fraquitismo-ag)"/><path d="M594,124.3 C594,157 579.5,157 579.5,189.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fraquitismo-ag)"/><path d="M186.7,239.3 C186.7,268.1 385.1,268.1 385.1,296.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fraquitismo-ag)"/><path d="M381.1,246.9 C381.1,271.9 385.1,271.9 385.1,296.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fraquitismo-ag)"/><path d="M579.5,239.3 C579.5,268.1 385.1,268.1 385.1,296.9" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="378.1" y1="296.9" x2="392.1" y2="296.9" stroke="#c0392b" stroke-width="3"/><path d="M385.1,361.9 C385.1,386.9 266.1,386.9 266.1,411.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fraquitismo-ag)"/><path d="M385.1,361.9 C385.1,390.8 489.6,390.8 489.6,419.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fraquitismo-ag)"/><rect x="95.4" y="67" width="171.5" height="65" rx="32.485" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="181.2" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Falta de vitamina D</text><text x="181.2" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">principal causa</text><text x="181.2" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">sol, dieta, má absorção</text><rect x="296.9" y="67" width="186.3" height="65" rx="32.485" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="390" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Perda renal de fósforo</text><text x="390" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">FGF-23 alto</text><text x="390" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">tumor ou PHEX</text><rect x="513.2" y="74.7" width="161.6" height="49.6" rx="24.805" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="594" y="95.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Hipofosfatasia</text><text x="594" y="111" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">ALPL: TNSALP baixa</text><rect x="96" y="189.6" width="181.4" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="186.7" y="210.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Calcipênico</text><text x="186.7" y="226" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">PTH alto, 25-OH-D baixa</text><rect x="307.4" y="182" width="147.5" height="65" rx="32.485" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="381.1" y="202.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Fosfopênico</text><text x="381.1" y="218.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">fósforo muito baixo</text><text x="381.1" y="233.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">PTH normal</text><rect x="484.8" y="189.6" width="189.3" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="579.5" y="210.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Pirofosfato acumulado</text><text x="579.5" y="226" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">inibe a mineralização</text><rect x="281.4" y="296.9" width="207.4" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="385.1" y="317.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Osteoide não mineralizado</text><text x="385.1" y="333.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">osso amolecido</text><text x="385.1" y="348.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">FA alta em mais de 95%</text><rect x="176.5" y="411.9" width="179" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="266.1" y="432.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Raquitismo na criança</text><text x="266.1" y="448.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">fise aberta: deformidade</text><text x="266.1" y="463.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">baixa estatura</text><rect x="385.6" y="419.6" width="208.1" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="489.6" y="440.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Osteomalácia no adulto</text><text x="489.6" y="455.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">zonas de Looser, dor, fraqueza</text><text x="95.4" y="502.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Setas douradas: causa e efeito. Barra vermelha: o pirofosfato bloqueia a mineralização. Na hipofosfatasia, a FA é baixa.</text></svg>