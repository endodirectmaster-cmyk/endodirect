<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 961.06" width="794" height="961.06" role="img" aria-label="Autonomia tireoidiana: do bócio ao nódulo que funciona sem TSH"><title>Autonomia tireoidiana: do bócio ao nódulo que funciona sem TSH</title><defs><marker id="fnomatoxico-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fnomatoxico-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fnomatoxico-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fnomatoxico-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="792" height="959.06" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="397" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Autonomia tireoidiana: do bócio ao nódulo que funciona sem TSH</text><text x="397" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Deficiência de iodo e estímulo trófico geram clones autônomos por mutação do TSHR ou GNAS</text><text x="65.8" y="118.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Causa</text><text x="65.8" y="261.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Estímulo</text><text x="65.8" y="403.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Evolução</text><text x="65.8" y="553.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Mutação</text><text x="65.8" y="711.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Formas</text><text x="65.8" y="868.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Quadro</text><path d="M394.7,162.7 L394.7,224.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnomatoxico-ag)"/><path d="M394.7,289.7 L394.7,351.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnomatoxico-ag)"/><path d="M394.7,447.4 L394.7,509.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnomatoxico-ag)"/><path d="M394.7,589.7 C394.7,624.5 185.3,624.5 185.3,659.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnomatoxico-ag)"/><path d="M394.7,589.7 L394.7,659.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnomatoxico-ag)"/><path d="M185.3,755.1 C185.3,789.9 394.7,789.9 394.7,824.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnomatoxico-ag)"/><path d="M394.7,755.1 L394.7,824.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnomatoxico-ag)"/><path d="M604.1,762.7 C604.1,793.7 394.7,793.7 394.7,824.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fnomatoxico-ag)"/><path d="M506.2,864.9 H705.7 Q715.7,864.9 715.7,854.9 V267.2 Q715.7,257.2 705.7,257.2 H515.3" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#fnomatoxico-ar)"/><text x="721.7" y="565" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="start" class="lbl">TSH ↓</text><rect x="285.3" y="67" width="218.9" height="95.7" rx="47.845" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="394.7" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Deficiência de iodo</text><text x="394.7" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">causa mais comum de bócio no</text><text x="394.7" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">mundo</text><text x="394.7" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">baixa oferta reduz a síntese</text><text x="394.7" y="149.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">hormonal</text><rect x="276.1" y="224.7" width="237.2" height="65" rx="32.485" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="394.7" y="245.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">TSH ↑</text><text x="394.7" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">estímulo trófico persistente; fatores</text><text x="394.7" y="276.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">locais IGF-1, EGF</text><rect x="285.8" y="351.7" width="217.9" height="95.7" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="394.7" y="372.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Bócio</text><text x="394.7" y="388" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">hiperplasia difusa; folículos</text><text x="394.7" y="403.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">heterogêneos</text><text x="394.7" y="418.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">ciclos de hiperplasia, involução e</text><text x="394.7" y="434" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">formação nodular</text><rect x="282.2" y="509.4" width="225" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="394.7" y="530.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Clones autônomos</text><text x="394.7" y="545.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">mutação ativadora do TSHR (ou</text><text x="394.7" y="561" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">GNAS): AMPc ligado sem TSH</text><text x="394.7" y="576.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">antitireoidiano não induz remissão</text><rect x="95.8" y="659.4" width="179.1" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="185.3" y="680.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Adenoma tóxico</text><text x="185.3" y="695.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">um nódulo autônomo</text><text x="185.3" y="711" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">único, quente</text><text x="185.3" y="726.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">supressão do parênquima</text><text x="185.3" y="741.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">extranodular</text><rect x="304.8" y="659.4" width="179.8" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="394.7" y="680.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">BMN tóxico (Plummer)</text><text x="394.7" y="695.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">múltiplas áreas</text><text x="394.7" y="711" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">autônomas</text><text x="394.7" y="726.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">captação heterogênea,</text><text x="394.7" y="741.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">em tabuleiro de xadrez</text><rect x="514.6" y="651.7" width="179.1" height="111.1" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="604.1" y="672.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Carga de iodo</text><text x="604.1" y="688.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">(Jod-Basedow)</text><text x="604.1" y="704.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">contraste iodado,</text><text x="604.1" y="719.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">amiodarona, suplementos</text><text x="604.1" y="735" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">desencadeia tireotoxicose</text><text x="604.1" y="750.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">em glândula já autônoma</text><rect x="283.3" y="824.7" width="222.9" height="80.3" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="394.7" y="845.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Tireotoxicose por autonomia</text><text x="394.7" y="861" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">TRAb negativo, sem oftalmopatia</text><text x="394.7" y="876.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">idoso: T3-toxicose, forma apática,</text><text x="394.7" y="891.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">fibrilação atrial</text><rect x="361.5" y="312.7" width="66.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="394.7" y="324.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">hiperplasia</text><rect x="345" y="470.4" width="99.5" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="394.7" y="482.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">ao longo de anos</text><rect x="257.8" y="616.5" width="64.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="290" y="628.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">um nódulo</text><rect x="358" y="616.5" width="73.5" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="394.7" y="628.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">várias áreas</text><rect x="461.4" y="785.7" width="76.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="499.4" y="797.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">desencadeia</text><text x="95.8" y="931.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Tracejado vermelho: o hormônio autônomo suprime o TSH; o parênquima normal, suprimido, é poupado pelo radioiodo.</text></svg>