<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 818.73" width="690" height="818.73" role="img" aria-label="Carcinoma diferenciado: o que a célula folicular conserva"><title>Carcinoma diferenciado: o que a célula folicular conserva</title><defs><marker id="fefolicular-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fefolicular-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fefolicular-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fefolicular-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="688" height="816.73" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="345" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Carcinoma diferenciado: o que a célula folicular conserva</text><text x="345" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Captar iodo, produzir tireoglobulina e responder ao TSH — e o que muda quando o iodo não é captado</text><text x="67.1" y="103.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Origem</text><text x="67.1" y="230.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Conserva</text><text x="67.1" y="388.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Permite</text><text x="67.1" y="561.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Perda</text><text x="67.1" y="718.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Conduta</text><path d="M380.6,132 C380.6,166.8 177.2,166.8 177.2,201.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fefolicular-ag)"/><path d="M380.6,132 C380.6,163 352.6,163 352.6,194" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fefolicular-ag)"/><path d="M380.6,132 C380.6,166.8 556,166.8 556,201.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fefolicular-ag)"/><path d="M177.2,251.3 C177.2,293.8 179.5,293.8 179.5,336.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fefolicular-ag)"/><path d="M352.6,258.9 C352.6,297.6 381.3,297.6 381.3,336.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fefolicular-ag)"/><path d="M556,251.3 C556,286.1 582.4,286.1 582.4,320.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fefolicular-ag)"/><path d="M179.5,432 C179.5,470.7 380.6,470.7 380.6,509.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fefolicular-ag)"/><path d="M381.3,432 L380.6,509.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fefolicular-ag)"/><path d="M380.6,605 L380.6,667" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fefolicular-ag)"/><rect x="272.1" y="67" width="216.9" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="380.6" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Célula folicular</text><text x="380.6" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">origem do papilífero (~85%) e do</text><text x="380.6" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">folicular (~10%)</text><rect x="119.8" y="201.6" width="114.7" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="177.2" y="222.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Capta iodo</text><text x="177.2" y="238" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">pelo canal NIS</text><rect x="264.5" y="194" width="176.2" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="352.6" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Produz tireoglobulina</text><text x="352.6" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">Tg sérica como marcador</text><text x="352.6" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">de doença</text><rect x="470.7" y="201.6" width="170.6" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="556" y="222.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Responde ao TSH</text><text x="556" y="238" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">o TSH é trófico ao tumor</text><rect x="97.4" y="336.3" width="164.2" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="179.5" y="357" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Radioiodo (I-131)</text><text x="179.5" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">rotina no alto risco e na</text><text x="179.5" y="388" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">metástase a distância</text><text x="179.5" y="403.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">com estímulo de TSH e</text><text x="179.5" y="418.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">dieta pobre em iodo</text><rect x="291.6" y="336.3" width="179.4" height="95.7" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="381.3" y="357" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Seguimento por Tg</text><text x="381.3" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">Tg + anti-Tg e US cervical</text><text x="381.3" y="388" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">seriados</text><text x="381.3" y="403.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">Tg em elevação →</text><text x="381.3" y="418.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">suspeita de recidiva</text><rect x="501" y="320.9" width="162.8" height="126.4" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="582.4" y="341.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Supressão do TSH</text><text x="582.4" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">levotiroxina; meta</text><text x="582.4" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">ajustada ao risco e à</text><text x="582.4" y="388" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">resposta</text><text x="582.4" y="403.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">mais supressão no alto</text><text x="582.4" y="418.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">risco ou doença</text><text x="582.4" y="434" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">persistente</text><rect x="274.4" y="509.4" width="212.3" height="95.7" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="380.6" y="530.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Desdiferenciação: flip-flop</text><text x="380.6" y="545.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">perde o canal NIS, mantém o</text><text x="380.6" y="561" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">transportador GLUT</text><text x="380.6" y="576.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">Tg detectável com PCI negativa</text><text x="380.6" y="591.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">(Tg+ / PCI−)</text><rect x="269.1" y="667" width="222.9" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="380.6" y="687.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">PET-FDG localiza a doença</text><text x="380.6" y="703.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">refratária ao iodo com progressão</text><text x="380.6" y="718.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">estrutural →</text><text x="380.6" y="734.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">lenvatinibe ou sorafenibe; alvos</text><text x="380.6" y="749.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">BRAF, RET, NTRK</text><rect x="227.4" y="462.7" width="105.3" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="280" y="474.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">PCI sem captação</text><rect x="341.3" y="462.7" width="80" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="381.3" y="474.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Tg detectável</text><text x="97.4" y="788.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Papilífero dissemina por via linfática; folicular, por via hematogênica.</text></svg>