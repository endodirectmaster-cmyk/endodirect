<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 772.6499999999999" width="764" height="772.6499999999999" role="img" aria-label="Patogênese da doença de Graves: o TRAb no lugar do TSH"><title>Patogênese da doença de Graves: o TRAb no lugar do TSH</title><defs><marker id="fireoidismo-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fireoidismo-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fireoidismo-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fireoidismo-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="762" height="770.6499999999999" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="382" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Patogênese da doença de Graves: o TRAb no lugar do TSH</text><text x="382" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">O anticorpo estimulador ativa o receptor de TSH na tireoide e nos fibroblastos orbitários</text><text x="69.1" y="118.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Gatilhos</text><text x="69.1" y="261.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Anticorpo</text><text x="69.1" y="395.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Alvos</text><text x="69.1" y="530.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Efeitos</text><text x="69.1" y="672.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b6f88" text-anchor="end" letter-spacing=".04em">Quadro</text><path d="M326.5,162.7 L326.5,224.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M326.5,289.7 C326.5,324.5 204,324.5 204,359.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M326.5,289.7 C326.5,320.7 433.5,320.7 433.5,351.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M204,424.3 C204,459.2 207.2,459.2 207.2,494" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M433.5,432 C433.5,463 449.4,463 449.4,494" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M207.2,559 C207.2,590 326.5,590 326.5,621" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><rect x="217.5" y="67" width="218.2" height="95.7" rx="47.845" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="326.5" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Predisposição e gatilhos</text><text x="326.5" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">predisposição HLA, CTLA-4,</text><text x="326.5" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">PTPN22; agregação familiar</text><text x="326.5" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">estresse, tabagismo, pós-parto,</text><text x="326.5" y="149.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">excesso de iodo, infecções</text><rect x="226.6" y="224.7" width="199.8" height="65" rx="32.485" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="326.5" y="245.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">TRAb estimulador (TSI)</text><text x="326.5" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">autoanticorpo que se liga ao</text><text x="326.5" y="276.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">receptor de TSH</text><rect x="112" y="359.3" width="184" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="204" y="380" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Célula folicular</text><text x="204" y="395.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">via AMPc ativada de forma</text><text x="204" y="411" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">contínua</text><rect x="326" y="351.7" width="215.1" height="80.3" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="433.5" y="372.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Fibroblastos orbitários e</text><text x="433.5" y="388.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">pré-tibiais</text><text x="433.5" y="404.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">coexpressam receptor de TSH e</text><text x="433.5" y="419.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">de IGF-1</text><rect x="99.3" y="494" width="215.8" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="207.2" y="514.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Hiperfunção difusa</text><text x="207.2" y="530.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">síntese e secreção aumentadas</text><text x="207.2" y="545.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">bócio difuso com sopro e frêmito</text><rect x="345.1" y="494" width="208.7" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="449.4" y="514.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Oftalmopatia e dermopatia</text><text x="449.4" y="530.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">mixedema pré-tibial</text><text x="449.4" y="545.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">achados específicos de Graves</text><rect x="217.2" y="621" width="218.6" height="95.7" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="326.5" y="641.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Tireotoxicose</text><text x="326.5" y="657.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">TSH↓; T4L e/ou T3↑; T3-toxicose</text><text x="326.5" y="672.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">frequente</text><text x="326.5" y="688" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">taquicardia, FA, perda de peso,</text><text x="326.5" y="703.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">tremor, osteoporose</text><rect x="283.3" y="185.7" width="86.5" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="326.5" y="197.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">autoimunidade</text><rect x="220.1" y="316.5" width="90.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="265.3" y="328.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">ativa o receptor</text><rect x="330.3" y="312.7" width="99.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="380" y="324.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">mesmo anticorpo</text><line x1="435.8" y1="668.8" x2="567.8" y2="668.8" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="567.8" y="635.5" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="575.8" y="651.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Ao tratar, o TSH segue</text><text x="575.8" y="664.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">suprimido por semanas a</text><text x="575.8" y="678" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">meses: não titular pelo TSH</text><text x="575.8" y="691.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">no início</text><text x="99.3" y="742.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Tionamidas inibem a TPO; betabloqueador controla os sintomas.</text></svg>