<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 887.6650000000001" width="736" height="887.6650000000001" role="img" aria-label="Crise tireotóxica: onde cada fármaco bloqueia a cascata"><title>Crise tireotóxica: onde cada fármaco bloqueia a cascata</title><defs><marker id="fxedematoso-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fxedematoso-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fxedematoso-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fxedematoso-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="734" height="885.6650000000001" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="368" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Crise tireotóxica: onde cada fármaco bloqueia a cascata</text><text x="368" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Tionamida antes do iodo: dado antes, o iodo alimenta a síntese</text><path d="M340.3,147.3 C340.3,183.8 335,183.8 335,220.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fxedematoso-ag)"/><path d="M589.4,147.3 C589.4,183.8 335,183.8 335,220.4" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="328" y1="220.4" x2="342" y2="220.4" stroke="#c0392b" stroke-width="3"/><path d="M335,270 C335,318 320.8,318 320.8,366.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fxedematoso-ag)"/><path d="M539.4,293 C539.4,329.5 320.8,329.5 320.8,366.1" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="313.8" y1="366.1" x2="327.8" y2="366.1" stroke="#c0392b" stroke-width="3"/><path d="M320.8,415.7 C320.8,463.7 330,463.7 330,511.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fxedematoso-ag)"/><path d="M585.8,438.7 C585.8,475.2 330,475.2 330,511.7" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="323" y1="511.7" x2="337" y2="511.7" stroke="#c0392b" stroke-width="3"/><path d="M330,561.4 C330,597.9 460,597.9 460,634.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fxedematoso-ag)"/><path d="M559.5,584.4 C559.5,609.4 460,609.4 460,634.4" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="453" y1="634.4" x2="467" y2="634.4" stroke="#c0392b" stroke-width="3"/><rect x="225.9" y="67" width="228.8" height="80.3" rx="40.165" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="340.3" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Graves não tratada + gatilho</text><text x="340.3" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">cirurgia, infecção, parto, carga de</text><text x="340.3" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">iodo/contraste, suspensão do</text><text x="340.3" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">antitireoidiano</text><rect x="484.7" y="67" width="209.4" height="80.3" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="589.4" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Tionamida</text><text x="589.4" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">metimazol ou PTU bloqueiam a</text><text x="589.4" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">síntese</text><text x="589.4" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">eficácia equivalente na crise</text><rect x="270.5" y="220.4" width="128.9" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="335" y="241.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Tireoide</text><text x="335" y="256.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">síntese hormonal</text><rect x="429.4" y="197.3" width="220.1" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="539.4" y="218" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Iodo (Lugol)</text><text x="539.4" y="233.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">bloqueia a liberação do hormônio</text><text x="539.4" y="249" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">pré-formado</text><text x="539.4" y="264.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">1 h DEPOIS da tionamida; antes,</text><text x="539.4" y="279.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">alimenta a síntese</text><rect x="210" y="366.1" width="221.7" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="320.8" y="386.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Liberação na circulação</text><text x="320.8" y="402.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hormônio pré-formado (T4 e T3)</text><rect x="461.7" y="343" width="248.3" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="585.8" y="363.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Propranolol, PTU, corticoide</text><text x="585.8" y="379.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">reduzem a conversão periférica de T4</text><text x="585.8" y="394.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">em T3</text><text x="585.8" y="410" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">corticoide também trata a insuficiência</text><text x="585.8" y="425.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">adrenal relativa</text><rect x="245.5" y="511.7" width="169.1" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="330" y="532.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Conversão periférica</text><text x="330" y="548.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">T4 → T3</text><rect x="444.6" y="488.7" width="229.9" height="95.7" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="559.5" y="509.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Betabloqueador</text><text x="559.5" y="525" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">propranolol controla FC e sintomas</text><text x="559.5" y="540.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">adrenérgicos</text><text x="559.5" y="555.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">esmolol na disfunção ventricular,</text><text x="559.5" y="571.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">hipotensão ou choque</text><rect x="329.3" y="634.4" width="261.4" height="95.7" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="460" y="655.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Descompensação sistêmica</text><text x="460" y="670.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">febre alta, taquicardia/FA, agitação,</text><text x="460" y="686.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">delirium, icterícia</text><text x="460" y="701.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">diagnóstico clínico: Burch-Wartofsky ≥45</text><text x="460" y="716.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">= tempestade</text><line x1="196" y1="390.9" x2="210" y2="390.9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="26" y="344.1" width="170" height="93.6" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="34" y="359.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Colestiramina (adjuvante)</text><text x="34" y="373.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">interrompe a recirculação</text><text x="34" y="386.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">êntero-hepática. AAS</text><text x="34" y="400.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">desloca T4/T3 das proteínas</text><text x="34" y="413.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">e piora: resfriar com</text><text x="34" y="427" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">paracetamol</text><line x1="196" y1="536.6" x2="245.5" y2="536.6" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="26" y="496.5" width="170" height="80.1" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="34" y="512.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">A preferência pelo PTU</text><text x="34" y="525.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">(inibe a conversão) é</text><text x="34" y="539" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">teórica: estudos recentes</text><text x="34" y="552.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">não mostraram</text><text x="34" y="565.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">superioridade</text><rect x="375" y="738.1" width="170" height="93.6" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="383" y="753.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Suporte em UTI: volume,</text><text x="383" y="767.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">controle de arritmias, tratar</text><text x="383" y="780.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">o precipitante (ex.:</text><text x="383" y="794.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">antibiótico); refratários</text><text x="383" y="807.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">podem requerer</text><text x="383" y="821" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">plasmaférese</text><text x="210" y="857.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Vermelho ⊣: onde o fármaco bloqueia. Dourado: o caminho do hormônio.</text></svg>