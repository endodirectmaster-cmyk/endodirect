<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 733.8149999999999" width="708" height="733.8149999999999" role="img" aria-label="Eixo hipotálamo-hipófise-tireoide: onde falha cada tipo"><title>Eixo hipotálamo-hipófise-tireoide: onde falha cada tipo</title><defs><marker id="fireoidismo-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fireoidismo-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fireoidismo-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fireoidismo-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="706" height="731.8149999999999" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="354" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Eixo hipotálamo-hipófise-tireoide: onde falha cada tipo</text><text x="354" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Primário: a glândula falha e o TSH sobe; central: o T4L cai sem TSH que responda</text><path d="M541,139.7 C541,197.5 549.8,197.5 549.8,255.4" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireoidismo-ag)"/><path d="M319.2,162.7 C319.2,209.1 549.8,209.1 549.8,255.4" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="542.8" y1="255.4" x2="556.8" y2="255.4" stroke="#c0392b" stroke-width="3"/><path d="M549.8,305 C549.8,359.1 546.4,359.1 546.4,413.1" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fireo