-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">anticorpo anti-IGF-1R</text><text x="632.8" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">reduz proptose e diplopia</text><rect x="418.2" y="194" width="201.7" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="519" y="214.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Fibroblastos orbitários</text><text x="519" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">expressam o receptor de TSH</text><text x="519" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">conjugado ao IGF-1R</text><rect x="210.2" y="320.9" width="199.8" height="65" rx="32.485" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="310.1" y="341.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Glicosaminoglicanos</text><text x="310.1" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">ácido hialurônico: hidrofílico,</text><text x="310.1" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">puxa água → edema</text><rect x="440" y="320.9" width="180.7" height="65" rx="32.485" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="530.3" y="341.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Inflamação</text><text x="530.3" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">dor, hiperemia, quemose</text><text x="530.3" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">(atividade)</text><rect x="650.6" y="328.6" width="177.1" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="739.2" y="349.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Adipogênese</text><text x="739.2" y="364.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">fibroblasto vira adipócito</text><rect x="383.9" y="447.9" width="270.2" height="80.3" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="519" y="468.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Músculos extraoculares e gordura</text><text x="519" y="484.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">retro-orbitária</text><text x="519" y="500.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">aumentam de volume num compartimento</text><text x="519" y="515.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">ósseo inextensível</text><rect x="213.7" y="597.9" width="174.8" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="301.1" y="618.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Proptose</text><text x="301.1" y="634.2" font-famil