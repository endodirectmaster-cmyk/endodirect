ext x="650" y="761.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">se não responder</text><text x="210.2" y="798.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Vermelho ⊣: o teprotumumabe bloqueia o IGF-1R conjugado ao TSHR. Dourado: cadeia causal.</text></svg>