<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 685 768.625" width="685" height="768.625" role="img" aria-label="O que a gestação muda na tireoide"><title>O que a gestação muda na tireoide</title><defs><marker id="feegestacao-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="feegestacao-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="feegestacao-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="feegestacao-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="683" height="766.625" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="342.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">O que a gestação muda na tireoide</text><text x="342.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Estrogênio, hCG, placenta e rim explicam os exames e as demandas</text><path d="M140.6,108.9 L140.6,186.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#feegestacao-ag)"/><path d="M140.6,235.9 C140.6,270.7 148.5,270.7 148.5,305.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#feegestacao-ag)"/><path d="M326.8,116.6 L326.8,178.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#feegestacao-ag)"/><path d="M326.8,243.6 C326.8,278.4 351.8,278.4 351.8,313.3" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#feegestacao-ag)"/><path d="M140.6,235.9 C140.6,255.9 36.1,255.9 36.1,397.7 S130.8,539.5 130.8,559.5" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#feegestacao-as)"/><path d="M175.7,497.5 C175.7,528.5 130.8,528.5 130.8,559.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#feegestacao-ag)"/><path d="M368.1,489.8 C368.1,528.5 370.1,528.5 370.1,567.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#feegestacao-ag)"/><rect x="79.2" y="74.7" width="122.7" height="34.3" rx="17.125" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="140.6" y="95.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Estrogênio ↑</text><rect x="231.9" y="67" width="189.9" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="326.8" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">β-hCG ↑</text><text x="326.8" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">pico entre 7 e 11 semanas</text><rect x="79.3" y="186.3" width="122.5" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="140.6" y="207" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">TBG ↑</text><text x="140.6" y="222.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">meia-vida maior</text><rect x="250.8" y="178.6" width="152.2" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="326.8" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Tireoide materna</text><text x="326.8" y="214.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">hCG é agonista fraco</text><text x="326.8" y="230.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">do receptor de TSH</text><rect x="62.1" y="305.6" width="172.7" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="148.5" y="326.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Totais sobem ~50%</text><text x="148.5" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">platô em 20 semanas</text><text x="148.5" y="357.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">T4L e T3L ficam normais</text><rect x="264.8" y="313.3" width="174.1" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="351.8" y="334" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">TSH ↓ no 1º trimestre</text><text x="351.8" y="349.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">pode ser fisiológico</text><rect x="73.1" y="432.6" width="205.2" height="65" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="175.7" y="453.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Placenta</text><text x="175.7" y="468.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">D3 degrada hormônio materno</text><text x="175.7" y="484.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">passagem ao feto</text><rect x="308.3" y="440.2" width="119.7" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="368.1" y="460.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Rim</text><text x="368.1" y="476.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">↑ TFG e iodúria</text><rect x="26.2" y="559.5" width="209.1" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="130.8" y="580.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Demanda de hormônio ↑</text><text x="130.8" y="595.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">~30–50%: TBG, metabolismo e</text><text x="130.8" y="611.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">passagem transplacentária</text><rect x="265.3" y="567.2" width="209.5" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="370.1" y="587.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Iodo ~250 mcg/dia</text><text x="370.1" y="603.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">perda renal e necessidade fetal</text><rect x="300.1" y="139.6" width="53.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="326.8" y="151.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">estimula</text><line x1="438.9" y1="338.1" x2="488.8" y2="338.1" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="488.8" y="304.7" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="496.8" y="320.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Referência do TSH por</text><text x="496.8" y="333.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">trimestre: no 1º, −0,4 no</text><text x="496.8" y="347.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">limite inferior e −0,5 no</text><text x="496.8" y="360.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">superior</text><rect x="45.8" y="632.5" width="170" height="80.1" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="53.8" y="648.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">A tireoide fetal só produz</text><text x="53.8" y="661.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">hormônio relevante por</text><text x="53.8" y="675" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">volta da 20ª semana: até</text><text x="53.8" y="688.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">lá, o feto depende do</text><text x="53.8" y="701.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">hormônio materno</text><text x="26.2" y="738.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Avaliar a fração livre, não o T4 total.</text></svg>