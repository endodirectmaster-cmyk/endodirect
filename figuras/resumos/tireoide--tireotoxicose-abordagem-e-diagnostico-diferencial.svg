<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 801 574.935" width="801" height="574.935" role="img" aria-label="Tireotoxicose: de onde vem o hormônio em excesso"><title>Tireotoxicose: de onde vem o hormônio em excesso</title><defs><marker id="fiferencial-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fiferencial-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fiferencial-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fiferencial-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="799" height="572.935" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="400.5" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Tireotoxicose: de onde vem o hormônio em excesso</text><text x="400.5" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Nem toda tireotoxicose é hipertireoidismo: a fonte do hormônio decide o tratamento</text><path d="M400.5,116.6 C400.5,141.6 271.6,141.6 271.6,166.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiferencial-ag)"/><path d="M400.5,116.6 C400.5,141.6 517.8,141.6 517.8,166.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiferencial-ag)"/><path d="M271.6,216.2 C271.6,241.2 138.6,241.2 138.6,266.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiferencial-ag)"/><path d="M271.6,216.2 C271.6,241.2 378.4,241.2 378.4,266.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiferencial-ag)"/><path d="M517.8,216.2 C517.8,241.2 557,241.2 557,266.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiferencial-ag)"/><path d="M517.8,216.2 C517.8,241.2 706.9,241.2 706.9,266.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiferencial-ag)"/><path d="M138.6,315.8 C138.6,340.8 274.1,340.8 274.1,365.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiferencial-ag)"/><path d="M378.4,315.8 C378.4,340.8 274.1,340.8 274.1,365.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiferencial-ag)"/><path d="M557,315.8 C557,340.8 509.6,340.8 509.6,365.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiferencial-ag)"/><path d="M706.9,315.8 C706.9,340.8 509.6,340.8 509.6,365.8" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fiferencial-ag)"/><rect x="286.1" y="67" width="228.8" height="49.6" rx="24.805" fill="#f6f2e6" stroke="#d9b652" stroke-width="1.5"/><text x="400.5" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Tireotoxicose</text><text x="400.5" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">excesso de hormônio nos tecidos</text><rect x="169.3" y="166.6" width="204.5" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="271.6" y="187.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Hipertireoidismo</text><text x="271.6" y="202.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">a glândula produz em excesso</text><rect x="403.8" y="166.6" width="227.8" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="517.8" y="187.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Sem hiperprodução</text><text x="517.8" y="202.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">hormônio pré-formado ou exógeno</text><rect x="25.8" y="266.2" width="225.7" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="138.6" y="286.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Graves</text><text x="138.6" y="302.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">TRAb positivo; 60–80% dos casos</text><rect x="281.5" y="266.2" width="193.9" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="378.4" y="286.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Autonomia</text><text x="378.4" y="302.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">adenoma tóxico, BMN tóxico</text><rect x="505.4" y="266.2" width="103.2" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="557" y="286.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Destruição</text><text x="557" y="302.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">tireoidites</text><rect x="638.6" y="266.2" width="136.6" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="706.9" y="286.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Exógeno</text><text x="706.9" y="302.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">LT4 ou T3: factícia</text><rect x="179.9" y="365.8" width="188.3" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="274.1" y="386.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Bloquear a produção</text><text x="274.1" y="402.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">antitireoidiano, radioiodo ou</text><text x="274.1" y="417.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">cirurgia</text><rect x="398.2" y="365.8" width="222.9" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="509.6" y="386.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Suporte</text><text x="509.6" y="402.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">remover a fonte, se exógena</text><text x="509.6" y="417.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sem antitireoidiano nem radioiodo</text><rect x="189.1" y="438.8" width="170" height="80.1" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="197.1" y="454.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Excesso de iodo, struma</text><text x="197.1" y="467.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">ovarii e metástases de</text><text x="197.1" y="481.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">carcinoma folicular</text><text x="197.1" y="494.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">produzem hormônio, mas a</text><text x="197.1" y="508.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">RAIU cervical é baixa</text><rect x="424.6" y="438.8" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="432.6" y="454.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Tireoglobulina baixa com</text><text x="432.6" y="467.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">RAIU baixa aponta factícia;</text><text x="432.6" y="481.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">na tireoidite, a Tg é elevada</text><text x="25.8" y="544.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Betabloqueador controla os sintomas adrenérgicos em qualquer causa.</text></svg>