<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 391.15" width="784" height="391.15" role="img" aria-label="Seguimento da hormonização: o que vigiar na mulher e no homem trans"><title>Seguimento da hormonização: o que vigiar na mulher e no homem trans</title><defs><marker id="flongoprazo-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="flongoprazo-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="flongoprazo-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="flongoprazo-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="782" height="389.15" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="392" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Seguimento da hormonização: o que vigiar na mulher e no homem trans</text><text x="392" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Consultas a cada 3 meses no 1º ano e depois 1 a 2 vezes ao ano</text><rect x="24" y="67" width="236" height="278.2" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M24,79 Q24,67 36,67 H248 Q260,67 260,79 V93.9 H24 Z" fill="#c0392b"/><text x="142" y="85.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Mulher trans — estrogênio</text><text x="36" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c0392b" text-anchor="middle">•</text><text x="46" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">TEV: principal risco; transdérmico</text><text x="46" y="129.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">em quem tem risco</text><text x="36" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c0392b" text-anchor="middle">•</text><text x="46" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Dosar estradiol, testosterona,</text><text x="46" y="167.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">prolactina e lipídios; potássio se</text><text x="46" y="184.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">espironolactona</text><text x="36" y="206.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c0392b" text-anchor="middle">•</text><text x="46" y="206.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Mamografia a cada 1 a 2 anos a</text><text x="46" y="222.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">partir dos 50, se ≥ 5 anos de</text><text x="46" y="238.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">terapia</text><text x="36" y="261.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c0392b" text-anchor="middle">•</text><text x="46" y="261.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Próstata: PSA e toque a partir dos</text><text x="46" y="277.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">50 (45 com risco), sem cortes de</text><text x="46" y="293.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">homem cis</text><text x="36" y="315.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c0392b" text-anchor="middle">•</text><text x="46" y="315.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Testículo: sem triagem de rotina;</text><text x="46" y="332.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">ultrassom só se suspeita</text><rect x="274" y="67" width="236" height="278.2" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M274,79 Q274,67 286,67 H498 Q510,67 510,79 V93.9 H274 Z" fill="#0b2545"/><text x="392" y="85.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Homem trans — testosterona</text><text x="286" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="296" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Hematócrito: basal, a cada 3</text><text x="296" y="129.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">meses no 1º ano, depois 1 a 2</text><text x="296" y="145.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">vezes ao ano</text><text x="286" y="167.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="296" y="167.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Ht &gt; 54%: suspender até</text><text x="296" y="184.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">normalizar e retomar com dose</text><text x="296" y="200.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">menor</text><text x="286" y="222.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="296" y="222.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Dosar testosterona e lipídios (HDL</text><text x="296" y="238.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">cai); peso e pressão arterial</text><text x="286" y="261.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="296" y="261.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Mamografia a cada 1 a 2 anos: a</text><text x="296" y="277.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">atrofia não exclui câncer</text><text x="286" y="299.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b2545" text-anchor="middle">•</text><text x="296" y="299.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Colpocitologia se útero e</text><text x="296" y="315.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">atividade sexual com penetração</text><rect x="524" y="67" width="236" height="278.2" rx="12" fill="#f6f2e6" stroke="#e2e8f0"/><path d="M524,79 Q524,67 536,67 H748 Q760,67 760,79 V93.9 H524 Z" fill="#2e7d32"/><text x="642" y="85.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Para ambos</text><text x="536" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle">•</text><text x="546" y="113.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">DXA: escore Z pela referência do</text><text x="546" y="129.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">gênero de identificação</text><text x="536" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle">•</text><text x="546" y="151.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Considerar DXA basal em</text><text x="546" y="167.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">qualquer idade se &gt; 1 ano sem</text><text x="546" y="184.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">reposição após gonadectomia</text><text x="536" y="206.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle">•</text><text x="546" y="206.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">HPV: mesmas indicações de</text><text x="546" y="222.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">vacina da população geral</text><text x="536" y="244.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle">•</text><text x="546" y="244.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Preservar gametas antes da</text><text x="546" y="261.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">hormonização</text><text x="536" y="283.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle">•</text><text x="546" y="283.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">Após gonadectomia, reposição</text><text x="546" y="299.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2f45" text-anchor="start">hormonal contínua</text><text x="24" y="363.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-style="italic" fill="#5b6f88" text-anchor="start">DXA sem fatores de risco a partir dos 65 anos; com fatores, a partir dos 50 (mulher trans) ou 60 (homem trans).</text></svg>