ios</text><text x="266" y="340" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">incongruência persistente e</text><text x="266" y="355.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">documentada</text><text x="266" y="370.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">capacidade de decisão (TCLE)</text><polygon points="174.2 446 357.8 446 373.8 470.8 357.8 495.6 174.2 495.6 158.2 470.8" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="266" y="466.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">≥ 18 anos e ≥ 1 ano de</text><text x="266" y="483" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">acompanhamento?</text><rect x="26" y="557.6" width="215.1" height="65" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="133.5" y="578.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Não iniciar</text><text x="133.5" y="593.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">vedada antes dos 18 anos</text><text x="133.5" y="609.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">e de 1 ano de acompanhamento</text><polygon points="287.1 557.6 490 557.6 506 590.1 490 622.6 287.1 622.6 271.1 590.1" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="388.6" y="578.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">Doença psiquiátrica</text><text x="388.6" y="594.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">grave ou contraindicação</text><text x="388.6" y="610.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7c4a03" text-anchor="middle">clínica?</text><rect x="34.5" y="692.3" width="215.8" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="142.4" y="713" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Contraindicado</text><text x="142.4" y="728.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">p. ex., transtorno psicótico grave</text><rect x="280.3" y="684.6" width="217.2" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="388.9" y="705.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Avaliação cardiometabólica</text><text x="388.9" y="720.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">parecer favorável; comorbidades</text><text x="388.9" y="736.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">controladas</text><rect x="294.8" y="811.6" width="188.2" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="388.9" y="832.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Iniciar hormonização</text><text x="388.9" y="847.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">consentimento inclui efeitos</text><text x="388.9" y="863.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">permanentes</text><rect x="184.1" y="518.6" width="31.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="199.8" y="530.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não</text><rect x="312.2" y="518.6" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="327.3" y="530.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="250.4" y="649.4" width="30.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="265.5" y="661.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Sim</text><rect x="372.9" y="645.6" width="31.4" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="388.6" y="657.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">Não</text><line x1="373.8" y1="470.8" x2="520" y2="470.8" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="520" y="430.7" width="170" height="80.1" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="528" y="446.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Acompanhamento com</text><text x="528" y="459.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">ênfase psiquiátrica e</text><text x="528" y="473.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">endocrinológica; impede o</text><text x="528" y="486.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">início imediato pelo modelo</text><text x="528" y="500.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">de consentimento informado</text><line x1="483" y1="844" x2="520" y2="844" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="520" y="810.7" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="528" y="826.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Cirurgia: só a partir dos 18</text><text x="528" y="839.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">anos, ou 21 se potencial</text><text x="528" y="853.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">esterilizador, após ≥ 1 ano</text><text x="528" y="866.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">de acompanhamento</text></svg>