<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 807.46" width="800" height="807.46" role="img" aria-label="Terapia feminilizante: onde agem o estradiol e cada antiandrogênio"><title>Terapia feminilizante: onde agem o estradiol e cada antiandrogênio</title><defs><marker id="finilizante-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="finilizante-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="finilizante-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="finilizante-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="798" height="805.46" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="400" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Terapia feminilizante: onde agem o estradiol e cada antiandrogênio</text><text x="400" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Estrogênio feminiliza; antiandrogênio suprime a testosterona endógena</text><path d="M400,147.3 C400,182.2 272.4,182.2 272.4,217" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="265.4" y1="217" x2="279.4" y2="217" stroke="#c0392b" stroke-width="3"/><path d="M272.4,266.6 C272.4,309.1 290.1,309.1 290.1,351.7" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#finilizante-ag)"/><path d="M473.1,274.3 C473.1,313 290.1,313 290.1,351.7" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="283.1" y1="351.7" x2="297.1" y2="351.7" stroke="#c0392b" stroke-width="3"/><path d="M290.1,385.9 C290.1,428.4 276.3,428.4 276.3,471" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#finilizante-ag)"/><path d="M463,401.3 C463,436.1 276.3,436.1 276.3,471" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="269.3" y1="471" x2="283.3" y2="471" stroke="#c0392b" stroke-width="3"/><path d="M276.3,520.6 C276.3,555.4 400,555.4 400,590.2" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#finilizante-ag)"/><path d="M481.1,528.2 C481.1,559.2 400,559.2 400,590.2" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="393" y1="590.2" x2="407" y2="590.2" stroke="#c0392b" stroke-width="3"/><path d="M400,624.5 L400,686.5" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#finilizante-ag)"/><rect x="282.8" y="67" width="234.4" height="80.3" rx="40.165" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="400" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Ciproterona</text><text x="400" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">inibe gonadotrofinas e bloqueia</text><text x="400" y="118.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">receptor</text><text x="400" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">10 mg/dia; prolactina, meningioma</text><rect x="214.3" y="217" width="116.1" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="272.4" y="237.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Hipófise</text><text x="272.4" y="253.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">gonadotrofinas</text><rect x="360.5" y="209.3" width="225.2" height="65" rx="32.485" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="473.1" y="230" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Estradiol</text><text x="473.1" y="245.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">mama, gordura, pele mais macia</text><text x="473.1" y="261" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">meta 100 a 200 pg/mL</text><rect x="242.1" y="351.7" width="96" height="34.3" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="290.1" y="372.4" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Testículo</text><rect x="368.1" y="336.3" width="189.9" height="65" rx="32.485" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="463" y="357" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Agonista de GnRH</text><text x="463" y="372.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">osteoporose se estrogênio</text><text x="463" y="388" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">insuficiente</text><rect x="210.1" y="471" width="132.3" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="276.3" y="491.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Testosterona</text><text x="276.3" y="507.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">meta &lt; 50 ng/dL</text><rect x="372.4" y="463.3" width="217.5" height="65" rx="32.485" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="481.1" y="484" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Espironolactona</text><text x="481.1" y="499.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">100 a 300 mg/dia; hipercalemia</text><text x="481.1" y="514.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">hipotensão, frequência urinária</text><rect x="310.9" y="590.2" width="178.2" height="34.3" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="400" y="610.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Receptor androgênico</text><rect x="287.5" y="686.5" width="225" height="65" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="400" y="707.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Caracteres masculinos</text><text x="400" y="722.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">pelos corporais, densidade capilar</text><text x="400" y="738.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">facial</text><rect x="335.4" y="305" width="92.3" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="381.6" y="317" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" class="lbl">atrofia testicular</text><rect x="350.1" y="428.1" width="39.2" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="369.6" y="440.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" class="lbl">reduz</text><rect x="413.5" y="551.2" width="54.1" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="440.6" y="563.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" class="lbl">bloqueia</text><line x1="585.7" y1="241.8" x2="603.9" y2="241.8" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="603.9" y="208.5" width="170" height="66.7" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="611.9" y="224.1" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Evitar etinilestradiol (TEV) e</text><text x="611.9" y="237.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">estrogênios conjugados;</text><text x="611.9" y="251" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">transdérmico se &gt; 45 anos</text><text x="611.9" y="264.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">ou TEV prévio</text><line x1="196.1" y1="495.8" x2="210.1" y2="495.8" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/><rect x="26.1" y="469.1" width="170" height="53.3" rx="8" fill="#f6f2e6" stroke="#d9b652" stroke-width="1"/><text x="34.1" y="484.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">Inibidor da 5-alfa-redutase</text><text x="34.1" y="498.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">reduz a conversão em DHT,</text><text x="34.1" y="511.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2f45" text-anchor="start">mas não tem uso rotineiro</text><text x="210.1" y="777.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Barra vermelha: inibição ou bloqueio. Setas douradas: estímulo.</text></svg>