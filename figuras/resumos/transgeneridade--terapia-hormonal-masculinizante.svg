<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 522.8" width="884" height="522.8" role="img" aria-label="O que a testosterona faz no homem trans e o que vigiar"><title>O que a testosterona faz no homem trans e o que vigiar</title><defs><marker id="fulinizante-ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#d9b652"/></marker><marker id="fulinizante-ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#c0392b"/></marker><marker id="fulinizante-as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#5b6f88"/></marker><marker id="fulinizante-av" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9 Z" fill="#2e7d32"/></marker></defs><rect x="1" y="1" width="882" height="520.8" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="442" y="32" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">O que a testosterona faz no homem trans e o que vigiar</text><text x="442" y="51" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">Uma molécula, quatro frentes: eixo, tecidos-alvo, osso e sangue</text><path d="M442,116.6 C442,147.6 182.5,147.6 182.5,178.6" fill="none" stroke="#c0392b" stroke-width="2.2"/><line x1="175.5" y1="178.6" x2="189.5" y2="178.6" stroke="#c0392b" stroke-width="3"/><path d="M442,116.6 C442,147.6 376.7,147.6 376.7,178.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fulinizante-ag)"/><path d="M442,116.6 C442,147.6 557.8,147.6 557.8,178.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fulinizante-ag)"/><path d="M442,116.6 C442,147.6 735.7,147.6 735.7,178.6" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fulinizante-ag)"/><path d="M182.5,228.2 C182.5,263.1 136.2,263.1 136.2,297.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fulinizante-ag)"/><path d="M376.7,228.2 C376.7,263.1 366.4,263.1 366.4,297.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fulinizante-ag)"/><path d="M557.8,228.2 C557.8,259.2 573,259.2 573,290.2" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#fulinizante-av)"/><path d="M735.7,228.2 C735.7,263.1 773.6,263.1 773.6,297.9" fill="none" stroke="#d9b652" stroke-width="2.2" marker-end="url(#fulinizante-ag)"/><path d="M136.2,347.5 L136.2,417.2" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#fulinizante-as)"/><path d="M366.4,347.5 L366.4,417.2" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#fulinizante-as)"/><rect x="351.3" y="67" width="181.4" height="49.6" rx="24.805" fill="#fdf3d0" stroke="#d9b652" stroke-width="1.5"/><text x="442" y="87.7" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Testosterona</text><text x="442" y="103.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">meta de 400 a 700 ng/dL</text><rect x="84.9" y="178.6" width="195.3" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="182.5" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Eixo gonadal</text><text x="182.5" y="214.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">suprimido; menos estrogênio</text><rect x="310.2" y="178.6" width="133.1" height="49.6" rx="10" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/><text x="376.7" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Tecidos-alvo</text><text x="376.7" y="214.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e9eef7" text-anchor="middle">ação androgênica</text><rect x="473.3" y="178.6" width="169.1" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="557.8" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Conversão periférica</text><text x="557.8" y="214.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">em estradiol</text><rect x="672.4" y="178.6" width="126.7" height="49.6" rx="10" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/><text x="735.7" y="199.3" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2f45" text-anchor="middle">Eritrocitose</text><text x="735.7" y="214.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6f88" text-anchor="middle">menor com o gel</text><rect x="26.2" y="297.9" width="220" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="136.2" y="318.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Ovulação cessa</text><text x="136.2" y="334.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">sem menstruação em 2–6 meses</text><rect x="276.2" y="297.9" width="180.5" height="49.6" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="366.4" y="318.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Efeitos esperados</text><text x="366.4" y="334.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">pelos, músculo, voz, libido</text><rect x="486.7" y="290.2" width="172.7" height="65" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="573" y="310.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Massa óssea</text><text x="573" y="326.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">depende de testosterona</text><text x="573" y="341.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">adequada</text><rect x="689.4" y="297.9" width="168.4" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="773.6" y="318.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Hematócrito &gt; 54%</text><text x="773.6" y="334.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">reduzir dose ou espaçar</text><rect x="54.3" y="417.2" width="163.7" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="136.2" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Não é contraceptivo</text><text x="136.2" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">DIU ou progestágeno</text><rect x="276.6" y="417.2" width="179.7" height="49.6" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="366.4" y="437.9" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b1e14" text-anchor="middle">Irreversíveis</text><text x="366.4" y="453.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2f45" text-anchor="middle">voz grave e clitoromegalia</text><rect x="286.5" y="139.6" width="51.5" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="312.3" y="151.6" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" class="lbl">suprime</text><rect x="524.1" y="251.2" width="82.6" height="16" rx="8" fill="#ffffff" fill-opacity=".92"/><text x="565.4" y="263.2" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6f88" text-anchor="middle" class="lbl">pode proteger</text><text x="26.2" y="492.8" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6f88" text-anchor="start">Suprimir o eixo é o que costuma dispensar antiandrogênio. Barra vermelha: supressão; caixas vermelhas: atenção.</text></svg>