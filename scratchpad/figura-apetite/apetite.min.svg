<svg viewBox="0 0 880 760" width="100%" style="max-width:880px;height:auto;color:inherit;font-family:inherit" role="img" aria-label="Controle hipotalâmico do apetite: neurônios AgRP/NPY e POMC/CART do núcleo arqueado, o neurônio de segunda ordem com receptor MC4R, e os hormônios periféricos grelina, insulina e leptina"><defs><marker id="ap-sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ap-sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C6BB0"/></marker><marker id="ap-barra" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 0 L2 10" stroke="#E76F51" stroke-width="3" fill="none"/></marker></defs><!-- ===== NEURÔNIO DE 2ª ORDEM ===== --><g><rect x="320" y="18" width="250" height="64" rx="12" fill="#E9C46A" fill-opacity="0.16" stroke="#E9C46A" stroke-width="2"/><text x="445" y="47" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">Neurônio de 2ª ordem</text><text x="445" y="66" text-anchor="middle" font-size="12.5" fill="currentColor" fill-opacity="0.85">núcleo paraventricular</text></g><g><rect x="422.8" y="72" width="44.4" height="20" rx="10" fill="#E9C46A"/><text class="ap-rec" x="445" y="86.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f1f2b">MC4R</text></g><text x="600" y="44" text-anchor="start" font-size="12.5" font-weight="700" fill="currentColor">↑ MC4R → ↓ fome e ↑ gasto</text><text x="600" y="62" text-anchor="start" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.85">o AgRP bloqueia esse mesmo receptor</text><!-- projeções que chegam ao MC4R --><path d="M262 285 C262 200, 300 132, 412 96" fill="none" stroke="#E76F51" stroke-width="2.2" marker-end="url(#ap-barra)"/><text x="238" y="150" text-anchor="end" font-size="12.5" font-weight="700" fill="currentColor">NPY / AgRP</text><text x="238" y="168" text-anchor="end" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.85">antagoniza o MC4R</text><path d="M617 285 C617 200, 578 132, 478 96" fill="none" stroke="#2A9D8F" stroke-width="2.2" marker-end="url(#ap-sv)"/><text x="650" y="150" text-anchor="start" font-size="12.5" font-weight="700" fill="currentColor">α-MSH / β-endorfina</text><text x="650" y="168" text-anchor="start" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.85">agonista do MC4R</text><!-- ===== NÚCLEO ARQUEADO ===== --><rect x="110" y="205" width="660" height="240" rx="26" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 6"/><text x="440" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">NÚCLEO ARQUEADO (hipotálamo)</text><text x="440" y="252" text-anchor="middle" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.85">neurônios de 1ª ordem</text><rect x="70" y="250" width="22" height="170" rx="8" fill="#457B9D" fill-opacity="0.30" stroke="#457B9D" stroke-width="1.5"/><text x="81" y="440" text-anchor="middle" font-size="11.5" font-weight="400" fill="currentColor" fill-opacity="0.85">Terceiro</text><text x="81" y="454" text-anchor="middle" font-size="11.5" font-weight="400" fill="currentColor" fill-opacity="0.85">ventrículo</text><g><rect x="155" y="285" width="215" height="80" rx="12" fill="#7C6BB0" fill-opacity="0.16" stroke="#7C6BB0" stroke-width="2"/><text x="262.5" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">AgRP / NPY</text><text x="262.5" y="341" text-anchor="middle" font-size="12.5" fill="currentColor" fill-opacity="0.85">orexígeno — ↑ fome</text></g><g><rect x="172.8" y="275" width="44.4" height="20" rx="10" fill="#7C6BB0"/><text class="ap-rec" x="195" y="289.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f1f2b">GHSR</text></g><g><rect x="307.8" y="275" width="44.4" height="20" rx="10" fill="#7C6BB0"/><text class="ap-rec" x="330" y="289.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f1f2b">LEPR</text></g><g><rect x="172.8" y="355" width="44.4" height="20" rx="10" fill="#7C6BB0"/><text class="ap-rec" x="195" y="369.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f1f2b">MC3R</text></g><g><rect x="510" y="285" width="215" height="80" rx="12" fill="#2A9D8F" fill-opacity="0.16" stroke="#2A9D8F" stroke-width="2"/><text x="617.5" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">POMC / CART</text><text x="617.5" y="341" text-anchor="middle" font-size="12.5" fill="currentColor" fill-opacity="0.85">anorexígeno — ↓ fome</text></g><g><rect x="527.8" y="275" width="44.4" height="20" rx="10" fill="#2A9D8F"/><text class="ap-rec" x="550" y="289.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f1f2b">LEPR</text></g><g><rect x="666.6" y="275" width="36.8" height="20" rx="10" fill="#2A9D8F"/><text class="ap-rec" x="685" y="289.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f1f2b">Y₁R</text></g><g><rect x="527.8" y="355" width="44.4" height="20" rx="10" fill="#2A9D8F"/><text class="ap-rec" x="550" y="369.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f1f2b">MC3R</text></g><path d="M370 325 L502 325" fill="none" stroke="#E76F51" stroke-width="2.2" marker-end="url(#ap-barra)"/><text x="436" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">inibição</text><!-- ===== HORMÔNIOS PERIFÉRICOS ===== --><g><rect x="140" y="545" width="210" height="62" rx="12" fill="#457B9D" fill-opacity="0.16" stroke="#457B9D" stroke-width="2"/><text x="245" y="573" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">Grelina</text><text x="245" y="592" text-anchor="middle" font-size="12.5" fill="currentColor" fill-opacity="0.85">estômago (células oxínticas)</text></g><g><rect x="530" y="545" width="210" height="62" rx="12" fill="#457B9D" fill-opacity="0.16" stroke="#457B9D" stroke-width="2"/><text x="635" y="573" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">Insulina · Leptina</text><text x="635" y="592" text-anchor="middle" font-size="12.5" fill="currentColor" fill-opacity="0.85">pâncreas · tecido adiposo</text></g><!-- estímulo: cada hormônio sobe reto para o seu neurônio --><path d="M245 545 L245 382" fill="none" stroke="#7C6BB0" stroke-width="2.2" marker-end="url(#ap-sr)"/><text x="258" y="470" text-anchor="start" font-size="12" font-weight="700" fill="currentColor">＋ estimula</text><path d="M635 545 L635 382" fill="none" stroke="#2A9D8F" stroke-width="2.2" marker-end="url(#ap-sv)"/><text x="622" y="470" text-anchor="end" font-size="12" font-weight="700" fill="currentColor">＋ estimula</text><!-- inibição cruzada: cada hormônio freia o neurônio oposto --><path d="M350 545 L522 374" fill="none" stroke="#E76F51" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ap-barra)"/><path d="M530 545 L358 374" fill="none" stroke="#E76F51" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ap-barra)"/><!-- ===== NOTAS E LEGENDA ===== --><text x="440" y="645" text-anchor="middle" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.9">Tracejado = ação inibitória cruzada: a grelina freia o POMC/CART; insulina e leptina freiam o AgRP/NPY.</text><line x1="60" y1="672" x2="820" y2="672" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/><text x="60" y="694" text-anchor="start" font-size="11.5" font-weight="400" fill="currentColor" fill-opacity="0.85">AgRP, peptídeo relacionado ao agouti; CART, transcrito regulado por cocaína e anfetamina; GHSR, receptor do secretagogo do GH;</text><text x="60" y="712" text-anchor="start" font-size="11.5" font-weight="400" fill="currentColor" fill-opacity="0.85">LEPR, receptor de leptina; MC3R/MC4R, receptor de melanocortina 3 e 4; NPY, neuropeptídeo Y; POMC, pró-opiomelanocortina;</text><text x="60" y="730" text-anchor="start" font-size="11.5" font-weight="400" fill="currentColor" fill-opacity="0.85">Y₁R, receptor Y₁ do NPY; α-MSH, hormônio estimulador de melanócitos alfa.</text></svg>