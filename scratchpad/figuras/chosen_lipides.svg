<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Metabolismo das lipoproteínas: vias exogena, endogena e reversa com o figado central" style="width:100%;max-width:640px;height:auto;font-family:Segoe UI,Arial,sans-serif">
  <defs>
    <radialGradient id="gLiver" cx="42%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#33506e"/>
      <stop offset="60%" stop-color="#153a63"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </radialGradient>
    <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f7f1e3"/>
    </linearGradient>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="#33506e"/>
    </marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="#c99a2e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="560" fill="url(#gPanel)"/>

  <text x="320" y="25" text-anchor="middle" font-size="19" font-weight="700" fill="#0b2545">Metabolismo das Lipoproteínas</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#5a6b7d">Vias exógena, endógena e reversa — o fígado como centro (hub)</text>

  <!-- via tags -->
  <text x="452" y="80" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.5" fill="#c99a2e">VIA EXÓGENA</text>
  <text x="460" y="150" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.5" fill="#c99a2e">VIA ENDÓGENA</text>
  <text x="110" y="360" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.5" fill="#c99a2e">VIA REVERSA</text>

  <!-- ================= LIVER (hub) ================= -->
  <path d="M 258,214 C 256,192 284,180 322,184 C 360,188 392,196 390,224 C 388,254 356,286 312,286 C 276,286 260,244 258,214 Z" fill="url(#gLiver)" stroke="#0b2545" stroke-width="1.5"/>
  <path d="M 322,186 C 322,196 320,204 320,212" fill="none" stroke="#d9b652" stroke-width="1.4" opacity="0.55"/>
  <ellipse cx="298" cy="206" rx="20" ry="9" fill="#ffffff" opacity="0.08"/>
  <text x="322" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.5">FÍGADO</text>

  <!-- ================= EXOGENA (top) ================= -->
  <rect x="26" y="52" width="94" height="36" rx="10" fill="#f2ede0" stroke="#33506e" stroke-width="1.4"/>
  <text x="73" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#0b2545">Intestino</text>

  <circle cx="212" cy="70" r="27" fill="#f2d675" stroke="#b89a3e" stroke-width="1.5"/>
  <text x="212" y="67" text-anchor="middle" font-size="11" font-weight="700" fill="#20364e">Quilo-</text>
  <text x="212" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#20364e">mícron</text>

  <circle cx="350" cy="70" r="24" fill="#e8c65a" stroke="#b89a3e" stroke-width="1.5"/>
  <text x="350" y="67" text-anchor="middle" font-size="10" font-weight="700" fill="#20364e">Rema-</text>
  <text x="350" y="79" text-anchor="middle" font-size="10" font-weight="700" fill="#20364e">nescente</text>

  <line x1="121" y1="70" x2="182" y2="70" stroke="#33506e" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="152" y="60" text-anchor="middle" font-size="10" fill="#5a6b7d">(dieta)</text>

  <line x1="240" y1="70" x2="323" y2="70" stroke="#33506e" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="282" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#33506e">LPL</text>

  <line x1="200" y1="93" x2="166" y2="140" stroke="#33506e" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="150" y="156" text-anchor="start" font-size="10" fill="#5a6b7d">AGL → tecidos</text>

  <line x1="349" y1="94" x2="338" y2="181" stroke="#33506e" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- ================= ENDOGENA (right) ================= -->
  <circle cx="576" cy="112" r="26" fill="#c0803a" stroke="#8a5a28" stroke-width="1.5"/>
  <text x="576" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">VLDL</text>

  <circle cx="576" cy="206" r="24" fill="#a96a2e" stroke="#7e4f22" stroke-width="1.5"/>
  <text x="576" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">IDL</text>

  <circle cx="576" cy="300" r="27" fill="#8f5624" stroke="#6a4019" stroke-width="1.5"/>
  <text x="576" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">LDL</text>

  <line x1="388" y1="214" x2="551" y2="120" stroke="#33506e" stroke-width="1.6" marker-end="url(#ah)"/>

  <line x1="576" y1="139" x2="576" y2="181" stroke="#33506e" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="604" y="164" text-anchor="start" font-size="10" font-weight="700" fill="#33506e">(LPL)</text>

  <line x1="576" y1="231" x2="576" y2="272" stroke="#33506e" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="604" y="256" text-anchor="start" font-size="10" font-weight="700" fill="#33506e">(HPL)</text>

  <line x1="550" y1="298" x2="386" y2="270" stroke="#33506e" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="470" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#33506e">LDLR</text>
  <text x="470" y="269" text-anchor="middle" font-size="9" fill="#5a6b7d">captação (fígado/periferia)</text>

  <!-- ================= REVERSA (bottom) ================= -->
  <rect x="20" y="384" width="152" height="48" rx="10" fill="#f2ede0" stroke="#35708a" stroke-width="1.4"/>
  <text x="96" y="401" text-anchor="middle" font-size="10" font-weight="700" fill="#20364e">Tecidos periféricos</text>
  <text x="96" y="415" text-anchor="middle" font-size="10" font-weight="700" fill="#20364e">/ macrófago</text>
  <text x="96" y="427" text-anchor="middle" font-size="9" fill="#5a6b7d">(colesterol acumulado)</text>

  <circle cx="300" cy="408" r="30" fill="#35708a" stroke="#245266" stroke-width="1.5"/>
  <text x="300" y="413" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">HDL</text>

  <line x1="173" y1="408" x2="267" y2="408" stroke="#33506e" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="220" y="398" text-anchor="middle" font-size="10" font-weight="700" fill="#33506e">(ABCA1)</text>

  <text x="300" y="452" text-anchor="middle" font-size="10" fill="#5a6b7d">LCAT (maturação do HDL)</text>

  <!-- CETP dashed -->
  <line x1="329" y1="392" x2="551" y2="316" stroke="#c99a2e" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahg)"/>
  <text x="452" y="372" text-anchor="middle" font-size="9.5" fill="#a67f22">CETP: ésteres de colesterol → VLDL/LDL</text>

  <!-- HDL to liver -->
  <line x1="300" y1="377" x2="311" y2="290" stroke="#33506e" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="236" y="330" text-anchor="middle" font-size="10" font-weight="700" fill="#33506e">transporte reverso</text>
  <text x="236" y="343" text-anchor="middle" font-size="10" fill="#5a6b7d">do colesterol</text>

  <!-- ================= TARGETS BOX ================= -->
  <rect x="16" y="462" width="608" height="86" rx="12" fill="#f2ede0" stroke="#d9b652" stroke-width="1.6"/>
  <text x="30" y="482" text-anchor="start" font-size="12" font-weight="700" fill="#0b2545">Alvos terapêuticos</text>

  <circle cx="34" cy="501" r="3" fill="#8f5624"/>
  <text x="44" y="505" text-anchor="start" font-size="10.5" fill="#20364e"><tspan font-weight="700">Estatina</tspan> (↑LDLR)</text>
  <circle cx="336" cy="501" r="3" fill="#8f5624"/>
  <text x="346" y="505" text-anchor="start" font-size="10.5" fill="#20364e"><tspan font-weight="700">Ezetimiba</tspan> (absorção intestinal, NPC1L1)</text>

  <circle cx="34" cy="525" r="3" fill="#8f5624"/>
  <text x="44" y="529" text-anchor="start" font-size="10.5" fill="#20364e"><tspan font-weight="700">iPCSK9 / inclisirana</tspan> (preservam o LDLR)</text>
  <circle cx="336" cy="525" r="3" fill="#8f5624"/>
  <text x="346" y="529" text-anchor="start" font-size="10.5" fill="#20364e"><tspan font-weight="700">Fibrato / ômega-3</tspan> (↑LPL, ↓TG)</text>
</svg>